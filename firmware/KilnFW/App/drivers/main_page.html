<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kilnCtl</title>
<link rel="stylesheet" href="/theme.css">
<script>(function(){var t=localStorage.getItem('kilnctl-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<!-- UI_PLAN.md Web section 4 items 1/2/4/5: shared nav, sticky Stop,
     connection-lost banner, confirm helper. `defer` -- see nav.js's own
     header comment for why this page's inline <script> below can only rely
     on window.kcNav/kcConfirm from inside event-handler callbacks. -->
<script defer src="/nav.js"></script>
<script defer src="/app.js"></script>
<style>
  /* Page-local palette (docs/UI_THEME.md / App/drivers/ui_theme.h, TODO.md
     10.6/10.6a). The shared --ui-* palette and .theme-btn now live in
     /theme.css (linked above, EMBED_TXTFILES'd from App/drivers/theme.css) --
     this block keeps only what's specific to this page: the --bg/--fg/etc
     names the existing light/dark toggle uses as its interface (unchanged
     behaviour); only the DARK variant points at the --ui-* values instead of
     its own hex, so toggled-dark and default (no preference) match the LCD,
     while explicit light mode is untouched. */
  :root {
    --bg: #fff; --fg: #111; --muted: #444; --border: #888; --button-bg: #f2f2f2;
    --card-bg: #f7f7f7; --on-color: #1a7a1a; --off-color: #888; --fault-color: #b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
      --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
      --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
    --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
    --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
  }
  body { font-family: sans-serif; max-width: 480px; margin: 2em auto; padding: 0 1em;
         background: var(--bg); color: var(--fg); }
  .theme-btn { position: fixed; top: 0.8em; right: 0.8em; border: 1px solid var(--border);
               background: var(--button-bg); color: var(--fg); border-radius: var(--ui-radius);
               padding: 0.3em 0.6em; font-size: 0.9em; cursor: pointer; }
  h1 { font-size: 1.2em; }
  h2 { font-size: 1em; margin-top: 1.5em; border-top: 1px solid var(--border); padding-top: 1em; }
  p { color: var(--muted); }
  a.button { display: inline-flex; align-items: center; min-height: var(--ui-touch);
             box-sizing: border-box; margin-top: 1.5em; padding: 0.7em 1.5em; font-size: 1em;
             border: 1px solid var(--border); border-radius: var(--ui-radius); text-decoration: none;
             color: var(--fg); background: var(--button-bg); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
          padding: 0.7em 1em; margin-bottom: 0.5em; display: flex; justify-content: space-between;
          align-items: center; }
  .temp { font-size: 1.1em; font-weight: bold; }
  .fault { color: var(--fault-color); font-size: 0.85em; }
  .stale { color: var(--muted); font-size: 0.85em; }
  .empty { color: var(--muted); font-style: italic; }
  select { width: 100%; box-sizing: border-box; min-height: var(--ui-touch); padding: 0.5em; font-size: 1em;
           background: var(--button-bg); color: var(--fg); border: 1px solid var(--border);
           border-radius: var(--ui-radius); margin-bottom: 0.5em; }
  button.run-btn { padding: 0.6em 1.2em; font-size: 0.95em;
                    border-radius: var(--ui-radius);
                    border: 1px solid var(--border); background: var(--button-bg); color: var(--fg);
                    cursor: pointer; margin-right: 0.5em; margin-top: 0.3em; }
  button.run-btn.primary { background: var(--on-color); color: #fff; border-color: var(--on-color); }
  .exec-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
               padding: 0.7em 1em; margin-top: 0.5em; }
  .exec-card .row { display: flex; justify-content: space-between; margin-bottom: 0.3em; }
  .exec-state { font-weight: bold; text-transform: capitalize; }
  .exec-state.state-faulted { color: var(--fault-color); }
  .exec-state.state-running { color: var(--on-color); }
  #historyChart { width: 100%; height: 220px; background: var(--card-bg);
                  border: 1px solid var(--border); border-radius: var(--ui-radius); display: block; }
  /* Previous-run breadcrumb (TODO.md 6A.3). Uses the existing card colours
     rather than a new palette; only the left rule is coloured, so an
     interrupted firing reads as urgent without the page shouting on every
     ordinary boot after a normal firing. */
  .banner { background: var(--card-bg); border: 1px solid var(--border);
            border-left: 4px solid var(--off-color); border-radius: var(--ui-radius);
            padding: 0.7em 1em; margin-bottom: 1em; font-size: 0.9em; }
  .banner.interrupted { border-left-color: var(--fault-color); }
  .banner h3 { margin: 0 0 0.4em 0; font-size: 0.95em; }
  .banner.interrupted h3 { color: var(--fault-color); }
  .banner .row { display: flex; justify-content: space-between; margin-bottom: 0.2em;
                 color: var(--muted); }
  .banner .note { color: var(--muted); font-style: italic; margin-top: 0.5em; }
  /* 2026-08-21 rework item 11: relay status shown next to each channel's
     temperature, sourced by joining zonesCache (thermo_mask/relay_mask,
     already loaded once by loadZones() -- see script below) against
     /api/status's "relays" array. Small pill per relay rather than plain
     text so several relays on one channel (item 11's "if several relays
     map to one channel, show them all, identifiably") read as distinct
     tokens instead of running together. relay-unknown (grey, no
     kc-live-value) is deliberately the least visually loud of the three --
     it is not a reading of any kind, live or stale, just an absence, and
     must not compete with relay-on/relay-off for attention the way a real
     status would. */
  .relay-status { margin-left: 0.4em; }
  .relay-tag { display: inline-block; font-size: 0.75em; font-weight: normal; border-radius: var(--ui-radius);
               padding: 0.1em 0.45em; margin-left: 0.25em; border: 1px solid var(--border); }
  .relay-tag.relay-on { color: #fff; background: var(--on-color); border-color: var(--on-color); }
  .relay-tag.relay-off { color: var(--muted); background: transparent; }
  .relay-tag.relay-unknown { color: var(--muted); background: transparent; font-style: italic; }
</style>
</head>
<body>
<button id="themeBtn" class="theme-btn" title="Toggle dark/light theme"></button>
<!-- <h1>kilnCtl</h1> removed 2026-08-21 (rework item 5): nav.js's topbar
     now shows "Dashboard" in the brand's old spot (see nav.js's
     pageTitle() -- this page's bare <title>kilnCtl</title> has no page name
     of its own to reuse, so that function maps it to "Dashboard" specially),
     so the heading duplicated it. -->
<div id="lastRunBanner"></div>

<!-- 2026-08-21 rework items 9/10: reordered so firing-profile status/picker
     comes first and per-channel temperatures come last, matching
     ui_page_home.c's own ordering (profile summary before zone rows -- see
     that file's header comment on what stayed on the LCD's home page and in
     what order). The history graph in between has no LCD equivalent to
     match: ui_page_home.c's own header comment says the desired-vs-actual
     chart was moved OFF the LCD's home page entirely, to ui_page_history.c,
     because it didn't fit that screen's 264px no-scroll budget -- the web
     dashboard has no such budget, so item 9 places it here explicitly
     rather than leaving it off. The "Thermocouples"/"Firing profiles" <h2>
     headings are removed outright (item 10), not just reordered: with the
     graph and channel cards sitting directly under their own picker/history
     intro text, the extra section labels no longer added information, only
     vertical space. -->
<div id="execCard"></div>
<div id="runPicker">
  <label for="profileSelect">Profile</label>
  <select id="profileSelect"></select>
  <button id="runBtn" type="button" class="run-btn primary">Start</button>
</div>
<p><a class="button" href="/profiles">Manage fire profiles</a></p>

<h2>History</h2>
<p>This run's trend: actual vs. desired temperature (left axis) and commanded
duty (right axis, 0-1), one sample per 30s. Resets when a new profile starts.
Red marks are thermal-guard trips. <a href="/api/history.csv">Download CSV</a></p>
<canvas id="historyChart" width="600" height="220"></canvas>
<p id="historyEmpty" class="empty">No history yet -- start a firing profile.</p>

<!-- Item 8: the "Settings" button that used to follow the history section
     is gone -- /settings is reachable from the shared drop-down menu now
     (nav.js), and that hub page itself no longer has anything on it BUT
     the danger zone (settings_page.html), so a second, redundant link to
     it from here would be pointing at a page with nothing left for the
     operator to do except something destructive. -->
<div id="channels"><p class="empty">Loading…</p></div>

<script>
const FAULT_BITS = [
  [0x01, 'open circuit'], [0x02, 'over/under voltage'], [0x04, 'TC low'],
  [0x08, 'TC high'], [0x10, 'CJ low'], [0x20, 'CJ high'],
  [0x40, 'TC out of range'], [0x80, 'CJ out of range'],
];
function faultText(bits) {
  return FAULT_BITS.filter(([b]) => bits & b).map(([, t]) => t).join(', ');
}

// Item 11: which relay(s) a thermocouple channel drives is NOT in
// /api/status -- it's derived from zonesCache (loaded once by loadZones(),
// below), specifically each zone's thermo_mask (which channels feed it) and
// relay_mask (which relays it drives). Both fields use the same "bit b =
// channel/relay number b" convention the migration code and the /api/status
// relay loop already rely on: zones_http.c's v3->v4 migration seeds a
// zone's thermo_mask as `1u << i` for zone index i (zones_http.c, comment
// on migrate_zones_cfg_v1_to_current), the exact same i this page's own
// `channel` field carries (MAX31856.h: "channel; /* 0..2, as used on the
// wire */", copied into dashboard_channel_status_t verbatim in
// dashboard_http.c); and dashboard_http.c's status_get_handler emits
// "relays" as `{"relay": relay, ...}` for `relay` running 1..KILN_IO_RELAY_COUNT
// with `on = ds.relay_on[relay - 1]`, i.e. relay_mask bit (relay-1) is relay
// number `relay` -- so testing bit (relay-1) here against the same mask the
// firmware itself reads with (`zones_config_get_relay_mask`) is the correct
// join, not a guess. A channel with no zone whose thermo_mask includes it
// maps to zero relay numbers below and renders NOTHING (not "off") --
// per this codebase's missing-data-is-absent convention (see e.g. this
// page's own age_ms===null handling above) an unmapped channel's relay
// state is unknown, not off, and inventing "off" here would be exactly the
// fabrication that convention exists to prevent.
function relayNumbersForChannel(channel) {
  var nums = [];
  (zonesCache.zones || []).forEach(function (z) {
    if (!(z.thermo_mask & (1 << channel))) return;
    for (var b = 0; b < 8; b++) {
      if (z.relay_mask & (1 << b)) {
        var relayNum = b + 1;
        if (nums.indexOf(relayNum) === -1) nums.push(relayNum);
      }
    }
  });
  return nums;
}

// relaysData is /api/status's "relays" array ({relay, on}), present only
// when ds.io_ready (dashboard_http.c) -- absent entirely on a board with no
// IO expander, same as today. Relay ON/OFF IS a live device reading (unlike
// the zone/relay MAPPING itself, which is config from zonesCache, fetched
// once -- see loadZones()'s own comment on why it's not in the fast poll),
// so each pill gets kc-live-value only when an actual on/off value was
// found; a relay whose number is in this channel's list but not in
// relaysData (io not ready) shows "n/a" undimmed, same "absent, not
// fabricated" rule as the channel-with-no-zone case above, just one level
// more specific (mapping known, current value not).
function relayStatusHtml(channel, relaysData) {
  var nums = relayNumbersForChannel(channel);
  if (!nums.length) return '';
  var onByRelay = {};
  (relaysData || []).forEach(function (r) { onByRelay[r.relay] = r.on; });
  var tags = nums.map(function (n) {
    if (!onByRelay.hasOwnProperty(n)) {
      return '<span class="relay-tag relay-unknown">R' + n + ': n/a</span>';
    }
    var on = onByRelay[n];
    return '<span class="relay-tag kc-live-value ' + (on ? 'relay-on' : 'relay-off') + '">R' + n +
           ': ' + (on ? 'ON' : 'off') + '</span>';
  });
  return '<span class="relay-status">' + tags.join('') + '</span>';
}

// Cached so the °C/°F toggle (app.js's kcUnit) can re-render immediately on
// change rather than waiting up to 2s for the next poll() tick -- see the
// 'kcunitchange' listener near the bottom of this script block.
var lastChannelsData = null;
function renderChannels(data) {
  lastChannelsData = data;
  const el = document.getElementById('channels');
  if (!data.thermo_ready) {
    el.innerHTML = '<p class="empty">No thermocouple board attached.</p>';
    return;
  }
  el.innerHTML = '';
  data.channels.forEach(function (ch) {
    const div = document.createElement('div');
    div.className = 'card';
    let detail;
    if (ch.spi_failed) {
      // Not a reading at all (the transport failed), so no kc-live-value --
      // dimming a "SPI read failed" fault label on disconnect would suggest
      // the fault itself might be stale/wrong, when it is exactly as current
      // as any other fault_status bit already read this poll.
      detail = '<span class="fault">SPI read failed</span>';
    } else if (!ch.valid) {
      detail = '<span class="fault">' + (faultText(ch.fault_status) || 'invalid reading') + '</span>';
    } else {
      // channels[].age_ms is null when no good conversion has ever been
      // seen; channels[].stale means "older than 10s" (not "no new sample
      // this poll"), so a reading under 10s old must never read as stale.
      var staleTag = '';
      if (ch.age_ms === null || ch.age_ms === undefined) {
        staleTag = ' <span class="stale">(no reading yet)</span>';
      } else if (ch.stale) {
        staleTag = ' <span class="stale">(stale, ' + (ch.age_ms / 1000).toFixed(0) + 's old)</span>';
      }
      // Item 7: cold-junction temperature dropped from this line -- the
      // dashboard now shows the thermocouple (process) reading only. The
      // raw ch.cj_c value is still served by /api/status (diagnostics_page.html
      // still surfaces it); dropping it HERE is a display choice, not a data
      // removal, and needed no API change.
      detail = '<span class="kc-live-value">' + window.kcUnit.fmt(ch.temp_c) + '</span>' + staleTag +
               relayStatusHtml(ch.channel, data.relays);
    }
    div.innerHTML = '<span>Channel ' + ch.channel + '</span><span class="temp">' + detail + '</span>';
    el.appendChild(div);
  });
}

// zonesCache/loadZones stay here (unlike setRelay/relayRow/renderRelays,
// moved to manual_page.html per UI_PLAN.md item 3) because the profile-exec
// card and the previous-run banner below still name zones by index
// (zoneName()), and (2026-08-21 rework item 11) renderChannels()'s own
// relayStatusHtml() above now also reads zonesCache directly for the
// thermo_mask/relay_mask join -- this page needs zone/relay MAPPING, not
// relay toggle controls (those stayed on manual_page.html). Fetched once on
// load, NOT added to poll()'s fast loop below: zone config changes rarely
// (an operator visiting /settings/zones), unlike the live relay ON/OFF bits
// this join combines it with, which do belong in the fast loop and already
// arrive via /api/status's "relays" field on every poll() tick.
var zonesCache = { zones: [] };
function loadZones() {
  return fetch('/api/zones').then(function (r) { return r.json(); }).then(function (data) {
    zonesCache = data;
  }).catch(function () {});
}

// -- Firing profile execution --------------------------------------------

// Keyed by profile id, filled in by loadProfileList(); used wherever a
// profile is later named by id only (running-exec card, previous-run
// banner) so builtins show their full title there too, not just their code.
var profileTitleById = {};

// A builtin carries both a short `code` (what fits profile_t's 15-char name
// field, e.g. "BQ1000") and the full human `title` ("Plainsman Electric
// Bisque") -- show the title, with the code as parenthesised supporting
// text when it differs and actually fits. A user-saved profile has only
// `name`, which is already the real name the operator gave it.
function profileDisplayName(p) {
  if (p.title && p.title !== p.code) return p.title + (p.code ? ' (' + p.code + ')' : '');
  return p.title || p.name;
}

function zoneListText(mask) {
  var names = [];
  for (var b = 0; b < 8; b++) { if (mask & (1 << b)) names.push(zoneName(b)); }
  return names.join(', ') || 'no zones';
}

function loadProfileList() {
  return fetch('/api/profiles').then(function (r) { return r.json(); }).then(function (list) {
    const sel = document.getElementById('profileSelect');
    sel.innerHTML = '';
    profileTitleById = {};
    list.forEach(function (p) { profileTitleById[p.id] = profileDisplayName(p); });
    if (list.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No saved profiles -- create one first';
      sel.appendChild(opt);
      document.getElementById('runBtn').disabled = true;
      return;
    }
    document.getElementById('runBtn').disabled = false;
    list.forEach(function (p) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = profileDisplayName(p) + ' (' + zoneListText(p.zone_mask) + ')';
      sel.appendChild(opt);
    });
  }).catch(function () {});
}

function fmtDuration(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m + 'm ' + sec + 's';
}

// Shared by the exec card and the previous-run banner (both name zones by
// bit position, zones.relay_mask-style, per zones_http.h).
function zoneName(zi) {
  return (zonesCache.zones[zi] && zonesCache.zones[zi].name) || ('Zone ' + zi);
}

// -- Previous-run breadcrumb (TODO.md 6A.3, "No auto-resume across reboot") --
//
// This is a report on a firing that is already over, NOT a live status and
// NOT an offer to resume one. The firmware never restarts a firing by
// itself; starting one is always the operator's explicit action through the
// picker below. The banner exists to answer the question a brownout leaves
// behind -- "did it stop because I stopped it, or because the power went
// out" -- and then get out of the way once acknowledged.
// Deliberately NO kc-live-value anywhere in this banner: TODO.md 6A.3 /
// this function's own header comment already establish that this is a
// report on a firing that is ALREADY OVER, not live status -- the numbers
// here (target_c, segment progress) describe a past moment, frozen at
// write time, and don't change or go stale when the current connection
// drops. Dimming them on disconnect would falsely imply they're a live
// reading whose truth depends on the device answering right now; they
// aren't. The °C figure below still runs through kcUnit.fmt() for unit
// parity, just without the live-value class.
function renderLastRun(st) {
  const el = document.getElementById('lastRunBanner');
  const lr = st.last_run;
  if (!lr || !lr.present) { el.innerHTML = ''; return; }

  var names = [];
  for (var b = 0; b < 8; b++) { if (lr.zone_mask & (1 << b)) names.push(zoneName(b)); }

  var html = '<div class="banner' + (lr.interrupted ? ' interrupted' : '') + '">' +
    '<h3>' + (lr.interrupted
      ? 'Previous firing was interrupted &mdash; it never ended cleanly'
      : 'Previous firing ended (' + lr.phase + ')') + '</h3>' +
    '<div class="row"><span>Profile</span><span>' +
      (profileTitleById[lr.profile_id] || lr.profile_name || ('id ' + lr.profile_id)) +
      ' &mdash; ' + (names.join(', ') || 'no zones') + '</span></div>' +
    '<div class="row"><span>Segment</span><span>' + (lr.segment_index + 1) + ' / ' + lr.segment_count +
      ' (' + (lr.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Target at that point</span><span>' + window.kcUnit.fmt(lr.target_c) + '</span></div>' +
    '<div class="row"><span>Into the segment</span><span>' + fmtDuration(lr.segment_elapsed_s) + '</span></div>' +
    // Uptime, not a clock time: the board has no RTC and no guaranteed SNTP,
    // so an absolute timestamp here would be fabricated. See run_state.h.
    '<div class="row"><span>Recorded at</span><span>' + fmtDuration(lr.uptime_at_write_s) +
      ' into that boot</span></div>';
  if (lr.fault_reason) {
    html += '<div class="row fault"><span>Fault ' + lr.fault_guard + '</span><span>' +
            lr.fault_reason + '</span></div>';
  }
  html += '<p class="note">' + (lr.interrupted
    ? 'Nothing was restarted. Relays came up off and stay off until you start a firing.'
    : 'Recorded by the controller, so this stop was deliberate.') + '</p>' +
    '<button class="run-btn" id="ackLastRunBtn">Dismiss</button></div>';

  el.innerHTML = html;
  document.getElementById('ackLastRunBtn').addEventListener('click', function () {
    fetch('/api/profile_exec/ack_last_run', { method: 'POST' }).then(pollExec).catch(pollExec);
  });
}

// This card is the live-status opposite of renderLastRun above: everything
// in it -- exec state, segment/dwell progress, target and per-zone actual
// temperatures, relay on/off -- describes what the board is doing RIGHT NOW
// and goes stale the instant the connection heartbeat (app.js) starts
// failing, so it all gets kc-live-value. Zone names and the profile title
// are config, not readings -- left unmarked.
var lastExecStData = null;
function renderExec(st) {
  lastExecStData = st;
  const card = document.getElementById('execCard');
  const picker = document.getElementById('runPicker');
  if (st.state === 'idle') {
    card.innerHTML = '';
    picker.style.display = '';
    return;
  }
  picker.style.display = 'none';

  var zoneNames = [];
  for (var zb = 0; zb < 8; zb++) { if (st.zone_mask & (1 << zb)) zoneNames.push(zoneName(zb)); }

  let html = '<div class="exec-card">' +
    '<div class="row"><span>' + (profileTitleById[st.profile_id] || st.profile_name) +
    ' &mdash; ' + zoneNames.join(', ') + '</span>' +
    '<span class="exec-state state-' + st.state + ' kc-live-value">' + st.state + '</span></div>' +
    '<div class="row"><span>Segment</span><span class="kc-live-value">' + (st.segment_index + 1) + ' / ' + st.segment_count +
    ' (' + (st.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Shared target</span><span class="kc-live-value">' + window.kcUnit.fmt(st.target_c) + '</span></div>';
  if (st.ramp_lock_held) {
    var laggingNames = [];
    for (var lb = 0; lb < 8; lb++) { if (st.ramp_lock_lagging_mask & (1 << lb)) laggingNames.push(zoneName(lb)); }
    html += '<div class="row fault"><span>Ramp-lock held</span><span class="kc-live-value">waiting on ' +
            (laggingNames.join(', ') || 'a zone') + '</span></div>';
  }
  (st.zones || []).forEach(function (z) {
    html += '<div class="row"><span>' + zoneName(z.zone) + '</span><span class="kc-live-value">' +
      (z.actual_valid ? window.kcUnit.fmt(z.actual_c) : 'no reading') +
      (z.faulted ? ' &mdash; FAULTED' : (z.relay_on ? ' &mdash; ON' : ' &mdash; off')) + '</span></div>';
    if (z.faulted) {
      html += '<div class="row fault kc-live-value">' + zoneName(z.zone) + ': ' + z.fault_reason + '</div>';
    }
  });
  if (st.dwelling && st.state === 'running') {
    html += '<div class="row"><span>Dwell remaining</span><span class="kc-live-value">' + fmtDuration(st.dwell_remaining_s) + '</span></div>';
  }
  if (st.state === 'faulted' && st.fault_reason) {
    html += '<div class="row fault kc-live-value">' + st.fault_reason + '</div>';
  }
  html += '</div>';

  html += '<div style="margin-top:0.5em">';
  if (st.state === 'running') {
    html += '<button class="run-btn" id="pauseBtn">Pause</button>';
  } else if (st.state === 'paused') {
    html += '<button class="run-btn primary" id="resumeBtn">Resume</button>';
  }
  if (st.state === 'running' || st.state === 'paused' || st.state === 'faulted' || st.state === 'done') {
    html += '<button class="run-btn" id="stopBtn">Stop</button>';
  }
  html += '</div>';

  card.innerHTML = html;
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', function () { execAction('pause'); });
  const resumeBtn = document.getElementById('resumeBtn');
  if (resumeBtn) resumeBtn.addEventListener('click', function () { execAction('resume'); });
  const stopBtn = document.getElementById('stopBtn');
  if (stopBtn) stopBtn.addEventListener('click', function () {
    if (!confirm('Stop this firing now? This aborts the run in progress and cannot be resumed.')) return;
    execAction('stop');
  });
}

function execAction(action) {
  fetch('/api/profile_exec/' + action, { method: 'POST' }).then(pollExec).catch(pollExec);
}

// If a start attempt fails, decide whether it failed because the BOARD
// isn't ready (missing zones, no thermocouple board, safety link down, ...)
// or because the PROFILE itself is bad (e.g. a ramp rate over a zone's
// ceiling). The start error is just free text, so there is no reliable way
// to tell those apart from the string alone; instead ask the readiness
// endpoint directly. Any item that is not "ok" and not "deliberately_off"
// (that one was the operator's own choice, not something blocking them) is
// a real blocker -- send the user there instead of a bare toast they can't
// act on. Otherwise it's almost certainly profile-specific, so just show it.
function redirectToReadinessIfBlocked(errMsg) {
  fetch('/api/readiness').then(function (r) { return r.json(); }).then(function (j) {
    var blocking = (j.items || []).some(function (it) {
      return it.status !== 'ok' && it.status !== 'deliberately_off';
    });
    if (blocking) {
      window.location.href = '/readiness';
    } else {
      alert(errMsg || 'failed to start');
    }
  }).catch(function () { alert(errMsg || 'failed to start'); });
}

document.getElementById('runBtn').addEventListener('click', function () {
  const id = document.getElementById('profileSelect').value;
  if (id === undefined || id === '') return;
  const startName = profileTitleById[id] || ('profile ' + id);
  if (!confirm('Start firing "' + startName + '" now? This energises the heaters and will run for hours.')) return;
  fetch('/api/profile_exec/start', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'id=' + id,
  }).then(function (r) { return r.json(); }).then(function (result) {
    if (result.ok === false) {
      redirectToReadinessIfBlocked(result.error);
      return;
    }
    pollExec();
  }).catch(pollExec);
});

function parseHistoryCsv(text) {
  var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
  var rows = [];
  for (var i = 1; i < lines.length; i++) { // skip header
    var f = lines[i].split(',');
    if (f.length < 5) continue;
    rows.push({
      t: parseFloat(f[0]), actual: parseFloat(f[1]), desired: parseFloat(f[2]),
      duty: parseFloat(f[3]), guard: parseInt(f[4], 10),
    });
  }
  return rows;
}

// The chart canvas itself carries no kc-live-value: a <canvas> is one opaque
// bitmap to the DOM, not text nodes/elements the .kc-stale rule's opacity
// selector can reach, and re-drawing it fully transparent on every stale
// tick just to fake the same dimming effect would be a second, duplicate
// staleness indicator fighting the one the banner already gives (this data
// is also on a materially slower 15s poll than the 2-3s heartbeat, so its
// own staleness lags the banner's anyway). The axis/legend TEXT this
// function draws is still unit-converted below for UI_PLAN.md item 7 parity,
// same as every other on-screen °C figure.
function drawHistoryChart(rows) {
  var canvas = document.getElementById('historyChart');
  var empty = document.getElementById('historyEmpty');
  if (!rows.length) {
    canvas.style.display = 'none';
    empty.style.display = '';
    return;
  }
  canvas.style.display = '';
  empty.style.display = 'none';

  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || 600, cssH = 220;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var style = getComputedStyle(document.documentElement);
  var fg = style.getPropertyValue('--fg').trim() || '#111';
  var muted = style.getPropertyValue('--muted').trim() || '#444';
  var border = style.getPropertyValue('--border').trim() || '#888';

  var padL = 42, padR = 36, padT = 10, padB = 20;
  var plotW = cssW - padL - padR, plotH = cssH - padT - padB;

  var tMin = rows[0].t, tMax = rows[rows.length - 1].t;
  if (tMax === tMin) tMax = tMin + 1;
  var tempVals = [];
  rows.forEach(function (r) {
    if (!isNaN(r.actual)) tempVals.push(r.actual);
    if (!isNaN(r.desired)) tempVals.push(r.desired);
  });
  var tMinV = tempVals.length ? Math.min.apply(null, tempVals) : 0;
  var tMaxV = tempVals.length ? Math.max.apply(null, tempVals) : 1;
  if (tMaxV === tMinV) tMaxV = tMinV + 1;
  tMinV -= (tMaxV - tMinV) * 0.05; tMaxV += (tMaxV - tMinV) * 0.05;

  function x(t) { return padL + (t - tMin) / (tMax - tMin) * plotW; }
  function yTemp(v) { return padT + plotH - (v - tMinV) / (tMaxV - tMinV) * plotH; }
  function yDuty(d) { return padT + plotH - d * plotH; }

  ctx.strokeStyle = border; ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);

  ctx.fillStyle = muted; ctx.font = '10px sans-serif';
  ctx.fillText(window.kcUnit.toDisplay(tMaxV).toFixed(0) + window.kcUnit.label(), 2, padT + 8);
  ctx.fillText(window.kcUnit.toDisplay(tMinV).toFixed(0) + window.kcUnit.label(), 2, padT + plotH);
  ctx.fillText('1.0', cssW - padR + 4, padT + 8);
  ctx.fillText('0.0', cssW - padR + 4, padT + plotH);

  function drawLine(key, yFn, color) {
    ctx.beginPath();
    var started = false;
    rows.forEach(function (r) {
      var v = r[key];
      if (isNaN(v)) { started = false; return; }
      var px = x(r.t), py = yFn(v);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    });
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  }
  drawLine('desired', yTemp, '#888');
  drawLine('duty', yDuty, '#3a9');
  drawLine('actual', yTemp, '#e63');

  rows.forEach(function (r) {
    if (r.guard && r.guard !== 0) {
      var px = x(r.t);
      ctx.strokeStyle = '#c22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + plotH); ctx.stroke();
    }
  });

  ctx.fillStyle = fg; ctx.font = '11px sans-serif';
  ctx.fillText('— actual', padL + 4, cssH - 4);
  ctx.fillStyle = '#888'; ctx.fillText('— desired', padL + 70, cssH - 4);
  ctx.fillStyle = '#3a9'; ctx.fillText('— duty', padL + 145, cssH - 4);
  ctx.fillStyle = fg;
}

function pollHistory() {
  fetch('/api/history.csv').then(function (r) { return r.text(); }).then(function (text) {
    drawHistoryChart(parseHistoryCsv(text));
  }).catch(function () {});
}

function pollExec() {
  fetch('/api/profile_exec').then(function (r) { return r.json(); }).then(function (st) {
    renderExec(st);
    renderLastRun(st);
  }).catch(function () {});
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(function (data) {
    // 2026-08-21: keeps app.js's kcUnit cache current from the same response
    // this page already fetches for its own rendering -- no second request
    // just to learn the device's unit preference (see app.js's own
    // one-time-fetch fallback for pages that never poll /api/status at all).
    window.kcUnit.updateFromStatus(data);
    renderChannels(data);
  }).catch(function () {});
  pollExec();
  setTimeout(poll, 2000);
}

loadZones().then(function () { loadProfileList(); poll(); });
pollHistory();
setInterval(pollHistory, 15000); // history only gains a new sample every 30s -- no need to poll faster
window.addEventListener('resize', pollHistory);

// UI_PLAN.md item 7: re-render immediately on a °C/°F toggle instead of
// waiting out poll()'s own 2s interval -- re-uses the last payload each
// render function already cached rather than re-fetching from the board.
window.addEventListener('kcunitchange', function () {
  if (lastChannelsData) renderChannels(lastChannelsData);
  if (lastExecStData) { renderExec(lastExecStData); renderLastRun(lastExecStData); }
  pollHistory();
});

(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = isDark(t) ? '☀' : '🌙';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
