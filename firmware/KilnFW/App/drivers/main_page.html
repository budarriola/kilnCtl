<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kilnCtl</title>
<link rel="stylesheet" href="/theme.css">
<script>(function(){var t=localStorage.getItem('kilnctl-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<!-- UI_PLAN.md Web section 4 items 1/2/4/5: shared nav, sticky Stop,
     connection-lost banner, confirm helper. `defer` -- see nav.js's own
     header comment for why this page's inline <script> below can only rely
     on window.kcNav/kcConfirm from inside event-handler callbacks. -->
<script defer src="/nav.js"></script>
<script defer src="/app.js"></script>
<style>
  /* Page-local palette (docs/UI_THEME.md / App/drivers/ui_theme.h, TODO.md
     10.6/10.6a). The shared --ui-* palette and .theme-btn now live in
     /theme.css (linked above, EMBED_TXTFILES'd from App/drivers/theme.css) --
     this block keeps only what's specific to this page: the --bg/--fg/etc
     names the existing light/dark toggle uses as its interface (unchanged
     behaviour); only the DARK variant points at the --ui-* values instead of
     its own hex, so toggled-dark and default (no preference) match the LCD,
     while explicit light mode is untouched. */
  :root {
    --bg: #fff; --fg: #111; --muted: #444; --border: #888; --button-bg: #f2f2f2;
    --card-bg: #f7f7f7; --on-color: #1a7a1a; --off-color: #888; --fault-color: #b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
      --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
      --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
    --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
    --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
  }
  body { font-family: sans-serif; max-width: 480px; margin: 2em auto; padding: 0 1em;
         background: var(--bg); color: var(--fg); }
  /* .theme-btn removed 2026-08-21: was a byte-for-byte duplicate of the one
     rule in /theme.css (which loads first), and being `position: fixed`
     made it overlap nav.js's topbar on a phone-width viewport -- see
     theme.css's own comment on .theme-btn for the fix. */
  h1 { font-size: 1.2em; }
  h2 { font-size: 1em; margin-top: 1.5em; border-top: 1px solid var(--border); padding-top: 1em; }
  p { color: var(--muted); }
  a.button { display: inline-flex; align-items: center; min-height: var(--ui-touch);
             box-sizing: border-box; margin-top: 1.5em; padding: 0.7em 1.5em; font-size: 1em;
             border: 1px solid var(--border); border-radius: var(--ui-radius); text-decoration: none;
             color: var(--fg); background: var(--button-bg); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
          padding: 0.7em 1em; margin-bottom: 0.5em; display: flex; justify-content: space-between;
          align-items: center; }
  .temp { font-size: 1.1em; font-weight: bold; }
  .fault { color: var(--fault-color); font-size: 0.85em; }
  .stale { color: var(--muted); font-size: 0.85em; }
  .empty { color: var(--muted); font-style: italic; }
  /* 2026-08-21 dashboard reflow: profile <select> and Start button now sit
     side by side (owner's explicit request) instead of stacked full-width.
     flex-wrap so a narrow phone (this page's own body max-width is 480px,
     but real viewports go well under that -- see the ~390px figure theme.css
     cites for its own mobile rule) drops the button to its own line under
     the select rather than the row overflowing and forcing horizontal
     scroll; the select keeps flex:1 so it fills the row (or wraps to full
     width) instead of leaving the button an arbitrary leftover sliver. */
  #runPicker { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; }
  /* Kiln-config selector (relay/thermocouple/PID/guard snapshot, distinct
     from the firing-PROFILE picker above -- see #kilnConfigPicker's own
     header comment in the body for why the labels are "Firing profile" /
     "Kiln config" rather than two things both called "profile"). Sits
     directly under #runPicker, same compact row shape (label + select +
     one primary action) so it reads as a sibling control, not a new
     section. Hidden entirely by default; loadKilnConfigs() only reveals it
     once a well-formed /api/kiln_configs response has actually arrived --
     see that function's comment for the exact degrade-on-old-firmware
     rule. */
  #kilnConfigPicker { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; margin-top: 0.6em; }
  #kilnConfigPicker[hidden] { display: none; }
  /* Compact management disclosure (save-as/overwrite/clone/rename/delete).
     A <details>/<summary> rather than a second page: everything the API
     contract needs fits in a handful of small rows, and a whole new page
     would need a CMakeLists.txt entry and an httpd handler -- both owned by
     other in-flight agents this pass, off-limits here. Closed by default so
     the dashboard stays compact; the summary text itself is the "obvious
     link to fuller management" the task allows in place of a separate page. */
  #kcManage { margin-top: 0.4em; width: 100%; }
  #kcManage summary { cursor: pointer; color: var(--muted); font-size: 0.85em; }
  #kcManage .kc-manage-body { margin-top: 0.5em; display: flex; flex-direction: column; gap: 0.5em; }
  .kc-manage-row { display: flex; flex-wrap: wrap; gap: 0.4em; align-items: center; }
  .kc-manage-row input[type=text] { flex: 1 1 140px; min-width: 0; box-sizing: border-box;
    min-height: var(--ui-touch); padding: 0.5em; font-size: 1em; background: var(--button-bg);
    color: var(--fg); border: 1px solid var(--border); border-radius: var(--ui-radius); }
  .kc-active-tag { font-size: 0.8em; color: var(--on-color); font-weight: bold; margin-left: 0.3em; }
  #kcConfigMsg { font-size: 0.85em; color: var(--muted); margin-top: 0.2em; }
  #kcConfigMsg.kc-error { color: var(--fault-color); }
  /* Owner request: profile/kiln-config <select> should read the same
     height as a .card row (the thermocouple channel cards), not theme.css's
     72px touch minimum -- .card has no min-height of its own, just
     0.7em/1em padding around one line of text, so match that padding here
     instead of the shared min-height every other <select>/<button> on this
     page still gets. */
  select { flex: 1 1 200px; min-width: 0; box-sizing: border-box; min-height: 0; padding: 0.7em 1em; font-size: 1em;
           background: var(--button-bg); color: var(--fg); border: 1px solid var(--border);
           border-radius: var(--ui-radius); margin-bottom: 0; }
  button.run-btn { padding: 0.6em 1.2em; font-size: 0.95em;
                    border-radius: var(--ui-radius);
                    border: 1px solid var(--border); background: var(--button-bg); color: var(--fg);
                    cursor: pointer; margin-right: 0.5em; margin-top: 0.3em; }
  button.run-btn.primary { background: var(--on-color); color: #fff; border-color: var(--on-color); }
  /* Owner's request: halve the Start button's height. theme.css's shared
     `button { min-height: var(--ui-touch); }` rule (var(--ui-touch): 72px,
     theme.css line 21) is exactly the "every real button gets a 72px touch
     target" convention that UI_PLAN.md section 3 Web item 2 consolidated
     there for all six pages -- halving to 36px directly contradicts it, and
     that conflict is real, not a rule I can quietly route around. Scoped to
     #runBtn only (not .run-btn generally, which would also shrink Pause/
     Resume in the exec card -- not asked for and not done here), and
     kept out of theme.css entirely so the other five pages' plain `button`
     rule and every other button on THIS page are unaffected. To claw back
     some of the lost tap area without growing the visible button back
     toward 72px, #runBtn keeps position:relative and grows its actual hit
     region with a transparent ::after extending 9px above and below the
     visible box (36px visible + 9+9 = 54px effective hit height) -- an
     invisible hit-area extension is the "padding/ext area rather than a
     smaller hit box" alternative asked for, since the visible box itself
     cannot be both half-height and still 72px tall. */
  #runBtn { min-height: 36px; position: relative; margin-top: 0; }
  #runBtn::after { content: ''; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px; }
  .exec-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
               padding: 0.7em 1em; margin-top: 0.5em; }
  .exec-card .row { display: flex; justify-content: space-between; margin-bottom: 0.3em; }
  .exec-state { font-weight: bold; text-transform: capitalize; }
  .exec-state.state-faulted { color: var(--fault-color); }
  .exec-state.state-running { color: var(--on-color); }
  #historyChart { width: 100%; height: 220px; background: var(--card-bg);
                  border: 1px solid var(--border); border-radius: var(--ui-radius); display: block; }
  /* 2026-08-21 owner request: chart legend/caption moved OUT of the canvas
     bitmap entirely, into real DOM text sitting below it. Three reasons, all
     from the same root cause -- baked-in canvas text uses fixed pixel offsets
     (padL+70, padL+145, ...) sized for the 600px design width, not this
     page's actual phone-width canvas.clientWidth; on a real ~360px viewport
     those offsets could crowd together or clip at the canvas edge, which is
     exactly the overlap-on-phone class of bug the owner has already reported
     twice. A flex-wrap DOM row instead wraps naturally at any width, is
     covered by the same --ui-xxx / --fg / --muted theme variables as everything
     (NEVER write that as "--ui-" followed by a star and a slash: the star-slash
     closes THIS comment early, the prose after it parses as CSS, and every
     rule below is silently discarded. That is not hypothetical -- it is what
     hid .relay-status/.relay-tag and produced the owner's "86.6 °FR1: off"
     report; the CSS parser stopped after 35 of this block's rules.)
     else on this page (canvas fillStyle strings were already doing this, but
     via getComputedStyle() plumbing that's easy to get wrong), and, per the
     owner's literal wording ("the legend ... should be below the plot
     area"), a DOM element after the <canvas> in source order is
     unambiguously below it -- unlike text drawn inside the canvas's own
     padding band, which reads as part of the chart image itself. */
  #chartMeta { margin-top: 0.4em; }
  .chart-axis-note { font-size: 0.75em; color: var(--muted); font-style: italic; margin-bottom: 0.3em; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 0.5em 0.9em; font-size: 0.75em; color: var(--fg); }
  .chart-legend-item { display: inline-flex; align-items: center; gap: 0.3em; white-space: nowrap; }
  .chart-legend-swatch { display: inline-block; width: 1.1em; height: 0; border-top: 2px solid; }
  .chart-legend-swatch.dashed { border-top-style: dashed; }
  /* 2026-08-21: progress bar sits directly under the chart (owner's explicit
     placement -- NOT at the page bottom, and the bottom nav bar stays gone).
     Hidden entirely (#progressWrap display:none) when there's nothing to
     show: idle with no run, or older firmware that doesn't send the new
     /api/profile_exec fields at all -- see renderProgress()'s own comment
     for the degrade-on-missing-fields rule. The indeterminate state (total
     known, remaining_s null -- e.g. a zero ramp-rate segment with no
     predictable duration) uses a moving stripe animation instead of any
     fixed fill fraction, so it can never be mistaken for "0% done" or
     "100% done"; the no-total state skips the track/fill entirely and shows
     elapsed-only text, since a bar with no denominator has nothing honest
     to show as its fill amount. */
  #progressWrap { margin-top: 0.6em; }
  .progress-track { height: 10px; border: 1px solid var(--border); border-radius: 999px;
                     background: var(--card-bg); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--on-color); width: 0%; }
  .progress-fill.indeterminate {
    width: 100% !important;
    background-image: repeating-linear-gradient(45deg, var(--on-color) 0, var(--on-color) 10px,
                       transparent 10px, transparent 20px);
    background-size: 28px 28px;
    animation: kc-progress-stripe 1s linear infinite;
  }
  @keyframes kc-progress-stripe { from { background-position: 0 0; } to { background-position: 28px 0; } }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8em;
                      color: var(--muted); margin-top: 0.3em; }
  .progress-label .estimate-tag { font-style: italic; }
  /* 2026-08-21 idle-dot swatch: ties a channel's dot colour on the (now
     always-visible) chart back to that same channel's row in the list
     below it, so "which dot is which channel" doesn't require a legend.
     CH_COLORS in the script is the single source of truth for the actual
     colour values; this is just the inline circle that displays them. */
  .ch-swatch { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%;
               margin-right: 0.4em; vertical-align: middle; }
  /* Previous-run breadcrumb (TODO.md 6A.3). Uses the existing card colours
     rather than a new palette; only the left rule is coloured, so an
     interrupted firing reads as urgent without the page shouting on every
     ordinary boot after a normal firing. */
  .banner { background: var(--card-bg); border: 1px solid var(--border);
            border-left: 4px solid var(--off-color); border-radius: var(--ui-radius);
            padding: 0.7em 1em; margin-bottom: 1em; font-size: 0.9em; }
  .banner.interrupted { border-left-color: var(--fault-color); }
  .banner h3 { margin: 0 0 0.4em 0; font-size: 0.95em; }
  .banner.interrupted h3 { color: var(--fault-color); }
  .banner .row { display: flex; justify-content: space-between; margin-bottom: 0.2em;
                 color: var(--muted); }
  .banner .note { color: var(--muted); font-style: italic; margin-top: 0.5em; }
  /* Safety-processor trip: the most serious state this page can report, so it
     gets a SOLID fill rather than lastRunBanner's border-only treatment --
     same escalation safety_page.html already applies to an ordinary trip
     (border) vs. TRIP_INEFFECTIVE/S9 (solid fill) -- here every live trip
     gets the solid treatment because "the run kept going while the kiln
     cooled" is exactly the failure this banner exists to make impossible to
     miss. ineffective (S9) gets stronger wording still, matching that same
     precedent's extra emphasis, without a second element/colour. */
  .banner.safety-trip { background: var(--fault-color); border-color: var(--fault-color);
                        border-left-color: var(--fault-color); }
  .banner.safety-trip h3, .banner.safety-trip .row, .banner.safety-trip .row span,
  .banner.safety-trip .note { color: #fff; }
  /* 2026-08-21 rework item 11: relay status shown next to each channel's
     temperature, sourced by joining zonesCache (thermo_mask/relay_mask,
     already loaded once by loadZones() -- see script below) against
     /api/status's "relays" array. Small pill per relay rather than plain
     text so several relays on one channel (item 11's "if several relays
     map to one channel, show them all, identifiably") read as distinct
     tokens instead of running together. relay-unknown (grey, no
     kc-live-value) is deliberately the least visually loud of the three --
     it is not a reading of any kind, live or stale, just an absence, and
     must not compete with relay-on/relay-off for attention the way a real
     status would. */
  .relay-status { margin-left: 0.4em; }
  .relay-tag { display: inline-block; font-size: 0.75em; font-weight: normal; border-radius: var(--ui-radius);
               padding: 0.1em 0.45em; margin-left: 0.25em; border: 1px solid var(--border); }
  .relay-tag.relay-on { color: #fff; background: var(--on-color); border-color: var(--on-color); }
  .relay-tag.relay-off { color: var(--muted); background: transparent; }
  .relay-tag.relay-unknown { color: var(--muted); background: transparent; font-style: italic; }
  /* Press-and-hold PID popup (2026-09-01, owner: "allow the user to hold a
     zone on the dashboard and create a popup that allows them to adjust the
     pid parameters while it is running"). Minimal, self-contained modal --
     no modal pattern existed anywhere on this page before this, so this is
     the first one; kept plain (no animation, no focus trap beyond click-
     outside-to-cancel) rather than building a general-purpose dialog
     component for a single use site. */
  #pidPopupOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55);
                      display: flex; align-items: center; justify-content: center;
                      z-index: 1000; padding: 1em; box-sizing: border-box; }
  #pidPopupOverlay[hidden] { display: none; }
  .pid-popup { background: var(--card-bg); color: var(--fg); border: 1px solid var(--border);
               border-radius: var(--ui-radius); padding: 1em; max-width: 420px; width: 100%;
               max-height: 90vh; overflow-y: auto; }
  .pid-popup h3 { margin: 0 0 0.4em 0; }
  .pid-popup .warn { color: var(--fault-color); font-weight: bold; }
  .pid-popup label { display: block; margin-top: 0.6em; font-size: 0.9em; }
  .pid-popup input[type=number] { width: 100%; box-sizing: border-box; font-size: 1em;
                                   padding: 0.35em; margin-top: 0.2em; }
  .pid-popup .btnrow { display: flex; gap: 0.5em; margin-top: 1em; }
  .pid-popup .btnrow button { flex: 1; min-height: var(--ui-touch, 2.5em); }
  .pid-popup .msg { margin-top: 0.6em; font-size: 0.9em; }
  .pid-popup .proposed { font-size: 0.85em; opacity: 0.85; margin-top: 0.6em; }
  .pid-popup .proposed button { font-size: 0.85em; margin-left: 0.4em; }
</style>
</head>
<body>
<button id="themeBtn" class="theme-btn" title="Toggle dark/light theme"></button>
<!-- <h1>kilnCtl</h1> removed 2026-08-21 (rework item 5): nav.js's topbar
     now shows "Dashboard" in the brand's old spot (see nav.js's
     pageTitle() -- this page's bare <title>kilnCtl</title> has no page name
     of its own to reuse, so that function maps it to "Dashboard" specially),
     so the heading duplicated it. -->
<!-- The safety-processor trip banner sits ABOVE lastRunBanner: a live trip is
     more urgent than a record of how the previous firing ended, and per the
     "must not look like an ordinary stop" requirement it needs to out-rank
     that banner visually as well as in reading order. Empty by default
     (renderSafetyTrip() below only ever fills it in, matching lastRunBanner's
     own hide-when-nothing-to-report pattern) -- never rendered as a green/
     blank "all clear" card, just absent when there is nothing to report. -->
<!-- boot_button.h's BOOT-button OTA-auth bypass window. Sits ABOVE the
     safety-trip banner: while this window is open, ANY device on the
     network can push firmware with no password check at all, which is a
     more urgent thing for an operator glancing at this page to know about
     than an ordinary safety trip. Empty by default, same hide-when-nothing-
     to-report pattern as safetyTripBanner/lastRunBanner below. -->
<div id="bootButtonBypassBanner"></div>
<div id="safetyTripBanner"></div>
<div id="lastRunBanner"></div>

<!-- 2026-08-21 rework items 9/10: reordered so firing-profile status/picker
     comes first and per-channel temperatures come last, matching
     ui_page_home.c's own ordering (profile summary before zone rows -- see
     that file's header comment on what stayed on the LCD's home page and in
     what order). The history graph in between has no LCD equivalent to
     match: ui_page_home.c's own header comment says the target-vs-actual
     chart was moved OFF the LCD's home page entirely, to ui_page_history.c,
     because it didn't fit that screen's 264px no-scroll budget -- the web
     dashboard has no such budget, so item 9 places it here explicitly
     rather than leaving it off. The "Thermocouples"/"Firing profiles" <h2>
     headings are removed outright (item 10), not just reordered: with the
     graph and channel cards sitting directly under their own picker/history
     intro text, the extra section labels no longer added information, only
     vertical space. -->
<div id="execCard"></div>
<!-- 2026-08-21 dashboard reflow: the history canvas now sits directly under
     execCard, ABOVE the profile picker (owner's explicit ordering request),
     matching the intuition that "what's happening" (live exec state, then
     its trend) reads top-to-bottom before "what to start next." The old
     <h2>History</h2> heading and its explanatory paragraph ("This run's
     trend... Red marks are thermal-guard trips. Download CSV") are removed
     outright, not just reordered -- with the graph sitting right under
     execCard with no other canvas nearby, the intro text no longer told the
     operator anything the picture didn't already. Removing that paragraph
     also removes the page's only inline link to /api/history.csv; the route
     itself is untouched and still serves the same CSV --
     GET /api/history.csv -- it's just no longer linked from this page's
     body text. The <p id="historyEmpty"> empty-state line is also gone
     (same "no longer earns its space" call); drawHistoryChart() below no
     longer references it at all -- see that function's own comment for how
     the empty case is now handled (hide the canvas, nothing else) so no
     dangling getElementById('historyEmpty') is left for the poll loop to
     dereference into a TypeError. -->
<canvas id="historyChart" width="600" height="220"></canvas>
<!-- Legend/span caption for historyChart -- see #chartMeta's own <style>
     comment for why this is real DOM text rather than canvas fillText.
     Populated by renderChartMeta() (below, in-script), never hand-authored
     here; empty by default so there's nothing to show before the first
     draw call. -->
<div id="chartMeta">
  <div id="chartAxisNote" class="chart-axis-note"></div>
  <div id="chartLegend" class="chart-legend"></div>
</div>
<div id="progressWrap" style="display:none">
  <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
  <div class="progress-label"><span id="progressElapsed"></span><span id="progressRemaining"></span></div>
</div>
<div id="runPicker">
  <label for="profileSelect">Firing profile</label>
  <select id="profileSelect"></select>
  <button id="runBtn" type="button" class="run-btn primary">Start</button>
</div>
<!-- Kiln config: a named saved snapshot of the WHOLE zones configuration
     (relay wiring, thermocouple assignment, PID gains, guard thresholds,
     limits -- everything zones_http.c's config covers), distinct from the
     firing PROFILE above (a temperature schedule). Labelled "Kiln config"
     specifically so the two stacked selectors are never mistaken for one
     another. Hidden by default; only loadKilnConfigs() (script below)
     reveals it, and only once /api/kiln_configs has answered with every
     field this page reads -- a 404 (older firmware / backend not yet
     landed) or a response missing a field leaves it hidden, same
     degrade-cleanly rule the rest of this page already follows for optional
     endpoints (see e.g. renderProgress()'s own comment). -->
<div id="kilnConfigPicker" hidden>
  <label for="kilnConfigSelect">Kiln config</label>
  <select id="kilnConfigSelect"></select>
  <button id="kcApplyBtn" type="button" class="run-btn">Apply</button>
  <div id="kcConfigMsg"></div>
  <!-- Management (save current as new / overwrite / clone / rename / delete)
       lives here, collapsed, rather than a separate settings page -- see
       the <style> block's #kcManage comment for why. -->
  <details id="kcManage">
    <summary>Manage kiln configs (save / clone / rename / delete)</summary>
    <div class="kc-manage-body">
      <div class="kc-manage-row">
        <input type="text" id="kcSaveNewName" placeholder="Save current setup as...">
        <button id="kcSaveNewBtn" type="button" class="run-btn">Save as new</button>
      </div>
      <div class="kc-manage-row">
        <button id="kcOverwriteBtn" type="button" class="run-btn">Overwrite selected with current setup</button>
      </div>
      <div class="kc-manage-row">
        <input type="text" id="kcCloneName" placeholder="New name for the clone">
        <button id="kcCloneBtn" type="button" class="run-btn">Clone selected</button>
      </div>
      <div class="kc-manage-row">
        <input type="text" id="kcRenameName" placeholder="Rename selected to...">
        <button id="kcRenameBtn" type="button" class="run-btn">Rename</button>
      </div>
      <div class="kc-manage-row">
        <button id="kcDeleteBtn" type="button" class="run-btn">Delete selected</button>
      </div>
    </div>
  </details>
</div>
<!-- <p><a class="button" href="/profiles">Manage fire profiles</a></p> removed
     2026-08-21: /profiles is still reachable from the shared drop-down menu
     (nav.js's "Firing profiles" entry), so removing this button does not
     orphan the destination. -->

<!-- Item 8: the "Settings" button that used to follow the history section
     is gone -- /settings is reachable from the shared drop-down menu now
     (nav.js), and that hub page itself no longer has anything on it BUT
     the danger zone (settings_page.html), so a second, redundant link to
     it from here would be pointing at a page with nothing left for the
     operator to do except something destructive. -->
<div id="channels"><p class="empty">Loading…</p></div>

<!-- Press-and-hold PID popup (2026-09-01) -- markup only, built once here
     rather than injected via JS, so it exists in the DOM before the
     trailing inline script tag below (which runs BEFORE the deferred
     nav.js/app.js) ever looks for it. Content is filled in by
     openPidPopup(). -->
<div id="pidPopupOverlay" hidden>
  <div class="pid-popup" id="pidPopupBox" role="dialog" aria-modal="true"></div>
</div>

<script>
const FAULT_BITS = [
  [0x01, 'open circuit'], [0x02, 'over/under voltage'], [0x04, 'TC low'],
  [0x08, 'TC high'], [0x10, 'CJ low'], [0x20, 'CJ high'],
  [0x40, 'TC out of range'], [0x80, 'CJ out of range'],
];
function faultText(bits) {
  return FAULT_BITS.filter(([b]) => bits & b).map(([, t]) => t).join(', ');
}

// Single source of truth for "which colour is channel N", shared by the
// channel-list swatch (renderChannels below) and the idle dots drawn on
// historyChart (drawIdleDots) -- see that function's comment for why the
// idle case needs a per-channel colour at all (the running-chart trend
// lines only ever track one representative zone, so they never needed
// this). Cycles if there are ever more channels than colours; five
// MAX31856 channels is the current board (CLAUDE.md), so this covers it
// with room to spare.
const CH_COLORS = ['#e63', '#3a9', '#37f', '#c8a', '#fa3', '#0bb'];
function chColor(channel) { return CH_COLORS[channel % CH_COLORS.length]; }

// Reserved palette for NON-ZONE series (commanded duty, the planned/target
// curve, guard-trip markers) -- 2026-08-31 follow-up, owner: "duty and
// planned should never be the same colour as the zones". INVARIANT: no
// value in this object may ever equal a value in CH_COLORS, checked once at
// load time just below (console.warn, not a throw -- a colour clash is a
// legibility bug, not a reason to break the page). Grey for duty
// deliberately matches what drawAutotuneChart() already used for the same
// series before this pass, so the firing chart and the autotune chart read
// as the same visual language rather than two different conventions for
// the same kind of line.
const SERIES_COLORS = { duty: '#888', plan: '#96c', guard: '#c22' };
(function checkSeriesColorsDontCollideWithZoneColors() {
  Object.keys(SERIES_COLORS).forEach(function (k) {
    if (CH_COLORS.indexOf(SERIES_COLORS[k]) !== -1) {
      console.warn('SERIES_COLORS.' + k + ' (' + SERIES_COLORS[k] +
        ') collides with a zone colour in CH_COLORS -- pick a different one');
    }
  });
})();

// Item 11: which relay(s) a thermocouple channel drives is NOT in
// /api/status -- it's derived from zonesCache (loaded once by loadZones(),
// below), specifically each zone's thermo_mask (which channels feed it) and
// relay_mask (which relays it drives). Both fields use the same "bit b =
// channel/relay number b" convention the migration code and the /api/status
// relay loop already rely on: zones_http.c's v3->v4 migration seeds a
// zone's thermo_mask as `1u << i` for zone index i (zones_http.c, comment
// on migrate_zones_cfg_v1_to_current), the exact same i this page's own
// `channel` field carries (MAX31856.h: "channel; /* 0..2, as used on the
// wire */", copied into dashboard_channel_status_t verbatim in
// dashboard_http.c); and dashboard_http.c's status_get_handler emits
// "relays" as `{"relay": relay, ...}` for `relay` running 1..KILN_IO_RELAY_COUNT
// with `on = ds.relay_on[relay - 1]`, i.e. relay_mask bit (relay-1) is relay
// number `relay` -- so testing bit (relay-1) here against the same mask the
// firmware itself reads with (`zones_config_get_relay_mask`) is the correct
// join, not a guess. A channel with no zone whose thermo_mask includes it
// maps to zero relay numbers below and renders NOTHING (not "off") --
// per this codebase's missing-data-is-absent convention (see e.g. this
// page's own age_ms===null handling above) an unmapped channel's relay
// state is unknown, not off, and inventing "off" here would be exactly the
// fabrication that convention exists to prevent.
function relayNumbersForChannel(channel) {
  var nums = [];
  (zonesCache.zones || []).forEach(function (z) {
    if (!(z.thermo_mask & (1 << channel))) return;
    for (var b = 0; b < 8; b++) {
      if (z.relay_mask & (1 << b)) {
        var relayNum = b + 1;
        if (nums.indexOf(relayNum) === -1) nums.push(relayNum);
      }
    }
  });
  return nums;
}

// Which zone (if any) claims this channel via thermo_mask, for the channel
// row's label (renderChannels below). Same mask/bit convention as
// relayNumbersForChannel above. If more than one zone's thermo_mask claims
// the same channel (overlapping masks are possible, not validated against
// here), the lowest zone index wins -- deterministic and matches the order
// zonesCache.zones is already indexed in, rather than concatenating names.
// Returns null (not '') when no zone claims the channel, or zonesCache
// hasn't loaded yet, so callers fall back to "Channel N".
function zoneIndexForChannel(channel) {
  var zones = zonesCache.zones || [];
  for (var zi = 0; zi < zones.length; zi++) {
    if (zones[zi] && (zones[zi].thermo_mask & (1 << channel))) return zi;
  }
  return null;
}

// relaysData is /api/status's "relays" array ({relay, on}), present only
// when ds.io_ready (dashboard_http.c) -- absent entirely on a board with no
// IO expander, same as today. Relay ON/OFF IS a live device reading (unlike
// the zone/relay MAPPING itself, which is config from zonesCache, fetched
// once -- see loadZones()'s own comment on why it's not in the fast poll),
// so each pill gets kc-live-value only when an actual on/off value was
// found; a relay whose number is in this channel's list but not in
// relaysData (io not ready) shows "n/a" undimmed, same "absent, not
// fabricated" rule as the channel-with-no-zone case above, just one level
// more specific (mapping known, current value not).
function relayStatusHtml(channel, relaysData) {
  var nums = relayNumbersForChannel(channel);
  if (!nums.length) return '';
  var onByRelay = {};
  (relaysData || []).forEach(function (r) { onByRelay[r.relay] = r.on; });
  // Display-only R0-3 (owner request 2026-08-27, to match the thermocouple
  // channels' 0-based numbering) -- `n` itself stays the real 1-based
  // "relay" number the API/wire protocol uses (onByRelay is keyed on it,
  // same as relaysData/setRelay() elsewhere); only the printed label is n-1.
  var tags = nums.map(function (n) {
    if (!onByRelay.hasOwnProperty(n)) {
      return '<span class="relay-tag relay-unknown">R' + (n - 1) + ': n/a</span>';
    }
    var on = onByRelay[n];
    return '<span class="relay-tag kc-live-value ' + (on ? 'relay-on' : 'relay-off') + '">R' + (n - 1) +
           ': ' + (on ? 'ON' : 'off') + '</span>';
  });
  return '<span class="relay-status">' + tags.join('') + '</span>';
}

// Cached so the °C/°F toggle (app.js's kcUnit) can re-render immediately on
// change rather than waiting up to 2s for the next poll() tick -- see the
// 'kcunitchange' listener near the bottom of this script block.
var lastChannelsData = null;
// watchdog_cfg.h -- updated on every /api/status poll (poll(), below), read
// by the runBtn click handler's extra firing confirmation.
var lastWatchdogPanicDisabled = false;
// watchdog_cfg.h's WATCHDOG_CFG_FIRING_WARNING, verbatim -- App/test/
// lint_pages.js compares this exact string against the C macro (same
// mechanism it already uses for OTA_INTERLOCK_NO_SAFETY_WARNING/
// NO_SAFETY_WARNING in app.js) so the two cannot drift apart.
var WATCHDOG_CFG_FIRING_WARNING_JS =
    'The task-watchdog panic is disabled for debugging. If a task hangs, the board will NOT ' +
    'reboot -- it will sit hung with the relays in whatever state they were last commanded. ' +
    'Start the firing anyway?';
function renderSafetyCard(data) {
  // Safety processor's OWN thermocouple + K4 relay -- independent of the
  // ESP-owned channels/relays rendered below. Shown regardless of
  // data.thermo_ready (that flag is about the ESP's own MAX31856 board, not
  // the safety processor) so a disagreement between the two, or K4's real
  // state, is visible at a glance without opening /diagnostics.
  if (!data.safety_ready) return null;
  const div = document.createElement('div');
  div.className = 'card';
  const tempHtml = (data.safety_temp_c === null || data.safety_temp_c === undefined)
    ? '<span class="stale">(no reading yet)</span>'
    : '<span class="kc-live-value">' + window.kcUnit.fmt(data.safety_temp_c) + '</span>';
  // Same relay-tag markup/classes as relayStatusHtml() above, so K4 reads
  // as one of the relay row rather than a differently-styled one-off.
  //
  // Named in full ("Safety relay K4"), not just "K4" (owner request
  // 2026-08-29): this is the contact that decides whether ANY element
  // current flows, and it is the one thing to watch while a firing is
  // supposed to be heating -- a two-character label on the dashboard sent
  // people to /diagnostics to find out what it meant.
  //
  // safety_relay_energized is null, not false, until a status frame has
  // actually been decoded (dashboard_http.c's safety_relay_known). The old
  // truthiness test rendered that unknown as a confident "off" -- the one
  // reading an operator must not be given, since "the safety relay is open"
  // and "nobody has told us yet" call for different actions.
  let relayCls = 'relay-off', relayTxt = 'off';
  if (data.safety_relay_energized === null || data.safety_relay_energized === undefined) {
    relayCls = 'stale'; relayTxt = 'unknown';
  } else if (data.safety_relay_energized) {
    relayCls = 'relay-on'; relayTxt = 'ON';
  }
  const relayHtml = '<span class="relay-status"><span class="relay-tag kc-live-value ' +
    relayCls + '" title="K4 on the safety processor -- closed only while SaftyFW is armed AND ' +
    'the controller has asked it to permit heating. No element current can flow while this is off.">' +
    'Safety relay K4: ' + relayTxt + '</span></span>';
  div.innerHTML = '<span>Safety TC</span><span class="temp">' + tempHtml + relayHtml + '</span>';
  return div;
}

// ---------------------------------------------------------------------------
// Press-and-hold gesture (2026-09-01, owner: "allow the user to hold a zone
// on the dashboard... create a popup that allows them to adjust the pid
// parameters"). Pointer Events (not separate touch/mouse handlers) so one
// implementation covers mouse, touch AND pen -- this board drives a local
// LCD and the dashboard is used from a phone, both need to work. ~550ms
// hold (typical long-press duration, short enough not to feel broken, long
// enough that a scroll/swipe never accidentally triggers it) and a 10px
// move-cancel threshold -- moving the pointer that far means the gesture is
// a drag/scroll, not a hold. Suppresses the click event that would
// otherwise follow a successful long-press (so it can never ALSO fire some
// future click handler on the same row), while leaving an ordinary short
// tap/click completely untouched -- fired=false there just clears the
// timer, exactly what happened before this function existed.
var LONGPRESS_MS = 550;
var LONGPRESS_MOVE_THRESHOLD_PX = 10;
function attachLongPress(el, onLongPress) {
  var timer = null, startX = 0, startY = 0, fired = false;
  function clear() { if (timer) { clearTimeout(timer); timer = null; } }
  function onDown(e) {
    if (e.button !== 0) return; // primary mouse button / touch / pen only
    fired = false;
    startX = e.clientX; startY = e.clientY;
    clear();
    timer = setTimeout(function () {
      timer = null;
      fired = true;
      onLongPress(e);
    }, LONGPRESS_MS);
  }
  function onMove(e) {
    if (!timer) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.sqrt(dx * dx + dy * dy) > LONGPRESS_MOVE_THRESHOLD_PX) clear();
  }
  function onUp() {
    clear();
    if (fired) {
      el.addEventListener('click', function suppress(ce) {
        ce.stopPropagation(); ce.preventDefault();
      }, { capture: true, once: true });
    }
  }
  el.addEventListener('pointerdown', onDown);
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('pointerleave', clear);
  // Reduces the native double-tap-zoom/scroll interference on touch, and
  // suppresses text selection / iOS's own long-press callout menu, which
  // would otherwise fight this gesture for the same hold.
  el.style.touchAction = 'manipulation';
  el.style.webkitUserSelect = 'none';
  el.style.userSelect = 'none';
  el.style.webkitTouchCallout = 'none';
}

// ---------------------------------------------------------------------------
// PID edit popup.
//
// Bounds mirror zones_config_json.c's zones_config_json_parse_float_field()
// calls for z%u_kp/z%u_ki/z%u_kd EXACTLY (read there, not invented here):
// [0.0, 1000.0] inclusive, finite, refused (never clamped) outside that --
// "zone pid_kp/ki/kd missing or out of range" is the firmware's own error
// text for a value outside this range. Kept as one shared constant so this
// popup can never drift from the firmware's own bound without both being
// touched in the same place.
var PID_BOUND_MIN = 0.0, PID_BOUND_MAX = 1000.0;

// Write path (requirement: reuse the existing POST /api/zones path and
// payload shape rather than a second one). That endpoint IS a whole-page
// submit (zones_http.c's zones_post_handler(): every zone's every field,
// plus top-level thermo_count/relay_count/relay names/timing profiles, all
// re-validated as one unit) -- there is no narrower "just this zone's PID"
// endpoint. Rather than reimplementing zones_page.html's own inheritance-
// aware form-building UI (settings_source chains, per-field customStack
// resolution -- real complexity that page owns and this popup must not
// duplicate or subtly diverge from), this does a GENERIC, MECHANICAL echo
// instead: GET /api/zones already returns every field POST wants, as a
// fully RESOLVED, concrete snapshot (settings_source, coupling_c%u, tc_type
// etc are all already-resolved values, not inheritance references) -- so
// echoing every field straight back, changing only the target zone's
// kp/ki/kd, is a complete and correct round-trip without needing any of
// that page's UI-side logic. Field-name mapping below was read directly out
// of zones_page.html's own submit handler and zones_http.c's
// parse_zone_fields()/zones_post_handler(), not guessed.
var ZONE_FIELD_MAP = [
  ['name', 'name', true], ['relay_mask', 'relay_mask', false], ['thermo_mask', 'thermo_mask', false],
  ['ct_mask', 'ct_mask', false], ['tc_type', 'tctype', false], ['timing_profile', 'timingprofile', false],
  ['cal_offset_c', 'cal', false],
  ['pid_kp', 'kp', false], ['pid_ki', 'ki', false], ['pid_kd', 'kd', false],
  ['max_ramp_c_per_hr', 'ramp', false], ['sanity_rate_c_per_min', 'sanity', false],
  ['control_mode', 'mode', false], ['max_temp_c', 'maxtemp', false], ['min_temp_c', 'mintemp', false],
  ['heater_window_ms', 'window', false], ['heater_min_on_ms', 'minon', false], ['heater_min_off_ms', 'minoff', false],
  ['guard_wrong_dir_window_s', 'wrongdirwindow', false], ['guard_wrong_dir_rate_c_per_min', 'wrongdirrate', false],
  ['guard_off_settle_s', 'offsettle', false], ['guard_runaway_rate_c_per_min', 'runawayrate', false],
  ['guard_runaway_margin_c', 'runawaymargin', false], ['guard_drift_period_s', 'driftperiod', false],
  ['guard_sensor_fault_debounce_ticks', 'debounce', false], ['guard_frozen_window_s', 'frozenwindow', false],
  ['cross_zone_max_delta_c', 'xzone', false],
  ['model_k_dc', 'k', false], ['model_tau_s', 'tau', false], ['model_dead_time_s', 'deadtime', false],
  ['fuzzy_strength_pct', 'fuzzy_strength', false], ['settings_source', 'settings_source', false],
];

// Builds the exact application/x-www-form-urlencoded body zones_page.html's
// own save handler posts -- see ZONE_FIELD_MAP's own comment. `cfg` is a
// freshly-fetched GET /api/zones response; `zoneIndex`/`kp`/`ki`/`kd` are
// the one change this popup makes. Every other field, for every zone,
// timing profile and relay name, is echoed back verbatim.
function buildZonesEchoPostBody(cfg, zoneIndex, kp, ki, kd) {
  var params = [];
  params.push('thermo_count=' + cfg.thermo_count);
  params.push('relay_count=' + cfg.relay_count);
  params.push('max_simultaneous_relays=' + cfg.max_simultaneous_relays);
  params.push('continue_on_zone_trip=' + (cfg.continue_on_zone_trip ? '1' : '0'));
  params.push('safety_tc_type=' + cfg.safety_tc_type);
  params.push('pc_link_abort_silence_ms=' + cfg.pc_link_abort_silence_ms);
  (cfg.relay_names || []).forEach(function (nm, r) {
    params.push('relay' + (r + 1) + '_name=' + encodeURIComponent(nm));
  });
  (cfg.timing_profiles || []).forEach(function (p, idx) {
    params.push('tp' + idx + '_name=' + encodeURIComponent(p.name || ''));
    params.push('tp' + idx + '_progressduty=' + p.guard_progress_duty_min);
    params.push('tp' + idx + '_progresswindow=' + p.guard_progress_window_s);
    params.push('tp' + idx + '_drifthyst=' + p.guard_drift_hysteresis_c);
    params.push('tp' + idx + '_frozeneps=' + p.guard_frozen_eps_c);
    params.push('tp' + idx + '_xzoneperiod=' + p.guard_cross_zone_period_s);
    params.push('tp' + idx + '_bbhyst=' + p.bangbang_hysteresis_c);
    params.push('tp' + idx + '_coolmargin=' + p.cooling_limited_margin_c);
    params.push('tp' + idx + '_coolhold=' + p.cooling_limited_hold_s);
    params.push('tp' + idx + '_ramplock=' + p.ramp_lock_band_c);
  });
  (cfg.zones || []).forEach(function (z, i) {
    ZONE_FIELD_MAP.forEach(function (m) {
      var key = m[0], suffix = m[1], isString = m[2];
      var val = z[key];
      params.push('z' + i + '_' + suffix + '=' + (isString ? encodeURIComponent(val) : val));
    });
    for (var j = 0; j < cfg.zones.length; j++) {
      params.push('z' + i + '_coupling_c' + j + '=' + z['coupling_c' + j]);
    }
    if (i === zoneIndex) {
      // Override the three this popup actually edits -- appended AFTER the
      // echoed z{i}_kp/ki/kd above, so these win (a duplicate key in an
      // application/x-www-form-urlencoded body resolves to the LAST
      // occurrence under http_form_find_field()'s linear scan, same as
      // every browser's own form-encoding convention).
      params.push('z' + i + '_kp=' + kp);
      params.push('z' + i + '_ki=' + ki);
      params.push('z' + i + '_kd=' + kd);
    }
  });
  return params.join('&');
}

var pidPopupZone = null; // zone index currently open, or null
var pidPopupCfg = null;  // last-fetched GET /api/zones snapshot for that zone

function closePidPopup() {
  pidPopupZone = null;
  pidPopupCfg = null;
  document.getElementById('pidPopupOverlay').setAttribute('hidden', '');
}

// Live actual/error refresh while the popup is open -- called from poll()'s
// existing 2s tick (reusing that cadence rather than a second timer), so
// "what are you about to affect" stays current for as long as the operator
// is deciding. actual_c comes from lastChannelsData (already fetched every
// tick); target/error need a RUNNING or PAUSED firing that includes this
// zone -- otherwise there is no setpoint to compare against and the popup
// says so rather than inventing a zero error.
function refreshPidPopupLive() {
  if (pidPopupZone === null) return;
  var elLive = document.getElementById('pidPopupLive');
  if (!elLive) return;
  var ch = lastChannelsData && lastChannelsData.channels &&
    lastChannelsData.channels.filter(function (c) { return c.channel === pidPopupZone; })[0];
  var actualTxt = (ch && ch.valid && !ch.spi_failed) ? window.kcUnit.fmt(ch.temp_c) : 'no reading';
  var st = lastExecStatus;
  var zst = st && (st.zones || []).filter(function (z) { return z.zone === pidPopupZone; })[0];
  var errTxt = 'no active firing on this zone -- nothing to compare against';
  if (zst && zst.active && zst.actual_valid && (st.state === 'running' || st.state === 'paused')) {
    errTxt = 'target ' + window.kcUnit.fmt(st.target_c) + ', error ' + fmtDeltaC(zst.actual_c - st.target_c) +
      (zst.duty !== undefined ? ', duty ' + zst.duty.toFixed(3) : '');
  }
  elLive.innerHTML = 'Actual: <b class="kc-live-value">' + actualTxt + '</b><br>' + errTxt;
}

// window.kcUnit.fmt()'s +32 Fahrenheit offset is wrong for a delta (target
// error, here) same as everywhere else on this page -- see the earlier
// firing-stats pass's own comment on this exact hazard. Kept local since
// that block was removed from this file (moved to zones_page.html) but this
// popup still needs a delta formatter of its own.
function fmtDeltaC(c) {
  if (c === null || c === undefined || isNaN(c)) return 'n/a';
  var v = window.kcUnit.get() === 'f' ? c * 9 / 5 : c;
  return (v >= 0 ? '+' : '') + v.toFixed(1) + ' ' + window.kcUnit.label();
}

function openPidPopup(zoneIndex) {
  pidPopupZone = zoneIndex;
  pidPopupCfg = null;
  var overlay = document.getElementById('pidPopupOverlay');
  var box = document.getElementById('pidPopupBox');
  box.innerHTML = '<h3>' + zoneName(zoneIndex) + ' -- PID</h3><p>Loading current config&hellip;</p>';
  overlay.removeAttribute('hidden');
  fetch('/api/zones').then(function (r) { return r.json(); }).then(function (cfg) {
    if (pidPopupZone !== zoneIndex) return; // closed/reopened on a different zone while this was in flight
    pidPopupCfg = cfg;
    renderPidPopup(cfg.zones[zoneIndex]);
  }).catch(function () {
    box.innerHTML = '<h3>' + zoneName(zoneIndex) + ' -- PID</h3>' +
      '<p class="warn">Could not read current config.</p>' +
      '<div class="btnrow"><button type="button" onclick="closePidPopup()">Close</button></div>';
  });
}

function renderPidPopup(z) {
  var box = document.getElementById('pidPopupBox');
  var running = lastExecStatus && (lastExecStatus.state === 'running' || lastExecStatus.state === 'paused');
  // Last autotune this SESSION proposed for this zone, if any -- lastAutotuneStatus
  // is the same global the autotune chart already uses (main_page.html has
  // no history beyond the current/last-polled run, same session-only
  // limitation the coupling matrix has, and for the same reason: nothing
  // else on this page persists it either).
  var at = lastAutotuneStatus;
  var atUsable = !!(at && at.zone === pidPopupZone && (at.state === 'done' || at.state === 'aborted') &&
    (at.method === 'relay' ? at.relay_valid : at.model_valid));
  var proposedHtml = atUsable
    ? ('<div class="proposed">Last autotune this session proposed (' + at.state + '): ' +
       'Kp=' + at.proposed_kp.toFixed(4) + ' Ki=' + at.proposed_ki.toFixed(5) + ' Kd=' + at.proposed_kd.toFixed(4) +
       '<button type="button" id="pidPopupUseProposed">Use these</button></div>')
    : '<div class="proposed">No usable autotune result for this zone this session.</div>';

  var runningWarn = running
    ? '<p class="warn">This board REFUSES to write zone config while ANY firing is RUNNING or PAUSED ' +
      '(zones_http.c own interlock check -- a hard refusal, not overridable). Apply below will still be ' +
      'sent and the boards own refusal reason shown, but it will not take effect until the firing is ' +
      'stopped. This is a firmware-level limitation, not a bug in this popup.</p>'
    : '';

  box.innerHTML =
    '<h3>' + zoneName(pidPopupZone) + ' -- PID parameters</h3>' +
    '<div id="pidPopupLive"></div>' +
    '<p class="warn">Changes take effect immediately on a running firing -- this directly changes how ' +
    'this zone is heated, right now, with no confirmation beyond clicking Apply below.</p>' +
    runningWarn + proposedHtml +
    '<label>Kp (current ' + z.pid_kp + ')<input type="number" id="pidPopupKp" value="' + z.pid_kp +
      '" step="any" min="0"></label>' +
    '<label>Ki (current ' + z.pid_ki + ') -- small values matter here, e.g. 0.00012; do not round this' +
      '<input type="number" id="pidPopupKi" value="' + z.pid_ki + '" step="any" min="0"></label>' +
    '<label>Kd (current ' + z.pid_kd + ')<input type="number" id="pidPopupKd" value="' + z.pid_kd +
      '" step="any" min="0"></label>' +
    '<div id="pidPopupMsg" class="msg"></div>' +
    '<div class="btnrow"><button type="button" id="pidPopupApplyBtn" onclick="applyPidPopup()">Apply</button>' +
    '<button type="button" onclick="closePidPopup()">Cancel</button></div>';
  var useBtn = document.getElementById('pidPopupUseProposed');
  if (useBtn && atUsable) {
    useBtn.addEventListener('click', function () {
      document.getElementById('pidPopupKp').value = at.proposed_kp;
      document.getElementById('pidPopupKi').value = at.proposed_ki;
      document.getElementById('pidPopupKd').value = at.proposed_kd;
    });
  }
  refreshPidPopupLive();
}

// Bounds mirrored EXACTLY from zones_config_json.c (see PID_BOUND_MIN/MAX's
// own comment) -- rejects, never clamps, same discipline the firmware
// itself uses ("refuse at the door, never clamp or ignore").
function validatePidValue(raw, label) {
  if (raw === '' || raw === null) return { error: label + ' is required' };
  var v = Number(raw);
  if (!isFinite(v) || isNaN(v)) return { error: label + ' must be a number' };
  if (v < PID_BOUND_MIN) return { error: label + ' cannot be negative' };
  if (v > PID_BOUND_MAX) return { error: label + ' is too large (max ' + PID_BOUND_MAX + ')' };
  return { value: v };
}

function applyPidPopup() {
  var msgEl = document.getElementById('pidPopupMsg');
  var kpR = validatePidValue(document.getElementById('pidPopupKp').value, 'Kp');
  var kiR = validatePidValue(document.getElementById('pidPopupKi').value, 'Ki');
  var kdR = validatePidValue(document.getElementById('pidPopupKd').value, 'Kd');
  var firstError = kpR.error || kiR.error || kdR.error;
  if (firstError) { msgEl.textContent = firstError; return; }
  if (!pidPopupCfg) { msgEl.textContent = 'Config not loaded yet -- try again in a moment.'; return; }
  var zi = pidPopupZone;
  var body = buildZonesEchoPostBody(pidPopupCfg, zi, kpR.value, kiR.value, kdR.value);
  var applyBtn = document.getElementById('pidPopupApplyBtn');
  applyBtn.disabled = true;
  msgEl.textContent = 'Applying…';
  fetch('/api/zones', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body,
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (t) { throw new Error(t || ('HTTP ' + r.status)); });
    // Never assume the write took -- re-read and show what the firmware
    // actually stored, the same "confirm, don't assume" discipline the
    // rest of this pass's write paths follow. A silent partial write that
    // reports success without checking is exactly the failure mode to
    // avoid.
    return fetch('/api/zones').then(function (r2) { return r2.json(); }).then(function (cfg2) {
      if (pidPopupZone !== zi) return; // popup moved to a different zone meanwhile
      pidPopupCfg = cfg2;
      var stored = cfg2.zones[zi];
      var matched = Math.abs(stored.pid_kp - kpR.value) < 1e-6 && Math.abs(stored.pid_ki - kiR.value) < 1e-9 &&
        Math.abs(stored.pid_kd - kdR.value) < 1e-6;
      msgEl.textContent = matched
        ? ('Stored: Kp=' + stored.pid_kp + ' Ki=' + stored.pid_ki + ' Kd=' + stored.pid_kd + '.')
        : ('WARNING: board now reports Kp=' + stored.pid_kp + ' Ki=' + stored.pid_ki + ' Kd=' + stored.pid_kd +
           ' -- different from what was sent. The write may not have fully landed.');
      document.getElementById('pidPopupKp').value = stored.pid_kp;
      document.getElementById('pidPopupKi').value = stored.pid_ki;
      document.getElementById('pidPopupKd').value = stored.pid_kd;
      applyBtn.disabled = false;
    });
  }).catch(function (e) {
    // Covers the interlock refusal (409/428, plain-text reason) and any
    // validation 400 -- both come back as this same .then()->catch() path
    // since !r.ok throws above; the board's own reason text is shown
    // verbatim rather than a generic "failed".
    msgEl.textContent = 'Not applied: ' + e.message;
    applyBtn.disabled = false;
  });
}

function renderChannels(data) {
  lastChannelsData = data;
  const el = document.getElementById('channels');
  if (!data.thermo_ready) {
    el.innerHTML = '';
    const safetyDiv = renderSafetyCard(data);
    if (safetyDiv) {
      el.appendChild(safetyDiv);
    } else {
      el.innerHTML = '<p class="empty">No thermocouple board attached.</p>';
    }
    return;
  }
  el.innerHTML = '';
  data.channels.forEach(function (ch) {
    const div = document.createElement('div');
    div.className = 'card';
    let detail;
    if (ch.spi_failed) {
      // Not a reading at all (the transport failed), so no kc-live-value --
      // dimming a "SPI read failed" fault label on disconnect would suggest
      // the fault itself might be stale/wrong, when it is exactly as current
      // as any other fault_status bit already read this poll.
      detail = '<span class="fault">SPI read failed</span>';
    } else if (!ch.valid) {
      detail = '<span class="fault">' + (faultText(ch.fault_status) || 'invalid reading') + '</span>';
    } else {
      // channels[].age_ms is null when no good conversion has ever been
      // seen; channels[].stale means "older than 10s" (not "no new sample
      // this poll"), so a reading under 10s old must never read as stale.
      var staleTag = '';
      if (ch.age_ms === null || ch.age_ms === undefined) {
        staleTag = ' <span class="stale">(no reading yet)</span>';
      } else if (ch.stale) {
        staleTag = ' <span class="stale">(stale, ' + (ch.age_ms / 1000).toFixed(0) + 's old)</span>';
      }
      // Item 7: cold-junction temperature dropped from this line -- the
      // dashboard now shows the thermocouple (process) reading only. The
      // raw ch.cj_c value is still served by /api/status (diagnostics_page.html
      // still surfaces it); dropping it HERE is a display choice, not a data
      // removal, and needed no API change.
      detail = '<span class="kc-live-value">' + window.kcUnit.fmt(ch.temp_c) + '</span>' + staleTag +
               relayStatusHtml(ch.channel, data.relays);
    }
    // Label the row with its zone name (operator-set on Thermocouples &
    // Zones) when one claims this channel; otherwise fall back to
    // "Channel N", same as before this change (zonesCache not loaded yet,
    // or a wired-but-unassigned channel, are both real states, not errors).
    // zoneName() itself already falls back to "Zone N" for an empty name
    // string ('' is falsy, so its `||` fallback fires) and HTML-escapes.
    // The channel number stays visible either way -- as a title tooltip
    // when a zone name is shown, inline when it isn't -- so an operator
    // diagnosing wiring can still tell which physical channel is which.
    var zi = zoneIndexForChannel(ch.channel);
    var label = (zi === null)
      ? 'Channel ' + ch.channel
      : '<span title="Channel ' + ch.channel + '">' + zoneName(zi) + '</span>';
    div.innerHTML = '<span><span class="ch-swatch" style="background:' + chColor(ch.channel) + '"></span>' +
      label + '</span><span class="temp">' + detail + '</span>';
    // Press-and-hold opens the PID popup -- only for a channel that IS a
    // zone (an unassigned channel has no PID to edit). Re-attached every
    // poll tick since renderChannels() rebuilds these <div>s from scratch
    // each time (el.innerHTML = '' above) -- cheap, and matches every other
    // per-card listener already re-attached the same way elsewhere on this
    // page (see e.g. the profile picker's own per-tick rebuild).
    if (zi !== null) {
      attachLongPress(div, function () { openPidPopup(zi); });
    }
    el.appendChild(div);
  });
  const safetyDiv = renderSafetyCard(data);
  if (safetyDiv) {
    el.appendChild(safetyDiv);
  }
}

// zonesCache/loadZones stay here (unlike setRelay/relayRow/renderRelays,
// moved to manual_page.html per UI_PLAN.md item 3) because the profile-exec
// card and the previous-run banner below still name zones by index
// (zoneName()), and (2026-08-21 rework item 11) renderChannels()'s own
// relayStatusHtml() above now also reads zonesCache directly for the
// thermo_mask/relay_mask join -- this page needs zone/relay MAPPING, not
// relay toggle controls (those stayed on manual_page.html). Fetched once on
// load, NOT added to poll()'s fast loop below: zone config changes rarely
// (an operator visiting /settings/zones), unlike the live relay ON/OFF bits
// this join combines it with, which do belong in the fast loop and already
// arrive via /api/status's "relays" field on every poll() tick.
var zonesCache = { zones: [] };
function loadZones() {
  return fetch('/api/zones').then(function (r) { return r.json(); }).then(function (data) {
    zonesCache = data;

// -- Firing profile execution --------------------------------------------

// Keyed by profile id, filled in by loadProfileList(); used wherever a
// profile is later named by id only (running-exec card, previous-run
// banner) so builtins show their full title there too, not just their code.
var profileTitleById = {};

// A builtin carries both a short `code` (what fits profile_t's 15-char name
// field, e.g. "BQ1000") and the full human `title` ("Plainsman Electric
// Bisque") -- show the title, with the code as parenthesised supporting
// text when it differs and actually fits. A user-saved profile has only
// `name`, which is already the real name the operator gave it.
function profileDisplayName(p) {
  if (p.title && p.title !== p.code) return p.title + (p.code ? ' (' + p.code + ')' : '');
  return p.title || p.name;
}

function zoneListText(mask) {
  var names = [];
  for (var b = 0; b < 8; b++) { if (mask & (1 << b)) names.push(zoneName(b)); }
  return names.join(', ') || 'no zones';
}

function loadProfileList() {
  return fetch('/api/profiles').then(function (r) { return r.json(); }).then(function (list) {
    const sel = document.getElementById('profileSelect');
    sel.innerHTML = '';
    profileTitleById = {};
    list.forEach(function (p) { profileTitleById[p.id] = profileDisplayName(p); });
    if (list.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No saved profiles -- create one first';
      sel.appendChild(opt);
      document.getElementById('runBtn').disabled = true;
      return;
    }
    document.getElementById('runBtn').disabled = false;
    list.forEach(function (p) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = profileDisplayName(p) + ' (' + zoneListText(p.zone_mask) + ')';
      sel.appendChild(opt);
    });
  }).catch(function () {});
}

// -- Kiln configs (relay/thermocouple/PID/guard snapshots) ---------------
//
// Distinct API surface from the firing-profile one above -- see
// /api/kiln_configs's contract (GET returns {active_id, configs:[{id,name,
// is_active}], max_count}; POST save/clone/apply/delete/rename). Degrades
// like every other optional endpoint on this page: a 404 (older firmware,
// or the backend for this simply hasn't landed yet) or a response missing
// any field this code reads hides #kilnConfigPicker entirely rather than
// showing a broken/empty dropdown -- never throws, never renders a
// half-working control.
var kilnConfigsCache = { active_id: null, configs: [], max_count: 0 };
function kcHaveWellFormedResponse(data) {
  return !!data && data.hasOwnProperty('active_id') && Array.isArray(data.configs) &&
         typeof data.max_count === 'number';
}
function kcSetMsg(text, isError) {
  var el = document.getElementById('kcConfigMsg');
  el.textContent = text || '';
  el.classList.toggle('kc-error', !!isError);
}
function loadKilnConfigs() {
  return fetch('/api/kiln_configs').then(function (r) {
    if (!r.ok) throw 0; // 404 on older firmware -- same treatment as any other missing route
    return r.json();
  }).then(function (data) {
    if (!kcHaveWellFormedResponse(data)) throw 0;
    kilnConfigsCache = data;
    var wrap = document.getElementById('kilnConfigPicker');
    var sel = document.getElementById('kilnConfigSelect');
    var prevValue = sel.value;
    sel.innerHTML = '';
    data.configs.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name + (c.is_active ? ' (active)' : '');
      sel.appendChild(opt);
    });
    // Prefer keeping whatever was selected (e.g. right after a clone/rename)
    // over silently jumping back to the first entry; fall back to the
    // active one, then whatever's first.
    if (data.configs.some(function (c) { return String(c.id) === prevValue; })) {
      sel.value = prevValue;
    } else if (data.active_id !== null && data.active_id !== undefined) {
      sel.value = String(data.active_id);
    }
    wrap.hidden = data.configs.length === 0;
  }).catch(function () {
    document.getElementById('kilnConfigPicker').hidden = true;
  });
}

function kcSelectedId() {
  var sel = document.getElementById('kilnConfigSelect');
  return sel.value === '' ? null : sel.value;
}
function kcSelectedConfig() {
  var id = kcSelectedId();
  if (id === null) return null;
  return kilnConfigsCache.configs.filter(function (c) { return String(c.id) === String(id); })[0] || null;
}

// Every mutating call below follows the same shape: POST, then treat a
// non-2xx OR an {ok:false} body as failure (matching this page's existing
// /api/profile_exec/start handling above), surface result.error verbatim
// (name collisions / over-long names come back as this, per the task's
// "must be reported, not silently truncated" requirement) rather than a
// generic toast, then reload the list so the UI reflects the board's
// actual state -- never assumed from the request alone.
function kcPost(path, formBody) {
  return window.kcFetchWithSafetyAck(path, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formBody,
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) { return { httpOk: r.ok, body: j }; });
  });
}
function kcHandleResult(result, okMsg) {
  var failed = !result.httpOk || result.body.ok === false;
  if (failed) {
    kcSetMsg(result.body.error || 'That failed.', true);
  } else {
    kcSetMsg(okMsg, false);
  }
  return loadKilnConfigs().then(function () { return !failed; });
}

document.getElementById('kcApplyBtn').addEventListener('click', function () {
  var cfg = kcSelectedConfig();
  if (!cfg) return;
  // Applying REWRITES relay wiring, thermocouple assignment, PID gains AND
  // guard thresholds -- overwriting the current live setup outright. Must
  // say so plainly (task's explicit wording requirement) and nudge toward
  // saving first, since there is no "are you sure" after this point.
  if (!confirm('Apply kiln config "' + cfg.name + '"?\n\n' +
               'This REPLACES the current relay wiring, thermocouple assignment, ' +
               'PID gains, and guard thresholds with what was saved in this config. ' +
               'If your current settings aren\'t saved anywhere, save them first ' +
               '(Manage below) or they will be lost.')) return;
  kcSetMsg('Applying...', false);
  kcPost('/api/kiln_configs/apply', 'id=' + encodeURIComponent(cfg.id)).then(function (result) {
    // The backend refuses this outright while a firing is running or heaters
    // are on -- that refusal must read as a clear, specific refusal, never
    // as a generic failure and never as if it quietly succeeded. It arrives
    // as ok:false + error text via the same kcHandleResult path as any other
    // failure, so no special-casing is needed here beyond making sure we
    // actually show the reason (handled by kcHandleResult using
    // result.body.error) -- but ALSO re-check the resulting active_id
    // matches what was requested, rather than trusting a 2xx+ok:true body
    // alone, per "re-read the resulting state after any apply."
    var failed = !result.httpOk || result.body.ok === false;
    if (failed) { kcHandleResult(result, ''); return; }
    loadKilnConfigs().then(function () {
      if (String(kilnConfigsCache.active_id) === String(cfg.id)) {
        kcSetMsg('Applied "' + cfg.name + '". Relay/thermocouple/PID/guard settings are now live.', false);
      } else {
        // POST reported success but the config that's actually active
        // afterward doesn't match what we asked for -- do not claim success
        // for something we can't confirm happened.
        kcSetMsg('Apply did not take effect as expected -- reload and check the active config before relying on it.', true);
      }
    });
  });
});

function fmtDuration(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m + 'm ' + sec + 's';
}

// Compact m:ss form for chart tick labels -- fmtDuration's "12m 34s" is fine
// for the progress bar's prose but is wider than a tick label has room for
// once several of them share the plot width on a phone-width canvas.
function fmtTick(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Freezing point, always in the raw Celsius the firmware stores and this
// script computes with -- app.js's kcUnit only converts for DISPLAY (see its
// own header comment), so every temperature comparison in this file, this
// constant included, stays in Celsius; only the text drawn on screen runs
// through kcUnit.toDisplay()/label().
var CHART_FREEZING_C = 0;

// One legend row's markup: a short coloured line sample (dashed for the
// planned-curve series, solid otherwise) plus its label. Labels here are
// always this script's own literal strings, never server-supplied, so
// kcEscapeHtml is not needed -- unlike the fault/name text spliced in
// elsewhere on this page, which always is.
function chartLegendItem(color, label, dashed) {
  return '<span class="chart-legend-item"><span class="chart-legend-swatch' +
    (dashed ? ' dashed' : '') + '" style="border-color:' + color + '"></span>' + label + '</span>';
}

// Single place that fills in #chartAxisNote/#chartLegend for BOTH chart
// modes -- see drawIdleDots/drawHistoryChart for what each mode passes in.
// The axis-note text is the "be honest about the span" requirement: it is
// built entirely from values the caller is actually about to plot (or, for
// the idle no-plan case, an explicit statement that nothing here is a time
// series at all), never a guess at wall-clock time this board doesn't have
// (see renderLastRun's own comment on why -- no RTC, no guaranteed SNTP).
function renderChartMeta(mode, opts) {
  opts = opts || {};
  var note = '';
  var items = [];
  if (mode === 'running') {
    // 2026-09-01 follow-up (owner: "i am still only seeing one zone on the
    // web graph... during a live three-zone firing"): one legend row per
    // zone actually plotted (opts.zoneItems, built by drawHistoryChart the
    // same way drawAutotuneChart's zoneItems already are -- chColor(zone),
    // the same mapping the channel list/idle dots use), not a single fixed
    // "actual" row. duty/planned/guard are all NON-zone series and now come
    // from SERIES_COLORS exclusively -- see that constant's own doc comment
    // for why they must never take a zone's colour.
    (opts.zoneItems || []).forEach(function (it) { items.push(chartLegendItem(it.color, it.label)); });
    // 2026-08-29: ONE target series, not two. What used to be a separate
    // grey "desired" row (the recorded commanded setpoint, trailing) and a
    // purple "planned" row (the forward preview) are now the same line --
    // solid over elapsed time, dashed ahead of now. Only one legend row, and
    // its label says which half is which when there is a future half.
    items.push(chartLegendItem(SERIES_COLORS.plan, opts.planShown ? 'planned (dashed ahead of now)' : 'planned'));
    items.push(chartLegendItem(SERIES_COLORS.duty, opts.dutyLabel || 'duty'));
    if (opts.guardShown) items.push(chartLegendItem(SERIES_COLORS.guard, 'guard trip'));
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
    // tMin/actualMaxT are exactly the domain x() maps rows over below --
    // never the plan's own (possibly longer) horizon, so this can't overstate
    // how much real history is on screen.
    note = 'Showing ' + fmtTick(opts.tMin) + '–' + fmtTick(opts.actualMaxT) + ' elapsed';
    if (opts.totalPlannedS !== null && opts.totalPlannedS !== undefined) {
      note += ' of ' + fmtTick(opts.totalPlannedS) + ' planned';
    }
    // Same reload-mid-run honesty as the autotune view (see that branch's
    // own comment below for the full reasoning) -- the non-representative
    // zones' temperature traces AND the representative zone's own per-zone
    // duty line are all client-collected, so a page (re)loaded after a
    // firing was already underway has no history for them before the
    // moment it opened.
    if (opts.partialZoneSeries) {
      note += " (coupling zones' traces and per-zone duty only cover time since this page was opened)";
    }
  } else if (mode === 'autotune') {
    // PID_EXPANSION_PLAN.md Phase 7b: the phase label is REQUIRED here, not
    // decoration -- a flat settling segment and a stalled step look
    // identical on the trace line alone (this cost real debugging time
    // tonight). zone/elapsed/duty ride along in the same note so an
    // operator glancing at the chart doesn't have to also open zones_page.
    //
    // 2026-08-31 follow-up: one legend row per zone actually plotted
    // (opts.zoneItems, built by drawAutotuneChart from CH_COLORS/chColor --
    // the same per-channel colour every other view on this page uses, so a
    // zone reads as the same colour here as in the channel list/idle dots),
    // plus the commanded-duty series -- see that function's own comment for
    // why coupling between zones needs to be visible, not just the tested
    // zone's own trace.
    var st = opts.st;
    (opts.zoneItems || []).forEach(function (it) { items.push(chartLegendItem(it.color, it.label)); });
    items.push(chartLegendItem(SERIES_COLORS.duty, 'commanded duty (right axis, %, stepped)'));
    if (opts.planShown) items.push(chartLegendItem(SERIES_COLORS.plan, 'planned profile (preview)', true));
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
    var phase = AUTOTUNE_PHASE_LABEL[st.state] || st.state;
    note = 'Autotune: ' + phase + ' — ' + zoneName(st.zone) +
      ' — elapsed ' + fmtTick(st.elapsed_s) + ' — duty ' + st.duty.toFixed(2);
    if (st.state === 'aborted' && st.abort_reason) {
      note += ' — ' + st.abort_reason;
    }
    // Reload-mid-run honesty (2026-08-31 follow-up): the OTHER zones' traces
    // are accumulated client-side (there is no server-side history for them
    // the way trace.csv is the tested zone's own authoritative record), so a
    // page opened after a run was already underway has NO history for those
    // zones before the moment it opened -- their lines start partway across
    // the plot rather than at t=0. Said explicitly here rather than left for
    // the reader to notice a line that "just starts partway through", which
    // could otherwise read as a sensor fault instead of what it actually is.
    if (opts.partialZoneSeries) {
      note += ' (some zones\' traces only cover time since this page was opened)';
    }
  } else {
    // Idle: the dots are this instant's live readings, not a time series --
    // see drawIdleDots's own header comment for why there is nothing to put a
    // real elapsed span on. Only the planned-curve preview (if any) has a
    // genuine time axis, so only it gets one, and it's labelled "preview,
    // not started" so it can never be mistaken for a run in progress.
    note = 'Live channel readings (not a time series)';
    if (opts.planShown) {
      items.push(chartLegendItem(SERIES_COLORS.plan, 'planned profile (preview)', true));
      note += ' — dashed line previews the selected profile, 0–' +
        fmtTick(opts.planMaxT) + ', not started';
    }
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
  }
  document.getElementById('chartAxisNote').textContent = note;
  document.getElementById('chartLegend').innerHTML = items.join('');
}

// Draws the x-axis tick row (evenly spaced fmtTick() labels across [tMin,
// tMax], mapped through the caller's own x() so ticks always land exactly
// where the data they label actually is) plus, when the axis had to stretch
// below freezing to fit a genuine sub-zero reading, a dashed reference line
// at 0degC so that region reads as "below the normal range", not as an
// ordinary continuation of the plot. g/x/yTemp/minV/maxV are the same
// values the caller just used to draw its own series.
function drawChartAxis(g, x, yTemp, tMin, tMax) {
  var ctx = g.ctx;
  var tickCount = 3;
  ctx.font = '9px sans-serif';
  for (var ti = 0; ti <= tickCount; ti++) {
    var tt = tMin + (tMax - tMin) * ti / tickCount;
    var tx = x(tt);
    ctx.strokeStyle = g.border;
    ctx.beginPath(); ctx.moveTo(tx, g.padT + g.plotH); ctx.lineTo(tx, g.padT + g.plotH + 3); ctx.stroke();
    var label = fmtTick(tt);
    var tw = ctx.measureText(label).width;
    var lx = Math.max(0, Math.min(g.cssW - tw, tx - tw / 2));
    ctx.fillStyle = g.muted;
    ctx.fillText(label, lx, g.cssH - 4);
  }
}

// Owner request: the y-axis (temp) should always carry 10 markings, not
// just a top/bottom label. Evenly spaced across [minV, maxV] regardless of
// how that range was derived (live-reading pad, history pad, or the
// freezing-floor clamp) -- shared by drawIdleDots and drawHistoryChart so
// both charts read the same way.
function drawYAxis(g, yTemp, minV, maxV) {
  var ctx = g.ctx, tickCount = 10;
  ctx.font = '10px sans-serif';
  for (var vi = 0; vi <= tickCount; vi++) {
    var vv = minV + (maxV - minV) * vi / tickCount;
    var vy = yTemp(vv);
    ctx.strokeStyle = g.border;
    ctx.beginPath(); ctx.moveTo(g.padL - 3, vy); ctx.lineTo(g.padL, vy); ctx.stroke();
    ctx.fillStyle = g.muted;
    ctx.fillText(window.kcUnit.toDisplay(vv).toFixed(0) + window.kcUnit.label(), 2, vy + 3);
  }
}

// The freezing-clamp's visible "this is out of range" marker -- drawn
// whenever the axis had to stretch below CHART_FREEZING_C to fit a genuine
// sub-zero reading (see drawIdleDots/drawHistoryChart's own comments on that
// clamp). Separate from drawChartAxis (time ticks) because it fires
// independently of whether there's any time axis to draw at all -- the idle
// dots have no time series but can still need this line.
function drawFreezingRef(g, yTemp, minV, maxV) {
  if (!(CHART_FREEZING_C > minV && CHART_FREEZING_C < maxV)) return;
  var ctx = g.ctx, fy = yTemp(CHART_FREEZING_C);
  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = g.fault; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(g.padL, fy); ctx.lineTo(g.padL + g.plotW, fy); ctx.stroke();
  ctx.restore();
}

// Shared by the exec card and the previous-run banner (both name zones by
// bit position, zones.relay_mask-style, per zones_http.h).
function zoneName(zi) {
  var raw = (zonesCache.zones[zi] && zonesCache.zones[zi].name) || ('Zone ' + zi);
  return window.kcEscapeHtml(raw);
}

// -- Planned-profile curve (the chart's single target series) ------------
//
// /api/profile_plan?id=N returns the profile's STRAIGHT-LINE plan
// (total_planned_s + points[{t,c}], celsius, t = seconds from a
// hypothetical run start at 0).
//
// SUPERSEDED 2026-08-29 (owner: "drop desired and modify planned; planned
// should be the displayed target for that time"). This used to be the third
// chart series, drawn alongside a separate grey "desired" line taken from
// history.csv's recorded setpoint column. The two were conceptually
// distinct -- recorded-commanded vs idealised-plan -- but reading them side
// by side was just redundant. They are now ONE series labelled "planned":
// over time already elapsed it plots the RECORDED commanded setpoint (what
// "desired" used to show, which is the real target at that moment and can
// legitimately sit behind the idealised plan when ramp-lock holds
// s_exec.target_c back -- see profile_executor.c's ramp-lock branch), and
// beyond the last recorded sample it continues with this plan's own points
// as the preview. Only the future half of the line is dashed, so "recorded"
// and "projected" stay distinguishable without a second legend row.
//
// Cached per profile id (a profile's plan does not change while the page is
// open -- editing one happens on /profiles, a full page navigation away)
// so switching the picker back and forth, or a running/paused state's
// repeated pollExec ticks, don't re-fetch every 2s. A 404 (route not wired
// yet -- the backend for this is landing concurrently with this change) or
// any fetch failure caches `null`, same "degrade like older firmware"
// treatment as every other optional endpoint on this page.
var planCache = {};
function fetchPlan(id) {
  if (id === undefined || id === null || id === '') return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(planCache, id)) return Promise.resolve(planCache[id]);
  return fetch('/api/profile_plan?id=' + id).then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (data) {
