<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kilnCtl</title>
<link rel="stylesheet" href="/theme.css">
<script>(function(){var t=localStorage.getItem('kilnctl-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<!-- UI_PLAN.md Web section 4 items 1/2/4/5: shared nav, sticky Stop,
     connection-lost banner, confirm helper. `defer` -- see nav.js's own
     header comment for why this page's inline <script> below can only rely
     on window.kcNav/kcConfirm from inside event-handler callbacks. -->
<script defer src="/nav.js"></script>
<script defer src="/app.js"></script>
<style>
  /* Page-local palette (docs/UI_THEME.md / App/drivers/ui_theme.h, TODO.md
     10.6/10.6a). The shared --ui-* palette and .theme-btn now live in
     /theme.css (linked above, EMBED_TXTFILES'd from App/drivers/theme.css) --
     this block keeps only what's specific to this page: the --bg/--fg/etc
     names the existing light/dark toggle uses as its interface (unchanged
     behaviour); only the DARK variant points at the --ui-* values instead of
     its own hex, so toggled-dark and default (no preference) match the LCD,
     while explicit light mode is untouched. */
  :root {
    --bg: #fff; --fg: #111; --muted: #444; --border: #888; --button-bg: #f2f2f2;
    --card-bg: #f7f7f7; --on-color: #1a7a1a; --off-color: #888; --fault-color: #b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
      --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
      --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
    --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
    --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
  }
  body { font-family: sans-serif; max-width: 480px; margin: 2em auto; padding: 0 1em;
         background: var(--bg); color: var(--fg); }
  .theme-btn { position: fixed; top: 0.8em; right: 0.8em; border: 1px solid var(--border);
               background: var(--button-bg); color: var(--fg); border-radius: var(--ui-radius);
               padding: 0.3em 0.6em; font-size: 0.9em; cursor: pointer; }
  h1 { font-size: 1.2em; }
  h2 { font-size: 1em; margin-top: 1.5em; border-top: 1px solid var(--border); padding-top: 1em; }
  p { color: var(--muted); }
  a.button { display: inline-flex; align-items: center; min-height: var(--ui-touch);
             box-sizing: border-box; margin-top: 1.5em; padding: 0.7em 1.5em; font-size: 1em;
             border: 1px solid var(--border); border-radius: var(--ui-radius); text-decoration: none;
             color: var(--fg); background: var(--button-bg); }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
          padding: 0.7em 1em; margin-bottom: 0.5em; display: flex; justify-content: space-between;
          align-items: center; }
  .temp { font-size: 1.1em; font-weight: bold; }
  .fault { color: var(--fault-color); font-size: 0.85em; }
  .stale { color: var(--muted); font-size: 0.85em; }
  .empty { color: var(--muted); font-style: italic; }
  /* 2026-08-21 dashboard reflow: profile <select> and Start button now sit
     side by side (owner's explicit request) instead of stacked full-width.
     flex-wrap so a narrow phone (this page's own body max-width is 480px,
     but real viewports go well under that -- see the ~390px figure theme.css
     cites for its own mobile rule) drops the button to its own line under
     the select rather than the row overflowing and forcing horizontal
     scroll; the select keeps flex:1 so it fills the row (or wraps to full
     width) instead of leaving the button an arbitrary leftover sliver. */
  #runPicker { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5em; }
  select { flex: 1 1 200px; min-width: 0; box-sizing: border-box; min-height: var(--ui-touch); padding: 0.5em; font-size: 1em;
           background: var(--button-bg); color: var(--fg); border: 1px solid var(--border);
           border-radius: var(--ui-radius); margin-bottom: 0; }
  button.run-btn { padding: 0.6em 1.2em; font-size: 0.95em;
                    border-radius: var(--ui-radius);
                    border: 1px solid var(--border); background: var(--button-bg); color: var(--fg);
                    cursor: pointer; margin-right: 0.5em; margin-top: 0.3em; }
  button.run-btn.primary { background: var(--on-color); color: #fff; border-color: var(--on-color); }
  /* Owner's request: halve the Start button's height. theme.css's shared
     `button { min-height: var(--ui-touch); }` rule (var(--ui-touch): 72px,
     theme.css line 21) is exactly the "every real button gets a 72px touch
     target" convention that UI_PLAN.md section 3 Web item 2 consolidated
     there for all six pages -- halving to 36px directly contradicts it, and
     that conflict is real, not a rule I can quietly route around. Scoped to
     #runBtn only (not .run-btn generally, which would also shrink Pause/
     Resume/Stop in the exec card -- not asked for and not done here), and
     kept out of theme.css entirely so the other five pages' plain `button`
     rule and every other button on THIS page are unaffected. To claw back
     some of the lost tap area without growing the visible button back
     toward 72px, #runBtn keeps position:relative and grows its actual hit
     region with a transparent ::after extending 9px above and below the
     visible box (36px visible + 9+9 = 54px effective hit height) -- an
     invisible hit-area extension is the "padding/ext area rather than a
     smaller hit box" alternative asked for, since the visible box itself
     cannot be both half-height and still 72px tall. */
  #runBtn { min-height: 36px; position: relative; margin-top: 0; }
  #runBtn::after { content: ''; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px; }
  .exec-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--ui-radius);
               padding: 0.7em 1em; margin-top: 0.5em; }
  .exec-card .row { display: flex; justify-content: space-between; margin-bottom: 0.3em; }
  .exec-state { font-weight: bold; text-transform: capitalize; }
  .exec-state.state-faulted { color: var(--fault-color); }
  .exec-state.state-running { color: var(--on-color); }
  #historyChart { width: 100%; height: 220px; background: var(--card-bg);
                  border: 1px solid var(--border); border-radius: var(--ui-radius); display: block; }
  /* 2026-08-21: progress bar sits directly under the chart (owner's explicit
     placement -- NOT at the page bottom, and the bottom nav bar stays gone).
     Hidden entirely (#progressWrap display:none) when there's nothing to
     show: idle with no run, or older firmware that doesn't send the new
     /api/profile_exec fields at all -- see renderProgress()'s own comment
     for the degrade-on-missing-fields rule. The indeterminate state (total
     known, remaining_s null -- e.g. a zero ramp-rate segment with no
     predictable duration) uses a moving stripe animation instead of any
     fixed fill fraction, so it can never be mistaken for "0% done" or
     "100% done"; the no-total state skips the track/fill entirely and shows
     elapsed-only text, since a bar with no denominator has nothing honest
     to show as its fill amount. */
  #progressWrap { margin-top: 0.6em; }
  .progress-track { height: 10px; border: 1px solid var(--border); border-radius: 999px;
                     background: var(--card-bg); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--on-color); width: 0%; }
  .progress-fill.indeterminate {
    width: 100% !important;
    background-image: repeating-linear-gradient(45deg, var(--on-color) 0, var(--on-color) 10px,
                       transparent 10px, transparent 20px);
    background-size: 28px 28px;
    animation: kc-progress-stripe 1s linear infinite;
  }
  @keyframes kc-progress-stripe { from { background-position: 0 0; } to { background-position: 28px 0; } }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8em;
                      color: var(--muted); margin-top: 0.3em; }
  .progress-label .estimate-tag { font-style: italic; }
  /* 2026-08-21 idle-dot swatch: ties a channel's dot colour on the (now
     always-visible) chart back to that same channel's row in the list
     below it, so "which dot is which channel" doesn't require a legend.
     CH_COLORS in the script is the single source of truth for the actual
     colour values; this is just the inline circle that displays them. */
  .ch-swatch { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 50%;
               margin-right: 0.4em; vertical-align: middle; }
  /* Previous-run breadcrumb (TODO.md 6A.3). Uses the existing card colours
     rather than a new palette; only the left rule is coloured, so an
     interrupted firing reads as urgent without the page shouting on every
     ordinary boot after a normal firing. */
  .banner { background: var(--card-bg); border: 1px solid var(--border);
            border-left: 4px solid var(--off-color); border-radius: var(--ui-radius);
            padding: 0.7em 1em; margin-bottom: 1em; font-size: 0.9em; }
  .banner.interrupted { border-left-color: var(--fault-color); }
  .banner h3 { margin: 0 0 0.4em 0; font-size: 0.95em; }
  .banner.interrupted h3 { color: var(--fault-color); }
  .banner .row { display: flex; justify-content: space-between; margin-bottom: 0.2em;
                 color: var(--muted); }
  .banner .note { color: var(--muted); font-style: italic; margin-top: 0.5em; }
  /* Safety-processor trip: the most serious state this page can report, so it
     gets a SOLID fill rather than lastRunBanner's border-only treatment --
     same escalation safety_page.html already applies to an ordinary trip
     (border) vs. TRIP_INEFFECTIVE/S9 (solid fill) -- here every live trip
     gets the solid treatment because "the run kept going while the kiln
     cooled" is exactly the failure this banner exists to make impossible to
     miss. ineffective (S9) gets stronger wording still, matching that same
     precedent's extra emphasis, without a second element/colour. */
  .banner.safety-trip { background: var(--fault-color); border-color: var(--fault-color);
                        border-left-color: var(--fault-color); }
  .banner.safety-trip h3, .banner.safety-trip .row, .banner.safety-trip .row span,
  .banner.safety-trip .note { color: #fff; }
  /* 2026-08-21 rework item 11: relay status shown next to each channel's
     temperature, sourced by joining zonesCache (thermo_mask/relay_mask,
     already loaded once by loadZones() -- see script below) against
     /api/status's "relays" array. Small pill per relay rather than plain
     text so several relays on one channel (item 11's "if several relays
     map to one channel, show them all, identifiably") read as distinct
     tokens instead of running together. relay-unknown (grey, no
     kc-live-value) is deliberately the least visually loud of the three --
     it is not a reading of any kind, live or stale, just an absence, and
     must not compete with relay-on/relay-off for attention the way a real
     status would. */
  .relay-status { margin-left: 0.4em; }
  .relay-tag { display: inline-block; font-size: 0.75em; font-weight: normal; border-radius: var(--ui-radius);
               padding: 0.1em 0.45em; margin-left: 0.25em; border: 1px solid var(--border); }
  .relay-tag.relay-on { color: #fff; background: var(--on-color); border-color: var(--on-color); }
  .relay-tag.relay-off { color: var(--muted); background: transparent; }
  .relay-tag.relay-unknown { color: var(--muted); background: transparent; font-style: italic; }
</style>
</head>
<body>
<button id="themeBtn" class="theme-btn" title="Toggle dark/light theme"></button>
<!-- <h1>kilnCtl</h1> removed 2026-08-21 (rework item 5): nav.js's topbar
     now shows "Dashboard" in the brand's old spot (see nav.js's
     pageTitle() -- this page's bare <title>kilnCtl</title> has no page name
     of its own to reuse, so that function maps it to "Dashboard" specially),
     so the heading duplicated it. -->
<!-- The safety-processor trip banner sits ABOVE lastRunBanner: a live trip is
     more urgent than a record of how the previous firing ended, and per the
     "must not look like an ordinary stop" requirement it needs to out-rank
     that banner visually as well as in reading order. Empty by default
     (renderSafetyTrip() below only ever fills it in, matching lastRunBanner's
     own hide-when-nothing-to-report pattern) -- never rendered as a green/
     blank "all clear" card, just absent when there is nothing to report. -->
<div id="safetyTripBanner"></div>
<div id="lastRunBanner"></div>

<!-- 2026-08-21 rework items 9/10: reordered so firing-profile status/picker
     comes first and per-channel temperatures come last, matching
     ui_page_home.c's own ordering (profile summary before zone rows -- see
     that file's header comment on what stayed on the LCD's home page and in
     what order). The history graph in between has no LCD equivalent to
     match: ui_page_home.c's own header comment says the desired-vs-actual
     chart was moved OFF the LCD's home page entirely, to ui_page_history.c,
     because it didn't fit that screen's 264px no-scroll budget -- the web
     dashboard has no such budget, so item 9 places it here explicitly
     rather than leaving it off. The "Thermocouples"/"Firing profiles" <h2>
     headings are removed outright (item 10), not just reordered: with the
     graph and channel cards sitting directly under their own picker/history
     intro text, the extra section labels no longer added information, only
     vertical space. -->
<div id="execCard"></div>
<!-- 2026-08-21 dashboard reflow: the history canvas now sits directly under
     execCard, ABOVE the profile picker (owner's explicit ordering request),
     matching the intuition that "what's happening" (live exec state, then
     its trend) reads top-to-bottom before "what to start next." The old
     <h2>History</h2> heading and its explanatory paragraph ("This run's
     trend... Red marks are thermal-guard trips. Download CSV") are removed
     outright, not just reordered -- with the graph sitting right under
     execCard with no other canvas nearby, the intro text no longer told the
     operator anything the picture didn't already. Removing that paragraph
     also removes the page's only inline link to /api/history.csv; the route
     itself is untouched and still serves the same CSV --
     GET /api/history.csv -- it's just no longer linked from this page's
     body text. The <p id="historyEmpty"> empty-state line is also gone
     (same "no longer earns its space" call); drawHistoryChart() below no
     longer references it at all -- see that function's own comment for how
     the empty case is now handled (hide the canvas, nothing else) so no
     dangling getElementById('historyEmpty') is left for the poll loop to
     dereference into a TypeError. -->
<canvas id="historyChart" width="600" height="220"></canvas>
<div id="progressWrap" style="display:none">
  <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
  <div class="progress-label"><span id="progressElapsed"></span><span id="progressRemaining"></span></div>
</div>
<div id="runPicker">
  <label for="profileSelect">Profile</label>
  <select id="profileSelect"></select>
  <button id="runBtn" type="button" class="run-btn primary">Start</button>
</div>
<!-- <p><a class="button" href="/profiles">Manage fire profiles</a></p> removed
     2026-08-21: /profiles is still reachable from the shared drop-down menu
     (nav.js's "Firing profiles" entry), so removing this button does not
     orphan the destination. -->

<!-- Item 8: the "Settings" button that used to follow the history section
     is gone -- /settings is reachable from the shared drop-down menu now
     (nav.js), and that hub page itself no longer has anything on it BUT
     the danger zone (settings_page.html), so a second, redundant link to
     it from here would be pointing at a page with nothing left for the
     operator to do except something destructive. -->
<div id="channels"><p class="empty">Loading…</p></div>

<script>
const FAULT_BITS = [
  [0x01, 'open circuit'], [0x02, 'over/under voltage'], [0x04, 'TC low'],
  [0x08, 'TC high'], [0x10, 'CJ low'], [0x20, 'CJ high'],
  [0x40, 'TC out of range'], [0x80, 'CJ out of range'],
];
function faultText(bits) {
  return FAULT_BITS.filter(([b]) => bits & b).map(([, t]) => t).join(', ');
}

// Single source of truth for "which colour is channel N", shared by the
// channel-list swatch (renderChannels below) and the idle dots drawn on
// historyChart (drawIdleDots) -- see that function's comment for why the
// idle case needs a per-channel colour at all (the running-chart trend
// lines only ever track one representative zone, so they never needed
// this). Cycles if there are ever more channels than colours; five
// MAX31856 channels is the current board (CLAUDE.md), so this covers it
// with room to spare.
const CH_COLORS = ['#e63', '#3a9', '#37f', '#c8a', '#fa3', '#0bb'];
function chColor(channel) { return CH_COLORS[channel % CH_COLORS.length]; }

// Item 11: which relay(s) a thermocouple channel drives is NOT in
// /api/status -- it's derived from zonesCache (loaded once by loadZones(),
// below), specifically each zone's thermo_mask (which channels feed it) and
// relay_mask (which relays it drives). Both fields use the same "bit b =
// channel/relay number b" convention the migration code and the /api/status
// relay loop already rely on: zones_http.c's v3->v4 migration seeds a
// zone's thermo_mask as `1u << i` for zone index i (zones_http.c, comment
// on migrate_zones_cfg_v1_to_current), the exact same i this page's own
// `channel` field carries (MAX31856.h: "channel; /* 0..2, as used on the
// wire */", copied into dashboard_channel_status_t verbatim in
// dashboard_http.c); and dashboard_http.c's status_get_handler emits
// "relays" as `{"relay": relay, ...}` for `relay` running 1..KILN_IO_RELAY_COUNT
// with `on = ds.relay_on[relay - 1]`, i.e. relay_mask bit (relay-1) is relay
// number `relay` -- so testing bit (relay-1) here against the same mask the
// firmware itself reads with (`zones_config_get_relay_mask`) is the correct
// join, not a guess. A channel with no zone whose thermo_mask includes it
// maps to zero relay numbers below and renders NOTHING (not "off") --
// per this codebase's missing-data-is-absent convention (see e.g. this
// page's own age_ms===null handling above) an unmapped channel's relay
// state is unknown, not off, and inventing "off" here would be exactly the
// fabrication that convention exists to prevent.
function relayNumbersForChannel(channel) {
  var nums = [];
  (zonesCache.zones || []).forEach(function (z) {
    if (!(z.thermo_mask & (1 << channel))) return;
    for (var b = 0; b < 8; b++) {
      if (z.relay_mask & (1 << b)) {
        var relayNum = b + 1;
        if (nums.indexOf(relayNum) === -1) nums.push(relayNum);
      }
    }
  });
  return nums;
}

// relaysData is /api/status's "relays" array ({relay, on}), present only
// when ds.io_ready (dashboard_http.c) -- absent entirely on a board with no
// IO expander, same as today. Relay ON/OFF IS a live device reading (unlike
// the zone/relay MAPPING itself, which is config from zonesCache, fetched
// once -- see loadZones()'s own comment on why it's not in the fast poll),
// so each pill gets kc-live-value only when an actual on/off value was
// found; a relay whose number is in this channel's list but not in
// relaysData (io not ready) shows "n/a" undimmed, same "absent, not
// fabricated" rule as the channel-with-no-zone case above, just one level
// more specific (mapping known, current value not).
function relayStatusHtml(channel, relaysData) {
  var nums = relayNumbersForChannel(channel);
  if (!nums.length) return '';
  var onByRelay = {};
  (relaysData || []).forEach(function (r) { onByRelay[r.relay] = r.on; });
  var tags = nums.map(function (n) {
    if (!onByRelay.hasOwnProperty(n)) {
      return '<span class="relay-tag relay-unknown">R' + n + ': n/a</span>';
    }
    var on = onByRelay[n];
    return '<span class="relay-tag kc-live-value ' + (on ? 'relay-on' : 'relay-off') + '">R' + n +
           ': ' + (on ? 'ON' : 'off') + '</span>';
  });
  return '<span class="relay-status">' + tags.join('') + '</span>';
}

// Cached so the °C/°F toggle (app.js's kcUnit) can re-render immediately on
// change rather than waiting up to 2s for the next poll() tick -- see the
// 'kcunitchange' listener near the bottom of this script block.
var lastChannelsData = null;
function renderChannels(data) {
  lastChannelsData = data;
  const el = document.getElementById('channels');
  if (!data.thermo_ready) {
    el.innerHTML = '<p class="empty">No thermocouple board attached.</p>';
    return;
  }
  el.innerHTML = '';
  data.channels.forEach(function (ch) {
    const div = document.createElement('div');
    div.className = 'card';
    let detail;
    if (ch.spi_failed) {
      // Not a reading at all (the transport failed), so no kc-live-value --
      // dimming a "SPI read failed" fault label on disconnect would suggest
      // the fault itself might be stale/wrong, when it is exactly as current
      // as any other fault_status bit already read this poll.
      detail = '<span class="fault">SPI read failed</span>';
    } else if (!ch.valid) {
      detail = '<span class="fault">' + (faultText(ch.fault_status) || 'invalid reading') + '</span>';
    } else {
      // channels[].age_ms is null when no good conversion has ever been
      // seen; channels[].stale means "older than 10s" (not "no new sample
      // this poll"), so a reading under 10s old must never read as stale.
      var staleTag = '';
      if (ch.age_ms === null || ch.age_ms === undefined) {
        staleTag = ' <span class="stale">(no reading yet)</span>';
      } else if (ch.stale) {
        staleTag = ' <span class="stale">(stale, ' + (ch.age_ms / 1000).toFixed(0) + 's old)</span>';
      }
      // Item 7: cold-junction temperature dropped from this line -- the
      // dashboard now shows the thermocouple (process) reading only. The
      // raw ch.cj_c value is still served by /api/status (diagnostics_page.html
      // still surfaces it); dropping it HERE is a display choice, not a data
      // removal, and needed no API change.
      detail = '<span class="kc-live-value">' + window.kcUnit.fmt(ch.temp_c) + '</span>' + staleTag +
               relayStatusHtml(ch.channel, data.relays);
    }
    div.innerHTML = '<span><span class="ch-swatch" style="background:' + chColor(ch.channel) + '"></span>Channel ' +
      ch.channel + '</span><span class="temp">' + detail + '</span>';
    el.appendChild(div);
  });
}

// zonesCache/loadZones stay here (unlike setRelay/relayRow/renderRelays,
// moved to manual_page.html per UI_PLAN.md item 3) because the profile-exec
// card and the previous-run banner below still name zones by index
// (zoneName()), and (2026-08-21 rework item 11) renderChannels()'s own
// relayStatusHtml() above now also reads zonesCache directly for the
// thermo_mask/relay_mask join -- this page needs zone/relay MAPPING, not
// relay toggle controls (those stayed on manual_page.html). Fetched once on
// load, NOT added to poll()'s fast loop below: zone config changes rarely
// (an operator visiting /settings/zones), unlike the live relay ON/OFF bits
// this join combines it with, which do belong in the fast loop and already
// arrive via /api/status's "relays" field on every poll() tick.
var zonesCache = { zones: [] };
function loadZones() {
  return fetch('/api/zones').then(function (r) { return r.json(); }).then(function (data) {
    zonesCache = data;
  }).catch(function () {});
}

// -- Firing profile execution --------------------------------------------

// Keyed by profile id, filled in by loadProfileList(); used wherever a
// profile is later named by id only (running-exec card, previous-run
// banner) so builtins show their full title there too, not just their code.
var profileTitleById = {};

// A builtin carries both a short `code` (what fits profile_t's 15-char name
// field, e.g. "BQ1000") and the full human `title` ("Plainsman Electric
// Bisque") -- show the title, with the code as parenthesised supporting
// text when it differs and actually fits. A user-saved profile has only
// `name`, which is already the real name the operator gave it.
function profileDisplayName(p) {
  if (p.title && p.title !== p.code) return p.title + (p.code ? ' (' + p.code + ')' : '');
  return p.title || p.name;
}

function zoneListText(mask) {
  var names = [];
  for (var b = 0; b < 8; b++) { if (mask & (1 << b)) names.push(zoneName(b)); }
  return names.join(', ') || 'no zones';
}

function loadProfileList() {
  return fetch('/api/profiles').then(function (r) { return r.json(); }).then(function (list) {
    const sel = document.getElementById('profileSelect');
    sel.innerHTML = '';
    profileTitleById = {};
    list.forEach(function (p) { profileTitleById[p.id] = profileDisplayName(p); });
    if (list.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = 'No saved profiles -- create one first';
      sel.appendChild(opt);
      document.getElementById('runBtn').disabled = true;
      return;
    }
    document.getElementById('runBtn').disabled = false;
    list.forEach(function (p) {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = profileDisplayName(p) + ' (' + zoneListText(p.zone_mask) + ')';
      sel.appendChild(opt);
    });
  }).catch(function () {});
}

function fmtDuration(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m + 'm ' + sec + 's';
}

// Shared by the exec card and the previous-run banner (both name zones by
// bit position, zones.relay_mask-style, per zones_http.h).
function zoneName(zi) {
  return (zonesCache.zones[zi] && zonesCache.zones[zi].name) || ('Zone ' + zi);
}

// -- Planned-profile curve (the third chart series) ----------------------
//
// /api/profile_plan?id=N returns the profile's STRAIGHT-LINE plan
// (total_planned_s + points[{t,c}], celsius, t = seconds from a
// hypothetical run start at 0) -- distinct from the "desired" series
// drawHistoryChart already draws from history.csv, which is the RECORDED
// setpoint sample-by-sample and only ever traces behind the run. This is
// the planned curve, drawn ahead of and through the run so the operator can
// see where the profile is headed, not just where it has been.
//
// Cached per profile id (a profile's plan does not change while the page is
// open -- editing one happens on /profiles, a full page navigation away)
// so switching the picker back and forth, or a running/paused state's
// repeated pollExec ticks, don't re-fetch every 2s. A 404 (route not wired
// yet -- the backend for this is landing concurrently with this change) or
// any fetch failure caches `null`, same "degrade like older firmware"
// treatment as every other optional endpoint on this page.
var planCache = {};
function fetchPlan(id) {
  if (id === undefined || id === null || id === '') return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(planCache, id)) return Promise.resolve(planCache[id]);
  return fetch('/api/profile_plan?id=' + id).then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (data) {
    planCache[id] = data;
    return data;
  }).catch(function () {
    planCache[id] = null;
    return null;
  });
}

// The plan currently drawn on the chart, if any -- set by pollExec (running/
// paused/faulted/done, keyed off st.profile_id) or by the profile <select>'s
// change handler (idle preview of whatever's picked but not yet started).
// null means "nothing to draw", either because no id is selected/running or
// because the plan fetch failed/404'd (old firmware, or id not found).
var activePlan = null;
function setActivePlanFor(id) {
  if (id === undefined || id === null || id === '') { activePlan = null; return; }
  fetchPlan(id).then(function (data) {
    activePlan = data;
    // Redraw whichever chart mode is current so a plan that arrives after
    // the frame was already drawn (fetch is async) doesn't sit un-rendered
    // until the next poll tick.
    if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); }
  });
}

// -- Progress bar (under the chart) ---------------------------------------
//
// Reads /api/profile_exec's total_planned_s/elapsed_s/remaining_s/
// remaining_is_estimate. All four are treated as a group: if the response
// doesn't carry them at all (older firmware -- this is a brand-new API
// surface landing alongside this change) the whole bar hides, same
// degrade-gracefully rule as the rest of this page's optional fields. Once
// the fields ARE present:
//   - state idle: hidden (nothing running, elapsed_s is meaningless before
//     a run exists).
//   - total_planned_s null: no denominator to show a fraction of, so no
//     track/fill at all -- elapsed time only, as text.
//   - total_planned_s known, remaining_s null: a ramp_c_per_hr==0 segment
//     has no predictable duration -- rendered as an animated indeterminate
//     stripe (full-width, moving), never 0% or 100%, and the remaining-time
//     text says "unknown" rather than "0:00".
//   - remaining_is_estimate true: the run has overrun (or could overrun)
//     its plan -- the label says "estimate" explicitly rather than
//     presenting a countdown the operator could mistake for exact.
function renderProgress(st) {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const elapsedEl = document.getElementById('progressElapsed');
  const remainingEl = document.getElementById('progressRemaining');

  var have = st && typeof st.elapsed_s === 'number' &&
             st.hasOwnProperty('total_planned_s') && st.hasOwnProperty('remaining_s') &&
             st.hasOwnProperty('remaining_is_estimate');
  var running = st && (st.state === 'running' || st.state === 'paused' ||
                        st.state === 'faulted' || st.state === 'done');
  if (!have || !running) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  elapsedEl.textContent = 'Elapsed ' + fmtDuration(st.elapsed_s);

  if (st.total_planned_s === null || st.total_planned_s === undefined) {
    // No meaningful denominator -- elapsed only, no bar fraction at all.
    fill.classList.remove('indeterminate');
    fill.style.width = '0%';
    remainingEl.textContent = '';
    return;
  }

  if (st.remaining_s === null || st.remaining_s === undefined) {
    fill.classList.add('indeterminate');
    remainingEl.innerHTML = '<span class="estimate-tag">time remaining unknown</span>';
    return;
  }

  fill.classList.remove('indeterminate');
  var pct = st.total_planned_s > 0 ? Math.max(0, Math.min(100, 100 * st.elapsed_s / st.total_planned_s)) : 100;
  fill.style.width = pct.toFixed(1) + '%';
  var remText = fmtDuration(st.remaining_s) + ' left';
  remainingEl.innerHTML = st.remaining_is_estimate
    ? remText + ' <span class="estimate-tag">(estimate)</span>'
    : remText;
}

// -- Previous-run breadcrumb (TODO.md 6A.3, "No auto-resume across reboot") --
//
// This is a report on a firing that is already over, NOT a live status and
// NOT an offer to resume one. The firmware never restarts a firing by
// itself; starting one is always the operator's explicit action through the
// picker below. The banner exists to answer the question a brownout leaves
// behind -- "did it stop because I stopped it, or because the power went
// out" -- and then get out of the way once acknowledged.
// Deliberately NO kc-live-value anywhere in this banner: TODO.md 6A.3 /
// this function's own header comment already establish that this is a
// report on a firing that is ALREADY OVER, not live status -- the numbers
// here (target_c, segment progress) describe a past moment, frozen at
// write time, and don't change or go stale when the current connection
// drops. Dimming them on disconnect would falsely imply they're a live
// reading whose truth depends on the device answering right now; they
// aren't. The °C figure below still runs through kcUnit.fmt() for unit
// parity, just without the live-value class.
// Mirrors SaftyFW's safety_guards.h SAFETY_TRIP_* enum, in words -- same
// mirrored-not-shared reasoning as profile_executor.c's
// safety_trip_reason_words() (KilnFW/SaftyFW are separate build targets;
// this firmware genuinely has no header to #include here). Keep in sync
// with that C table and with safety_guards.h's own enum if it changes.
var SAFETY_TRIP_WORDS = {
  0: 'none', 1: 'overtemp (S1)', 2: 'over setpoint (S2)', 3: 'load stuck on (S3)',
  5: 'sensor invalid (S5)', 6: 'main processor fault (S6a)', 7: 'safety link dead (S6b)',
  8: 'E-stop (S7)', 9: 'rate of rise (S8)', 10: 'TRIP_INEFFECTIVE (S9)',
  12: 'frozen sensor (S11)', 13: 'enclosure overtemp (S12)', 14: 'borrowed data stale (S13)',
  15: 'config corrupt', 16: 'self-test failure'
};
function safetyTripWords(reason) { return SAFETY_TRIP_WORDS[reason] || 'unknown guard'; }

// The gap this closes: relay_authority already blocks new relay-on while the
// safety processor reports a trip, but until this pass nothing on this page
// ever looked at diag_state, so a live trip looked exactly like an ordinary
// firing in progress while the kiln quietly cooled. SAFETY_LINK_STALE_MS
// (1500, safety_link.h) gates this the same way profile_executor.c's
// watchdog gates its own FAULTED transition: a diag_state == TRIPPED read off
// a frame that old is the "link went silent" case, not a live trip, and
// showing it here as a fresh trip would blur exactly the distinction the
// task calls out (guard firing vs. dead peer). Absent/stale diag data never
// renders as safe -- it renders as nothing (banner hidden), never a green
// "all clear," matching the rest of this page's stale-data convention.
var SAFETY_LINK_DIAG_STATE_TRIPPED = 4;
var SAFETY_LINK_STALE_MS = 1500;
function renderSafetyTrip(data) {
  var el = document.getElementById('safetyTripBanner');
  var tripped = data.diag_ever_received && data.diag_state === SAFETY_LINK_DIAG_STATE_TRIPPED &&
                typeof data.diag_age_ms === 'number' && data.diag_age_ms < SAFETY_LINK_STALE_MS;
  if (!tripped) { el.innerHTML = ''; return; }
  var reason = data.diag_trip_reason;
  var ineffective = reason === 10;
  var words = safetyTripWords(reason);
  el.innerHTML = '<div class="banner safety-trip">' +
    '<h3>' + (ineffective ? '!! SAFETY TRIP -- TRIP_INEFFECTIVE !!' : 'SAFETY PROCESSOR TRIPPED') + '</h3>' +
    '<div class="row"><span>Reason</span><span>' + words + '</span></div>' +
    '<div class="row"><span>Heat</span><span>relays blocked off by the safety processor</span></div>' +
    (ineffective ? '<p class="note">Power may still be flowing to the load. Go to the breaker, not the kiln.</p>' : '') +
    '<p class="note">Any firing in progress has been aborted and will not resume. ' +
    'Clear the trip on the safety processor before starting a new firing.</p></div>';
}

function renderLastRun(st) {
  const el = document.getElementById('lastRunBanner');
  const lr = st.last_run;
  if (!lr || !lr.present) { el.innerHTML = ''; return; }

  var names = [];
  for (var b = 0; b < 8; b++) { if (lr.zone_mask & (1 << b)) names.push(zoneName(b)); }

  var html = '<div class="banner' + (lr.interrupted ? ' interrupted' : '') + '">' +
    '<h3>' + (lr.interrupted
      ? 'Previous firing was interrupted &mdash; it never ended cleanly'
      : 'Previous firing ended (' + lr.phase + ')') + '</h3>' +
    '<div class="row"><span>Profile</span><span>' +
      (profileTitleById[lr.profile_id] || lr.profile_name || ('id ' + lr.profile_id)) +
      ' &mdash; ' + (names.join(', ') || 'no zones') + '</span></div>' +
    '<div class="row"><span>Segment</span><span>' + (lr.segment_index + 1) + ' / ' + lr.segment_count +
      ' (' + (lr.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Target at that point</span><span>' + window.kcUnit.fmt(lr.target_c) + '</span></div>' +
    '<div class="row"><span>Into the segment</span><span>' + fmtDuration(lr.segment_elapsed_s) + '</span></div>' +
    // Uptime, not a clock time: the board has no RTC and no guaranteed SNTP,
    // so an absolute timestamp here would be fabricated. See run_state.h.
    '<div class="row"><span>Recorded at</span><span>' + fmtDuration(lr.uptime_at_write_s) +
      ' into that boot</span></div>';
  if (lr.fault_reason) {
    html += '<div class="row fault"><span>Fault ' + lr.fault_guard + '</span><span>' +
            lr.fault_reason + '</span></div>';
  }
  html += '<p class="note">' + (lr.interrupted
    ? 'Nothing was restarted. Relays came up off and stay off until you start a firing.'
    : 'Recorded by the controller, so this stop was deliberate.') + '</p>' +
    '<button class="run-btn" id="ackLastRunBtn">Dismiss</button></div>';

  el.innerHTML = html;
  document.getElementById('ackLastRunBtn').addEventListener('click', function () {
    fetch('/api/profile_exec/ack_last_run', { method: 'POST' }).then(pollExec).catch(pollExec);
  });
}

// This card is the live-status opposite of renderLastRun above: everything
// in it -- exec state, segment/dwell progress, target and per-zone actual
// temperatures, relay on/off -- describes what the board is doing RIGHT NOW
// and goes stale the instant the connection heartbeat (app.js) starts
// failing, so it all gets kc-live-value. Zone names and the profile title
// are config, not readings -- left unmarked.
var lastExecStData = null;
function renderExec(st) {
  lastExecStData = st;
  const card = document.getElementById('execCard');
  const picker = document.getElementById('runPicker');
  if (st.state === 'idle') {
    card.innerHTML = '';
    picker.style.display = '';
    return;
  }
  picker.style.display = 'none';

  var zoneNames = [];
  for (var zb = 0; zb < 8; zb++) { if (st.zone_mask & (1 << zb)) zoneNames.push(zoneName(zb)); }

  let html = '<div class="exec-card">' +
    '<div class="row"><span>' + (profileTitleById[st.profile_id] || st.profile_name) +
    ' &mdash; ' + zoneNames.join(', ') + '</span>' +
    '<span class="exec-state state-' + st.state + ' kc-live-value">' + st.state + '</span></div>' +
    '<div class="row"><span>Segment</span><span class="kc-live-value">' + (st.segment_index + 1) + ' / ' + st.segment_count +
    ' (' + (st.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Shared target</span><span class="kc-live-value">' + window.kcUnit.fmt(st.target_c) + '</span></div>';
  if (st.ramp_lock_held) {
    var laggingNames = [];
    for (var lb = 0; lb < 8; lb++) { if (st.ramp_lock_lagging_mask & (1 << lb)) laggingNames.push(zoneName(lb)); }
    html += '<div class="row fault"><span>Ramp-lock held</span><span class="kc-live-value">waiting on ' +
            (laggingNames.join(', ') || 'a zone') + '</span></div>';
  }
  (st.zones || []).forEach(function (z) {
    html += '<div class="row"><span>' + zoneName(z.zone) + '</span><span class="kc-live-value">' +
      (z.actual_valid ? window.kcUnit.fmt(z.actual_c) : 'no reading') +
      (z.faulted ? ' &mdash; FAULTED' : (z.relay_on ? ' &mdash; ON' : ' &mdash; off')) + '</span></div>';
    if (z.faulted) {
      html += '<div class="row fault kc-live-value">' + zoneName(z.zone) + ': ' + z.fault_reason + '</div>';
    }
  });
  if (st.dwelling && st.state === 'running') {
    html += '<div class="row"><span>Dwell remaining</span><span class="kc-live-value">' + fmtDuration(st.dwell_remaining_s) + '</span></div>';
  }
  if (st.state === 'faulted' && st.fault_reason) {
    html += '<div class="row fault kc-live-value">' + st.fault_reason + '</div>';
  }
  html += '</div>';

  html += '<div style="margin-top:0.5em">';
  if (st.state === 'running') {
    html += '<button class="run-btn" id="pauseBtn">Pause</button>';
  } else if (st.state === 'paused') {
    html += '<button class="run-btn primary" id="resumeBtn">Resume</button>';
  }
  if (st.state === 'running' || st.state === 'paused' || st.state === 'faulted' || st.state === 'done') {
    html += '<button class="run-btn" id="stopBtn">Stop</button>';
  }
  html += '</div>';

  card.innerHTML = html;
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', function () { execAction('pause'); });
  const resumeBtn = document.getElementById('resumeBtn');
  if (resumeBtn) resumeBtn.addEventListener('click', function () { execAction('resume'); });
  const stopBtn = document.getElementById('stopBtn');
  if (stopBtn) stopBtn.addEventListener('click', function () {
    if (!confirm('Stop this firing now? This aborts the run in progress and cannot be resumed.')) return;
    execAction('stop');
  });
}

function execAction(action) {
  fetch('/api/profile_exec/' + action, { method: 'POST' }).then(pollExec).catch(pollExec);
}

// If a start attempt fails, decide whether it failed because the BOARD
// isn't ready (missing zones, no thermocouple board, safety link down, ...)
// or because the PROFILE itself is bad (e.g. a ramp rate over a zone's
// ceiling). The start error is just free text, so there is no reliable way
// to tell those apart from the string alone; instead ask the readiness
// endpoint directly. Any item that is not "ok" and not "deliberately_off"
// (that one was the operator's own choice, not something blocking them) is
// a real blocker -- send the user there instead of a bare toast they can't
// act on. Otherwise it's almost certainly profile-specific, so just show it.
function redirectToReadinessIfBlocked(errMsg) {
  fetch('/api/readiness').then(function (r) { return r.json(); }).then(function (j) {
    var blocking = (j.items || []).some(function (it) {
      return it.status !== 'ok' && it.status !== 'deliberately_off';
    });
    if (blocking) {
      window.location.href = '/readiness';
    } else {
      alert(errMsg || 'failed to start');
    }
  }).catch(function () { alert(errMsg || 'failed to start'); });
}

document.getElementById('runBtn').addEventListener('click', function () {
  const id = document.getElementById('profileSelect').value;
  if (id === undefined || id === '') return;
  const startName = profileTitleById[id] || ('profile ' + id);
  if (!confirm('Start firing "' + startName + '" now? This energises the heaters and will run for hours.')) return;
  fetch('/api/profile_exec/start', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'id=' + id,
  }).then(function (r) { return r.json(); }).then(function (result) {
    if (result.ok === false) {
      redirectToReadinessIfBlocked(result.error);
      return;
    }
    pollExec();
  }).catch(pollExec);
});

function parseHistoryCsv(text) {
  var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
  var rows = [];
  for (var i = 1; i < lines.length; i++) { // skip header
    var f = lines[i].split(',');
    if (f.length < 5) continue;
    rows.push({
      t: parseFloat(f[0]), actual: parseFloat(f[1]), desired: parseFloat(f[2]),
      duty: parseFloat(f[3]), guard: parseInt(f[4], 10),
    });
  }
  return rows;
}

// The chart canvas itself carries no kc-live-value: a <canvas> is one opaque
// bitmap to the DOM, not text nodes/elements the .kc-stale rule's opacity
// selector can reach, and re-drawing it fully transparent on every stale
// tick just to fake the same dimming effect would be a second, duplicate
// staleness indicator fighting the one the banner already gives (this data
// is also on a materially slower 15s poll than the 2-3s heartbeat, so its
// own staleness lags the banner's anyway). The axis/legend TEXT this
// function draws is still unit-converted below for UI_PLAN.md item 7 parity,
// same as every other on-screen °C figure.
// Shared canvas/axis setup for both the running-trend chart (drawHistoryChart)
// and the idle-dots chart (drawIdleDots). Returns null if the canvas isn't
// laid out yet (clientWidth 0), same "nothing sensible to draw" case either
// caller already had to handle.
function setupChart() {
  var canvas = document.getElementById('historyChart');
  canvas.style.display = '';
  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || 600, cssH = 220;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var style = getComputedStyle(document.documentElement);
  var fg = style.getPropertyValue('--fg').trim() || '#111';
  var muted = style.getPropertyValue('--muted').trim() || '#444';
  var border = style.getPropertyValue('--border').trim() || '#888';

  var padL = 42, padR = 36, padT = 10, padB = 20;
  var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
  ctx.strokeStyle = border; ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);
  return { canvas: canvas, ctx: ctx, cssW: cssW, cssH: cssH, fg: fg, muted: muted, border: border,
           padL: padL, padR: padR, padT: padT, padB: padB, plotW: plotW, plotH: plotH };
}

// Idle case (no profile running): there is no time axis to plot against --
// the history ring isn't being fed (profile_executor.c only samples while a
// zone is active/running) -- so this draws one static dot per thermocouple
// channel, pinned to the left edge of the plot area, using this tick's
// /api/status reading. It does NOT accumulate points or move rightward over
// time; each call fully replaces the previous frame (setupChart() clears the
// canvas), so a channel's dot just relocates vertically as its live temp
// changes. Colour matches that channel's swatch in the list below (CH_COLORS/
// chColor(), shared source of truth) so the two views read as the same data.
function drawIdleDots(data) {
  var g = setupChart();
  if (!g) return;
  var channels = (data && data.thermo_ready) ? (data.channels || []) : [];
  var vals = channels.filter(function (c) { return c.valid && !c.spi_failed; })
                     .map(function (c) { return c.temp_c; });

  // Planned-curve preview (idle only): activePlan is set by the profileSelect
  // change handler / initial load when a profile is picked but not started.
  // Its points feed into the same min/max pad below so the preview curve is
  // never clipped off the top/bottom of a range sized only for the dots.
  var planPts = (activePlan && activePlan.points) || [];
  planPts.forEach(function (p) { vals.push(p.c); });

  // Y-axis rule: with no history to derive a range from, scale to the
  // live readings themselves (min/max +/- 10% pad, same shape as the
  // running chart's 5% pad but a bit more generous since a single frozen
  // reading has no future samples to eventually widen the range). With no
  // valid reading at all, fall back to a fixed 0-100 degC range converted
  // through kcUnit -- arbitrary, but keeps the axis legible instead of a
  // divide-by-zero 0..1 span, and matches the kiln's low end.
  var minV = vals.length ? Math.min.apply(null, vals) : 0;
  var maxV = vals.length ? Math.max.apply(null, vals) : 100;
  if (maxV === minV) { minV -= 5; maxV += 5; }
  var padV = (maxV - minV) * 0.1;
  minV -= padV; maxV += padV;

  function yTemp(v) { return g.padT + g.plotH - (v - minV) / (maxV - minV) * g.plotH; }
  var dotX = g.padL + 10; // pinned to the left edge, never marches across the plot

  g.ctx.fillStyle = g.muted; g.ctx.font = '10px sans-serif';
  g.ctx.fillText(window.kcUnit.toDisplay(maxV).toFixed(0) + window.kcUnit.label(), 2, g.padT + 8);
  g.ctx.fillText(window.kcUnit.toDisplay(minV).toFixed(0) + window.kcUnit.label(), 2, g.padT + g.plotH);

  // Planned-curve preview drawn BEFORE the dots so the dots (this instant's
  // real readings) stay on top and are never occluded by the dashed line.
  // Spans the full plot width against the plan's own time axis (0..last
  // point's t, or total_planned_s if larger) -- deliberately NOT pinned to
  // the left edge like the dots, and dashed + a distinct colour (#96c) so
  // it reads as "the plan", not as a moving trend the way the running
  // chart's solid lines do. Explicit label makes the "not started" state
  // impossible to mistake for a live run.
  if (planPts.length >= 2) {
    var pMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > pMaxT) pMaxT = activePlan.total_planned_s;
    if (pMaxT <= 0) pMaxT = 1;
    function px(t) { return g.padL + (t / pMaxT) * g.plotW; }
    g.ctx.save();
    g.ctx.setLineDash([6, 4]);
    g.ctx.strokeStyle = '#96c'; g.ctx.lineWidth = 1.5;
    g.ctx.beginPath();
    planPts.forEach(function (p, i) {
      var ppx = px(p.t), ppy = yTemp(p.c);
      if (i === 0) g.ctx.moveTo(ppx, ppy); else g.ctx.lineTo(ppx, ppy);
    });
    g.ctx.stroke();
    g.ctx.restore();
  }

  channels.forEach(function (c) {
    if (!c.valid || c.spi_failed) return;
    var py = yTemp(c.temp_c);
    g.ctx.beginPath();
    g.ctx.arc(dotX, py, 4, 0, Math.PI * 2);
    g.ctx.fillStyle = chColor(c.channel);
    g.ctx.fill();
  });

  g.ctx.fillStyle = g.fg; g.ctx.font = '11px sans-serif';
  if (planPts.length >= 2) {
    g.ctx.fillText('no firing running — current channel readings', g.padL + 4, g.cssH - 4);
    g.ctx.fillStyle = '#96c';
    g.ctx.fillText('- - previewing plan (not started)', g.padL + 4, g.cssH - 16);
    g.ctx.fillStyle = g.fg;
  } else {
    g.ctx.fillText('no firing running — current channel readings', g.padL + 4, g.cssH - 4);
  }
}

function drawHistoryChart(rows) {
  // 2026-08-21: #historyEmpty (the "No history yet" <p>) was removed from the
  // markup above along with the History heading/intro paragraph -- this used
  // to toggle canvas/empty visibility as a pair. There is no replacement text
  // element now, by the same "no longer earns its space" call as the
  // paragraph removal. The chart itself is now ALWAYS shown though (see
  // updateChart()'s idle/running split below): an empty `rows` here only
  // happens transiently (e.g. history.csv fetch racing a just-started
  // profile), so rather than hiding the canvas this just leaves whatever
  // was drawn last tick on screen -- never a blank state.
  if (!rows.length) {
    return;
  }

  var g = setupChart();
  if (!g) return;
  var ctx = g.ctx, cssW = g.cssW, cssH = g.cssH, fg = g.fg, muted = g.muted;
  var padL = g.padL, padR = g.padR, padT = g.padT, padB = g.padB, plotW = g.plotW, plotH = g.plotH;

  var tMin = rows[0].t, tMax = rows[rows.length - 1].t;
  // Planned curve (activePlan, set by pollExec's lastExecPlanId switch keyed
  // off st.profile_id): extend tMax to cover the plan's own future points so
  // the dashed line draws AHEAD of the run, not just clipped to however far
  // history.csv has recorded so far -- that's the whole point of showing it
  // separately from the recorded-desired trace, which only ever traces
  // behind. planPts is empty if there's no active plan, or the fetch
  // 404'd/failed (older firmware) -- both collapse to "just draw the usual
  // two series" further down.
  var planPts = (activePlan && activePlan.points) || [];
  if (planPts.length) {
    var planMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > planMaxT) planMaxT = activePlan.total_planned_s;
    if (planMaxT > tMax) tMax = planMaxT;
  }
  if (tMax === tMin) tMax = tMin + 1;
  var tempVals = [];
  rows.forEach(function (r) {
    if (!isNaN(r.actual)) tempVals.push(r.actual);
    if (!isNaN(r.desired)) tempVals.push(r.desired);
  });
  planPts.forEach(function (p) { tempVals.push(p.c); });
  var tMinV = tempVals.length ? Math.min.apply(null, tempVals) : 0;
  var tMaxV = tempVals.length ? Math.max.apply(null, tempVals) : 1;
  if (tMaxV === tMinV) tMaxV = tMinV + 1;
  tMinV -= (tMaxV - tMinV) * 0.05; tMaxV += (tMaxV - tMinV) * 0.05;

  function x(t) { return padL + (t - tMin) / (tMax - tMin) * plotW; }
  function yTemp(v) { return padT + plotH - (v - tMinV) / (tMaxV - tMinV) * plotH; }
  function yDuty(d) { return padT + plotH - d * plotH; }

  ctx.fillStyle = muted; ctx.font = '10px sans-serif';
  ctx.fillText(window.kcUnit.toDisplay(tMaxV).toFixed(0) + window.kcUnit.label(), 2, padT + 8);
  ctx.fillText(window.kcUnit.toDisplay(tMinV).toFixed(0) + window.kcUnit.label(), 2, padT + plotH);
  ctx.fillText('1.0', cssW - padR + 4, padT + 8);
  ctx.fillText('0.0', cssW - padR + 4, padT + plotH);

  function drawLine(key, yFn, color) {
    ctx.beginPath();
    var started = false;
    rows.forEach(function (r) {
      var v = r[key];
      if (isNaN(v)) { started = false; return; }
      var px = x(r.t), py = yFn(v);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    });
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  }
  drawLine('desired', yTemp, '#888');
  drawLine('duty', yDuty, '#3a9');
  drawLine('actual', yTemp, '#e63');

  // Planned curve: dashed + a colour (#96c) shared with no other series (and
  // with the idle preview above, so it reads as "the same kind of thing" in
  // both chart modes), drawn last so it sits on top of the solid duty line
  // it may cross. Straight lines between consecutive points, per the API's
  // own contract ("Straight lines between consecutive points is the correct
  // rendering").
  if (planPts.length >= 2) {
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#96c'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    planPts.forEach(function (p, i) {
      var ppx = x(p.t), ppy = yTemp(p.c);
      if (i === 0) ctx.moveTo(ppx, ppy); else ctx.lineTo(ppx, ppy);
    });
    ctx.stroke();
    ctx.restore();
  }

  rows.forEach(function (r) {
    if (r.guard && r.guard !== 0) {
      var px = x(r.t);
      ctx.strokeStyle = '#c22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + plotH); ctx.stroke();
    }
  });

  ctx.fillStyle = fg; ctx.font = '11px sans-serif';
  ctx.fillText('— actual', padL + 4, cssH - 4);
  ctx.fillStyle = '#888'; ctx.fillText('— desired', padL + 70, cssH - 4);
  ctx.fillStyle = '#3a9'; ctx.fillText('— duty', padL + 145, cssH - 4);
  if (planPts.length >= 2) {
    ctx.fillStyle = '#96c'; ctx.fillText('- - planned', padL + 205, cssH - 4);
  }
  ctx.fillStyle = fg;
}

function pollHistory() {
  fetch('/api/history.csv').then(function (r) { return r.text(); }).then(function (text) {
    drawHistoryChart(parseHistoryCsv(text));
  }).catch(function () {});
}

// Chart mode switch: the user's actual request ("the current temps should
// just show as dots ... until the profile is started") means the chart is
// two different visuals sharing one canvas, not one dataset with an empty
// state. /api/profile_exec's st.state is the same idle/running/paused/
// faulted/done value renderExec() already switches on to show/hide the
// picker vs. the exec card -- reusing it here (rather than e.g. inferring
// "running" from history.csv row count) keeps both switches on the same
// source of truth, so they can never disagree about whether a firing is
// live. wasIdle tracks the previous call so a fresh idle->running
// transition repaints the trend chart immediately instead of waiting up to
// 15s for pollHistory's own interval.
var wasIdle = true;
function updateChartMode(st) {
  var idleNow = !st || st.state === 'idle';
  if (idleNow) {
    drawIdleDots(lastChannelsData);
  } else if (wasIdle) {
    pollHistory();
  }
  wasIdle = idleNow;
}

// Tracks the profile id the running/paused/etc. plan curve was last fetched
// for, so a poll tick that reports the SAME run doesn't refetch/redraw every
// 2s -- only an actual change (new run started, or exec state going idle)
// re-triggers setActivePlanFor.
var lastExecPlanId = undefined;
function pollExec() {
  fetch('/api/profile_exec').then(function (r) { return r.json(); }).then(function (st) {
    renderExec(st);
    renderLastRun(st);
    renderProgress(st);
    var idleNow = !st || st.state === 'idle';
    var planId = idleNow ? undefined : st.profile_id;
    if (planId !== lastExecPlanId) {
      lastExecPlanId = planId;
      if (idleNow) {
        // A run just ended -- don't leave its plan curve on screen under the
        // idle dots. Fall back to previewing whatever's currently picked (or
        // nothing, if the list hasn't loaded / nothing's selected yet).
        var sel = document.getElementById('profileSelect');
        setActivePlanFor(sel ? sel.value : undefined);
      } else {
        setActivePlanFor(planId);
      }
    }
    updateChartMode(st);
  }).catch(function () {});
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(function (data) {
    // 2026-08-21: keeps app.js's kcUnit cache current from the same response
    // this page already fetches for its own rendering -- no second request
    // just to learn the device's unit preference (see app.js's own
    // one-time-fetch fallback for pages that never poll /api/status at all).
    window.kcUnit.updateFromStatus(data);
    renderChannels(data);
    renderSafetyTrip(data);
    // Idle dots are a LIVE temperature display (same data as the channel
    // cards above), so they refresh on this 2s status poll, not history.csv's
    // slower 15s one -- a firing that's still idle should show the dots
    // tracking the kiln cooling/heating ambient in real time, not appear
    // frozen between 15s history polls that (while idle) fetch nothing new
    // anyway (history.csv only starts moving once a profile is running).
    if (wasIdle) { drawIdleDots(data); }
  }).catch(function () {});
  pollExec();
  setTimeout(poll, 2000);
}

// Idle-preview: previewing the plan for whatever's picked (but not started)
// is a natural fit here since the picker sits right below the chart -- but
// it must never look like a run in progress. drawIdleDots() below labels it
// explicitly ("previewing plan — not started") and it only ever draws while
// wasIdle is true; the moment a run actually starts, pollExec's own
// lastExecPlanId switch takes over and the preview label goes away with it.
document.getElementById('profileSelect').addEventListener('change', function (e) {
  if (wasIdle) setActivePlanFor(e.target.value);
});

loadZones().then(function () {
  loadProfileList().then(function () {
    var sel = document.getElementById('profileSelect');
    if (wasIdle && sel) setActivePlanFor(sel.value);
  });
  poll();
});
setInterval(pollHistory, 15000); // history only gains a new sample every 30s -- no need to poll faster
window.addEventListener('resize', function () { if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); } });

// UI_PLAN.md item 7: re-render immediately on a °C/°F toggle instead of
// waiting out poll()'s own 2s interval -- re-uses the last payload each
// render function already cached rather than re-fetching from the board.
window.addEventListener('kcunitchange', function () {
  if (lastChannelsData) renderChannels(lastChannelsData);
  if (lastExecStData) { renderExec(lastExecStData); renderLastRun(lastExecStData); }
  pollHistory();
});

(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = isDark(t) ? '☀' : '🌙';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
