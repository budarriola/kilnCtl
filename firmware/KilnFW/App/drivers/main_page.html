function fmtDuration(s) {
  const m = Math.floor(s / 60), sec = s % 60;
  return m + 'm ' + sec + 's';
}

// Compact m:ss form for chart tick labels -- fmtDuration's "12m 34s" is fine
// for the progress bar's prose but is wider than a tick label has room for
// once several of them share the plot width on a phone-width canvas.
function fmtTick(s) {
  s = Math.max(0, Math.round(s));
  var m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// Freezing point, always in the raw Celsius the firmware stores and this
// script computes with -- app.js's kcUnit only converts for DISPLAY (see its
// own header comment), so every temperature comparison in this file, this
// constant included, stays in Celsius; only the text drawn on screen runs
// through kcUnit.toDisplay()/label().
var CHART_FREEZING_C = 0;

// One legend row's markup: a short coloured line sample (dashed for the
// planned-curve series, solid otherwise) plus its label. Labels here are
// always this script's own literal strings, never server-supplied, so
// kcEscapeHtml is not needed -- unlike the fault/name text spliced in
// elsewhere on this page, which always is.
function chartLegendItem(color, label, dashed) {
  return '<span class="chart-legend-item"><span class="chart-legend-swatch' +
    (dashed ? ' dashed' : '') + '" style="border-color:' + color + '"></span>' + label + '</span>';
}

// Single place that fills in #chartAxisNote/#chartLegend for BOTH chart
// modes -- see drawIdleDots/drawHistoryChart for what each mode passes in.
// The axis-note text is the "be honest about the span" requirement: it is
// built entirely from values the caller is actually about to plot (or, for
// the idle no-plan case, an explicit statement that nothing here is a time
// series at all), never a guess at wall-clock time this board doesn't have
// (see renderLastRun's own comment on why -- no RTC, no guaranteed SNTP).
function renderChartMeta(mode, opts) {
  opts = opts || {};
  var note = '';
  var items = [];
  if (mode === 'running') {
    items.push(chartLegendItem('#e63', 'actual'));
    items.push(chartLegendItem('#888', 'desired'));
    items.push(chartLegendItem('#3a9', 'duty'));
    if (opts.planShown) items.push(chartLegendItem('#96c', 'planned', true));
    if (opts.guardShown) items.push(chartLegendItem('#c22', 'guard trip'));
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
    // tMin/actualMaxT are exactly the domain x() maps rows over below --
    // never the plan's own (possibly longer) horizon, so this can't overstate
    // how much real history is on screen.
    note = 'Showing ' + fmtTick(opts.tMin) + '–' + fmtTick(opts.actualMaxT) + ' elapsed';
    if (opts.totalPlannedS !== null && opts.totalPlannedS !== undefined) {
      note += ' of ' + fmtTick(opts.totalPlannedS) + ' planned';
    }
  } else {
    // Idle: the dots are this instant's live readings, not a time series --
    // see drawIdleDots's own header comment for why there is nothing to put a
    // real elapsed span on. Only the planned-curve preview (if any) has a
    // genuine time axis, so only it gets one, and it's labelled "preview,
    // not started" so it can never be mistaken for a run in progress.
    note = 'Live channel readings (not a time series)';
    if (opts.planShown) {
      items.push(chartLegendItem('#96c', 'planned profile (preview)', true));
      note += ' — dashed line previews the selected profile, 0–' +
        fmtTick(opts.planMaxT) + ', not started';
    }
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
  }
  document.getElementById('chartAxisNote').textContent = note;
  document.getElementById('chartLegend').innerHTML = items.join('');
}

// Draws the x-axis tick row (evenly spaced fmtTick() labels across [tMin,
// tMax], mapped through the caller's own x() so ticks always land exactly
// where the data they label actually is) plus, when the axis had to stretch
// below freezing to fit a genuine sub-zero reading, a dashed reference line
// at 0degC so that region reads as "below the normal range", not as an
// ordinary continuation of the plot. g/x/yTemp/minV/maxV are the same
// values the caller just used to draw its own series.
function drawChartAxis(g, x, yTemp, tMin, tMax) {
  var ctx = g.ctx;
  var tickCount = 3;
  ctx.font = '9px sans-serif';
  for (var ti = 0; ti <= tickCount; ti++) {
    var tt = tMin + (tMax - tMin) * ti / tickCount;
    var tx = x(tt);
    ctx.strokeStyle = g.border;
    ctx.beginPath(); ctx.moveTo(tx, g.padT + g.plotH); ctx.lineTo(tx, g.padT + g.plotH + 3); ctx.stroke();
    var label = fmtTick(tt);
    var tw = ctx.measureText(label).width;
    var lx = Math.max(0, Math.min(g.cssW - tw, tx - tw / 2));
    ctx.fillStyle = g.muted;
    ctx.fillText(label, lx, g.cssH - 4);
  }
}

// The freezing-clamp's visible "this is out of range" marker -- drawn
// whenever the axis had to stretch below CHART_FREEZING_C to fit a genuine
// sub-zero reading (see drawIdleDots/drawHistoryChart's own comments on that
// clamp). Separate from drawChartAxis (time ticks) because it fires
// independently of whether there's any time axis to draw at all -- the idle
// dots have no time series but can still need this line.
function drawFreezingRef(g, yTemp, minV, maxV) {
  if (!(CHART_FREEZING_C > minV && CHART_FREEZING_C < maxV)) return;
  var ctx = g.ctx, fy = yTemp(CHART_FREEZING_C);
  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = g.fault; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(g.padL, fy); ctx.lineTo(g.padL + g.plotW, fy); ctx.stroke();
  ctx.restore();
}

// Shared by the exec card and the previous-run banner (both name zones by
// bit position, zones.relay_mask-style, per zones_http.h).
function zoneName(zi) {
  var raw = (zonesCache.zones[zi] && zonesCache.zones[zi].name) || ('Zone ' + zi);
  return window.kcEscapeHtml(raw);
}

// -- Planned-profile curve (the third chart series) ----------------------
//
// /api/profile_plan?id=N returns the profile's STRAIGHT-LINE plan
// (total_planned_s + points[{t,c}], celsius, t = seconds from a
// hypothetical run start at 0) -- distinct from the "desired" series
// drawHistoryChart already draws from history.csv, which is the RECORDED
// setpoint sample-by-sample and only ever traces behind the run. This is
// the planned curve, drawn ahead of and through the run so the operator can
// see where the profile is headed, not just where it has been.
//
// Cached per profile id (a profile's plan does not change while the page is
// open -- editing one happens on /profiles, a full page navigation away)
// so switching the picker back and forth, or a running/paused state's
// repeated pollExec ticks, don't re-fetch every 2s. A 404 (route not wired
// yet -- the backend for this is landing concurrently with this change) or
// any fetch failure caches `null`, same "degrade like older firmware"
// treatment as every other optional endpoint on this page.
var planCache = {};
function fetchPlan(id) {
  if (id === undefined || id === null || id === '') return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(planCache, id)) return Promise.resolve(planCache[id]);
  return fetch('/api/profile_plan?id=' + id).then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (data) {
    planCache[id] = data;
    return data;
  }).catch(function () {
    planCache[id] = null;
    return null;
  });
}

// The plan currently drawn on the chart, if any -- set by pollExec (running/
// paused/faulted/done, keyed off st.profile_id) or by the profile <select>'s
// change handler (idle preview of whatever's picked but not yet started).
// null means "nothing to draw", either because no id is selected/running or
// because the plan fetch failed/404'd (old firmware, or id not found).
var activePlan = null;
function setActivePlanFor(id) {
  if (id === undefined || id === null || id === '') { activePlan = null; return; }
  fetchPlan(id).then(function (data) {
    activePlan = data;
    // Redraw whichever chart mode is current so a plan that arrives after
    // the frame was already drawn (fetch is async) doesn't sit un-rendered
    // until the next poll tick.
    if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); }
  });
}

// -- Progress bar (under the chart) ---------------------------------------
//
// Reads /api/profile_exec's total_planned_s/elapsed_s/remaining_s/
// remaining_is_estimate. All four are treated as a group: if the response
// doesn't carry them at all (older firmware -- this is a brand-new API
// surface landing alongside this change) the whole bar hides, same
// degrade-gracefully rule as the rest of this page's optional fields. Once
// the fields ARE present:
//   - state idle: hidden (nothing running, elapsed_s is meaningless before
//     a run exists).
//   - total_planned_s null: no denominator to show a fraction of, so no
//     track/fill at all -- elapsed time only, as text.
//   - total_planned_s known, remaining_s null: a ramp_c_per_hr==0 segment
//     has no predictable duration -- rendered as an animated indeterminate
//     stripe (full-width, moving), never 0% or 100%, and the remaining-time
//     text says "unknown" rather than "0:00".
//   - remaining_is_estimate true: the run has overrun (or could overrun)
//     its plan -- the label says "estimate" explicitly rather than
//     presenting a countdown the operator could mistake for exact.
function renderProgress(st) {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const elapsedEl = document.getElementById('progressElapsed');
  const remainingEl = document.getElementById('progressRemaining');

  var have = st && typeof st.elapsed_s === 'number' &&
             st.hasOwnProperty('total_planned_s') && st.hasOwnProperty('remaining_s') &&
             st.hasOwnProperty('remaining_is_estimate');
  var running = st && (st.state === 'running' || st.state === 'paused' ||
                        st.state === 'faulted' || st.state === 'done');
  if (!have || !running) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  elapsedEl.textContent = 'Elapsed ' + fmtDuration(st.elapsed_s);

  if (st.total_planned_s === null || st.total_planned_s === undefined) {
    // No meaningful denominator -- elapsed only, no bar fraction at all.
    fill.classList.remove('indeterminate');
    fill.style.width = '0%';
    remainingEl.textContent = '';
    return;
  }

  if (st.remaining_s === null || st.remaining_s === undefined) {
    fill.classList.add('indeterminate');
    remainingEl.innerHTML = '<span class="estimate-tag">time remaining unknown</span>';
    return;
  }

  fill.classList.remove('indeterminate');
  var pct = st.total_planned_s > 0 ? Math.max(0, Math.min(100, 100 * st.elapsed_s / st.total_planned_s)) : 100;
  fill.style.width = pct.toFixed(1) + '%';
  var remText = fmtDuration(st.remaining_s) + ' left';
  remainingEl.innerHTML = st.remaining_is_estimate
    ? remText + ' <span class="estimate-tag">(estimate)</span>'
    : remText;
}

// -- Previous-run breadcrumb (TODO.md 6A.3, "No auto-resume across reboot") --
//
// This is a report on a firing that is already over, NOT a live status and
// NOT an offer to resume one. The firmware never restarts a firing by
// itself; starting one is always the operator's explicit action through the
// picker below. The banner exists to answer the question a brownout leaves
// behind -- "did it stop because I stopped it, or because the power went
// out" -- and then get out of the way once acknowledged.
// Deliberately NO kc-live-value anywhere in this banner: TODO.md 6A.3 /
// this function's own header comment already establish that this is a
// report on a firing that is ALREADY OVER, not live status -- the numbers
// here (target_c, segment progress) describe a past moment, frozen at
// write time, and don't change or go stale when the current connection
// drops. Dimming them on disconnect would falsely imply they're a live
// reading whose truth depends on the device answering right now; they
// aren't. The °C figure below still runs through kcUnit.fmt() for unit
// parity, just without the live-value class.
// Mirrors SaftyFW's safety_guards.h SAFETY_TRIP_* enum, in words -- same
// mirrored-not-shared reasoning as profile_executor.c's
// safety_trip_reason_words() (KilnFW/SaftyFW are separate build targets;
// this firmware genuinely has no header to #include here). Keep in sync
// with that C table and with safety_guards.h's own enum if it changes.
var SAFETY_TRIP_WORDS = {
  0: 'none', 1: 'chamber over absolute temperature limit (S1)',
  2: 'chamber over setpoint for too long (S2)', 3: 'relay/contactor stuck on, no heat commanded (S3)',
  5: 'safety thermocouple reading invalid (S5)', 6: 'main controller (ESP) reported a fault (S6a)',
  7: 'safety link to main controller went silent (S6b)', 8: 'E-stop pressed (S7)',
  9: 'rising faster than physically possible (S8)', 10: 'contactor welded on, trip did NOT cut power (S9)',
  12: 'safety sensor reading frozen, not updating (S11)', 13: 'enclosure/cold-junction over-temperature (S12)',
  14: "borrowed zone's TC stopped updating (S13)",
  15: 'safety config corrupt', 16: 'safety self-test failed'
};
function safetyTripWords(reason) { return SAFETY_TRIP_WORDS[reason] || 'unknown guard'; }

// thermal_guard_trip_t decode now lives once, in app.js's
// window.thermalGuardWords -- both this page and diagnostics_page.html call
// that shared copy instead of keeping their own table, so the two pages
// cannot drift apart the way SAFETY_TRIP_WORDS above still can (that one
// mirrors a C header; this one only ever mirrored itself across two JS
// files, so centralizing it removed the duplication instead of documenting
// it). 2026-08-28: the last-run banner below used to print lr.fault_guard as
// a bare number next to the word "Fault" -- an undecoded enum, exactly the
// offender ROADMAP.md M13 calls out.

// The gap this closes: relay_authority already blocks new relay-on while the
// safety processor reports a trip, but until this pass nothing on this page
// ever looked at diag_state, so a live trip looked exactly like an ordinary
// firing in progress while the kiln quietly cooled. SAFETY_LINK_STALE_MS
// (1500, safety_link.h) gates this the same way profile_executor.c's
// watchdog gates its own FAULTED transition: a diag_state == TRIPPED read off
// a frame that old is the "link went silent" case, not a live trip, and
// showing it here as a fresh trip would blur exactly the distinction the
// task calls out (guard firing vs. dead peer). Absent/stale diag data never
// renders as safe -- it renders as nothing (banner hidden), never a green
// "all clear," matching the rest of this page's stale-data convention.
var SAFETY_LINK_DIAG_STATE_TRIPPED = 4;
var SAFETY_LINK_STALE_MS = 1500;
// 2026-08-27 (owner scope change: "all faults... come with instructions on
// how to fix them... what was detected wrong"). The ESP now decodes cause/
// remedy/fault-source text itself, off safety_trip_words.h's ONE shared
// table (dashboard_http.c's GET /api/status handler) -- this banner reads
// those fields (diag_trip_reason_cause/_remedy, heat_block_sources_words)
// straight off the JSON rather than keeping a second copy of that logic
// here, so cause/remedy text cannot drift from the LCD's. safetyTripWords()/
// SAFETY_TRIP_WORDS above are kept only as an old-firmware fallback for a
// board that hasn't picked up the new fields yet.
function renderSafetyTrip(data) {
  var el = document.getElementById('safetyTripBanner');
  var tripped = data.diag_ever_received && data.diag_state === SAFETY_LINK_DIAG_STATE_TRIPPED &&
                typeof data.diag_age_ms === 'number' && data.diag_age_ms < SAFETY_LINK_STALE_MS;
  if (!tripped) { el.innerHTML = ''; return; }
  var reason = data.diag_trip_reason;
  var ineffective = reason === 10;
  var isMainFault = reason === 6; // S6a -- the safety processor sees one bit, ESP knows the source
  var words = data.diag_trip_reason_words || safetyTripWords(reason);
  // 2026-08-28: diag_trip_reason_cause (Frame B, the LIVE trip state) never
  // carries numbers -- Frame B has no room for the trip snapshot fields, so
  // dashboard_http.c can only decode it generically. trip_reason_cause
  // (Frame D, TRIP_EVENT) DOES carry them (safety_trip_words_cause_numbered()
  // on the ESP side) whenever the latched trip is this same trip -- which it
  // is, for as long as this banner is showing a live TRIPPED state, since
  // nothing else can produce a fresh TRIP_EVENT in between. Prefer it when
  // the reasons agree; fall back to the generic live text otherwise (a
  // stale/absent TRIP_EVENT, or the rare disagreement window right at a
  // fresh trip before Frame D has arrived).
  var cause = (data.trip_event_ever_received && data.trip_reason === reason && data.trip_reason_cause)
    ? data.trip_reason_cause
    : (data.diag_trip_reason_cause || 'Detail not available on this firmware build.');
  var remedy = data.diag_trip_reason_remedy || 'See firmware/SaftyFW/docs/SAFETY_MODEL.md.';
  var html = '<div class="banner safety-trip">' +
    '<h3>' + (ineffective ? '!! SAFETY TRIP -- TRIP_INEFFECTIVE !!' : 'SAFETY PROCESSOR TRIPPED') + '</h3>' +
    '<div class="row"><span>Reason</span><span>' + window.kcEscapeHtml(words) + '</span></div>' +
    '<div class="row"><span>Detected</span><span>' + window.kcEscapeHtml(cause) + '</span></div>';
  if (isMainFault) {
    // S6a: the "detected" line above is deliberately generic (the safety
    // processor only sees the resulting bit) -- THIS is the actual reason,
    // decoded from the ESP's own fault_sources bitmask AT THE MOMENT this
    // trip latched (trip_fault_sources), not the live heat_block_sources
    // (which may since have released -- see safety_link.h's field comment
    // for why the two can legitimately disagree and must stay labeled
    // separately).
    // 2026-08-28 audit fix (N3/N4): the backend (dashboard_http.c) now
    // decides "not captured" for BOTH cases -- an unwitnessed reboot resend
    // (trip_fault_sources_valid false) and a genuinely-live event whose
    // source released before the frame arrived (mask == 0) -- so this page
    // just renders whatever it says rather than re-deciding with its own
    // (older, narrower) mask check.
    var srcWords = data.trip_fault_sources_words ||
      'not captured (older firmware, or the source released before this page loaded)';
    html += '<div class="row"><span>Fault source (at trip)</span><span>' + window.kcEscapeHtml(srcWords) + '</span></div>';
    var liveWords = data.heat_block_sources_words;
    var liveMask = data.heat_block_sources || 0;
    if (liveMask !== 0 && liveWords !== srcWords) {
      html += '<div class="row"><span>Still asserted right now</span><span>' + window.kcEscapeHtml(liveWords) + '</span></div>';
    }
  }
  html += '<div class="row"><span>Heat</span><span>relays blocked off by the safety processor</span></div>' +
    '<div class="row"><span>To clear</span><span>' + window.kcEscapeHtml(remedy) + '</span></div>' +
    (ineffective ? '<p class="note">Power may still be flowing to the load. Go to the breaker, not the kiln.</p>' : '') +
    '<p class="note">Any firing in progress has been aborted and will not resume. This trip is LATCHED -- ' +
    'it does not clear on its own, and starting a new firing will NOT clear it. Only an explicit Clear Trip does, ' +
    'and it is refused for as long as the cause above is still present.</p>' +
    (reason !== 10
      ? '<button class="run-btn" id="clearTripBtn">Clear Trip</button>'
      : '') +
    '</div>';
  el.innerHTML = html;
  var btn = document.getElementById('clearTripBtn');
  if (btn) {
    btn.addEventListener('click', function () {
      fetch('/api/safety/clear_trip', { method: 'POST' })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (j && j.ok === false && j.error) {
            btn.insertAdjacentHTML('afterend', '<div class="row fault">' + window.kcEscapeHtml(j.error) + '</div>');
          }
        })
        .catch(function () {});
    });
  }
}

// boot_button.h -- same solid-fill "safety-trip" visual treatment as
// renderSafetyTrip() below (border-only "banner" is what this page reserves
// for merely informational strips like lastRunBanner; a window that lets
// ANYONE on the network flash firmware with no password gets the same
// impossible-to-miss styling as a live safety trip, not a quieter one).
function renderBootButtonBypass(data) {
  var el = document.getElementById('bootButtonBypassBanner');
  if (!data.boot_button_bypass_active) { el.innerHTML = ''; return; }
  var remS = data.boot_button_bypass_remaining_s || 0;
  var mm = Math.floor(remS / 60), ss = remS % 60;
  el.innerHTML = '<div class="banner safety-trip">' +
    '<h3>BOOT-BUTTON RECOVERY: OTA PASSWORD CHECK BYPASSED</h3>' +
    '<div class="row"><span>Any device on this network can flash firmware right now, no password.</span></div>' +
    '<div class="row"><span>Closes automatically in</span><span class="kc-live-value">' +
      mm + ':' + (ss < 10 ? '0' : '') + ss + '</span></div>' +
    '</div>';
}

function renderLastRun(st) {
  const el = document.getElementById('lastRunBanner');
  const lr = st.last_run;
  if (!lr || !lr.present) { el.innerHTML = ''; return; }

  var names = [];
  for (var b = 0; b < 8; b++) { if (lr.zone_mask & (1 << b)) names.push(zoneName(b)); }

  var html = '<div class="banner' + (lr.interrupted ? ' interrupted' : '') + '">' +
    '<h3>' + (lr.interrupted
      ? 'Previous firing was interrupted &mdash; it never ended cleanly'
      : 'Previous firing ended (' + lr.phase + ')') + '</h3>' +
    '<div class="row"><span>Profile</span><span>' +
      window.kcEscapeHtml(profileTitleById[lr.profile_id] || lr.profile_name || ('id ' + lr.profile_id)) +
      ' &mdash; ' + (names.join(', ') || 'no zones') + '</span></div>' +
    '<div class="row"><span>Segment</span><span>' + (lr.segment_index + 1) + ' / ' + lr.segment_count +
      ' (' + (lr.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Target at that point</span><span>' + window.kcUnit.fmt(lr.target_c) + '</span></div>' +
    '<div class="row"><span>Into the segment</span><span>' + fmtDuration(lr.segment_elapsed_s) + '</span></div>' +
    // Uptime, not a clock time: the board has no RTC and no guaranteed SNTP,
    // so an absolute timestamp here would be fabricated. See run_state.h.
    '<div class="row"><span>Recorded at</span><span>' + fmtDuration(lr.uptime_at_write_s) +
      ' into that boot</span></div>';
  if (lr.fault_reason) {
    html += '<div class="row fault"><span>Fault (' + window.kcEscapeHtml(window.thermalGuardWords(lr.fault_guard)) +
            ')</span><span>' + window.kcEscapeHtml(lr.fault_reason) + '</span></div>';
  }
  html += '<p class="note">' + (lr.interrupted
    ? 'Nothing was restarted. Relays came up off and stay off until you start a firing.'
    : 'Recorded by the controller, so this stop was deliberate.') + '</p>' +
    '<button class="run-btn" id="ackLastRunBtn">Dismiss</button></div>';

  el.innerHTML = html;
  document.getElementById('ackLastRunBtn').addEventListener('click', function () {
    fetch('/api/profile_exec/ack_last_run', { method: 'POST' }).then(pollExec).catch(pollExec);
  });
}

// This card is the live-status opposite of renderLastRun above: everything
// in it -- exec state, segment/dwell progress, target and per-zone actual
// temperatures, relay on/off -- describes what the board is doing RIGHT NOW
// and goes stale the instant the connection heartbeat (app.js) starts
// failing, so it all gets kc-live-value. Zone names and the profile title
// are config, not readings -- left unmarked.
var lastExecStData = null;
function renderExec(st) {
  lastExecStData = st;
  const card = document.getElementById('execCard');
  const picker = document.getElementById('runPicker');
  // #kilnConfigPicker rides along with the firing-profile picker: applying a
  // kiln config is refused by the backend while a firing is running anyway
  // (it would rewrite the very relay/PID/guard setup the run depends on), so
  // hiding it alongside runPicker keeps the control from inviting an action
  // that's just going to be refused. Only toggled when the element actually
  // exists -- loadKilnConfigs() may not have resolved yet, or may have left
  // it hidden because the backend doesn't support it.
  const kcPicker = document.getElementById('kilnConfigPicker');
  if (st.state === 'idle') {
    card.innerHTML = '';
    picker.style.display = '';
    if (kcPicker) kcPicker.style.display = '';
    return;
  }
  picker.style.display = 'none';
  if (kcPicker) kcPicker.style.display = 'none';

  var zoneNames = [];
  for (var zb = 0; zb < 8; zb++) { if (st.zone_mask & (1 << zb)) zoneNames.push(zoneName(zb)); }

  let html = '<div class="exec-card">' +
    '<div class="row"><span>' + window.kcEscapeHtml(profileTitleById[st.profile_id] || st.profile_name) +
    ' &mdash; ' + zoneNames.join(', ') + '</span>' +
    '<span class="exec-state state-' + st.state + ' kc-live-value">' + st.state + '</span></div>' +
    '<div class="row"><span>Segment</span><span class="kc-live-value">' + (st.segment_index + 1) + ' / ' + st.segment_count +
    ' (' + (st.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Shared target</span><span class="kc-live-value">' + window.kcUnit.fmt(st.target_c) + '</span></div>';
  if (st.ramp_lock_held) {
    var laggingNames = [];
    for (var lb = 0; lb < 8; lb++) { if (st.ramp_lock_lagging_mask & (1 << lb)) laggingNames.push(zoneName(lb)); }
    html += '<div class="row fault"><span>Ramp-lock held</span><span class="kc-live-value">waiting on ' +
            (laggingNames.join(', ') || 'a zone') + '</span></div>';
  }
  (st.zones || []).forEach(function (z) {
    html += '<div class="row"><span>' + zoneName(z.zone) + '</span><span class="kc-live-value">' +
      (z.actual_valid ? window.kcUnit.fmt(z.actual_c) : 'no reading') +
      (z.faulted ? ' &mdash; FAULTED' : (z.relay_on ? ' &mdash; ON' : ' &mdash; off')) + '</span></div>';
    if (z.faulted) {
      html += '<div class="row fault kc-live-value">' + zoneName(z.zone) + ': ' + window.kcEscapeHtml(z.fault_reason) + '</div>';
    }
  });
  if (st.dwelling && st.state === 'running') {
    html += '<div class="row"><span>Dwell remaining</span><span class="kc-live-value">' + fmtDuration(st.dwell_remaining_s) + '</span></div>';
  }
  if (st.state === 'faulted' && st.fault_reason) {
    html += '<div class="row fault kc-live-value">' + window.kcEscapeHtml(st.fault_reason) + '</div>';
  }
  html += '</div>';

  html += '<div style="margin-top:0.5em">';
  if (st.state === 'running') {
    html += '<button class="run-btn" id="pauseBtn">Pause</button>';
  } else if (st.state === 'paused') {
    html += '<button class="run-btn primary" id="resumeBtn">Resume</button>';
  }
  if (st.state === 'running' || st.state === 'paused' || st.state === 'faulted' || st.state === 'done') {
    html += '<button class="run-btn" id="stopBtn">Stop</button>';
  }
  html += '</div>';

  card.innerHTML = html;
  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.addEventListener('click', function () { execAction('pause'); });
  const resumeBtn = document.getElementById('resumeBtn');
  if (resumeBtn) resumeBtn.addEventListener('click', function () { execAction('resume'); });
  const stopBtn = document.getElementById('stopBtn');
  if (stopBtn) stopBtn.addEventListener('click', function () {
    if (!confirm('Stop this firing now? This aborts the run in progress and cannot be resumed.')) return;
    execAction('stop');
  });
}

function execAction(action) {
  fetch('/api/profile_exec/' + action, { method: 'POST' }).then(pollExec).catch(pollExec);
}

// If a start attempt fails, decide whether it failed because the BOARD
// isn't ready (missing zones, no thermocouple board, safety link down, ...)
// or because the PROFILE itself is bad (e.g. a ramp rate over a zone's
// ceiling). The start error is just free text, so there is no reliable way
// to tell those apart from the string alone; instead ask the readiness
// endpoint directly. Any item that is not "ok" and not "deliberately_off"
// (that one was the operator's own choice, not something blocking them) is
// a real blocker -- send the user there instead of a bare toast they can't
// act on. Otherwise it's almost certainly profile-specific, so just show it.
function redirectToReadinessIfBlocked(errMsg) {
  fetch('/api/readiness').then(function (r) { return r.json(); }).then(function (j) {
    var blocking = (j.items || []).some(function (it) {
      return it.status !== 'ok' && it.status !== 'deliberately_off';
    });
    if (blocking) {
      window.location.href = '/readiness';
    } else {
      alert(errMsg || 'failed to start');
    }
  }).catch(function () { alert(errMsg || 'failed to start'); });
}

document.getElementById('runBtn').addEventListener('click', function () {
  const id = document.getElementById('profileSelect').value;
  if (id === undefined || id === '') return;
  const startName = profileTitleById[id] || ('profile ' + id);
  if (!confirm('Start firing "' + startName + '" now? This energises the heaters and will run for hours.')) return;
  // Extra confirmation on top of the normal one above, only when the task-
  // watchdog panic is currently disabled (dev/bench mode).
  if (lastWatchdogPanicDisabled && !window.kcConfirm(WATCHDOG_CFG_FIRING_WARNING_JS)) {
    return;
  }
  fetch('/api/profile_exec/start', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'id=' + id,
  }).then(function (r) { return r.json(); }).then(function (result) {
    if (result.ok === false) {
      redirectToReadinessIfBlocked(result.error);
      return;
    }
    pollExec();
  }).catch(pollExec);
});

function parseHistoryCsv(text) {
  var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
  var rows = [];
  for (var i = 1; i < lines.length; i++) { // skip header
    var f = lines[i].split(',');
    if (f.length < 5) continue;
    rows.push({
      t: parseFloat(f[0]), actual: parseFloat(f[1]), desired: parseFloat(f[2]),
      duty: parseFloat(f[3]), guard: parseInt(f[4], 10),
    });
  }
  return rows;
}

// The chart canvas itself carries no kc-live-value: a <canvas> is one opaque
// bitmap to the DOM, not text nodes/elements the .kc-stale rule's opacity
// selector can reach, and re-drawing it fully transparent on every stale
// tick just to fake the same dimming effect would be a second, duplicate
// staleness indicator fighting the one the banner already gives (this data
// is also on a materially slower 15s poll than the 2-3s heartbeat, so its
// own staleness lags the banner's anyway). The axis/legend TEXT this
// function draws is still unit-converted below for UI_PLAN.md item 7 parity,
// same as every other on-screen °C figure.
// Shared canvas/axis setup for both the running-trend chart (drawHistoryChart)
// and the idle-dots chart (drawIdleDots). Returns null if the canvas isn't
// laid out yet (clientWidth 0), same "nothing sensible to draw" case either
// caller already had to handle.
function setupChart() {
  var canvas = document.getElementById('historyChart');
  canvas.style.display = '';
  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || 600, cssH = 220;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var style = getComputedStyle(document.documentElement);
  var fg = style.getPropertyValue('--fg').trim() || '#111';
  var muted = style.getPropertyValue('--muted').trim() || '#444';
  var border = style.getPropertyValue('--border').trim() || '#888';
  // Theme-aware colour for the freezing reference line/legend swatch --
  // never a hard-coded hex, same rule the rest of this page's palette
  // already follows (see the :root/--fault-color chain at the top of this
  // file). Falls back to the light-theme default only if the variable is
  // somehow unset.
  var fault = style.getPropertyValue('--fault-color').trim() || '#b00';

  var padL = 42, padR = 36, padT = 10, padB = 20;
  var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
  ctx.strokeStyle = border; ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);
  return { canvas: canvas, ctx: ctx, cssW: cssW, cssH: cssH, fg: fg, muted: muted, border: border, fault: fault,
           padL: padL, padR: padR, padT: padT, padB: padB, plotW: plotW, plotH: plotH };
}

// Idle case (no profile running): there is no time axis to plot against --
// the history ring isn't being fed (profile_executor.c only samples while a
// zone is active/running) -- so this draws one static dot per thermocouple
// channel, pinned to the left edge of the plot area, using this tick's
// /api/status reading. It does NOT accumulate points or move rightward over
// time; each call fully replaces the previous frame (setupChart() clears the
// canvas), so a channel's dot just relocates vertically as its live temp
// changes. Colour matches that channel's swatch in the list below (CH_COLORS/
// chColor(), shared source of truth) so the two views read as the same data.
function drawIdleDots(data) {
  var g = setupChart();
  if (!g) return;
  var channels = (data && data.thermo_ready) ? (data.channels || []) : [];
  var vals = channels.filter(function (c) { return c.valid && !c.spi_failed; })
                     .map(function (c) { return c.temp_c; });

  // Planned-curve preview (idle only): activePlan is set by the profileSelect
  // change handler / initial load when a profile is picked but not started.
  // Its points feed into the same min/max pad below so the preview curve is
  // never clipped off the top/bottom of a range sized only for the dots.
  // Genuine-reading check for the freezing clamp below: only ACTUAL
  // thermocouple readings count as "a real sub-zero temperature" -- the plan
  // preview (pushed into `vals` further down, for ranging purposes only) is a
  // synthetic curve that has no business setting the axis floor.
  var sensorVals = vals.slice();

  var planPts = (activePlan && activePlan.points) || [];
  planPts.forEach(function (p) { vals.push(p.c); });

  // Y-axis rule: with no history to derive a range from, scale to the
  // live readings themselves (min/max +/- 10% pad, same shape as the
  // running chart's 5% pad but a bit more generous since a single frozen
  // reading has no future samples to eventually widen the range). With no
  // valid reading at all, fall back to a fixed 0-100 degC range converted
  // through kcUnit -- arbitrary, but keeps the axis legible instead of a
  // divide-by-zero 0..1 span, and matches the kiln's low end.
  var minV = vals.length ? Math.min.apply(null, vals) : 0;
  var maxV = vals.length ? Math.max.apply(null, vals) : 100;
  if (maxV === minV) { minV -= 5; maxV += 5; }
  var padV = (maxV - minV) * 0.1;
  minV -= padV; maxV += padV;

  // Owner request: "the charts should never show below freezing temp" -- but
  // ONLY as an axis floor, not a data clamp. A disconnected/faulty probe or a
  // genuinely cold workshop can and does read below 0degC, and that reading
  // must still be plotted, visibly out of range, not silently pinned to 0 --
  // hiding a real sub-zero reading on a safety-relevant display would hide
  // exactly the kind of fault this dashboard exists to surface. So: if
  // nothing actually read below freezing, don't let the +/-10% pad push the
  // axis floor below 0 for no reason (snap it back up to CHART_FREEZING_C).
  // If something genuinely did read below freezing, leave the axis exactly
  // where the data put it (below zero) and let drawChartAxis's dashed
  // reference line mark 0degC as the abnormal boundary.
  var belowFreezing = sensorVals.length > 0 && Math.min.apply(null, sensorVals) < CHART_FREEZING_C;
  if (!belowFreezing) { minV = Math.max(minV, CHART_FREEZING_C); if (maxV <= minV) maxV = minV + 10; }

  function yTemp(v) { return g.padT + g.plotH - (v - minV) / (maxV - minV) * g.plotH; }
  var dotX = g.padL + 10; // pinned to the left edge, never marches across the plot

  g.ctx.fillStyle = g.muted; g.ctx.font = '10px sans-serif';
  g.ctx.fillText(window.kcUnit.toDisplay(maxV).toFixed(0) + window.kcUnit.label(), 2, g.padT + 8);
  g.ctx.fillText(window.kcUnit.toDisplay(minV).toFixed(0) + window.kcUnit.label(), 2, g.padT + g.plotH);

  // Planned-curve preview drawn BEFORE the dots so the dots (this instant's
  // real readings) stay on top and are never occluded by the dashed line.
  // Spans the full plot width against the plan's own time axis (0..last
  // point's t, or total_planned_s if larger) -- deliberately NOT pinned to
  // the left edge like the dots, and dashed + a distinct colour (#96c) so
  // it reads as "the plan", not as a moving trend the way the running
  // chart's solid lines do. Explicit label makes the "not started" state
  // impossible to mistake for a live run.
  var pMaxT = 0;
  if (planPts.length >= 2) {
    pMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > pMaxT) pMaxT = activePlan.total_planned_s;
    if (pMaxT <= 0) pMaxT = 1;
    function px(t) { return g.padL + (t / pMaxT) * g.plotW; }
    g.ctx.save();
    g.ctx.setLineDash([6, 4]);
    g.ctx.strokeStyle = '#96c'; g.ctx.lineWidth = 1.5;
    g.ctx.beginPath();
    planPts.forEach(function (p, i) {
      var ppx = px(p.t), ppy = yTemp(p.c);
      if (i === 0) g.ctx.moveTo(ppx, ppy); else g.ctx.lineTo(ppx, ppy);
    });
    g.ctx.stroke();
    g.ctx.restore();
    // The plan preview is the ONLY thing in this idle frame with a genuine
    // time axis (the dots below are a single instant, not a series) -- so
    // ticks are drawn spanning just its own 0..pMaxT domain, via the same px()
    // used to place the curve itself, not the dots' fixed left-edge x.
    drawChartAxis(g, px, yTemp, 0, pMaxT);
  }
  if (belowFreezing) drawFreezingRef(g, yTemp, minV, maxV);

  channels.forEach(function (c) {
    if (!c.valid || c.spi_failed) return;
    var py = yTemp(c.temp_c);
    g.ctx.beginPath();
    g.ctx.arc(dotX, py, 4, 0, Math.PI * 2);
    g.ctx.fillStyle = chColor(c.channel);
    g.ctx.fill();
  });

  renderChartMeta('idle', {
    planShown: planPts.length >= 2, planMaxT: pMaxT,
    freezingShown: belowFreezing, faultColor: g.fault,
  });
}

function drawHistoryChart(rows) {
  // 2026-08-21: #historyEmpty (the "No history yet" <p>) was removed from the
  // markup above along with the History heading/intro paragraph -- this used
  // to toggle canvas/empty visibility as a pair. There is no replacement text
  // element now, by the same "no longer earns its space" call as the
  // paragraph removal. The chart itself is now ALWAYS shown though (see
  // updateChart()'s idle/running split below): an empty `rows` here only
  // happens transiently (e.g. history.csv fetch racing a just-started
  // profile), so rather than hiding the canvas this just leaves whatever
  // was drawn last tick on screen -- never a blank state.
  if (!rows.length) {
    return;
  }

  var g = setupChart();
  if (!g) return;
  var ctx = g.ctx, cssW = g.cssW, cssH = g.cssH, fg = g.fg, muted = g.muted;
  var padL = g.padL, padR = g.padR, padT = g.padT, padB = g.padB, plotW = g.plotW, plotH = g.plotH;

  var tMin = rows[0].t, tMax = rows[rows.length - 1].t;
  // Planned curve (activePlan, set by pollExec's lastExecPlanId switch keyed
  // off st.profile_id): extend tMax to cover the plan's own future points so
  // the dashed line draws AHEAD of the run, not just clipped to however far
  // history.csv has recorded so far -- that's the whole point of showing it
  // separately from the recorded-desired trace, which only ever traces
  // behind. planPts is empty if there's no active plan, or the fetch
  // 404'd/failed (older firmware) -- both collapse to "just draw the usual
  // two series" further down.
  var planPts = (activePlan && activePlan.points) || [];
  if (planPts.length) {
    var planMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > planMaxT) planMaxT = activePlan.total_planned_s;
    if (planMaxT > tMax) tMax = planMaxT;
  }
  if (tMax === tMin) tMax = tMin + 1;
  var tempVals = [];
  var actualVals = []; // genuine sensor readings only -- see freezing-clamp comment below
  rows.forEach(function (r) {
    if (!isNaN(r.actual)) { tempVals.push(r.actual); actualVals.push(r.actual); }
    if (!isNaN(r.desired)) tempVals.push(r.desired);
  });
  planPts.forEach(function (p) { tempVals.push(p.c); });
  var tMinV = tempVals.length ? Math.min.apply(null, tempVals) : 0;
  var tMaxV = tempVals.length ? Math.max.apply(null, tempVals) : 1;
  if (tMaxV === tMinV) tMaxV = tMinV + 1;
  tMinV -= (tMaxV - tMinV) * 0.05; tMaxV += (tMaxV - tMinV) * 0.05;

  // Same freezing-axis-floor clamp as drawIdleDots (see that function's
  // comment for the full reasoning): only the recorded ACTUAL trace counts as
  // "a real reading" for deciding whether the axis is allowed to dip below
  // 0degC -- the desired/duty/planned series are config/plan, not sensor
  // data, and must never be what forces (or excuses clamping away) a
  // below-freezing axis.
  var belowFreezing = actualVals.length > 0 && Math.min.apply(null, actualVals) < CHART_FREEZING_C;
  if (!belowFreezing) { tMinV = Math.max(tMinV, CHART_FREEZING_C); if (tMaxV <= tMinV) tMaxV = tMinV + 1; }

  function x(t) { return padL + (t - tMin) / (tMax - tMin) * plotW; }
  function yTemp(v) { return padT + plotH - (v - tMinV) / (tMaxV - tMinV) * plotH; }
  function yDuty(d) { return padT + plotH - d * plotH; }

  ctx.fillStyle = muted; ctx.font = '10px sans-serif';
  ctx.fillText(window.kcUnit.toDisplay(tMaxV).toFixed(0) + window.kcUnit.label(), 2, padT + 8);
  ctx.fillText(window.kcUnit.toDisplay(tMinV).toFixed(0) + window.kcUnit.label(), 2, padT + plotH);
  ctx.fillText('1.0', cssW - padR + 4, padT + 8);
  ctx.fillText('0.0', cssW - padR + 4, padT + plotH);

  function drawLine(key, yFn, color) {
    ctx.beginPath();
    var started = false;
    rows.forEach(function (r) {
      var v = r[key];
      if (isNaN(v)) { started = false; return; }
      var px = x(r.t), py = yFn(v);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    });
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.stroke();
  }
  drawLine('desired', yTemp, '#888');
  drawLine('duty', yDuty, '#3a9');
  drawLine('actual', yTemp, '#e63');

  // Planned curve: dashed + a colour (#96c) shared with no other series (and
  // with the idle preview above, so it reads as "the same kind of thing" in
  // both chart modes), drawn last so it sits on top of the solid duty line
  // it may cross. Straight lines between consecutive points, per the API's
  // own contract ("Straight lines between consecutive points is the correct
  // rendering").
  if (planPts.length >= 2) {
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = '#96c'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    planPts.forEach(function (p, i) {
      var ppx = x(p.t), ppy = yTemp(p.c);
      if (i === 0) ctx.moveTo(ppx, ppy); else ctx.lineTo(ppx, ppy);
    });
    ctx.stroke();
    ctx.restore();
  }

  rows.forEach(function (r) {
    if (r.guard && r.guard !== 0) {
      var px = x(r.t);
      ctx.strokeStyle = '#c22'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + plotH); ctx.stroke();
    }
  });

  var guardShown = rows.some(function (r) { return r.guard && r.guard !== 0; });
  drawChartAxis(g, x, yTemp, tMin, tMax);
  if (belowFreezing) drawFreezingRef(g, yTemp, tMinV, tMaxV);

  var actualMaxT = rows[rows.length - 1].t;
  renderChartMeta('running', {
    tMin: tMin, actualMaxT: actualMaxT,
    totalPlannedS: (activePlan && activePlan.total_planned_s !== undefined) ? activePlan.total_planned_s : null,
    planShown: planPts.length >= 2, guardShown: guardShown,
    freezingShown: belowFreezing, faultColor: g.fault,
  });
}

function pollHistory() {
  fetch('/api/history.csv').then(function (r) { return r.text(); }).then(function (text) {
    drawHistoryChart(parseHistoryCsv(text));
  }).catch(function () {});
}

// Chart mode switch: the user's actual request ("the current temps should
// just show as dots ... until the profile is started") means the chart is
// two different visuals sharing one canvas, not one dataset with an empty
// state. /api/profile_exec's st.state is the same idle/running/paused/
// faulted/done value renderExec() already switches on to show/hide the
// picker vs. the exec card -- reusing it here (rather than e.g. inferring
// "running" from history.csv row count) keeps both switches on the same
// source of truth, so they can never disagree about whether a firing is
// live. wasIdle tracks the previous call so a fresh idle->running
// transition repaints the trend chart immediately instead of waiting up to
// 15s for pollHistory's own interval.
var wasIdle = true;
function updateChartMode(st) {
  var idleNow = !st || st.state === 'idle';
  if (idleNow) {
    drawIdleDots(lastChannelsData);
  } else if (wasIdle) {
    pollHistory();
  }
  wasIdle = idleNow;
}

// Tracks the profile id the running/paused/etc. plan curve was last fetched
// for, so a poll tick that reports the SAME run doesn't refetch/redraw every
// 2s -- only an actual change (new run started, or exec state going idle)
// re-triggers setActivePlanFor.
var lastExecPlanId = undefined;
function pollExec() {
  fetch('/api/profile_exec').then(function (r) { return r.json(); }).then(function (st) {
    renderExec(st);
    renderLastRun(st);
    renderProgress(st);
    var idleNow = !st || st.state === 'idle';
    var planId = idleNow ? undefined : st.profile_id;
    if (planId !== lastExecPlanId) {
      lastExecPlanId = planId;
      if (idleNow) {
        // A run just ended -- don't leave its plan curve on screen under the
        // idle dots. Fall back to previewing whatever's currently picked (or
        // nothing, if the list hasn't loaded / nothing's selected yet).
        var sel = document.getElementById('profileSelect');
        setActivePlanFor(sel ? sel.value : undefined);
      } else {
        setActivePlanFor(planId);
      }
    }
    updateChartMode(st);
  }).catch(function () {});
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(function (data) {
    // 2026-08-21: keeps app.js's kcUnit cache current from the same response
    // this page already fetches for its own rendering -- no second request
    // just to learn the device's unit preference (see app.js's own
    // one-time-fetch fallback for pages that never poll /api/status at all).
    window.kcUnit.updateFromStatus(data);
    // watchdog_cfg.h: cached here (not re-fetched on Start click) so the
    // extra firing confirmation below reads the same live snapshot every
    // other status-derived control on this page already uses.
    lastWatchdogPanicDisabled = !!data.watchdog_panic_disabled;
    renderChannels(data);
    renderBootButtonBypass(data);
    renderSafetyTrip(data);
    // Idle dots are a LIVE temperature display (same data as the channel
    // cards above), so they refresh on this 2s status poll, not history.csv's
    // slower 15s one -- a firing that's still idle should show the dots
    // tracking the kiln cooling/heating ambient in real time, not appear
    // frozen between 15s history polls that (while idle) fetch nothing new
    // anyway (history.csv only starts moving once a profile is running).
    if (wasIdle) { drawIdleDots(data); }
  }).catch(function () {});
  pollExec();
  setTimeout(poll, 2000);
}

// Idle-preview: previewing the plan for whatever's picked (but not started)
// is a natural fit here since the picker sits right below the chart -- but
// it must never look like a run in progress. drawIdleDots() below labels it
// explicitly ("previewing plan — not started") and it only ever draws while
// wasIdle is true; the moment a run actually starts, pollExec's own
// lastExecPlanId switch takes over and the preview label goes away with it.
document.getElementById('profileSelect').addEventListener('change', function (e) {
  if (wasIdle) setActivePlanFor(e.target.value);
});

loadZones().then(function () {
  loadProfileList().then(function () {
    var sel = document.getElementById('profileSelect');
    if (wasIdle && sel) setActivePlanFor(sel.value);
  });
  loadKilnConfigs();
  poll();
});
setInterval(pollHistory, 15000); // history only gains a new sample every 30s -- no need to poll faster
window.addEventListener('resize', function () { if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); } });

// UI_PLAN.md item 7: re-render immediately on a °C/°F toggle instead of
// waiting out poll()'s own 2s interval -- re-uses the last payload each
// render function already cached rather than re-fetching from the board.
window.addEventListener('kcunitchange', function () {
  if (lastChannelsData) renderChannels(lastChannelsData);
  if (lastExecStData) { renderExec(lastExecStData); renderLastRun(lastExecStData); }
  pollHistory();
});

(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = isDark(t) ? '☀' : '🌙';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
