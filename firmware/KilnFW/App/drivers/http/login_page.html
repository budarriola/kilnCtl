<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln Login</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  form { display: flex; flex-direction: column; gap: 0.75rem; width: 18rem; padding: 1.5rem; }
  label { font-size: 0.9rem; }
  input { padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.6rem; font-size: 1rem; cursor: pointer; }
  #error { color: #c0392b; min-height: 1.2rem; font-size: 0.9rem; }
</style>
</head>
<body>
<!-- Not hidden in the markup: the ordinary login form is the fail-closed
     default, so a session check that never resolves (a board that accepts the
     connection and then stalls -- neither .then nor .catch ever runs) still
     leaves a usable login form on screen rather than a blank page. The
     load-time fetch below sets BOTH forms explicitly once it has an answer. -->
<form id="login-form" autocomplete="on">
  <h2>Kiln Login</h2>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div id="error"></div>
  <button type="submit">Log in</button>
</form>
<form id="bootstrap-form" autocomplete="off" hidden>
  <h2>Set Administrator Password</h2>
  <p style="font-size:0.85rem;max-width:18rem;">No administrator credential is configured yet. Choose one now
  to finish setup or to regain access after a lockout.</p>
  <label for="bootstrap-username">Username</label>
  <input id="bootstrap-username" name="username" type="text" autocomplete="username" required>
  <label for="bootstrap-password">New password</label>
  <input id="bootstrap-password" name="password" type="password" autocomplete="new-password" required>
  <label for="bootstrap-password-confirm">Confirm password</label>
  <input id="bootstrap-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required>
  <div id="bootstrap-error"></div>
  <button type="submit">Set password</button>
</form>
<script>
// Where to send the operator after a successful login. http_auth_http.c's
// page-route redirect (owner report, 2026-09-21: "just show a login page
// no matter where they come from") lands here with ?return=<the page they
// asked for>, e.g. /login?return=/settings -- read it back so login sends
// them on to where they actually wanted to go instead of always landing on
// the Dashboard. Only a same-page-relative path ("/..." with no scheme or
// "//" host part, which browsers would otherwise treat as protocol-
// relative to an ATTACKER'S host) is honoured -- anything else, or a
// missing/empty param, falls back to "/". This is an open-redirect guard:
// the query string is attacker-controllable (anyone can hand a person a
// crafted /login?return=... link) even though today's only producer
// (http_auth_http.c) always writes one of its own known route strings.
function loginReturnPath() {
  var params = new URLSearchParams(window.location.search);
  var ret = params.get('return');
  // Review fix, 2026-09-21: the second character must be neither "/" NOR a
  // BACKSLASH. Browsers normalise "\" to "/" in a URL path (WHATWG URL), so
  // "/\evil.example" parses as "//evil.example" -- protocol-relative to an
  // attacker's host -- and slipped past a "//"-only guard. URLSearchParams has
  // already percent-decoded `ret` here, so "%2F%5Cevil.example" is checked in
  // its decoded form, not its literal one.
  if (ret && ret.charAt(0) === '/' && ret.charAt(1) !== '/' && ret.charAt(1) !== '\\') {
    return ret;
  }
  return '/';
}

function submitLogin(evt) {
  evt.preventDefault();
  var errorEl = document.getElementById('error');
  errorEl.textContent = '';
  var body = 'username=' + encodeURIComponent(document.getElementById('username').value) +
             '&password=' + encodeURIComponent(document.getElementById('password').value);
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }).then(function (resp) {
    if (resp.ok) {
      window.location.href = loginReturnPath();
      return;
    }
    if (resp.status === 429) {
      // Login lockout ladder (owner decision 2026-09-21): never auto-retry,
      // just surface the server's own Retry-After seconds so the operator
      // knows when trying again is worth it.
      var retryAfter = resp.headers.get('Retry-After');
      errorEl.textContent = retryAfter ?
        ('Too many attempts -- try again in ' + retryAfter + 's.') :
        'Too many attempts -- try again later.';
      return;
    }
    return resp.text().then(function (text) {
      errorEl.textContent = text || 'Login failed.';
    });
  }).catch(function () {
    errorEl.textContent = 'Network error.';
  });
}

function submitBootstrap(evt) {
  evt.preventDefault();
  var errorEl = document.getElementById('bootstrap-error');
  errorEl.textContent = '';
  var pw = document.getElementById('bootstrap-password').value;
  var confirm = document.getElementById('bootstrap-password-confirm').value;
  if (pw !== confirm) {
    errorEl.textContent = 'Passwords do not match.';
    return;
  }
  var body = 'username=' + encodeURIComponent(document.getElementById('bootstrap-username').value) +
             '&password=' + encodeURIComponent(pw);
  fetch('/api/auth/bootstrap_password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body
  }).then(function (resp) {
    if (resp.ok) {
      // Keep this page's own query string (?return=<gated page>, from
      // app.js's kcRedirectToBootstrap()) so the login that follows still
      // lands back on that page. Not validated here: the reloaded page's
      // loginReturnPath() is the one open-redirect guard and reads this same
      // string back before anything navigates on it.
      window.location.href = '/login' + (window.location.search || '');
      return;
    }
    return resp.text().then(function (text) {
      if (resp.status === 409) {
        // Administrator credential got configured elsewhere (another tab, a
        // race) between page load and submit -- reload to fall back to the
        // ordinary login form rather than showing a stale bootstrap form.
        window.location.reload();
        return;
      }
      errorEl.textContent = text || 'Could not set password.';
    });
  }).catch(function () {
    errorEl.textContent = 'Network error.';
  });
}

document.getElementById('login-form').addEventListener('submit', submitLogin);
document.getElementById('bootstrap-form').addEventListener('submit', submitBootstrap);

// GET /api/auth/session is ROUTE_TIER_OPEN and reports bootstrap_needed --
// the same predicate POST /api/auth/bootstrap_password's own handler and
// route-tier enforcement gate on (web_auth_admin_bootstrap_needed(),
// net/web_auth_session.h): true only when web auth is enabled AND no
// administrator credential is configured yet (first run, or every admin
// credential cleared). This page never decides that gate itself -- it only
// asks the board and shows the matching form; the firmware refuses the
// POST outright once a credential exists, regardless of what this page
// renders.
fetch('/api/auth/session').then(function (resp) {
  return resp.ok ? resp.json() : { bootstrap_needed: false };
}).catch(function () {
  return { bootstrap_needed: false };
}).then(function (status) {
  var showBootstrap = !!status.bootstrap_needed;
  document.getElementById('bootstrap-form').hidden = !showBootstrap;
  document.getElementById('login-form').hidden = showBootstrap;
});
</script>
</body>
</html>
