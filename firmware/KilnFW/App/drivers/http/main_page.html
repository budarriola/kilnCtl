// The axis-note text is the "be honest about the span" requirement: it is
// built entirely from values the caller is actually about to plot (or, for
// the idle no-plan case, an explicit statement that nothing here is a time
// series at all), never a guess at wall-clock time this board doesn't have
// (see renderLastRun's own comment on why -- no RTC, no guaranteed SNTP).
function renderChartMeta(mode, opts) {
  opts = opts || {};
  var note = '';
  var items = [];
  if (mode === 'running') {
    // 2026-09-01 follow-up (owner: "i am still only seeing one zone on the
    // web graph... during a live three-zone firing"): one legend row per
    // zone actually plotted (opts.zoneItems, built by drawHistoryChart the
    // same way drawAutotuneChart's zoneItems already are -- chColor(zone),
    // the same mapping the channel list/idle dots use), not a single fixed
    // "actual" row. duty/planned/guard are all NON-zone series and now come
    // from SERIES_COLORS exclusively -- see that constant's own doc comment
    // for why they must never take a zone's colour.
    (opts.zoneItems || []).forEach(function (it) { items.push(chartLegendItem(it.color, it.label)); });
    // 2026-08-29: ONE target series, not two. What used to be a separate
    // grey "desired" row (the recorded commanded setpoint, trailing) and a
    // purple "planned" row (the forward preview) are now the same line --
    // solid over elapsed time, dashed ahead of now. Only one legend row, and
    // its label says which half is which when there is a future half.
    items.push(chartLegendItem(SERIES_COLORS.plan, opts.planShown ? 'planned (dashed ahead of now)' : 'planned'));
    items.push(chartLegendItem(SERIES_COLORS.duty, opts.dutyLabel || 'duty'));
    if (opts.guardShown) items.push(chartLegendItem(SERIES_COLORS.guard, 'guard trip'));
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
    // tMin/actualMaxT are exactly the domain x() maps rows over below --
    // never the plan's own (possibly longer) horizon, so this can't overstate
    // how much real history is on screen.
    note = 'Showing ' + fmtTick(opts.tMin) + '–' + fmtTick(opts.actualMaxT) + ' elapsed';
    if (opts.totalPlannedS !== null && opts.totalPlannedS !== undefined) {
      note += ' of ' + fmtTick(opts.totalPlannedS) + ' planned';
    }
    // Same reload-mid-run honesty as the autotune view (see that branch's
    // own comment below for the full reasoning) -- the non-representative
    // zones' temperature traces AND the representative zone's own per-zone
    // duty line are all client-collected, so a page (re)loaded after a
    // firing was already underway has no history for them before the
    // moment it opened.
    if (opts.partialZoneSeries) {
      note += " (coupling zones' traces and per-zone duty only cover time since this page was opened)";
    }
  } else if (mode === 'autotune') {
    // PID_EXPANSION_PLAN.md Phase 7b: the phase label is REQUIRED here, not
    // decoration -- a flat settling segment and a stalled step look
    // identical on the trace line alone (this cost real debugging time
    // tonight). zone/elapsed/duty ride along in the same note so an
    // operator glancing at the chart doesn't have to also open zones_page.
    //
    // 2026-08-31 follow-up: one legend row per zone actually plotted
    // (opts.zoneItems, built by drawAutotuneChart from CH_COLORS/chColor --
    // the same per-channel colour every other view on this page uses, so a
    // zone reads as the same colour here as in the channel list/idle dots),
    // plus the commanded-duty series -- see that function's own comment for
    // why coupling between zones needs to be visible, not just the tested
    // zone's own trace.
    var st = opts.st;
    (opts.zoneItems || []).forEach(function (it) { items.push(chartLegendItem(it.color, it.label)); });
    items.push(chartLegendItem(SERIES_COLORS.duty, 'commanded duty (right axis, %, stepped)'));
    if (opts.planShown) items.push(chartLegendItem(SERIES_COLORS.plan, 'planned profile (preview)', true));
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
    var phase = (st.sub_phase && AUTOTUNE_SUB_PHASE_LABEL[st.sub_phase]) ||
      AUTOTUNE_PHASE_LABEL[st.state] || st.state;
    note = 'Autotune: ' + phase + ' — ' + zoneName(st.zone) +
      ' — elapsed ' + fmtTick(st.elapsed_s) + ' — duty ' + st.duty.toFixed(2);
    if (st.state === 'aborted' && st.abort_reason) {
      note += ' — ' + st.abort_reason;
    }
    // Reload-mid-run honesty (2026-08-31 follow-up): the OTHER zones' traces
    // are accumulated client-side (there is no server-side history for them
    // the way trace.csv is the tested zone's own authoritative record), so a
    // page opened after a run was already underway has NO history for those
    // zones before the moment it opened -- their lines start partway across
    // the plot rather than at t=0. Said explicitly here rather than left for
    // the reader to notice a line that "just starts partway through", which
    // could otherwise read as a sensor fault instead of what it actually is.
    if (opts.partialZoneSeries) {
      note += ' (some zones\' traces only cover time since this page was opened)';
    }
  } else {
    // Idle: the dots are this instant's live readings, not a time series --
    // see drawIdleDots's own header comment for why there is nothing to put a
    // real elapsed span on. Only the planned-curve preview (if any) has a
    // genuine time axis, so only it gets one, and it's labelled "preview,
    // not started" so it can never be mistaken for a run in progress.
    note = 'Live channel readings (not a time series)';
    if (opts.planShown) {
      items.push(chartLegendItem(SERIES_COLORS.plan, 'planned profile (preview)', true));
      note += ' — dashed line previews the selected profile, 0–' +
        fmtTick(opts.planMaxT) + ', not started';
    }
    if (opts.freezingShown) items.push(chartLegendItem(opts.faultColor || '#b00', 'freezing (0°C)', true));
  }
  document.getElementById('chartAxisNote').textContent = note;
  document.getElementById('chartLegend').innerHTML = items.join('');
}

// Draws the x-axis tick row (evenly spaced fmtTick() labels across [tMin,
// tMax], mapped through the caller's own x() so ticks always land exactly
// where the data they label actually is) plus, when the axis had to stretch
// below freezing to fit a genuine sub-zero reading, a dashed reference line
// at 0degC so that region reads as "below the normal range", not as an
// ordinary continuation of the plot. g/x/yTemp/minV/maxV are the same
// values the caller just used to draw its own series.
function drawChartAxis(g, x, yTemp, tMin, tMax) {
  var ctx = g.ctx;
  var tickCount = 3;
  ctx.font = '9px sans-serif';
  for (var ti = 0; ti <= tickCount; ti++) {
    var tt = tMin + (tMax - tMin) * ti / tickCount;
    var tx = x(tt);
    ctx.strokeStyle = g.border;
    ctx.beginPath(); ctx.moveTo(tx, g.padT + g.plotH); ctx.lineTo(tx, g.padT + g.plotH + 3); ctx.stroke();
    var label = fmtTick(tt);
    var tw = ctx.measureText(label).width;
    var lx = Math.max(0, Math.min(g.cssW - tw, tx - tw / 2));
    ctx.fillStyle = g.muted;
    ctx.fillText(label, lx, g.cssH - 4);
  }
}

// Owner request: the y-axis (temp) should always carry 10 markings, not
// just a top/bottom label. Evenly spaced across [minV, maxV] regardless of
// how that range was derived (live-reading pad, history pad, or the
// freezing-floor clamp) -- shared by drawIdleDots and drawHistoryChart so
// both charts read the same way.
function drawYAxis(g, yTemp, minV, maxV) {
  var ctx = g.ctx, tickCount = 10;
  ctx.font = '10px sans-serif';
  for (var vi = 0; vi <= tickCount; vi++) {
    var vv = minV + (maxV - minV) * vi / tickCount;
    var vy = yTemp(vv);
    ctx.strokeStyle = g.border;
    ctx.beginPath(); ctx.moveTo(g.padL - 3, vy); ctx.lineTo(g.padL, vy); ctx.stroke();
    ctx.fillStyle = g.muted;
    ctx.fillText(window.kcUnit.toDisplay(vv).toFixed(0) + window.kcUnit.label(), 2, vy + 3);
  }
}

// Duty (right-hand secondary axis) tick-label formatter -- the plotted duty
// values themselves stay 0.0-1.0 floats (yDuty()/the trace math never
// change), this only formats what a tick VALUE renders as. Math.round (not
// toFixed) so an intermediate tick born from floating-point division (e.g.
// 1/3) can never emit something like "33.33333333333333%" -- every label is
// a clean integer percent.
function fmtDutyPct(d) { return Math.round(d * 100) + '%'; }

// Sideways "Duty cycle" label for the right-hand secondary axis, conventional
// orientation for a Y-axis title (reads bottom-to-top). Shared by
// drawHistoryChart and drawAutotuneChart, both of which plot commanded duty
// on that axis. save()/rotate()/restore() is paired tightly around just this
// text draw so no other draw call on this canvas -- before or after -- ever
// sees a rotated context.
function drawDutyAxisLabel(g) {
  var ctx = g.ctx;
  ctx.save();
  ctx.fillStyle = g.muted;
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.translate(g.cssW - 8, g.padT + g.plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Duty cycle', 0, 0);
  ctx.restore();
}

// The freezing-clamp's visible "this is out of range" marker -- drawn
// whenever the axis had to stretch below CHART_FREEZING_C to fit a genuine
// sub-zero reading (see drawIdleDots/drawHistoryChart's own comments on that
// clamp). Separate from drawChartAxis (time ticks) because it fires
// independently of whether there's any time axis to draw at all -- the idle
// dots have no time series but can still need this line.
function drawFreezingRef(g, yTemp, minV, maxV) {
  if (!(CHART_FREEZING_C > minV && CHART_FREEZING_C < maxV)) return;
  var ctx = g.ctx, fy = yTemp(CHART_FREEZING_C);
  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = g.fault; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(g.padL, fy); ctx.lineTo(g.padL + g.plotW, fy); ctx.stroke();
  ctx.restore();
}

// Shared by the exec card and the previous-run banner (both name zones by
// bit position, zones.relay_mask-style, per zones_http.h).
function zoneName(zi) {
  var raw = (zonesCache.zones[zi] && zonesCache.zones[zi].name) || ('Zone ' + zi);
  return window.kcEscapeHtml(raw);
}

// -- Planned-profile curve (the chart's single target series) ------------
//
// /api/profile_plan?id=N returns the profile's STRAIGHT-LINE plan
// (total_planned_s + points[{t,c}], celsius, t = seconds from a
// hypothetical run start at 0).
//
// SUPERSEDED 2026-08-29 (owner: "drop desired and modify planned; planned
// should be the displayed target for that time"). This used to be the third
// chart series, drawn alongside a separate grey "desired" line taken from
// history.csv's recorded setpoint column. The two were conceptually
// distinct -- recorded-commanded vs idealised-plan -- but reading them side
// by side was just redundant. They are now ONE series labelled "planned":
// over time already elapsed it plots the RECORDED commanded setpoint (what
// "desired" used to show, which is the real target at that moment and can
// legitimately sit behind the idealised plan when ramp-lock holds
// s_exec.target_c back -- see profile_executor.c's ramp-lock branch), and
// beyond the last recorded sample it continues with this plan's own points
// as the preview. Only the future half of the line is dashed, so "recorded"
// and "projected" stay distinguishable without a second legend row.
//
// Cached per profile id (a profile's plan does not change while the page is
// open -- editing one happens on /profiles, a full page navigation away)
// so switching the picker back and forth, or a running/paused state's
// repeated pollExec ticks, don't re-fetch every 2s. A 404 (route not wired
// yet -- the backend for this is landing concurrently with this change) or
// any fetch failure caches `null`, same "degrade like older firmware"
// treatment as every other optional endpoint on this page.
var planCache = {};
function fetchPlan(id) {
  if (id === undefined || id === null || id === '') return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(planCache, id)) return Promise.resolve(planCache[id]);
  return fetch('/api/profile_plan?id=' + id).then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (data) {
    planCache[id] = data;
    return data;
  }).catch(function () {
    planCache[id] = null;
    return null;
  });
}

// The plan currently drawn on the chart, if any -- set by pollExec (running/
// paused/faulted/done, keyed off st.profile_id) or by the profile <select>'s
// change handler (idle preview of whatever's picked but not yet started).
// null means "nothing to draw", either because no id is selected/running or
// because the plan fetch failed/404'd (old firmware, or id not found).
var activePlan = null;
// Latest id asked for: two overlapping requests (e.g. the page-load preview
// and poll()'s first "a run is live" tick) must not let the SLOWER plan
// fetch win -- only the most recent request may set activePlan.
var activePlanRequestSeq = 0;
function setActivePlanFor(id) {
  var seq = ++activePlanRequestSeq;
  if (id === undefined || id === null || id === '') { activePlan = null; return; }
  fetchPlan(id).then(function (data) {
    if (seq !== activePlanRequestSeq) return;
    activePlan = data;
    // Redraw whichever chart mode is current so a plan that arrives after
    // the frame was already drawn (fetch is async) doesn't sit un-rendered
    // until the next poll tick.
    if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); }
  });
}

// -- Progress bar (under the chart) ---------------------------------------
//
// Reads /api/profile_exec's total_planned_s/elapsed_s/remaining_s/
// remaining_is_estimate. All four are treated as a group: if the response
// doesn't carry them at all (older firmware -- this is a brand-new API
// surface landing alongside this change) the whole bar hides, same
// degrade-gracefully rule as the rest of this page's optional fields. Once
// the fields ARE present:
//   - state idle: hidden (nothing running, elapsed_s is meaningless before
//     a run exists).
//   - total_planned_s null: no denominator to show a fraction of, so no
//     track/fill at all -- elapsed time only, as text.
//   - total_planned_s known, remaining_s null: a ramp_c_per_hr==0 segment
//     has no predictable duration -- rendered as an animated indeterminate
//     stripe (full-width, moving), never 0% or 100%, and the remaining-time
//     text says "unknown" rather than "0:00".
//   - remaining_is_estimate true: the run has overrun (or could overrun)
//     its plan -- the label says "estimate" explicitly rather than
//     presenting a countdown the operator could mistake for exact.
function renderProgress(st) {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const elapsedEl = document.getElementById('progressElapsed');
  const remainingEl = document.getElementById('progressRemaining');

  var have = st && typeof st.elapsed_s === 'number' &&
             st.hasOwnProperty('total_planned_s') && st.hasOwnProperty('remaining_s') &&
             st.hasOwnProperty('remaining_is_estimate');
  var running = st && (st.state === 'running' || st.state === 'paused' ||
                        st.state === 'faulted' || st.state === 'done');
  if (!have || !running) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';

  elapsedEl.textContent = 'Elapsed ' + fmtDuration(st.elapsed_s);

  if (st.total_planned_s === null || st.total_planned_s === undefined) {
    // No meaningful denominator -- elapsed only, no bar fraction at all.
    fill.classList.remove('indeterminate');
    fill.style.width = '0%';
    remainingEl.textContent = '';
    return;
  }

  if (st.remaining_s === null || st.remaining_s === undefined) {
    fill.classList.add('indeterminate');
    remainingEl.innerHTML = '<span class="estimate-tag">time remaining unknown</span>';
    return;
  }

  fill.classList.remove('indeterminate');
  var pct = st.total_planned_s > 0 ? Math.max(0, Math.min(100, 100 * st.elapsed_s / st.total_planned_s)) : 100;
  fill.style.width = pct.toFixed(1) + '%';
  var remText = fmtDuration(st.remaining_s) + ' left';
  remainingEl.innerHTML = st.remaining_is_estimate
    ? remText + ' <span class="estimate-tag">(estimate)</span>'
    : remText;
}

// -- Previous-run breadcrumb (TODO.md 6A.3, "No auto-resume across reboot") --
//
// This is a report on a firing that is already over, NOT a live status and
// NOT an offer to resume one. The firmware never restarts a firing by
// itself; starting one is always the operator's explicit action through the
// picker below. The banner exists to answer the question a brownout leaves
// behind -- "did it stop because I stopped it, or because the power went
// out" -- and then get out of the way once acknowledged.
// Deliberately NO kc-live-value anywhere in this banner: TODO.md 6A.3 /
// this function's own header comment already establish that this is a
// report on a firing that is ALREADY OVER, not live status -- the numbers
// here (target_c, segment progress) describe a past moment, frozen at
// write time, and don't change or go stale when the current connection
// drops. Dimming them on disconnect would falsely imply they're a live
// reading whose truth depends on the device answering right now; they
// aren't. The °C figure below still runs through kcUnit.fmt() for unit
// parity, just without the live-value class.
// Mirrors SaftyFW's safety_guards.h SAFETY_TRIP_* enum, in words -- same
// mirrored-not-shared reasoning as profile_executor.c's
// safety_trip_reason_words() (KilnFW/SaftyFW are separate build targets;
// this firmware genuinely has no header to #include here). Keep in sync
// with that C table and with safety_guards.h's own enum if it changes.
var SAFETY_TRIP_WORDS = {
  0: 'none', 1: 'chamber over absolute temperature limit (S1)',
  2: 'chamber over setpoint for too long (S2)', 3: 'relay/contactor stuck on, no heat commanded (S3)',
  5: 'safety thermocouple reading invalid or missing (S5)', 6: 'main controller (ESP) reported a fault (S6a)',
  7: 'safety link to main controller went silent (S6b)', 8: 'E-stop pressed (S7)',
  9: 'rising faster than physically possible (S8)', 10: 'contactor welded on, trip did NOT cut power (S9)',
  12: 'safety sensor reading frozen, not updating (S11)', 13: 'enclosure/cold-junction over-temperature (S12)',
  14: "borrowed zone's TC stopped updating (S13)",
  15: 'safety config corrupt', 16: 'safety self-test failed'
};
function safetyTripWords(reason) { return SAFETY_TRIP_WORDS[reason] || 'unknown guard'; }

// thermal_guard_trip_t decode now lives once, in app.js's
// window.thermalGuardWords -- both this page and diagnostics_page.html call
// that shared copy instead of keeping their own table, so the two pages
// cannot drift apart the way SAFETY_TRIP_WORDS above still can (that one
// mirrors a C header; this one only ever mirrored itself across two JS
// files, so centralizing it removed the duplication instead of documenting
// it). 2026-08-28: the last-run banner below used to print lr.fault_guard as
// a bare number next to the word "Fault" -- an undecoded enum, exactly the
// offender ROADMAP.md M13 calls out.

// The gap this closes: relay_authority already blocks new relay-on while the
// safety processor reports a trip, but until this pass nothing on this page
// ever looked at diag_state, so a live trip looked exactly like an ordinary
// firing in progress while the kiln quietly cooled. SAFETY_LINK_STALE_MS
// (1500, safety_link.h) gates this the same way profile_executor.c's
// watchdog gates its own FAULTED transition: a diag_state == TRIPPED read off
// a frame that old is the "link went silent" case, not a live trip, and
// showing it here as a fresh trip would blur exactly the distinction the
// task calls out (guard firing vs. dead peer). Absent/stale diag data never
// renders as safe -- it renders as nothing (banner hidden), never a green
// "all clear," matching the rest of this page's stale-data convention.
var SAFETY_LINK_DIAG_STATE_TRIPPED = 4;
var SAFETY_LINK_STALE_MS = 1500;
// 2026-08-27 (owner scope change: "all faults... come with instructions on
// how to fix them... what was detected wrong"). The ESP now decodes cause/
// remedy/fault-source text itself, off safety_trip_words.h's ONE shared
// table (dashboard_http.c's GET /api/status handler) -- this banner reads
// those fields (diag_trip_reason_cause/_remedy, heat_block_sources_words)
// straight off the JSON rather than keeping a second copy of that logic
// here, so cause/remedy text cannot drift from the LCD's. safetyTripWords()/
// SAFETY_TRIP_WORDS above are kept only as an old-firmware fallback for a
// board that hasn't picked up the new fields yet.
function renderSafetyTrip(data) {
  var el = document.getElementById('safetyTripBanner');
  var tripped = data.diag_ever_received && data.diag_state === SAFETY_LINK_DIAG_STATE_TRIPPED &&
                typeof data.diag_age_ms === 'number' && data.diag_age_ms < SAFETY_LINK_STALE_MS;
  if (!tripped) { el.innerHTML = ''; return; }
  var reason = data.diag_trip_reason;
  var ineffective = reason === 10;
  var isMainFault = reason === 6; // S6a -- the safety processor sees one bit, ESP knows the source
  var words = data.diag_trip_reason_words || safetyTripWords(reason);
  // 2026-08-28: diag_trip_reason_cause (Frame B, the LIVE trip state) never
  // carries numbers -- Frame B has no room for the trip snapshot fields, so
  // dashboard_http.c can only decode it generically. trip_reason_cause
  // (Frame D, TRIP_EVENT) DOES carry them (safety_trip_words_cause_numbered()
  // on the ESP side) whenever the latched trip is this same trip -- which it
  // is, for as long as this banner is showing a live TRIPPED state, since
  // nothing else can produce a fresh TRIP_EVENT in between. Prefer it when
  // the reasons agree; fall back to the generic live text otherwise (a
  // stale/absent TRIP_EVENT, or the rare disagreement window right at a
  // fresh trip before Frame D has arrived).
  var cause = (data.trip_event_ever_received && data.trip_reason === reason && data.trip_reason_cause)
    ? data.trip_reason_cause
    : (data.diag_trip_reason_cause || 'Detail not available on this firmware build.');
  var remedy = data.diag_trip_reason_remedy || 'Check the safety processor documentation for this trip reason.';
  var html = '<div class="banner safety-trip">' +
    '<h3>' + (ineffective ? '!! SAFETY TRIP -- TRIP_INEFFECTIVE !!' : 'SAFETY PROCESSOR TRIPPED') + '</h3>' +
    '<div class="row"><span>Reason</span><span>' + window.kcEscapeHtml(words) + '</span></div>' +
    '<div class="row"><span>Detected</span><span>' + window.kcEscapeHtml(cause) + '</span></div>';
  if (isMainFault) {
    // S6a: the "detected" line above is deliberately generic (the safety
    // processor only sees the resulting bit) -- THIS is the actual reason,
    // decoded from the ESP's own fault_sources bitmask AT THE MOMENT this
    // trip latched (trip_fault_sources), not the live heat_block_sources
    // (which may since have released -- see safety_link.h's field comment
    // for why the two can legitimately disagree and must stay labeled
    // separately).
    // 2026-08-28 audit fix (N3/N4): the backend (dashboard_http.c) now
    // decides "not captured" for BOTH cases -- an unwitnessed reboot resend
    // (trip_fault_sources_valid false) and a genuinely-live event whose
    // source released before the frame arrived (mask == 0) -- so this page
    // just renders whatever it says rather than re-deciding with its own
    // (older, narrower) mask check.
    var srcWords = data.trip_fault_sources_words ||
      'not captured (older firmware, or the source released before this page loaded)';
    html += '<div class="row"><span>Fault source (at trip)</span><span>' + window.kcEscapeHtml(srcWords) + '</span></div>';
    var liveWords = data.heat_block_sources_words;
    var liveMask = data.heat_block_sources || 0;
    if (liveMask !== 0 && liveWords !== srcWords) {
      html += '<div class="row"><span>Still asserted right now</span><span>' + window.kcEscapeHtml(liveWords) + '</span></div>';
    }
  }
  html += '<div class="row"><span>Heat</span><span>relays blocked off by the safety processor</span></div>' +
    '<div class="row"><span>To clear</span><span>' + window.kcEscapeHtml(remedy) + '</span></div>' +
    (ineffective ? '<p class="note">Power may still be flowing to the load. Go to the breaker, not the kiln.</p>' : '') +
    '<p class="note">Any firing in progress has been aborted and will not resume. This trip is LATCHED -- ' +
    'it does not clear on its own, and starting a new firing will NOT clear it. Only an explicit Clear Trip does, ' +
    'and it is refused for as long as the cause above is still present.</p>' +
    (reason !== 10
      ? '<button class="run-btn" id="clearTripBtn">Clear Trip</button>'
      : '') +
    '</div>';
  el.innerHTML = html;
  var btn = document.getElementById('clearTripBtn');
  if (btn) {
    btn.addEventListener('click', function () {
      fetch('/api/safety/clear_trip', { method: 'POST' })
        .then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (j) {
          if (j && j.ok === false && j.error) {
            btn.insertAdjacentHTML('afterend', '<div class="row fault">' + window.kcEscapeHtml(j.error) + '</div>');
          }
        })
        .catch(function () {});
    });
  }
}

// boot_button.h -- same solid-fill "safety-trip" visual treatment as
// renderSafetyTrip() below (border-only "banner" is what this page reserves
// for merely informational strips like lastRunBanner; a window that lets
// ANYONE on the network flash firmware with no password gets the same
// impossible-to-miss styling as a live safety trip, not a quieter one).
function renderBootButtonBypass(data) {
  var el = document.getElementById('bootButtonBypassBanner');
  if (!data.boot_button_bypass_active) { el.innerHTML = ''; return; }
  var remS = data.boot_button_bypass_remaining_s || 0;
  var mm = Math.floor(remS / 60), ss = remS % 60;
  el.innerHTML = '<div class="banner safety-trip">' +
    '<h3>BOOT-BUTTON RECOVERY: OTA PASSWORD CHECK BYPASSED</h3>' +
    '<div class="row"><span>Any device on this network can flash firmware right now, no password.</span></div>' +
    '<div class="row"><span>Closes automatically in</span><span class="kc-live-value">' +
      mm + ':' + (ss < 10 ? '0' : '') + ss + '</span></div>' +
    '</div>';
}

// CLAUDE.md's ota_rollback_esp() hazard, closed 2026-09-16: firing is refused
// (profile_executor_run.c) while a real, previously-tuned zones config
// exists on flash but this firmware could not decode it -- either an OTA
// rollback past a schema bump (on-disk version NEWER than this firmware
// knows) or a blob older than this firmware's migration chain can bring
// forward. zones_config_load_fault is only ever true in that specific case,
// never for the unrelated "board has simply never been configured" state
// (which also reads zones_config_valid==false but leaves this flag false and
// gets the ordinary "/settings/zones" message the Start button already
// shows). Same solid "safety-trip" banner styling as renderSpiWedged() above
// it -- this blocks firing exactly like a live trip does, so it earns the
// same visual weight, not a quieter informational one. No "fire anyway"
// button: this state means the board does not trust its own tuning data
// (PID gains, guard bands, thermocouple mapping), and offering a bypass here
// would recreate the exact silent-defaults hazard this banner exists to
// close -- see profile_executor_run.c's identical no-override reasoning.
function renderZonesConfigLoadFault(data) {
  var el = document.getElementById('zonesConfigLoadFaultBanner');
  if (!el) return;
  if (!data.zones_config_load_fault) { el.innerHTML = ''; return; }
  var onDisk = data.zones_config_load_fault_on_disk_version;
  var fwVer = data.zones_config_load_fault_fw_version;
  var reason = data.zones_config_load_fault_reason || '';
  var detail, remedy;
  if (data.zones_config_load_fault_newer) {
    detail = 'Stored zone config is version ' + onDisk + '; this firmware only understands up to version ' +
      fwVer + ' -- likely an OTA rollback past a config schema bump.';
    remedy = 'Reflash the matching (or newer) firmware to restore the tuned config.';
  } else {
    detail = 'Stored zone config is version ' + onDisk + ' and this firmware (version ' + fwVer +
      ') cannot migrate it forward: ' + window.kcEscapeHtml(reason) + '.';
    remedy = 'Reflash the firmware version that saved this config, or reconfigure zones from scratch.';
  }
  el.innerHTML = '<div class="banner safety-trip">' +
    '<h3>ZONE CONFIG NOT UNDERSTOOD -- FIRING REFUSED</h3>' +
    '<div class="row"><span>' + window.kcEscapeHtml(detail) + '</span></div>' +
    '<div class="row"><span>The board is running on blank/default settings this boot, not your tuned ' +
    'configuration, and will not start a firing until this is resolved.</span></div>' +
    '<div class="row"><span>To clear</span><span>' + window.kcEscapeHtml(remedy) + '</span></div>' +
    '</div>';
}

// M13 fix (2026-09-16): the single-migration-step write-back
// (zones_config_persist_migrated_blob_verified(), zones_config_store.c)
// could not confirm a just-migrated zones config was actually written back
// to flash. Distinct from renderZonesConfigLoadFault() above -- THIS boot's
// config is valid and running fine right now; the risk is only that the
// NEXT firmware install (one step further, per the one-step migration
// policy) will find flash still holding the older, pre-migration bytes and
// refuse them the same way renderZonesConfigLoadFault() describes. Not a
// firing-blocking condition, so it gets the quieter "interrupted" (red
// left-border) treatment rather than the solid safety-trip fill.
function renderZonesConfigMigrationPersistFault(data) {
  var el = document.getElementById('zonesConfigMigrationPersistFaultBanner');
  if (!el) return;
  if (!data.zones_config_migration_persist_fault) { el.innerHTML = ''; return; }
  var onDisk = data.zones_config_migration_persist_fault_on_disk_version;
  var fwVer = data.zones_config_migration_persist_fault_fw_version;
  el.innerHTML = '<div class="banner interrupted">' +
    '<h3>ZONE CONFIG MIGRATION NOT CONFIRMED SAVED</h3>' +
    '<div class="row"><span>This boot migrated the stored zone config from version ' + onDisk +
    ' to version ' + fwVer + ' and is running on it now, but could not confirm the migrated copy was ' +
    'written back to flash.</span></div>' +
    '<div class="row"><span>Nothing is wrong right now, but the NEXT firmware update may not be able to ' +
    'read the config still on flash and could fall back to default gains with no separate ' +
    'warning.</span></div>' +
    '<div class="row"><span>To clear</span><span>Re-save the zones config from /settings/zones (or reboot ' +
    'this firmware once more) so the write-back is retried.</span></div>' +
    '</div>';
}

// M13 fix: kiln_cfg_swap_boot_recover() (kiln_cfg_swap.c) could not recover
// an interrupted two-processor kiln-config swap at boot. Heaters are
// alarmed/disabled the whole time this is true (the divergence/ceiling
// hooks this module reuses already gate them) -- this banner's only job is
// to say WHY and what to do, since previously that only reached an ESP_LOGE
// line. "interrupted" (red left-border) treatment, same as the migration
// banner above, not the solid safety-trip fill: this is a config-sync
// condition with a known remedy, not an active thermal trip.
function renderKilnCfgSwapBootFault(data) {
  var el = document.getElementById('kilnCfgSwapBootFaultBanner');
  if (!el) return;
  if (!data.kiln_cfg_swap_boot_fault) { el.innerHTML = ''; return; }
  var reason = data.kiln_cfg_swap_boot_fault_reason || '';
  el.innerHTML = '<div class="banner interrupted">' +
    '<h3>KILN CONFIG SWAP INTERRUPTED -- NOT RECOVERED</h3>' +
    '<div class="row"><span>' + window.kcEscapeHtml(reason) + '</span></div>' +
    '</div>';
}

// 2026-09-16: the safety processor's (SaftyFW) MAX31856 tc_type reconfigure
// retry (thermo_task.c) has exhausted its bound with the type still
// unverified. Before this bit reached the wire (SAFETY_LINK_DIAG_FLAG_TC_
// RECONFIG_GAVE_UP, safety_link.h), the only trace was thermo_task.c's own
// s_reconfig_gave_up (SWD-only) and a WARN log line that travels over the
// isolated Pico<->ESP link as an ordinary LOG-task frame nothing on this
// side decodes -- an operator watching only this page had no way to learn
// that the safety thermocouple's already-reported invalid reading (S5) will
// NOT self-heal without intervention. Deliberately does NOT say "bad
// reading" or "sensor fault" -- the underlying cause is a config/
// verification failure (CLAUDE.md's "safety TC invalid is one CR1 byte"
// note: often a single CR1 readback mismatch, not a real temperature
// problem). "interrupted" (red left-border) treatment, same as the two
// banners just above: a known, named condition with a remedy, not the
// solid safety-trip fill (S5 itself already gets that treatment via
// safetyTripBanner when it is the live trip cause).
function renderSafetyTcReconfigGaveUp(data) {
  var el = document.getElementById('safetyTcReconfigGaveUpBanner');
  if (!el) return;
  if (!data.safety_tc_reconfig_gave_up) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="banner interrupted">' +
    '<h3>SAFETY THERMOCOUPLE CONFIG NOT VERIFIED</h3>' +
    '<div class="row"><span>The safety processor could not confirm the safety thermocouple\'s ' +
    'configured type after repeated retries and has stopped retrying automatically. This is a ' +
    'configuration/verification failure, not necessarily a bad reading.</span></div>' +
    '<div class="row"><span>To clear</span><span>Power-cycle the safety processor, or check the ' +
    'safety thermocouple\'s wiring/connector, then confirm via the safety status panel that the ' +
    'reading is valid again.</span></div>' +
    '</div>';
}

// 2026-09-22: S1 (abs_max_temp_c) and S8 (max_rate_c_per_min) ship
// disabled-by-zero on the Pico by design (no defensible default until
// commissioned) -- SAFETY_MODEL.md's "guards with no defensible default
// ship disabled, and say so in telemetry" line. Before this pass neither
// bit had a distinct wire signal (only the bundled, less specific
// commissioning summary elsewhere on this page). Informational, not a
// fault -- "info" (not "interrupted"/red) treatment, since an
// uncommissioned board reporting these is expected, not a problem to fix
// urgently on its own. Reuses .banner.lag's --ok "working as designed"
// treatment (see that class's own comment above) rather than inventing a
// new "info" class.
function renderSafetyGuardDisabledByZero(data) {
  var el = document.getElementById('safetyGuardDisabledByZeroBanner');
  if (!el) return;
  var s1 = !!data.safety_s1_abs_max_disabled;
  var s8 = !!data.safety_s8_rate_guard_disabled;
  if (!s1 && !s8) { el.innerHTML = ''; return; }
  var names = [];
  if (s1) { names.push('S1 (absolute temperature ceiling)'); }
  if (s8) { names.push('S8 (implausible rate of rise)'); }
  el.innerHTML = '<div class="banner lag">' +
    '<h3>SAFETY GUARD(S) DISABLED -- NOT COMMISSIONED</h3>' +
    '<div class="row"><span>' + names.join(', ') + ' ' +
    (names.length > 1 ? 'are' : 'is') + ' shipped disabled because the required threshold has ' +
    'never been set to a nonzero value. Never trips while disabled.</span></div>' +
    '<div class="row"><span>To arm</span><span>Set the corresponding threshold (abs_max_temp_c ' +
    'for S1, max_rate_c_per_min for S8) via the safety config panel.</span></div>' +
    '</div>';
}

// opus review, commit 9fc55d9, M4: /api/status's thermo_spi_wedged straight
// through to a prominent, impossible-to-miss indicator -- see this banner's
// own <div> comment above for why it outranks even the safety-trip banner in
// reading order. Same hide-when-nothing-to-report pattern as
// renderSafetyTrip()/renderBootButtonBypass().
function renderSpiWedged(data) {
  var el = document.getElementById('spiWedgedBanner');
  if (!el) return;
  if (!data.thermo_spi_wedged) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="banner safety-trip">' +
    '<h3>SPI BUS WEDGED -- NO TEMPERATURE READINGS</h3>' +
    '<div class="row"><span>Every thermocouple channel and the on-board display share one SPI bus, ' +
    'and it has stopped responding. There are no live temperature readings from this board right now.</span></div>' +
    '<div class="row"><span>To clear</span><span>Reboot the board. There is no other recovery today.</span></div>' +
    '</div>';
}

function renderLastRun(st) {
  const el = document.getElementById('lastRunBanner');
  const lr = st.last_run;
  if (!lr || !lr.present) { el.innerHTML = ''; return; }

  var names = [];
  for (var b = 0; b < 8; b++) { if (lr.zone_mask & (1 << b)) names.push(zoneName(b)); }

  var html = '<div class="banner' + (lr.interrupted ? ' interrupted' : '') + '">' +
    '<h3>' + (lr.interrupted
      ? 'Previous firing was interrupted &mdash; it never ended cleanly'
      : 'Previous firing ended (' + lr.phase + ')') + '</h3>' +
    '<div class="row"><span>Profile</span><span>' +
      window.kcEscapeHtml(profileTitleById[lr.profile_id] || lr.profile_name || ('id ' + lr.profile_id)) +
      ' &mdash; ' + (names.join(', ') || 'no zones') + '</span></div>' +
    '<div class="row"><span>Segment</span><span>' + (lr.segment_index + 1) + ' / ' + lr.segment_count +
      ' (' + (lr.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Target at that point</span><span>' + window.kcUnit.fmt(lr.target_c) + '</span></div>' +
    '<div class="row"><span>Into the segment</span><span>' + fmtDuration(lr.segment_elapsed_s) + '</span></div>' +
    // Uptime, not a clock time: the board has no RTC and no guaranteed SNTP,
    // so an absolute timestamp here would be fabricated. See run_state.h.
    '<div class="row"><span>Recorded at</span><span>' + fmtDuration(lr.uptime_at_write_s) +
      ' into that boot</span></div>';
  if (lr.fault_reason) {
    html += '<div class="row fault"><span>Fault (' + window.kcEscapeHtml(window.thermalGuardWords(lr.fault_guard)) +
            ')</span><span>' + window.kcEscapeHtml(lr.fault_reason) + '</span></div>';
  }
  html += '<p class="note">' + (lr.interrupted
    ? 'Nothing was restarted. Relays came up off and stay off until you start a firing.'
    : 'Recorded by the controller, so this stop was deliberate.') + '</p>' +
    '<button class="run-btn" id="ackLastRunBtn">Dismiss</button></div>';

  el.innerHTML = html;
  document.getElementById('ackLastRunBtn').addEventListener('click', function () {
    fetch('/api/profile_exec/ack_last_run', { method: 'POST' }).then(pollExec).catch(pollExec);
  });
}

// This card is the live-status opposite of renderLastRun above: everything
// in it -- exec state, segment/dwell progress, target and per-zone actual
// temperatures, relay on/off -- describes what the board is doing RIGHT NOW
// and goes stale the instant the connection heartbeat (app.js) starts
// failing, so it all gets kc-live-value. Zone names and the profile title
// are config, not readings -- left unmarked.
var lastExecStData = null;
// 2026-09-01 follow-up (owner, on a screenshot of the per-zone block this
// used to render here: "this is far too messy, put this in the zones page
// and make it readable"). The full firing_stats table now lives on
// zones_page.html (per-zone detail belongs next to the PID parameters and
// the coupling matrix, not on the live "what is the kiln doing right now"
// dashboard) -- see that page's renderFiringStatsTable(). What's left here
// is ONE headline number, only for a run that has actually ended
// (done/faulted; a still-RUNNING run's stats are still accumulating and a
// "worst so far" figure would invite reading it as final): the worst
// (highest) zone's normalized IAE, a single dimensionless "how well did
// this firing track" figure, linking to the zones page for the rest.
// Excluded samples are still surfaced here, not just on the zones page --
// "a run with many dropped samples must read as untrustworthy" is exactly
// the kind of thing a one-line dashboard summary must not hide behind a
// click-through, so a non-zero total gets its own short warning inline.
function renderRunQualityHeadline(st) {
  if (st.state !== 'done' && st.state !== 'faulted') return '';
  var worst = null;
  var totalExcluded = 0, totalSamples = 0;
  (st.zones || []).forEach(function (z) {
    var fs = z.firing_stats;
    if (!fs || !fs.sample_count) return;
    totalExcluded += fs.excluded_sample_count || 0;
    totalSamples += fs.sample_count;
    if (!isNaN(fs.iae_normalized) && (!worst || fs.iae_normalized > worst.iae)) {
      worst = { zone: z.zone, iae: fs.iae_normalized };
    }
  });
  if (!worst) return '';
  var html = '<div class="row kc-live-value" style="font-size:0.85em;opacity:0.85">' +
    '<span>Run quality</span><span>worst zone ' + zoneName(worst.zone) + ': IAE(norm) ' +
    worst.iae.toFixed(3) + ' &mdash; <a href="/settings/zones">details</a></span></div>';
  if (totalExcluded > 0) {
    html += '<div class="row fault kc-live-value" style="font-size:0.85em">' +
      totalExcluded + ' of ' + (totalExcluded + totalSamples) +
      ' samples excluded across all zones (invalid readings) &mdash; these stats may not be trustworthy</div>';
  }
  return html;
}

function renderExec(st) {
  lastExecStData = st;
  const card = document.getElementById('execCard');
  const picker = document.getElementById('runPicker');
  // #kilnConfigIndicator is read-only (no action to invite refusal of, see
  // its own comment above the markup) and so is never hidden/shown based on
  // firing state, unlike the removed #kilnConfigPicker this used to ride
  // along with.
  if (st.state === 'idle') {
    card.innerHTML = '';
    picker.style.display = '';
    return;
  }
  picker.style.display = 'none';

  var zoneNames = [];
  for (var zb = 0; zb < 8; zb++) { if (st.zone_mask & (1 << zb)) zoneNames.push(zoneName(zb)); }

  let html = '<div class="exec-card">' +
    '<div class="row"><span>' + window.kcEscapeHtml(profileTitleById[st.profile_id] || st.profile_name) +
    ' &mdash; ' + zoneNames.join(', ') + '</span>' +
    '<span class="exec-state state-' + st.state + ' kc-live-value">' + st.state + '</span></div>' +
    '<div class="row"><span>Segment</span><span class="kc-live-value">' + (st.segment_index + 1) + ' / ' + st.segment_count +
    ' (' + (st.dwelling ? 'dwelling' : 'ramping') + ')</span></div>' +
    '<div class="row"><span>Shared target</span><span class="kc-live-value">' + window.kcUnit.fmt(st.target_c) + '</span></div>';
  if (st.ramp_lock_held) {
    var laggingNames = [];
    for (var lb = 0; lb < 8; lb++) { if (st.ramp_lock_lagging_mask & (1 << lb)) laggingNames.push(zoneName(lb)); }
    html += '<div class="row fault"><span>Ramp-lock held</span><span class="kc-live-value">waiting on ' +
            (laggingNames.join(', ') || 'a zone') + '</span></div>';
  }
  (st.zones || []).forEach(function (z) {
    html += '<div class="row"><span>' + zoneName(z.zone) + '</span><span class="kc-live-value">' +
      (z.actual_valid ? window.kcUnit.fmt(z.actual_c) : 'no reading') +
      (z.faulted ? ' &mdash; FAULTED' : (z.relay_on ? ' &mdash; ON' : ' &mdash; off')) + '</span></div>';
    if (z.faulted) {
      html += '<div class="row fault kc-live-value">' + zoneName(z.zone) + ': ' + window.kcEscapeHtml(z.fault_reason) + '</div>';
    }
  });
  if (st.dwelling && st.state === 'running') {
    html += '<div class="row"><span>Dwell remaining</span><span class="kc-live-value">' + fmtDuration(st.dwell_remaining_s) + '</span></div>';
  }
  if (st.state === 'faulted' && st.fault_reason) {
    html += '<div class="row fault kc-live-value">' + window.kcEscapeHtml(st.fault_reason) + '</div>';
  }
  html += renderRunQualityHeadline(st);
  html += '</div>';

  // No Stop button here (removed 2026-08-29, owner: "there is also an extra
  // start button above the graph that should not be there" -- it renders as
  // "Stop" while a firing is stoppable). app.js's sticky STOP FIRING bar is
  // fixed to the bottom of EVERY page and covers exactly the same
  // running/paused/faulted/done states (its STOPPABLE_STATES) with the same
  // confirm text and the same POST /api/profile_exec/stop, so this in-card
  // copy was a second control for one action sitting right above the chart.
  // Pause/Resume moved to that same sticky bar 2026-08-30 (owner: one
  // toggling button, next to Stop, on every page) -- no in-card control for
  // either one any more.

  card.innerHTML = html;
}

// -- "Kiln is falling behind" banner (PID_EXPANSION_PLAN.md sec 7.4) -------
// Ramp-lock (ramp_lock_held/ramp_lock_lagging_mask, already read above in
// renderExec()'s terser in-card row) is a NORMAL executor mechanism: it
// holds the shared setpoint from advancing until every zone catches up, so
// no target is ever skipped just because one zone is thermally slower. This
// banner is the operator-visible version of that same state -- worded as an
// explanation ("behind, catching up"), never as a fault. An actual zone
// fault already gets its own "FAULTED" row in renderExec() above and is
// untouched by this code.
//
// LAG_DEBOUNCE_TICKS: poll()'s /api/profile_exec fetch runs on a 2s cadence
// (see poll()'s own setTimeout(poll, 2000)). A single momentary lock --
// e.g. a duty-cycle transient tripping the >3C-from-setpoint test for one
// tick and clearing before the next -- is routine and must NOT flash this
// banner; that would train the operator to stop reading it. Requiring 3
// CONSECUTIVE lagging ticks (6s sustained) before showing filters that
// blip out while still surfacing a real stretch well within one poll of it
// becoming visible in the chart. Clearing is deliberately NOT debounced --
// the instant a tick reports the lock released, the banner drops immediately,
// since disappearing one tick early is not the failure mode being guarded
// against (only a false, unwarranted APPEARANCE is).
//
// This debounce is used ONLY for the fallback path (ramp_lock_held/
// ramp_lock_lagging_mask), which is instantaneous on the wire -- a board
// running firmware that predates commit 1e03448 has no other signal. The
// per-zone ramp_lag_sustained field (added in that commit) is itself
// debounced in firmware, 30s continuous (EXEC_SUSTAINED_LAG_S,
// profile_executor_internal.h) before it goes true, and it clears the
// instant the lag lifts. Stacking this UI's own 6s on top of that would
// make a real stretch take 36s to surface for no safety benefit -- the
// firmware debounce already exists specifically to filter the same kind of
// blip this UI debounce was written to filter. So the rich path is shown
// the moment any zone reports ramp_lag_sustained===true, undebounced here,
// while the fallback path keeps its own 6s client-side debounce for an
// older board's instantaneous field.
var LAG_DEBOUNCE_TICKS = 3;
var lagConsecutiveTicks = 0;
var lagBannerShown = false;

// Pure (no DOM, no module-level state): turns one /api/profile_exec payload
// into the lagging-zone list this banner needs. Kept separate from the
// debounce/render logic below so a Node test harness can exercise it
// directly against representative payloads.
//
// Commit 1e03448 landed the richer per-zone fields this was written
// speculatively against (ramp_lock_lag_detail was a guess; the real shape
// is per-zone fields on st.zones[i]: ramp_lag_sustained/ramp_lag_held_s/
// ramp_lag_commanded_rate_c_per_hr/ramp_lag_achieved_rate_c_per_hr -- see
// profile_executor.h and dashboard_json.c's append_zone_status_json()).
// Detected by field PRESENCE on the first active zone entry (typeof
// ramp_lag_sustained === 'boolean') rather than by trusting every entry
// blindly, so a same-tick payload from an older board (the field simply
// absent) falls straight through to the ramp_lock_held/
// ramp_lock_lagging_mask fields this page already depended on before this
// pass, with zero required schema beyond what renderExec() above already
// needs. Lag is reported per zone REGARDLESS of ramp_assist_enabled --
// only the run-level ramp_stretch_* numbers are gated on that flag (see
// renderLagBanner below).
function zonesArrayHasRichLagFields(st) {
  var zones = (st && st.zones) || [];
  for (var i = 0; i < zones.length; i++) {
    return typeof zones[i].ramp_lag_sustained === 'boolean';
  }
  return false;
}

function deriveLagZones(st) {
  if (!st) return { zones: [], rich: false };
  if (zonesArrayHasRichLagFields(st)) {
    var rich = (st.zones || []).filter(function (z) {
      return z && z.ramp_lag_sustained === true;
    }).map(function (z) {
      return {
        zone: z.zone,
        actualC: z.actual_valid ? z.actual_c : null,
        // Shared setpoint (st.target_c) -- /api/profile_exec has no per-zone
        // target, same field renderExec()'s "Shared target" row already uses.
        targetC: (typeof st.target_c === 'number') ? st.target_c : null,
        heldS: z.ramp_lag_held_s,
        commandedRate: z.ramp_lag_commanded_rate_c_per_hr,
        achievedRate: z.ramp_lag_achieved_rate_c_per_hr,
      };
    });
    return { zones: rich, rich: true };
  }
  if (!st.ramp_lock_held) return { zones: [], rich: false };
  var zonesByIndex = {};
  (st.zones || []).forEach(function (z) { zonesByIndex[z.zone] = z; });
  var out = [];
  for (var zb = 0; zb < 8; zb++) {
    if (!(st.ramp_lock_lagging_mask & (1 << zb))) continue;
    var z = zonesByIndex[zb];
    out.push({
      zone: zb,
      actualC: (z && z.actual_valid) ? z.actual_c : null,
      targetC: (typeof st.target_c === 'number') ? st.target_c : null,
    });
  }
  return { zones: out, rich: false };
}

// Stateful: advances the module-level debounce counters from one poll()
// tick's (firing?, laggingZones, rich?) and returns whether the banner
// should be showing right now. Split from deriveLagZones so the harness can
// drive debounce timing (consecutive ticks, a single-tick blip) independently
// of payload shape. The rich path is already debounced upstream in firmware
// (see the LAG_DEBOUNCE_TICKS comment above), so it shows immediately and
// does not touch/consume the fallback path's tick counter -- but it DOES
// reset that counter, so a board that flips between shapes mid-session
// (firmware upgrade) never shows a fallback banner off a stale count left
// over from before the rich fields appeared.
function updateLagBannerVisibility(firing, zones, rich) {
  if (!firing || zones.length === 0) {
    lagConsecutiveTicks = 0;
    lagBannerShown = false;
    return false;
  }
  if (rich) {
    lagConsecutiveTicks = 0;
    lagBannerShown = true;
    return true;
  }
  lagConsecutiveTicks++;
  if (lagConsecutiveTicks >= LAG_DEBOUNCE_TICKS) lagBannerShown = true;
  return lagBannerShown;
}

// Formats one zone's rich-path detail line, e.g. "Zone 2 -- 145s: 60C/hr
// commanded vs 22C/hr achieved". Falls back to just actual-vs-target when a
// rate/duration is missing (defensive; firmware always sends all three
// together, sustained-or-not).
function formatRichLagDetail(z) {
  var name = zoneName(z.zone);
  if (typeof z.heldS !== 'number' || typeof z.commandedRate !== 'number' ||
      typeof z.achievedRate !== 'number') {
    return name;
  }
  return name + ' &mdash; ' + fmtDuration(Math.round(z.heldS)) + ': ' +
    Math.round(z.commandedRate) + '°C/hr commanded vs ' +
    Math.round(z.achievedRate) + '°C/hr achieved';
}

function renderLagBanner(st, data) {
  var el = document.getElementById('lagBanner');
  if (!el) return;
  var derived = deriveLagZones(st);
  var zones = derived.zones, rich = derived.rich;
  // Ramp-lock only stretches an actively RUNNING schedule -- a paused run
  // isn't advancing anyway, so "behind schedule" doesn't apply to it, and
  // this must never show while idle/faulted/done (isFiringActive() above
  // covers running+paused, deliberately narrower here to just 'running').
  var firing = !!st && st.state === 'running';
  var show = updateLagBannerVisibility(firing, zones, rich);
  if (!show) { el.innerHTML = ''; return; }
  var items = zones.map(function (z) {
    if (rich) return formatRichLagDetail(z);
    var name = zoneName(z.zone);
    if (z.actualC == null || z.targetC == null) return name;
    return name + ' &mdash; ' + window.kcUnit.fmt(z.actualC) + ' vs target ' + window.kcUnit.fmt(z.targetC);
  });
  var stretchNote = '';
  // ramp_stretch_segment_s/ramp_stretch_total_s are run-level fields on `st`
  // (dashboard_http.c), gated on ramp_assist_enabled -- an /api/status field
  // (data, not st: see dashboard_http.c's status handler). They read 0
  // whenever assist is off, and 0 there means "not measured", not "nothing
  // stretched" -- showing "0s stretched" in that case would claim a
  // measurement that was never taken. So this is shown only when assist is
  // known to be on; otherwise the note says nothing about a duration at all.
  if (data && data.ramp_assist_enabled && st &&
      typeof st.ramp_stretch_segment_s === 'number' && typeof st.ramp_stretch_total_s === 'number') {
    stretchNote = ' This segment has been stretched ' + fmtDuration(Math.round(st.ramp_stretch_segment_s)) +
      ' so far (' + fmtDuration(Math.round(st.ramp_stretch_total_s)) + ' total this run).';
  }
  el.innerHTML = '<div class="banner lag"><h3>Kiln is falling behind schedule</h3>' +
    '<div class="row"><span>' + items.join('; ') + '</span></div>' +
    '<div class="note">This is normal ramp-lock behaviour, not a fault &mdash; ' +
    'the schedule is being stretched to give ' + (items.length > 1 ? 'these zones' : 'this zone') +
    ' time to catch up before the next target.' + stretchNote + '</div></div>';
}

// If a start attempt fails, decide whether it failed because the BOARD
// isn't ready (missing zones, no thermocouple board, safety link down, ...)
// or because the PROFILE itself is bad (e.g. a ramp rate over a zone's
// ceiling). The start error is just free text, so there is no reliable way
// to tell those apart from the string alone; instead ask the readiness
// endpoint directly. Any item that is not "ok" and not "deliberately_off"
// (that one was the operator's own choice, not something blocking them) is
// a real blocker -- send the user there instead of a bare toast they can't
// act on. Otherwise it's almost certainly profile-specific, so just show it.
function redirectToReadinessIfBlocked(errMsg) {
  fetch('/api/readiness').then(function (r) { return r.json(); }).then(function (j) {
    var blocking = (j.items || []).some(function (it) {
      return it.status !== 'ok' && it.status !== 'deliberately_off';
    });
    if (blocking) {
      window.location.href = '/readiness';
    } else {
      window.kcAlert(errMsg || 'failed to start');
    }
  }).catch(function () { window.kcAlert(errMsg || 'failed to start'); });
}

// -- Profile feasibility (2026-09-02) -------------------------------------
//
// profile_feasibility.c already computes a per-segment, per-zone verdict for
// every profile (PROFILE_SEG_OK / TOO_FAST / UNREACHABLE / UNKNOWN); this
// page does not recompute any of it, it just fetches GET /api/profile?id=
// (the same endpoint the editor uses) and surfaces the rollup + per-segment
// fields that response already carries. profiles_page.html's catalogue view
// established the OK/too_fast/unreachable vocabulary and CSS idiom
// (FZ_LABEL/FZ_WHY/fzMark) for the SAME verdict strings; this reuses that
// wording rather than inventing new phrasing, but additionally surfaces
// "unknown" (that page deliberately hides it) because the firing flow is a
// worse place to stay silent about an untuned zone than a read-only
// catalogue browse is.
var profileFeasCache = {};
function fetchProfileFeas(id) {
  if (id === undefined || id === null || id === '') return Promise.resolve(null);
  if (Object.prototype.hasOwnProperty.call(profileFeasCache, id)) return Promise.resolve(profileFeasCache[id]);
  return fetch('/api/profile?id=' + id).then(function (r) {
    if (!r.ok) throw 0;
    return r.json();
  }).then(function (data) {
    profileFeasCache[id] = data;
    return data;
  }).catch(function () {
    profileFeasCache[id] = null; // degrade like every other optional endpoint on this page: no icon, no gate
    return null;
  });
}

// Same two verdicts profiles_page.html marks, plus "unknown" -- see the
// block comment above for why this page does not hide it. Text matches
// FZ_WHY there for the two real failures so the two pages never disagree
// about what "too fast"/"unreachable" mean.
var FEAS_WHY = {
  too_fast: 'commanded ramp exceeds what the zone can sustain (heating headroom, or -- on a falling ramp -- ' +
            'the kiln’s natural cooling rate; there is no active cooling)',
  unreachable: 'the kiln cannot reach this temperature at all with its tuned model',
};

// Splits a profile-detail response's segments into real problems (too_fast/
// unreachable) and merely-unassessed ones (unknown -- untuned zone, not a
// known failure). Returns null when there is nothing to say (no feasibility
// field at all -- older firmware -- or every segment OK).
function feasSummarize(data) {
  if (!data || !data.feasibility) return null;
  if (data.feasibility === 'ok') return null;
  var problems = [];
  var unknowns = [];
  (data.segments || []).forEach(function (s, i) {
    if (s.feasibility === 'too_fast' || s.feasibility === 'unreachable') {
      problems.push({ n: i + 1, v: s.feasibility });
    } else if (s.feasibility === 'unknown') {
      unknowns.push(i + 1);
    }
  });
  return { rollup: data.feasibility, problems: problems, unknowns: unknowns };
}

// Shared body for both the info popup and the start-confirmation popup, so
// the two never drift apart on wording.
function feasBodyHtml(summary) {
  var html = '';
  if (summary.problems.length) {
    html += '<p class="warn">The tuned model says this profile is not achievable as written:</p><ul>';
    summary.problems.forEach(function (p) {
      var label = p.v === 'too_fast' ? 'too fast' : 'unreachable';
      html += '<li>Segment ' + p.n + ': <b>' + label + '</b> — ' + FEAS_WHY[p.v] + '.</li>';
    });
    html += '</ul>';
  }
  if (summary.unknowns.length) {
    var plural = summary.unknowns.length > 1;
    html += '<p>Segment' + (plural ? 's ' : ' ') + summary.unknowns.join(', ') +
      (plural ? ' use a zone' : ' uses a zone') + ' that has never been autotuned, so ' +
      (plural ? 'their' : 'its') + ' achievability is <b>not assessed</b> — that is an open question, ' +
      'not a predicted failure.</p>';
  }
  html += '<p>This assessment assumes an <b>empty kiln</b>, the same condition the PID was tuned under. A ' +
          'loaded kiln has more thermal mass and heats more slowly, so a profile that is marginal empty may ' +
          'not be achievable loaded.</p>';
  html += '<p class="msg">The achievable-rate figure itself comes from a model fitted at low temperature and ' +
          'extrapolated up to each segment’s target.</p>';
  return html;
}

// ---------------------------------------------------------------------------
// Configured-limit headroom warning (owner policy 2026-09-08): "it will be
// the user's responsibility to create profiles that meet their set limits...
// guided by the dashboard warnings" -- profiles are NEVER clamped, rewritten
// or rejected to fit max_temp_c/max_ramp_c_per_hr. The one thing that stays
// is the EXISTING start-time refusal for a profile that genuinely exceeds a
// hard limit (profile_executor_run.c's re-check) -- this feature's job is
// only to make that outcome, and the near-miss cases short of it, VISIBLE
// before the operator ever presses Start, not discovered as a trip.
//
// This is a DIFFERENT question from feasSummarize()'s model-based
// too_fast/unreachable verdict above: that asks "can the tuned plant
// physically get there"; this asks "is the profile close enough to the
// OPERATOR'S OWN configured ceiling to trip on ordinary overshoot". A
// profile can be perfectly feasible (the kiln can reach and hold the
// target) and still sit right at its own configured ceiling -- exactly the
// concrete case that prompted this: max_temp_c and the Pico's independent
// abs_max_temp_c are BOTH 80C on this bench, so an 80C profile has zero
// margin and will trip on any overshoot.
//
// Purely a client-side computation over data this page already fetches --
// zonesCache.zones' max_temp_c/max_ramp_c_per_hr (GET /api/zones, loaded by
// loadZones() above) and target_c/ramp_c_per_hr/seg_kind/zone_mask (GET
// /api/profile?id=, already fetched by fetchProfileFeas() above for the
// feasibility icon). No new endpoint, no new JSON field on either response
// -- zero added httpd JSON cost.
//
// abs_max_temp_c (the Pico's independent ceiling) is deliberately NOT
// fetched or compared here even though it is a live figure: setup_wizard_
// page.html step 7 already REFUSES to commission abs_max_temp_c below the
// highest configured zone max_temp_c ("must never be tighter than the
// ESP's"), so max_temp_c is structurally always the tighter-or-equal of the
// two -- comparing against it again client-side would need a new fetch just
// to reach the same verdict max_temp_c already gives. Likewise S8's
// max_rate_c_per_min (33.3C/min = 1998C/hr live on this bench) is far
// looser than any sane max_ramp_c_per_hr (900C/hr live on this bench) and
// is not wired in for the same reason -- it is not the binding constraint.
//
// Four states, ranked worst-to-best (see classifyMargin()):
//   'exceeds'     target/rate is ABOVE the zone's configured ceiling
//                 outright -- refused at start, same as always; surfaced
//                 here so that refusal is not a surprise.
//   'at_limit'    within LIMIT_AT_LIMIT_EPS_C of the ceiling -- no margin
//                 for overshoot. This project has MEASURED real dwell-entry
//                 overshoot (PID_EXPANSION_PLAN.md), so a target this close
//                 to the ceiling is a PREDICTABLE trip, not a hypothetical
//                 one -- limitBodyHtml() below says so in those terms.
//   'near_limit'  within LIMIT_HEADROOM_WARN_C (5C -- the owner's own stated
//                 rule of thumb for practical headroom) of the ceiling.
//   'comfortable' not reported at all: no icon, no popup. "A warning that
//                 is always present is a warning nobody reads."
var LIMIT_HEADROOM_WARN_C = 5;     // owner's stated practical-headroom rule of thumb
var LIMIT_AT_LIMIT_EPS_C = 0.5;    // ignore-sub-half-degree-effects: below this, "at" the ceiling
var LIMIT_RAMP_NEAR_FRAC = 0.9;    // rate has no natural "5C"-equivalent unit -- use a fraction instead

var LIMIT_RANK = { exceeds: 3, at_limit: 2, near_limit: 1, comfortable: 0 };

// Mirrors zones_config_accessors.h's zone_control_mode_t. Named rather than
// spelled 0 inline so the comparison in computeProfileLimitWarning() reads
// the same way profile_executor_start.c's own precheck does.
var ZONE_CONTROL_MODE_OFF = 0;

function classifyMargin(margin, nearBandC) {
  if (margin < 0) return 'exceeds';
  if (margin <= LIMIT_AT_LIMIT_EPS_C) return 'at_limit';
  if (margin <= nearBandC) return 'near_limit';
  return 'comfortable';
}

// Walks every ZONE_RAMP segment of a /api/profile?id= response against the
// CURRENTLY configured ceilings of every zone in its zone_mask, and returns
// the worst verdict found plus the offending items, or null if nothing is
// worth reporting (no segments, no commissioned zone in the mask, or every
// segment comfortably inside both ceilings).
function computeProfileLimitWarning(zones, profileData) {
  if (!profileData || !profileData.segments || !profileData.segments.length) return null;
  var zoneMask = profileData.zone_mask || 0;
  var worst = 'comfortable';
  var items = [];
  (profileData.segments || []).forEach(function (s, i) {
    // PROFILE_SEG_KIND_ZONE_RAMP=0; others carry no target_c/ramp_c_per_hr.
    // Strict !== 0 is safe because BOTH producers state seg_kind explicitly:
    // profiles_catalog_http.c's user-slot emitter always did, and its builtin
    // emitter now does too (it used to omit the field entirely, which made
    // `undefined !== 0` bail out of every builtin segment and left this whole
    // warning silently inert for the shipped catalogue). A missing field is
    // deliberately NOT treated as kind 0 here -- that would re-hide the next
    // producer that forgets it.
    if (s.seg_kind !== 0) return;
    for (var zi = 0; zi < 8; zi++) {
      if (!(zoneMask & (1 << zi))) continue;
      var z = zones[zi];
      if (!z) continue;
      // max_temp_c == 0 is NOT "use the firmware default" for this field.
      // zones_config_accessors.h is explicit that there is no repo-established
      // safe absolute-temperature default to substitute (the 2026-08-27 "guard
      // 5's absolute ceiling is off by default" audit), so nothing here may
      // invent one. What the firmware actually does with a 0 is REFUSE the
      // firing: profile_executor_start.c's ceiling precheck returns false for
      // any zone in the mask whose control_mode is not OFF and whose
      // max_temp_c is <= 0. So this is reported as 'exceeds' -- the run will
      // be refused at start, exactly like a target above a real ceiling --
      // rather than skipped, which is what previously hid it. An OFF zone is
      // skipped, matching that same precheck.
      if (!(z.max_temp_c > 0)) {
        if (z.control_mode !== ZONE_CONTROL_MODE_OFF) {
          items.push({ n: i + 1, zone: zi, kind: 'unset_ceiling', level: 'exceeds' });
          worst = 'exceeds';
        }
        continue;
      }

      var tempLevel = classifyMargin(z.max_temp_c - s.target_c, LIMIT_HEADROOM_WARN_C);
      if (tempLevel !== 'comfortable') {
        items.push({ n: i + 1, zone: zi, kind: 'temp', target: s.target_c, limit: z.max_temp_c,
                     margin: z.max_temp_c - s.target_c, level: tempLevel });
      }
      if (LIMIT_RANK[tempLevel] > LIMIT_RANK[worst]) worst = tempLevel;

      if (z.max_ramp_c_per_hr > 0 && s.ramp_c_per_hr) {
        var rate = Math.abs(s.ramp_c_per_hr);
        var rampLevel = classifyMargin(z.max_ramp_c_per_hr - rate, z.max_ramp_c_per_hr * (1 - LIMIT_RAMP_NEAR_FRAC));
        if (rampLevel !== 'comfortable') {
          items.push({ n: i + 1, zone: zi, kind: 'ramp', target: rate, limit: z.max_ramp_c_per_hr,
                       margin: z.max_ramp_c_per_hr - rate, level: rampLevel });
        }
        if (LIMIT_RANK[rampLevel] > LIMIT_RANK[worst]) worst = rampLevel;
      }
    }
  });
  if (worst === 'comfortable') return null;
  return { level: worst, items: items };
}

var LIMIT_LEVEL_LABEL = { exceeds: 'exceeds the limit', at_limit: 'at the limit', near_limit: 'close to the limit' };

function limitBodyHtml(summary) {
  var html = '';
  if (summary.level === 'exceeds') {
    html += '<p class="warn">One or more segments exceed a configured ceiling outright. This profile will ' +
            'be <b>refused at start</b> until either the profile or the zone\'s limit changes.</p>';
  } else if (summary.level === 'at_limit') {
    html += '<p class="warn">One or more segments sit AT a configured ceiling, with no margin for overshoot. ' +
            'This kiln has measured real overshoot at dwell entry -- a target this close to the ceiling is a ' +
            '<b>predictable trip</b>, not a hypothetical one.</p>';
  } else {
    html += '<p>One or more segments are within a small margin of a configured ceiling -- worth knowing before ' +
            'you start, though not yet a likely trip.</p>';
  }
  html += '<ul>';
  summary.items.forEach(function (it) {
    var zoneLabel = zoneName(it.zone);
    if (it.kind === 'unset_ceiling') {
      html += '<li>Segment ' + it.n + ' (' + zoneLabel + '): this zone has <b>no maximum temperature ' +
              'configured</b> and is not switched off -- the firing will be <b>refused at start</b> ' +
              'until a ceiling is set on the Thermocouples &amp; Zones page.</li>';
      return;
    }
    var unit = it.kind === 'temp' ? 'C' : 'C/hr';
    var what = it.kind === 'temp' ? 'target' : 'ramp rate';
    html += '<li>Segment ' + it.n + ' (' + zoneLabel + '): ' + what + ' ' + it.target.toFixed(1) + unit +
            ' vs limit ' + it.limit.toFixed(1) + unit + ' -- <b>' + LIMIT_LEVEL_LABEL[it.level] + '</b>' +
            (it.margin >= 0 ? ' (' + it.margin.toFixed(1) + unit + ' headroom)' : '') + '.</li>';
  });
  html += '</ul>';
  html += '<p class="msg">The profile is not being changed -- these limits are the zone\'s own configuration ' +
          '(Thermocouples &amp; Zones settings). Raise the limit or edit the profile if this is not what you want.</p>';
  return html;
}

function openLimitInfoPopup() {
  var id = document.getElementById('profileSelect').value;
  var summary = computeProfileLimitWarning(zonesCache.zones || [], profileFeasCache[id]);
  if (!summary) return;
  var name = profileTitleById[id] || ('profile ' + id);
  var box = document.getElementById('feasPopupBox');
  box.innerHTML = '<h3>Configured-limit notice — ' + name + '</h3>' + limitBodyHtml(summary) +
    '<div class="btnrow"><button type="button" id="feasPopupCloseBtn">Close</button></div>';
  document.getElementById('feasPopupOverlay').removeAttribute('hidden');
  document.getElementById('feasPopupCloseBtn').addEventListener('click', closeFeasPopup);
}

// Refreshes #profileLimitIcon for whatever's currently selected. Same
// stale-response guard as updateProfileFeasIcon() (fetchProfileFeas shares
// its cache with that function, so this never issues its own extra fetch).
function updateProfileLimitIcon() {
  var id = document.getElementById('profileSelect').value;
  var icon = document.getElementById('profileLimitIcon');
  if (id === undefined || id === '') {
    icon.hidden = true;
    return;
  }
  fetchProfileFeas(id).then(function (data) {
    if (document.getElementById('profileSelect').value !== id) return;
    var summary = computeProfileLimitWarning(zonesCache.zones || [], data);
    icon.classList.remove('limit-icon-danger', 'limit-icon-warn', 'limit-icon-info');

// Start-time gate: shown instead of going straight to the existing confirm()
