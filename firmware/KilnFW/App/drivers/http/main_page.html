// Refreshes the icon for whatever's currently selected. Called on initial
// list load and on every profileSelect change (see the change handler
// below). Guards against a stale response landing after the selection
// changed again while the fetch was in flight.
function updateProfileFeasIcon() {
  var id = document.getElementById('profileSelect').value;
  var icon = document.getElementById('profileFeasIcon');
  if (id === undefined || id === '') {
    icon.hidden = true;
    return;
  }
  fetchProfileFeas(id).then(function (data) {
    if (document.getElementById('profileSelect').value !== id) return;
    var summary = feasSummarize(data);
    if (!summary) {
      icon.hidden = true;
      icon.classList.remove('feas-icon-warn', 'feas-icon-unknown');
      return;
    }
    var hasProblem = summary.problems.length > 0;
    icon.hidden = false;
    icon.classList.toggle('feas-icon-warn', hasProblem);
    icon.classList.toggle('feas-icon-unknown', !hasProblem);
    icon.textContent = hasProblem ? '⚠' : 'ⓘ';
    icon.title = hasProblem
      ? 'Feasibility warning for this profile — click for details'
      : 'Part of this profile has not been assessed — click for details';
  });
}

function proceedToStart(id, startName) {
  window.kcConfirm('Start firing "' + startName + '" now? This energises the heaters and will run for hours.').then(function (ok) {
    if (!ok) return;
    // Extra confirmation on top of the normal one above, only when the task-
    // watchdog panic is currently disabled (dev/bench mode).
    (lastWatchdogPanicDisabled ? window.kcConfirm(WATCHDOG_CFG_FIRING_WARNING_JS) : Promise.resolve(true)).then(function (ok2) {
      if (!ok2) return;
      fetch('/api/profile_exec/start', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'id=' + id,
      }).then(function (r) { return r.json(); }).then(function (result) {
        if (result.ok === false) {
          // THE READINESS FIRING INTERLOCK (2026-09-09,
          // App/drivers/safety/readiness_gate.h). Four checklist items --
          // safety_trip, recovery_mode, crash_report, estop_verified -- now
          // REFUSE a start outright. When one of them is the reason, the
          // response carries "readiness_item": the /api/readiness key of the
          // single item that blocked.
          //
          // Handled ahead of redirectToReadinessIfBlocked() below, and NOT by
          // folding it into that function, because the two cases genuinely
          // differ: that path knows only that SOMETHING on the checklist is
          // amber and sends the operator to go look, which is the right answer
          // for a vague "board isn't ready". This path knows exactly which item
          // refused and why, so it says so first -- a refusal that dumps the
          // operator on an eighteen-item checklist with no indication of which
          // line refused them reads as a broken board, which is precisely the
          // failure this interlock must not introduce.
          if (result.readiness_item) {
            // Navigate only once the operator has dismissed the notice: the
            // native alert() this replaced blocked until then, and kcAlert()
            // does not -- navigating straight away would unload the page
            // before the refusal reason was ever read.
            window.kcAlert(result.error || 'refused by the readiness interlock').then(function () {
              window.location.href = '/readiness#' + encodeURIComponent(result.readiness_item);
            });
            return;
          }
          redirectToReadinessIfBlocked(result.error);
          return;
        }
        pollExec();
      }).catch(function (err) {
        // Was a bare `.catch(pollExec)`: a non-JSON error body (the plain-text
        // 409 the recovery-mode refusal above this handler still sends) threw
        // here and the operator saw the Start button do absolutely nothing. Poll
        // as before, but say something first -- unless the operator simply
        // cancelled the sign-in prompt, which is not a board failure.
        if (!(window.kcIsAuthCancelled && window.kcIsAuthCancelled(err))) {
          window.kcAlert('Start failed and the board did not explain why -- check the '
                + 'Readiness page and the log.');
        }
        pollExec();
      });
    });
  });
}

document.getElementById('runBtn').addEventListener('click', function () {
  const id = document.getElementById('profileSelect').value;
  if (id === undefined || id === '') return;
  const startName = profileTitleById[id] || ('profile ' + id);
  fetchProfileFeas(id).then(function (data) {
    var summary = feasSummarize(data);
    if (summary) {
      openFeasStartPopup(startName, summary, function () { proceedToStart(id, startName); });
    } else {
      proceedToStart(id, startName);
    }
  });
});

// 2026-09-01 (owner: "the duty cycle and all of the zones are not always
// visible on the web graph" / "sometimes the legends are there and the plot
// for it is gone too"): history.csv widened from one representative zone's
// actual/duty to every zone's, fixing the actual root cause -- those traces
// used to exist ONLY client-side (firingZoneSeries/firingDutySeries below),
// so they were gone on reload/late-open. Columns are now
// elapsed_s,desired_c,z0_actual_c,z0_duty,z0_guard,z1_actual_c,...,zone_mask
// -- one z<N>_actual_c,z<N>_duty,z<N>_guard triple per zone, then a trailing
// zone_mask column (dashboard_http.c's history_csv_get_handler(),
// HISTORY_ZONE_COUNT zones). `target` is kept as the row's name for
// desired_c, same reasoning as before: it's the elapsed half of the single
// "planned" line, not a second series.
//
// 2026-09-02 (opus review of 3f9b1a9/2a8ff7e): zone_mask is THIS ROW's own
// mask, captured firmware-side at the time this sample was taken -- NOT the
// executor's current-run zone_mask. A caller averaging/masking a row (e.g.
// avgMaskedDuty below) MUST use r.zoneMask, never lastExecStatus.zone_mask:
// the executor zeroes its zone_mask while idle (profile_executor_status.c),
// so every historical row read that way while idle divided by zero and
// plotted NaN for the whole duty trace, and a row from a PREVIOUS run read
// against the CURRENT run's mask was averaged against the wrong zones.
// Falls back to 0 (no zones known active) for a CSV from older firmware
// with no trailing column, same "missing column -> 0/empty" tolerance the
// per-zone fields below already have via parseFloat/parseInt on a short row.
var HISTORY_ZONE_COUNT = 3; // must match firmware's MAX31856_CHANNEL_COUNT (profile_executor.h)
function parseHistoryCsv(text) {
  var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
  var rows = [];
  var minFields = 2 + HISTORY_ZONE_COUNT * 3;
  var maskField = minFields; // zone_mask trails the per-zone triples
  for (var i = 1; i < lines.length; i++) { // skip header
    var f = lines[i].split(',');
    if (f.length < minFields) continue;
    var zoneActual = [], zoneDuty = [], zoneGuard = [];
    for (var zi = 0; zi < HISTORY_ZONE_COUNT; zi++) {
      var base = 2 + zi * 3;
      zoneActual.push(parseFloat(f[base]));
      zoneDuty.push(parseFloat(f[base + 1]));
      zoneGuard.push(parseInt(f[base + 2], 10));
    }
    var zoneMask = f.length > maskField ? parseInt(f[maskField], 10) : 0;
    if (isNaN(zoneMask)) zoneMask = 0;
    rows.push({
      t: parseFloat(f[0]), target: parseFloat(f[1]),
      zoneActual: zoneActual, zoneDuty: zoneDuty, zoneGuard: zoneGuard, zoneMask: zoneMask,
    });
  }
  return rows;
}

// PID_EXPANSION_PLAN.md Phase 7b: /api/autotune/trace.csv's own two-column
// format ("elapsed_s,measurement_c\n" header then one row per captured
// sample) -- same skip-header/split-on-comma shape as parseHistoryCsv above,
// kept as its own function rather than generalised because the two CSVs
// don't share a column layout and forcing one parser to know both would
// just be an extra branch for no reuse.
function parseAutotuneTraceCsv(text) {
  var lines = text.split('\n').filter(function (l) { return l.trim().length > 0; });
  var pts = [];
  for (var i = 1; i < lines.length; i++) { // skip header
    var f = lines[i].split(',');
    if (f.length < 2) continue;
    var t = parseFloat(f[0]), c = parseFloat(f[1]);
    if (isNaN(t) || isNaN(c)) continue;
    pts.push({ t: t, c: c });
  }
  return pts;
}

// The chart canvas itself carries no kc-live-value: a <canvas> is one opaque
// bitmap to the DOM, not text nodes/elements the .kc-stale rule's opacity
// selector can reach, and re-drawing it fully transparent on every stale
// tick just to fake the same dimming effect would be a second, duplicate
// staleness indicator fighting the one the banner already gives (this data
// is also on a materially slower 15s poll than the 2-3s heartbeat, so its
// own staleness lags the banner's anyway). The axis/legend TEXT this
// function draws is still unit-converted below for UI_PLAN.md item 7 parity,
// same as every other on-screen °C figure.
// Shared canvas/axis setup for both the running-trend chart (drawHistoryChart)
// and the idle-dots chart (drawIdleDots). Returns null if the canvas isn't
// laid out yet (clientWidth 0), same "nothing sensible to draw" case either
// caller already had to handle.
function setupChart() {
  var canvas = document.getElementById('historyChart');
  canvas.style.display = '';
  var dpr = window.devicePixelRatio || 1;
  var cssW = canvas.clientWidth || 600, cssH = 220;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  var style = getComputedStyle(document.documentElement);
  var fg = style.getPropertyValue('--fg').trim() || '#111';
  var muted = style.getPropertyValue('--muted').trim() || '#444';
  var border = style.getPropertyValue('--border').trim() || '#888';
  // Theme-aware colour for the freezing reference line/legend swatch --
  // never a hard-coded hex, same rule the rest of this page's palette
  // already follows (see the :root/--bad chain at the top of this
  // file). Falls back to the light-theme default only if the variable is
  // somehow unset.
  var fault = style.getPropertyValue('--bad').trim() || '#b00';

  // padR is 46 (was 36) to leave room for the sideways "Duty cycle" title
  // beside the right axis's percent tick labels -- see drawDutyAxisLabel().
  var padL = 42, padR = 46, padT = 10, padB = 20;
  var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
  ctx.strokeStyle = border; ctx.lineWidth = 1;
  ctx.strokeRect(padL, padT, plotW, plotH);
  return { canvas: canvas, ctx: ctx, cssW: cssW, cssH: cssH, fg: fg, muted: muted, border: border, fault: fault,
           padL: padL, padR: padR, padT: padT, padB: padB, plotW: plotW, plotH: plotH };
}

// Idle case (no profile running): there is no time axis to plot against --
// the history ring isn't being fed (profile_executor.c only samples while a
// zone is active/running) -- so this draws one static dot per thermocouple
// channel, pinned to the left edge of the plot area, using this tick's
// /api/status reading. It does NOT accumulate points or move rightward over
// time; each call fully replaces the previous frame (setupChart() clears the
// canvas), so a channel's dot just relocates vertically as its live temp
// changes. Colour matches that channel's swatch in the list below (CH_COLORS/
// chColor(), shared source of truth) so the two views read as the same data.
function drawIdleDots(data) {
  var g = setupChart();
  if (!g) return;
  var channels = (data && data.thermo_ready) ? (data.channels || []) : [];
  var vals = channels.filter(function (c) { return c.valid && !c.spi_failed; })
                     .map(function (c) { return c.temp_c; });

  // Planned-curve preview (idle only): activePlan is set by the profileSelect
  // change handler / initial load when a profile is picked but not started.
  // Its points feed into the same min/max pad below so the preview curve is
  // never clipped off the top/bottom of a range sized only for the dots.
  // Genuine-reading check for the freezing clamp below: only ACTUAL
  // thermocouple readings count as "a real sub-zero temperature" -- the plan
  // preview (pushed into `vals` further down, for ranging purposes only) is a
  // synthetic curve that has no business setting the axis floor.
  var sensorVals = vals.slice();

  var planPts = (activePlan && activePlan.points) || [];
  planPts.forEach(function (p) { vals.push(p.c); });

  // Y-axis rule: with no history to derive a range from, scale to the
  // live readings themselves (min/max +/- 10% pad, same shape as the
  // running chart's 5% pad but a bit more generous since a single frozen
  // reading has no future samples to eventually widen the range). With no
  // valid reading at all, fall back to a fixed 0-100 degC range converted
  // through kcUnit -- arbitrary, but keeps the axis legible instead of a
  // divide-by-zero 0..1 span, and matches the kiln's low end.
  var minV = vals.length ? Math.min.apply(null, vals) : 0;
  var maxV = vals.length ? Math.max.apply(null, vals) : 100;
  if (maxV === minV) { minV -= 5; maxV += 5; }
  var padV = (maxV - minV) * 0.1;
  minV -= padV; maxV += padV;

  // Owner request: "the charts should never show below freezing temp" -- but
  // ONLY as an axis floor, not a data clamp. A disconnected/faulty probe or a
  // genuinely cold workshop can and does read below 0degC, and that reading
  // must still be plotted, visibly out of range, not silently pinned to 0 --
  // hiding a real sub-zero reading on a safety-relevant display would hide
  // exactly the kind of fault this dashboard exists to surface. So: if
  // nothing actually read below freezing, don't let the +/-10% pad push the
  // axis floor below 0 for no reason (snap it back up to CHART_FREEZING_C).
  // If something genuinely did read below freezing, leave the axis exactly
  // where the data put it (below zero) and let drawChartAxis's dashed
  // reference line mark 0degC as the abnormal boundary.
  var belowFreezing = sensorVals.length > 0 && Math.min.apply(null, sensorVals) < CHART_FREEZING_C;
  if (!belowFreezing) { minV = Math.max(minV, CHART_FREEZING_C); if (maxV <= minV) maxV = minV + 10; }

  function yTemp(v) { return g.padT + g.plotH - (v - minV) / (maxV - minV) * g.plotH; }
  var dotX = g.padL + 10; // pinned to the left edge, never marches across the plot

  drawYAxis(g, yTemp, minV, maxV);

  // Planned-curve preview drawn BEFORE the dots so the dots (this instant's
  // real readings) stay on top and are never occluded by the dashed line.
  // Spans the full plot width against the plan's own time axis (0..last
  // point's t, or total_planned_s if larger) -- deliberately NOT pinned to
  // the left edge like the dots, and dashed + a distinct colour (#96c) so
  // it reads as "the plan", not as a moving trend the way the running
  // chart's solid lines do. Explicit label makes the "not started" state
  // impossible to mistake for a live run.
  var pMaxT = 0;
  if (planPts.length >= 2) {
    pMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > pMaxT) pMaxT = activePlan.total_planned_s;
    if (pMaxT <= 0) pMaxT = 1;
    function px(t) { return g.padL + (t / pMaxT) * g.plotW; }
    g.ctx.save();
    g.ctx.setLineDash([6, 4]);
    g.ctx.strokeStyle = SERIES_COLORS.plan; g.ctx.lineWidth = 1.5;
    g.ctx.beginPath();
    planPts.forEach(function (p, i) {
      var ppx = px(p.t), ppy = yTemp(p.c);
      if (i === 0) g.ctx.moveTo(ppx, ppy); else g.ctx.lineTo(ppx, ppy);
    });
    g.ctx.stroke();
    g.ctx.restore();
    // The plan preview is the ONLY thing in this idle frame with a genuine
    // time axis (the dots below are a single instant, not a series) -- so
    // ticks are drawn spanning just its own 0..pMaxT domain, via the same px()
    // used to place the curve itself, not the dots' fixed left-edge x.
    drawChartAxis(g, px, yTemp, 0, pMaxT);
  }
  if (belowFreezing) drawFreezingRef(g, yTemp, minV, maxV);

  channels.forEach(function (c) {
    if (!c.valid || c.spi_failed) return;
    var py = yTemp(c.temp_c);
    g.ctx.beginPath();
    g.ctx.arc(dotX, py, 4, 0, Math.PI * 2);
    g.ctx.fillStyle = chColor(c.channel);
    g.ctx.fill();
  });

  renderChartMeta('idle', {
    planShown: planPts.length >= 2, planMaxT: pMaxT,
    freezingShown: belowFreezing, faultColor: g.fault,
  });
}

// 2026-09-01 (owner: "the duty cycle and all of the zones are not always
// visible on the web graph" -- reproduced live against a running three-zone
// firing; also "sometimes the legends are there and the plot for it is gone
// too, sometimes the legends are not there"). Two separate bugs, fixed
// together:
//
//  1. history.csv used to carry ONE representative zone's actual/target and
//     ONE whole-kiln-aggregate duty column (profile_executor.h's old
//     "scoped to a single representative zone" limitation) -- every OTHER
//     zone's trace, and per-zone duty, existed ONLY client-side
//     (firingZoneSeries/firingDutySeries below), so a page (re)loaded
//     mid-firing had nothing for them: "not always visible" was a data
//     problem, not a drawing one. Fixed at the source: the firmware ring
//     buffer now records every zone (see profile_executor.h's doc comment
//     on profile_history_entry_t), so `rows` below carries every zone's
//     trace and duty for the WHOLE run, survives reload, and
//     firingZoneSeries/firingDutySeries become a pure freshness top-up --
//     the few seconds between history.csv's 15s poll and "now" -- rather
//     than the only copy of the data.
//  2. drawZoneLine used to push a legend entry whenever `pts.length > 0`,
//     which is true even when every point in `pts` is NaN (a zone whose
//     entire visible window had no valid reading) -- a legend row with
//     nothing drawn under it, exactly the "legends are there and the plot
//     ... is gone" report. Fixed by gating the legend push on at least one
//     DRAWABLE (non-NaN) point, the same test the draw loop itself uses to
//     decide whether it ever calls moveTo/lineTo.
function drawHistoryChart(rows) {
  // 2026-08-21: #historyEmpty (the "No history yet" <p>) was removed from the
  // markup above along with the History heading/intro paragraph -- this used
  // to toggle canvas/empty visibility as a pair. There is no replacement text
  // element now, by the same "no longer earns its space" call as the
  // paragraph removal. The chart itself is now ALWAYS shown though (see
  // updateChart()'s idle/running split below): an empty `rows` here only
  // happens transiently (e.g. history.csv fetch racing a just-started
  // profile), so rather than hiding the canvas this just leaves whatever
  // was drawn last tick on screen -- never a blank state.
  if (!rows.length) {
    return;
  }

  var g = setupChart();
  if (!g) return;
  var ctx = g.ctx, cssW = g.cssW, cssH = g.cssH, fg = g.fg, muted = g.muted;
  var padL = g.padL, padR = g.padR, padT = g.padT, padB = g.padB, plotW = g.plotW, plotH = g.plotH;

  var repZone = lastExecStatus ? zoneMaskLowestBit(lastExecStatus.zone_mask) : -1;

  var tMin = rows[0].t, tMax = rows[rows.length - 1].t;
  // "actual" span (what's really been recorded/collected, as opposed to the
  // plan's own future preview extending tMax further below) -- this is what
  // renderChartMeta's "Showing X-Y elapsed" note reports, so it must include
  // the client-collected series' own tails, which can run slightly AHEAD of
  // history.csv's 15s poll cadence.
  Object.keys(firingZoneSeries).forEach(function (zi) {
    var arr = firingZoneSeries[zi];
    if (arr.length) tMax = Math.max(tMax, arr[arr.length - 1].t);
  });
  if (firingDutySeries.length) tMax = Math.max(tMax, firingDutySeries[firingDutySeries.length - 1].t);
  var actualMaxT = tMax;

  // Planned curve (activePlan, set by pollExec's lastExecPlanId switch keyed
  // off st.profile_id): extend tMax to cover the plan's own future points so
  // the dashed half of the target line draws AHEAD of the run, not just
  // clipped to however far history.csv has recorded so far -- that forward
  // half is the only part of the target line the plan supplies; the elapsed
  // half comes from the recorded samples. planPts is empty if there's no
  // active plan, or the fetch 404'd/failed (older firmware) -- both collapse
  // to "target line stops at now, no dashed preview" further down.
  var planPts = (activePlan && activePlan.points) || [];
  if (planPts.length) {
    var planMaxT = planPts[planPts.length - 1].t;
    if (activePlan.total_planned_s && activePlan.total_planned_s > planMaxT) planMaxT = activePlan.total_planned_s;
    if (planMaxT > tMax) tMax = planMaxT;
  }
  if (tMax === tMin) tMax = tMin + 1;
  var tempVals = [];
  var actualVals = []; // genuine sensor readings only -- see freezing-clamp comment below
  rows.forEach(function (r) {
    for (var zi = 0; zi < HISTORY_ZONE_COUNT; zi++) {
      if (!isNaN(r.zoneActual[zi])) { tempVals.push(r.zoneActual[zi]); actualVals.push(r.zoneActual[zi]); }
    }
    if (!isNaN(r.target)) tempVals.push(r.target);
  });
  planPts.forEach(function (p) { tempVals.push(p.c); });
  // 2026-09-01: firingZoneSeries is now only a top-up for the gap since the
  // last history.csv poll (every zone's full-run trace comes from `rows`
  // itself, see drawHistoryChart's own doc comment) -- there is no longer a
  // "this page was reloaded mid-run and lost the other zones' history"
  // case to flag (opts.partialZoneSeries used to exist for exactly that;
  // removed along with the note it drove, since it would now be false
  // information every time it fired).
  Object.keys(firingZoneSeries).forEach(function (zi) {
    firingZoneSeries[zi].forEach(function (p) { tempVals.push(p.c); actualVals.push(p.c); });
  });
  var tMinV = tempVals.length ? Math.min.apply(null, tempVals) : 0;
  var tMaxV = tempVals.length ? Math.max.apply(null, tempVals) : 1;
  if (tMaxV === tMinV) tMaxV = tMinV + 1;
  tMinV -= (tMaxV - tMinV) * 0.05; tMaxV += (tMaxV - tMinV) * 0.05;

  // Same freezing-axis-floor clamp as drawIdleDots (see that function's
  // comment for the full reasoning): only genuine sensor readings count as
  // "a real reading" for deciding whether the axis is allowed to dip below
  // 0degC -- the planned/duty series are config/plan, not sensor
  // data, and must never be what forces (or excuses clamping away) a
  // below-freezing axis.
  var belowFreezing = actualVals.length > 0 && Math.min.apply(null, actualVals) < CHART_FREEZING_C;
  if (!belowFreezing) { tMinV = Math.max(tMinV, CHART_FREEZING_C); if (tMaxV <= tMinV) tMaxV = tMinV + 1; }

  function x(t) { return padL + (t - tMin) / (tMax - tMin) * plotW; }
  function yTemp(v) { return padT + plotH - (v - tMinV) / (tMaxV - tMinV) * plotH; }
  function yDuty(d) { return padT + plotH - d * plotH; }

  drawYAxis(g, yTemp, tMinV, tMaxV);
  ctx.fillStyle = muted; ctx.font = '10px sans-serif';
  ctx.fillText(fmtDutyPct(1), cssW - padR + 4, padT + 8);
  ctx.fillText(fmtDutyPct(0), cssW - padR + 4, padT + plotH);
  drawDutyAxisLabel(g);

  // Whole-kiln average duty (2026-09-02 follow-up, owner: "insted of showing
  // zone 0 duty on the screen i want to see the duty of the whole kiln on
  // the graph example (duty0+duty1+duty2+duty3)/zones"). Previously this
  // traced ONE representative zone's own commanded duty (repZone, defaulting
  // to zone 0 whenever no run was active to pick a representative from --
  // exactly the "zone 0 duty" the owner is describing). Now it averages
  // every zone actually in the run's zone_mask, recorded firmware-side for
  // the whole run (r.zoneDuty[hzi], history.csv) so this still survives
  // reload same as before -- topped up with firingDutySeries (client-
  // collected from /api/profile_exec, itself now averaged the same way, see
  // sampleFiringZoneTemps) for the gap between history.csv's 15s poll and
  // now. Continuous (not the autotune chart's stepped rendering): PID/
  // BANGBANG duty output is genuinely continuous, unlike autotune's
  // deliberately-held step-test duty.
  //
  // 2026-09-02 fix (opus review of 3f9b1a9/2a8ff7e): EACH row uses its OWN
  // r.zoneMask, not a single lastExecStatus.zone_mask shared across every
  // row. The executor's current-run mask is 0 whenever idle (profile_
  // executor_status.c only fills zone_mask while state != IDLE), so masking
  // every historical row with it divided by zero and NaN'd out the whole
  // duty trace the instant no run was active -- and a row sampled during a
  // PREVIOUS run got averaged against whatever mask the CURRENT run
  // happens to have, not the mask that was actually in effect when that
  // row was recorded. r.zoneMask (parseHistoryCsv, from history.csv's
  // trailing column) is the mask the firmware captured at sample time, so
  // this is correct both while idle and across a ring that spans more than
  // one run.
  var dutyLabel = 'whole-kiln avg duty';
  var dutyPts = rows.map(function (r) {
    return { t: r.t, duty: avgMaskedDuty(r.zoneDuty, r.zoneMask, popcount8(r.zoneMask)) };
  });
  var lastDutyT = dutyPts.length ? dutyPts[dutyPts.length - 1].t : -Infinity;
  firingDutySeries.forEach(function (p) { if (p.t > lastDutyT) dutyPts.push({ t: p.t, duty: p.duty }); });
  ctx.beginPath();
  var dStarted = false;
  dutyPts.forEach(function (p) {
    if (isNaN(p.duty)) { dStarted = false; return; }
    var px = x(p.t), py = yDuty(p.duty);
    if (!dStarted) { ctx.moveTo(px, py); dStarted = true; } else { ctx.lineTo(px, py); }
  });
  ctx.strokeStyle = SERIES_COLORS.duty; ctx.lineWidth = 1.5; ctx.stroke();

  // Per-zone temperature traces (2026-09-01 follow-up). Thinner than the
  // non-zone series (1.3 vs 1.5) DELIBERATELY: tonight's real run has all
  // three zones tracking within a few degrees of each other (targets
  // 45C/60C, zones starting within ~7C of one another), which is exactly
  // the case a thick line width turns into one indistinguishable band --
  // colour separation (chColor, the same mapping the channel list/idle
  // dots/autotune chart use) plus a slightly thinner stroke keeps close
  // lines readable as separate lines instead of merging visually.
  var zoneItems = [];
  // Bug 2 above: a legend row only belongs here if the line actually drew
  // something -- `pts.length > 0` is not that test, since every point can
  // still be NaN (checked via `.some`, not just presence of the array).
  function drawZoneLine(zi, pts, label) {
    if (!pts.some(function (p) { return !isNaN(p.c); })) return;
    ctx.beginPath();
    var started = false;
    pts.forEach(function (p) {
      if (isNaN(p.c)) { started = false; return; }
      var px = x(p.t), py = yTemp(p.c);
      if (!started) { ctx.moveTo(px, py); started = true; } else { ctx.lineTo(px, py); }
    });
    ctx.strokeStyle = chColor(zi); ctx.lineWidth = 1.3; ctx.stroke();
    zoneItems.push({ color: chColor(zi), label: label });
  }
  // history.csv now carries every zone for the whole run -- draw each zone
  // the CURRENT run actually has in its zone_mask straight from `rows`,
  // topped up with firingZoneSeries' more recent client-collected points
  // (the gap between history.csv's 15s poll and now) rather than relying on
  // firingZoneSeries as the only source for every non-representative zone.
  if (lastExecStatus) {
    var mask = lastExecStatus.zone_mask;
    for (var hzi = 0; hzi < HISTORY_ZONE_COUNT; hzi++) {
      if (!(mask & (1 << hzi))) continue; // not part of this run
      var zpts = rows.map(function (r) { return { t: r.t, c: r.zoneActual[hzi] }; });
      var lastZoneT = zpts.length ? zpts[zpts.length - 1].t : -Infinity;
      (firingZoneSeries[hzi] || []).forEach(function (p) { if (p.t > lastZoneT) zpts.push(p); });
      var label = zoneName(hzi) + (hzi === repZone ? ' (recorded, survives reload)' : '');
      drawZoneLine(hzi, zpts, label);
    }
  } else {
    // No exec status yet to say which zones are in this run (a fetch
    // failure raced this draw) -- still show SOMETHING rather than a blank
    // chart, generically labelled since the real zone identity is unknown
    // this tick.
    drawZoneLine(0, rows.map(function (r) { return { t: r.t, c: r.zoneActual[0] }; }), 'actual');
  }

  // The single target series ("planned"), drawn last so it sits on top of
  // the solid duty/zone lines it may cross:
  //
  //   solid  over [tMin .. last recorded sample] -- r.target, the setpoint
  //          the executor really commanded at each of those samples. This is
  //          what the old grey "desired" line drew, and it is kept rather
  //          than replaced by the idealised plan because the two genuinely
  //          differ whenever ramp-lock holds the commanded setpoint behind
  //          the profile; the chart must show the target that was actually
  //          in force at time t, not the one the profile wished for.
  //   dashed from that last recorded point onward through the plan's future
  //          points -- the preview. It starts at the recorded point, not at
  //          the plan's own value for "now", so any ramp-lock lag shows up
  //          as the visible offset it is instead of a silent jump.
  //
  // Straight lines between consecutive plan points, per the API's own
  // contract ("Straight lines between consecutive points is the correct
  // rendering").
  var lastTargetPt = null;
  ctx.beginPath();
  var tStarted = false;
  rows.forEach(function (r) {
    if (isNaN(r.target)) { tStarted = false; return; }
    var px = x(r.t), py = yTemp(r.target);
    if (!tStarted) { ctx.moveTo(px, py); tStarted = true; } else { ctx.lineTo(px, py); }
    lastTargetPt = { t: r.t, c: r.target };
  });
  ctx.strokeStyle = SERIES_COLORS.plan; ctx.lineWidth = 1.5; ctx.stroke();

  var futurePts = planPts.filter(function (p) {
    return !lastTargetPt || p.t > lastTargetPt.t;
  });
  var planShown = futurePts.length > 0;
  if (planShown) {
    var seq = lastTargetPt ? [lastTargetPt].concat(futurePts) : futurePts;
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = SERIES_COLORS.plan; ctx.lineWidth = 1.5;
    ctx.beginPath();
    seq.forEach(function (p, i) {
      var ppx = x(p.t), ppy = yTemp(p.c);
      if (i === 0) ctx.moveTo(ppx, ppy); else ctx.lineTo(ppx, ppy);
    });
    ctx.stroke();
    ctx.restore();
  }

  // A guard trip on ANY zone marks the timeline -- guard is now per-zone
  // (r.zoneGuard[]), not one whole-kiln value, since a per-zone guard trip
  // (guards 1/2/4/7, profile_executor.h) drops only that zone while the run
  // continues for the rest.
  function rowHasGuardTrip(r) { return r.zoneGuard.some(function (gv) { return gv && gv !== 0; }); }
  rows.forEach(function (r) {
    if (rowHasGuardTrip(r)) {
      var px = x(r.t);
      ctx.strokeStyle = SERIES_COLORS.guard; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(px, padT); ctx.lineTo(px, padT + plotH); ctx.stroke();
    }
  });

  var guardShown = rows.some(rowHasGuardTrip);
  drawChartAxis(g, x, yTemp, tMin, tMax);
  if (belowFreezing) drawFreezingRef(g, yTemp, tMinV, tMaxV);

  renderChartMeta('running', {
    tMin: tMin, actualMaxT: actualMaxT, zoneItems: zoneItems, dutyLabel: dutyLabel,
    // No opts.partialZoneSeries here (2026-09-01): every zone's full-run
    // trace now comes from `rows` itself, so there is no "lost on reload"
    // case left to flag for the firing chart -- see the doc comment where
    // firingZoneSeries is built.
    totalPlannedS: (activePlan && activePlan.total_planned_s !== undefined) ? activePlan.total_planned_s : null,
    planShown: planShown, guardShown: guardShown,
    freezingShown: belowFreezing, faultColor: g.fault,
  });
}

// Draws the run-trend view -- but only while that IS the current view.
// Owner report, 2026-09-27 ("i perodicly see a profile flash on the graph
// even though there is nothing running"): this used to draw
// unconditionally, and it runs on a bare setInterval(pollHistory, 15000)
// below, plus the kcunitchange/resize/setActivePlanFor paths. The history
// ring (profile_executor's s_exec.history) is cleared only when a NEW run
// starts, so after an operator Stop (state back to 'idle') every 15 s tick
// repainted the whole finished run plus its plan curve over the idle dots
// until poll()'s next 2 s tick put the dots back -- the periodic flash.
// Checked both before the fetch (no pointless request) and again when it
// lands (the state may have changed while it was in flight).
function pollHistory() {
  if (currentChartView(lastExecStatus, lastAutotuneStatus) !== 'history') return;
  fetch('/api/history.csv').then(function (r) { return r.text(); }).then(function (text) {
    if (currentChartView(lastExecStatus, lastAutotuneStatus) !== 'history') return;
    drawHistoryChart(parseHistoryCsv(text));
  }).catch(function () {});
}

// PID_EXPANSION_PLAN.md Phase 7b: live autotune trace drawn on the SAME
// canvas as the run chart / idle dots, entirely client-side -- /api/autotune
// and /api/autotune/trace.csv already existed, both are polled far below
// their own rate limits (see pollAutotune()'s comment), and no firmware
// buffer grew for this. States named per autotune_engine_state_t
// (dashboard_json.c's autotune_state_name(), read from the enum rather than
// assumed): idle/settling/stepping/relay_approach/relay_cycling/done/
// aborted. "probe"/"identify" are target mode's two STEPPING sub-phases --
// distinguishable via the separate "sub_phase" field dashboard_json.c now
// reports (added rather than changing "state" itself, which PcTools and this
// page's own isAutotuneActive() below still match literally).
var AUTOTUNE_PHASE_LABEL = {
  settling: 'settling (baseline hold)', stepping: 'stepping (recording trace)',
  relay_approach: 'relay approach (driving to setpoint)', relay_cycling: 'relay cycling (recording trace)',
  done: 'done', aborted: 'ABORTED',
};
var AUTOTUNE_SUB_PHASE_LABEL = {
  probe: 'probing (rough gain estimate)', identify: 'identifying (recording trace)',
};

// True for exactly the states an autotune run is actively driving relays
// and recording -- shared by updateChartMode's mode switch and the
// client-side sampling below so both agree on "is a run live" the same way.
function isAutotuneActive(state) {
  return state === 'settling' || state === 'stepping' ||
    state === 'relay_approach' || state === 'relay_cycling';
}

// ---------------------------------------------------------------------------
// Client-side multi-zone trace (2026-08-31 follow-up, owner: "if the
// autotune trace is the zone 0 real temp then the other zones should also
// leave a trace, instead of the dots"). /api/autotune/trace.csv only ever
// records the ONE zone under test (autotune_engine.c drives/samples a
// single zone at a time) -- there is no server-side history for the other
// zones' temperatures during a run. But cross-zone coupling on this board
// is real and large (5-12 C/duty measured) -- a single-zone step test
// visibly warms its neighbours, and THAT is diagnostic: it is the coupling
// being measured, not noise. So the other zones' traces are built
// client-side from the SAME /api/status channel readings the idle dots and
// channel cards already use, sampled once per poll() tick while a run is
// active.
//
// Keyed by channel index; the zone actually under test is deliberately NOT
// collected here -- autotuneTrace (the parsed trace.csv) is already its own
// authoritative, device-sampled record, and duplicating it client-side at a
// different (2s vs. the device's 10s) cadence would just be two competing,
// slightly-disagreeing lines for the same zone.
var autotuneZoneSeries = {};
// The duty the autotune engine actually commanded, as a piecewise-constant
// (stepped) series -- "what was intended/commanded", the other half of the
// "intended vs actual" the owner asked for alongside the temperature trace.
// One point per pollAutotune() tick (10s, matches AUTOTUNE_ENGINE_SAMPLE_
// PERIOD_S -- duty cannot change faster than the engine's own control loop
// samples it, so there is nothing to gain from sampling this any faster).
var autotuneDutySeries = [];
// Which zone the CURRENT contents of the two arrays above belong to, so a
// new run (same or different zone) is detected and the stale arrays are
// cleared instead of splicing a new run's points onto the tail of the
// previous one's.
var autotuneSeriesZone = null;
var wasAutotuneActive = false;

// Bounded, per the "do not grow an array forever across a 4h run"
// requirement. CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S decimates the raw 2s
// poll cadence down to one point every 5s per zone -- denser than the
// tested zone's own 10s device trace (so the coupling curves still read as
// smooth), while a 4h run only ever produces 4*3600/5 = 2880 points per
// zone, comfortably under the MAX_POINTS ring cap below (which exists as a
// hard backstop, not the normal exit path). Each {t,c}/{t,duty} point is a
// tiny JS object (two numbers) -- at the cap, 3000 points * 2 series-ish
// arrays * up to MAX31856_CHANNEL_COUNT zones is on the order of a few
// hundred KB in the tab's heap, nowhere near a concern for a page that
// already keeps a 2880-row history.csv-derived array in the running-chart
// path.
var CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S = 5;
var CLIENT_SERIES_MAX_POINTS = 3000;

function pushCappedPoint(arr, point) {
  arr.push(point);
  if (arr.length > CLIENT_SERIES_MAX_POINTS) arr.shift();
}

// Client-clock estimate of the autotune run's own elapsed_s, between
// /api/autotune polls (10s apart) -- self-corrects every time pollAutotune()
// lands a fresh st.elapsed_s, so drift never accumulates past one poll
// interval. Used only to place the OTHER zones' 2s-cadence samples on the
// same time axis as the tested zone's device-reported elapsed_s; the tested
// zone's own trace never uses this (it has real elapsed_s per sample from
// trace.csv).
var lastAutotuneStatusFetchedAtMs = 0;
function estimateAutotuneElapsedS() {
  if (!lastAutotuneStatus) return null;
  var sinceFetchS = Math.max(0, (Date.now() - lastAutotuneStatusFetchedAtMs) / 1000);
  return (lastAutotuneStatus.elapsed_s || 0) + sinceFetchS;
}

// Called from poll()'s /api/status handler (2s cadence) with the just-
// fetched channel data. A no-op whenever no autotune is actively running --
// deliberately checked against isAutotuneActive(), not just "state exists",
// so this never accumulates points for an idle board or a long-finished
// run sitting in DONE/ABORTED.
function sampleAutotuneZoneTemps(data) {
  if (!lastAutotuneStatus || !isAutotuneActive(lastAutotuneStatus.state)) return;
  if (!data || !data.thermo_ready || !data.channels) return;
  var t = estimateAutotuneElapsedS();
  if (t === null) return;
  var testedZone = lastAutotuneStatus.zone;
  data.channels.forEach(function (ch) {
    if (!ch.valid || ch.spi_failed || ch.channel === testedZone) return;
    var arr = autotuneZoneSeries[ch.channel];
    if (!arr) { arr = autotuneZoneSeries[ch.channel] = []; }
    var last = arr[arr.length - 1];
    if (last && (t - last.t) < CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S) return;
    pushCappedPoint(arr, { t: t, c: ch.temp_c });
  });
}

// ---------------------------------------------------------------------------
// 2026-09-01 follow-up (owner, tested live against a running three-zone
// firing, profile 7): "i am still only seeing one zone on the web graph".
// This originally got the client-side-accumulation treatment described
// below -- history.csv only had one representative zone's actual and one
// whole-kiln-aggregate duty, so every other zone's trace lived only in this
// tab. That was later fixed at the SOURCE instead (see drawHistoryChart's
// own 2026-09-01 doc comment): the firmware ring buffer now records every
// zone, so history.csv carries every zone's trace and survives a reload.
// 2026-09-02 correction (owner policy, opus review of 3f9b1a9/2a8ff7e): this
// is NOT "the full-run trace" for a firing longer than the ring's own
// window (HISTORY_MAX_SAMPLES * HISTORY_SAMPLE_PERIOD_S, ~5h20m at the
// current firmware sizing -- profile_executor.h) -- the ring is a display
// buffer, not a durable firing record, and its early samples fall off the
// back as a longer firing keeps sampling. firingZoneSeries/firingDutySeries
// below are kept, but now only as a freshness top-up for the gap between
// history.csv's 15s poll and "now" (drawHistoryChart merges them in),
// rather than the only copy of a non-representative zone's data.
function isFiringActive(state) {
  return state === 'running' || state === 'paused';
}

// Mirrors profile_executor.h's own "the lowest-indexed active zone in the
// run's zone_mask" rule for HISTORY_SAMPLE_PERIOD_S's ring buffer -- MUST
// stay in sync with that rule, not an independent guess, or this page's
// "which zone is history.csv actually showing" would silently disagree with
// the firmware's own answer. -1 if no bit is set (idle/no run).
function zoneMaskLowestBit(mask) {
  for (var b = 0; b < 8; b++) { if (mask & (1 << b)) return b; }
  return -1;
}

// Count of set bits in a zone_mask -- the "how many zones are actually in
// this run" divisor for the whole-kiln average duty trace (2026-09-02,
// owner: "(duty0+duty1+duty2+duty3)/zones"). Mirrors the same zone_mask
// notion zoneMaskLowestBit()/drawHistoryChart's per-zone loop already use,
// not an independent "3 zones" or "4 zones" guess -- a zone not set in the
// mask (not configured, or not part of THIS run) must not participate in
// either the sum or the divisor.
function popcount8(mask) {
  var n = 0;
  for (var b = 0; b < 8; b++) { if (mask & (1 << b)) n++; }
  return n;
}

// Mean of dutyArr[hzi] across every bit set in mask (history.csv row shape:
// dutyArr indexed 0..HISTORY_ZONE_COUNT-1, same as r.zoneDuty). zoneCount is
// popcount8(mask), passed in only to short-circuit an empty mask -- it is
// NOT the divisor (see 2026-09-02 fix below). Returns NaN when there is
// nothing to average (no active zones, or every masked zone's duty this row
// is itself NaN) so the trace breaks/gaps exactly like a single-zone NaN
// used to, rather than silently plotting a false 0.
//
// 2026-09-02 fix (opus review of 3f9b1a9/2a8ff7e): the divisor is `n`, the
// count of masked zones that actually HAD a value this row, not zoneCount
// (the full mask popcount). The commit that introduced this function
// claimed dividing by the full popcount was what kept a missing sample from
// skewing the average -- backwards: dividing a partial sum by the FULL zone
// count is exactly what drags the average toward zero every time one
// in-mask zone's reading is momentarily NaN (a fault, a stale-read gap),
// even though the other zones' duty didn't change. Dividing by n -- the
// zones that actually contributed -- reports the true mean of the zones
// with data this tick, and only degrades to NaN (a visible gap) when NONE
// of them do.
function avgMaskedDuty(dutyArr, mask, zoneCount) {
  if (zoneCount <= 0) return NaN;
  var sum = 0, n = 0;
  for (var hzi = 0; hzi < HISTORY_ZONE_COUNT; hzi++) {
    if (!(mask & (1 << hzi))) continue;
    var d = dutyArr[hzi];
    if (isNaN(d)) continue;
    sum += d; n++;
  }
  return n > 0 ? (sum / n) : NaN;
}

// Client-collected TOP-UP traces (2026-09-01: history.csv now records every
// zone for the whole run, see drawHistoryChart's own doc comment -- this is
// no longer the only source for a non-representative zone, just the bridge
// between history.csv's 15s poll and now). Keyed by channel index, same
// shape and same CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S/CLIENT_SERIES_MAX_POINTS
// bounds as autotuneZoneSeries -- see that constant's own doc comment for
// the memory-cost arithmetic, which applies identically here.
var firingZoneSeries = {};
// Per-zone duty TOP-UP for the representative zone ONLY, not all three --
// /api/profile_exec exposes per-zone duty (profile_exec_zone_status_t::
// duty) and drawing all three zones' duty was tried, but with three
// temperature lines already sitting close together (a few degrees apart,
// per the owner's own numbers) three more duty lines was real clutter, not
// signal, on one canvas. The representative zone's own duty is drawn from
// history.csv for the whole run (drawHistoryChart), topped up here with the
// gap since the last poll -- see that same reasoning for why one zone's
// duty, not all three. If a future request wants all three zones' duty, the
// natural extension is a per-zone toggle in the legend rather than always
// drawing three more lines by default.
var firingDutySeries = [];
// Which zone_mask the two arrays above were collected for -- a changed
// mask (a different run, even one that happens to start immediately after
// the last one ended) means stale data, not a continuation.
var firingSeriesZoneMask = null;
var wasFiringActive = false;

// Called from poll()'s consolidated /api/status + /api/profile_exec handler
// (2s cadence, both already fetched together -- see poll()'s own comment)
// with that tick's channel data and exec status. total_elapsed_s comes
// straight from st (profile_exec_status_t's own real-seconds-since-start
// field, see profile_executor.h) -- unlike the autotune case, no client-
// clock interpolation is needed here because BOTH endpoints this function
// needs are fetched in the same tick, not on independent cadences.
function sampleFiringZoneTemps(data, st) {
  if (!st || !isFiringActive(st.state)) return;
  if (!data || !data.thermo_ready || !data.channels) return;
  var repZone = zoneMaskLowestBit(st.zone_mask);
  var t = st.total_elapsed_s || 0;
  data.channels.forEach(function (ch) {
    if (!ch.valid || ch.spi_failed || ch.channel === repZone) return;
    var arr = firingZoneSeries[ch.channel];
    if (!arr) { arr = firingZoneSeries[ch.channel] = []; }
    var last = arr[arr.length - 1];
    if (last && (t - last.t) < CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S) return;
    pushCappedPoint(arr, { t: t, c: ch.temp_c });
  });
  // Whole-kiln average duty top-up (2026-09-02, same change as
  // drawHistoryChart's dutyPts above) -- average every zone /api/profile_exec
  // reports active (st.zones only ever contains active zones, see
  // append_zone_status_json()) that is also set in st.zone_mask, divided by
  // the mask's popcount, not just the one representative zone's own duty.
  var zoneCount = popcount8(st.zone_mask);
  if (zoneCount > 0) {
    var activeZones = (st.zones || []).filter(function (z) {
      return st.zone_mask & (1 << z.zone);
    });
    if (activeZones.length) {
      var dlast = firingDutySeries[firingDutySeries.length - 1];
      if (!dlast || (t - dlast.t) >= CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S) {
        var dutySum = activeZones.reduce(function (acc, z) { return acc + z.duty; }, 0);
        pushCappedPoint(firingDutySeries, { t: t, duty: dutySum / zoneCount });
      }
    }
  }
}

// trace is the parsed /api/autotune/trace.csv (elapsed_s from autotune
// start, not from any firing profile) -- the TESTED zone's own authoritative
// record. autotuneZoneSeries (module-level, above) supplies the other
// zones' client-collected traces on the same time axis, and
// autotuneDutySeries supplies the commanded-duty step line. The
// planned-profile overlay reuses whatever `activePlan` the picker/idle-
// preview machinery already has selected (see fetchPlan/setActivePlanFor
// above) -- it is drawn dashed and CLIPPED to the trace's own elapsed window
// rather than stretching the axis out to the plan's full length, which for
// a multi-hour firing profile would squash a 10-20 minute autotune trace
// into a sliver. Kept even with three zones now on screen: it is a single
// distinct dashed purple line, visually unlike any of the solid per-zone
// colours, and an operator who ran a step test to prepare for a specific
// profile still benefits from seeing that profile's own curve for
// reference -- it was judged not to add clutter, only one more line.
function drawAutotuneChart(st, trace) {
  var g = setupChart();
  if (!g) return;
  var ctx = g.ctx;
  var tMin = 0;
  var tMax = Math.max(st.elapsed_s || 0, trace.length ? trace[trace.length - 1].t : 0, 60);
  Object.keys(autotuneZoneSeries).forEach(function (zi) {
    var arr = autotuneZoneSeries[zi];
    if (arr.length) tMax = Math.max(tMax, arr[arr.length - 1].t);
  });
  if (autotuneDutySeries.length) {
    tMax = Math.max(tMax, autotuneDutySeries[autotuneDutySeries.length - 1].t);
  }

  var planPts = ((activePlan && activePlan.points) || []).filter(function (p) { return p.t <= tMax; });

  var tempVals = trace.map(function (p) { return p.c; });
  if (st.actual_valid) tempVals.push(st.actual_c);
  planPts.forEach(function (p) { tempVals.push(p.c); });
  var partialZoneSeries = false;
  Object.keys(autotuneZoneSeries).forEach(function (zi) {
    var arr = autotuneZoneSeries[zi];
    arr.forEach(function (p) { tempVals.push(p.c); });
    // A collected series that starts well after tMin means this page was
    // (re)loaded after the run was already underway -- see this function's
    // header comment and renderChartMeta's own doc comment on
    // opts.partialZoneSeries for why that is surfaced rather than silently
    // drawn as if it were the whole run.
    if (arr.length && arr[0].t > tMin + CLIENT_ZONE_SAMPLE_MIN_INTERVAL_S * 2) partialZoneSeries = true;
  });
  var minV = tempVals.length ? Math.min.apply(null, tempVals) : 0;
  var maxV = tempVals.length ? Math.max.apply(null, tempVals) : 1;
  if (maxV === minV) maxV = minV + 1;
  minV -= (maxV - minV) * 0.05; maxV += (maxV - minV) * 0.05;
  var belowFreezing = trace.some(function (p) { return p.c < CHART_FREEZING_C; });
  if (!belowFreezing) { minV = Math.max(minV, CHART_FREEZING_C); if (maxV <= minV) maxV = minV + 1; }

  function x(t) { return g.padL + (t - tMin) / (tMax - tMin) * g.plotW; }
  function yTemp(v) { return g.padT + g.plotH - (v - minV) / (maxV - minV) * g.plotH; }
  // Secondary axis, right side, FIXED 0..1 range (0-100%) regardless of the
  // temperature range -- duty is not a temperature and must never share its
  // scale, same reasoning the running chart's own yDuty() already applies.
  function yDuty(d) { return g.padT + g.plotH - d * g.plotH; }

  drawYAxis(g, yTemp, minV, maxV);
  ctx.fillStyle = g.muted; ctx.font = '10px sans-serif';
  ctx.fillText(fmtDutyPct(1), g.cssW - g.padR + 4, g.padT + 8);
  ctx.fillText(fmtDutyPct(0), g.cssW - g.padR + 4, g.padT + g.plotH);
  drawDutyAxisLabel(g);

  if (planPts.length) {
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = SERIES_COLORS.plan; ctx.lineWidth = 1.5;
    ctx.beginPath();
    planPts.forEach(function (p, i) {
      var px = x(p.t), py = yTemp(p.c);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.stroke();
    ctx.restore();
  }

  // Commanded duty FIRST (drawn under the temperature traces): piecewise
  // CONSTANT, not interpolated -- the engine holds one duty value between
  // samples, so each segment is drawn as a horizontal hold at the OLD value
  // followed by a vertical jump to the new one at the sample where it
  // changed, the standard "step" rendering, extended flat out to `now`
  // (tMax) so the line always reaches the right edge of whatever's plotted.
  if (autotuneDutySeries.length) {
    ctx.beginPath();
    ctx.strokeStyle = SERIES_COLORS.duty; ctx.lineWidth = 1.5;
    var dx0 = x(autotuneDutySeries[0].t), dy0 = yDuty(autotuneDutySeries[0].duty);
    ctx.moveTo(dx0, dy0);
    for (var di = 1; di < autotuneDutySeries.length; di++) {
      var prevY = yDuty(autotuneDutySeries[di - 1].duty);
      var curX = x(autotuneDutySeries[di].t), curY = yDuty(autotuneDutySeries[di].duty);
      ctx.lineTo(curX, prevY); // hold at the previous value up to this sample's time
      ctx.lineTo(curX, curY);  // then jump to the new value
    }
    var lastD = autotuneDutySeries[autotuneDutySeries.length - 1];
    ctx.lineTo(x(tMax), yDuty(lastD.duty)); // extend the final hold out to now
    ctx.stroke();
  }

  // Per-zone temperature traces, one legend row each -- the tested zone uses
  // its trace.csv record (device-sampled, authoritative); every other ACTIVE
  // zone uses its client-collected autotuneZoneSeries entry, drawn only over
  // the span actually collected (see partialZoneSeries above -- never
  // backfilled to tMin). Colour is chColor(zone index), the SAME mapping
  // the channel list and idle dots already use, so a zone reads as one
  // consistent colour everywhere on this page.
  var zoneItems = [];
  function drawZoneTrace(zi, pts, label) {
    if (!pts.length) return;
    ctx.beginPath();
    pts.forEach(function (p, i) {
      var px = x(p.t), py = yTemp(p.c);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    ctx.strokeStyle = chColor(zi); ctx.lineWidth = 1.5; ctx.stroke();
    zoneItems.push({ color: chColor(zi), label: label });
  }
  drawZoneTrace(st.zone, trace, zoneName(st.zone) + ' (under test)');
  Object.keys(autotuneZoneSeries).forEach(function (ziStr) {
    var zi = Number(ziStr);
    drawZoneTrace(zi, autotuneZoneSeries[zi], zoneName(zi) + ' (coupling)');
  });

  drawChartAxis(g, x, yTemp, tMin, tMax);
  if (belowFreezing) drawFreezingRef(g, yTemp, minV, maxV);

  renderChartMeta('autotune', {
    st: st, planShown: planPts.length >= 2, zoneItems: zoneItems,
    partialZoneSeries: partialZoneSeries,
    freezingShown: belowFreezing, faultColor: g.fault,
  });
}

// Chart mode switch: the user's actual request ("the current temps should
// just show as dots ... until the profile is started") means the chart is
// two different visuals sharing one canvas, not one dataset with an empty
// state. /api/profile_exec's st.state is the same idle/running/paused/
// faulted/done value renderExec() already switches on to show/hide the
// picker vs. the exec card -- reusing it here (rather than e.g. inferring
// "running" from history.csv row count) keeps both switches on the same
// source of truth, so they can never disagree about whether a firing is
// live. wasIdle tracks the previous call so a fresh idle->running
// transition repaints the trend chart immediately instead of waiting up to
// 15s for pollHistory's own interval.
//
// Phase 7b: an in-progress autotune (state not idle/done/aborted) takes
// priority over both -- it is the more urgent "what is happening" view, the
// same reasoning renderChartMeta's banners elsewhere on this page already
// follow. A DONE/ABORTED result stays showing too ("leave the trace and the
// outcome visible... rather than blanking it") but ONLY while no firing
// profile is actually running -- an autotune result from earlier tonight
// must not eclipse a live firing that started since. lastExecStatus is
// cached so pollAutotune's own (slower, 10s) tick can re-run this same
// decision without waiting on the 2s /api/status/profile_exec tick, and so
// a caller (like pollAutotune) that has no fresher `st` of its own can pass
// nothing and get the last-known one back.
//
// 2026-08-31 follow-up ("it glitches back and forth between the 3 dots and
// the trace"): this function is now THE ONLY place on the page that decides
// which chart view to show and draws it. Before this fix, poll()'s own
// /api/status handler ALSO drew directly (an unconditional drawIdleDots()
// whenever wasIdle was true, with no idea an autotune could be active) in
// addition to this function being called separately from pollExec()'s
// /api/profile_exec resolution -- two independent async fetches, each
// firing this same 2s tick, one of which used a completely different (and
// wrong -- it never checked autotune state at all) decision than this
// function. Whichever of the two HTTP responses happened to land last for a
// given tick decided what was on screen, so the view alternated between the
// idle dots and the autotune trace essentially at random, exactly the
// symptom reported. The fix is not a timing tweak (equalizing intervals
// would only make the race rarer, not gone) -- it's this: ONE decision
// function, fed by state that's already been merged (poll() below now
// gathers /api/status and /api/profile_exec via Promise.all before calling
// this once), plus every other trigger (pollAutotune's own slower tick, the
// manual pollExec() after a Start-firing click) routing through this exact
// same function instead of drawing anything themselves.
var wasIdle = true;
var lastExecStatus = null;
// Which of the three chart views the cached exec/autotune state calls for:
// 'autotune', 'idle' (live dots + plan preview) or 'history' (the run
// trend). Shared by updateChartMode() and pollHistory() so the 15 s
// history refresh can never paint the trend view over the idle dots or
// the autotune trace (see pollHistory()'s own comment).
function currentChartView(execSt, atSt) {
  var idleNow = !execSt || execSt.state === 'idle';
  var atState = atSt && atSt.state;
  if (isAutotuneActive(atState) || ((atState === 'done' || atState === 'aborted') && idleNow)) {
    return 'autotune';
  }
  return idleNow ? 'idle' : 'history';
}
function updateChartMode(st) {
  if (st) { lastExecStatus = st; }
  st = lastExecStatus;
  var idleNow = !st || st.state === 'idle';
  var view = currentChartView(st, lastAutotuneStatus);
  if (view === 'autotune') {
    drawAutotuneChart(lastAutotuneStatus, autotuneTrace);
  } else if (view === 'idle') {
    drawIdleDots(lastChannelsData);
  } else if (wasIdle) {
    pollHistory();
  }
  wasIdle = idleNow;
}

// Owner report, 2026-09-27: "i perodicly see a profile flash on the graph
// even though there is nothing running. i would like to see the last
// profile there untill i start or select another." Two separate causes:
//   1. The PERIODIC flash: pollHistory() repainting the finished run's
//      trend over the idle dots every 15 s -- fixed there (see its own
//      comment).
//   2. On an idle transition poll()/pollExec() used to call
//      `setActivePlanFor(sel.value)` -- whatever the <select> happened to
//      sit on, not the profile that had just run -- and page load did the
//      same, so the preview showed an arbitrary profile.
// For (2): a run ending no longer touches activePlan (the finished run's
// curve stays) and the picker is moved onto that profile so graph, picker
// and Run button agree. The "last relevant profile" (last one that ran or
// was explicitly picked, whichever is LATER) is persisted in localStorage
// with a wall-clock time (try/catch; degrades to nothing remembered) and
// on load is ordered against the board's own per-profile
// last_run_started_unix_s from GET /api/profiles -- so a run started from
// the LCD or UART while this page was closed beats an older selection.
// GET /api/profile_exec's `last_run` is only a last-resort fallback: it is
// run_state's BOOT record (the run in progress before the last reboot, or
// absent once acknowledged), not this boot's latest run, and carries no
// wall-clock time to order it by.
var LAST_PROFILE_STORAGE_KEY = 'kcLastPreviewedProfileId';
// Returns {id: string, t: ms since epoch} or undefined. A bare id string
// (this change's first cut stored one) reads as t = 0: "some time ago".
function getPersistedLastProfile() {
  try {
    var v = window.localStorage.getItem(LAST_PROFILE_STORAGE_KEY);
    if (v === null || v === '') return undefined;
    var o = null;
    try { o = JSON.parse(v); } catch (e) { o = null; }
    if (o && typeof o === 'object') {
      if (o.id === undefined || o.id === null || o.id === '') return undefined;
      return { id: String(o.id), t: Number(o.t) || 0 };
    }
    return { id: String(v), t: 0 };
  } catch (e) { return undefined; }
}
function setPersistedLastProfileId(id, nowMs) {
  try {
    if (id === undefined || id === null || id === '') {
      window.localStorage.removeItem(LAST_PROFILE_STORAGE_KEY);
    } else {
      window.localStorage.setItem(LAST_PROFILE_STORAGE_KEY, JSON.stringify({
        id: String(id), t: (typeof nowMs === 'number') ? nowMs : Date.now() }));
    }
  } catch (e) { /* private browsing / storage disabled -- fine to lose this */ }
}
// The most recently STARTED profile per the board's own records, as
// {id, t: ms}, or undefined (no list, or no SNTP time recorded yet: the
// firmware reports 0 rather than a fabricated time).
function newestFiredProfile(profiles) {
  var best;
  (profiles || []).forEach(function (p) {
    var s = Number(p && p.last_run_started_unix_s) || 0;
    if (s > 0 && (!best || s * 1000 > best.t)) best = { id: String(p.id), t: s * 1000 };
  });
  return best;
}
// Picks what the idle preview (and the picker) should show when nothing
// else has set it yet: page load, or the picker going from empty to
// populated after a login. `profiles` is the loaded GET /api/profiles list
// (empty/absent without a session); `execSt` the last /api/profile_exec.
function pickInitialProfileId(sel, execSt, profiles) {
  var haveList = Array.isArray(profiles) && profiles.length > 0;
  function known(id) {
    return !haveList || profiles.some(function (p) { return String(p.id) === id; });
  }
  var persisted = getPersistedLastProfile();
  if (persisted && !known(persisted.id)) persisted = undefined; // deleted since
  var fired = newestFiredProfile(profiles);
  if (persisted && fired) return (fired.t > persisted.t) ? fired.id : persisted.id;
  if (persisted) return persisted.id;
  if (fired) return fired.id;
  if (execSt && execSt.last_run && execSt.last_run.present &&
      known(String(execSt.last_run.profile_id))) {
    return String(execSt.last_run.profile_id);
  }
  return sel ? sel.value : undefined;
}
// Moves the (idle) picker onto `id` if it lists it, so the preview curve,
// the picker's label, the feasibility icons and the Run button all name the
// same profile. Returns whether it did.
function selectProfileInPicker(id) {
  var sel = document.getElementById('profileSelect');
  if (!sel || id === undefined || id === null || id === '') return false;
  var want = String(id);
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === want) {
      if (sel.value !== want) {
        sel.value = want;
        updateProfileFeasIcon();
        updateProfileLimitIcon();
      }
      return true;
    }
  }
  return false;
}
// Shared by poll() and pollExec(): exec state moved to/from idle. A run
// that ended leaves its curve on screen (activePlan already holds it).
function noteExecPlanChange(planId, idleNow) {
  if (idleNow) {
    if (lastExecPlanId !== undefined) {
      setPersistedLastProfileId(lastExecPlanId);
      selectProfileInPicker(lastExecPlanId);
    }
    lastExecPlanId = planId;
  } else {
    lastExecPlanId = planId;
    setActivePlanFor(planId);
    setPersistedLastProfileId(planId);
  }
}

// Tracks the profile id the running/paused/etc. plan curve was last fetched
// for, so a poll tick that reports the SAME run doesn't refetch/redraw every
// 2s -- only an actual change (new run started, or exec state going idle)
// re-triggers setActivePlanFor.
var lastExecPlanId = undefined;
function pollExec() {
  fetch('/api/profile_exec').then(function (r) { return r.json(); }).then(function (st) {
    renderExec(st);
    renderLastRun(st);
    renderProgress(st);
    renderLagBanner(st);
    var idleNow = !st || st.state === 'idle';
    var planId = idleNow ? undefined : st.profile_id;
    if (planId !== lastExecPlanId) noteExecPlanChange(planId, idleNow);
    updateChartMode(st);
  }).catch(function () {});
}

// PID_EXPANSION_PLAN.md Phase 7b: /api/autotune status + trace, polled
// independently of pollExec/poll since an autotune run has nothing to do
// with firing-profile execution state. lastAutotuneStatus feeds
// updateChartMode's mode switch; autotuneTrace is the parsed trace.csv,
// refetched only when the device's own sample_count has actually grown
// (matches the 10s AUTOTUNE_ENGINE_SAMPLE_PERIOD_S -- polling the CSV every
// 2-3s the way /api/status is polled would just be requesting the same rows
// over and over, a needless load on an httpd this board has run short of
// memory under before). autotuneLastFetchedCount resets to -1 whenever the
// device-side sample_count is seen to have DROPPED (a new run started and
// overwrote the trace ring), which both clears the stale trace and forces
// an immediate refetch.
var lastAutotuneStatus = null;
var autotuneTrace = [];
var autotuneLastFetchedCount = -1;
function pollAutotune() {
  fetch('/api/autotune').then(function (r) { return r.json(); }).then(function (st) {
    lastAutotuneStatus = st;
    lastAutotuneStatusFetchedAtMs = Date.now();
    // New-run detection for the client-side zone/duty series (autotuneTrace
    // above has its own, older reset via the sample_count-dropped check just
    // below -- this is the same idea applied to the two arrays this follow-
    // up added). Three independent triggers, any one of which means "these
    // arrays no longer describe the run that's either running now or about
    // to be": a fresh idle/done/aborted -> active transition, a report of a
    // different zone than the one these arrays were collected for (covers
    // the same-poll-tick case where sample_count hasn't visibly dropped
    // yet), and the pre-existing sample_count-dropped signal (a same-zone
    // re-run that overwrote the device's own trace ring).
    var active = isAutotuneActive(st.state);
    var newRun = (active && !wasAutotuneActive) || (st.zone !== autotuneSeriesZone) ||
      (st.sample_count < autotuneLastFetchedCount);
    if (newRun) {
      autotuneZoneSeries = {};
      autotuneDutySeries = [];
      autotuneSeriesZone = st.zone;
    }
    // Duty is recorded whenever a run is active, plus the ONE tick where it
    // just finished (so the stepped line closes out at its final value
    // instead of trailing off before the run's actual end).
    var justFinished = (st.state === 'done' || st.state === 'aborted') && wasAutotuneActive;
    if (active || justFinished) {
      pushCappedPoint(autotuneDutySeries, { t: st.elapsed_s || 0, duty: st.duty || 0 });
    }
    wasAutotuneActive = active;
    if (st.sample_count < autotuneLastFetchedCount) {
      autotuneTrace = [];
      autotuneLastFetchedCount = -1;
    }
    if (st.sample_count > 0 && st.sample_count !== autotuneLastFetchedCount) {
      fetch('/api/autotune/trace.csv').then(function (r) { return r.text(); }).then(function (text) {
        autotuneTrace = parseAutotuneTraceCsv(text);
        autotuneLastFetchedCount = st.sample_count;
        updateChartMode();
      }).catch(function () {});
    } else {
      updateChartMode();
    }
  }).catch(function () {});
}

// 2026-08-31 follow-up: /api/status and /api/profile_exec are now fetched
// together (Promise.all) and every render decision for this 2s tick,
// including the chart, happens in this ONE .then() -- see updateChartMode's
// own comment for the flapping bug this replaces (two independently-timed
// fetches, each deciding and drawing the chart on its own, whichever landed
// last for a given tick winning). A fetch failure degrades to null for that
// half of the pair (same catch-to-null convention every optional endpoint
// on this page already uses) rather than aborting the whole tick -- a
// status-only or exec-only hiccup still lets the other half's render run
// and still runs updateChartMode() once, off whatever is cached from the
// last successful fetch of the half that failed.
// RELAY_LIFE_BUDGET.md: shown PERSISTENTLY (never auto-hides
// itself back below the operator's attention once a tier is active) as long
// as relay_life_tier is warn/error. This is deliberate and DOES contradict
// this file's own pidPopupBumplessHazard() comment a few thousand lines up
// ("a warning that is always present is a warning nobody reads") -- that
// rule is right for a momentary, self-clearing condition an operator can
// act on and dismiss; relay contact wear only ever increases within a
// firing, so hiding it again before the underlying relay is replaced would
// just teach operators to ignore it at the moment it matters most. Do not
// "fix" this into an auto-hide without re-reading the plan.
function renderRelayLife(data) {
  var icon = document.getElementById('relayLifeIcon');
  if (!data || !data.relay_life || data.relay_life_tier === 'none' || !data.relay_life_tier) {
    icon.hidden = true;
    icon.classList.remove('feas-icon-warn', 'relay-life-error');
    return;
  }
  var worst = null;
  (data.relay_life || []).forEach(function (r) {
    if (r.tier === 'none') return;
    if (!worst || (r.percent || 0) > (worst.percent || 0)) worst = r;
  });
  if (!worst) {
    icon.hidden = true;
    icon.classList.remove('feas-icon-warn', 'relay-life-error');
    return;
  }
  var isError = data.relay_life_tier === 'error';
  icon.hidden = false;
  icon.classList.toggle('feas-icon-warn', !isError);
  icon.classList.toggle('relay-life-error', isError);
  icon.textContent = '⚠';
  var num = worst.relay + 1;
  var typeLabel = worst.type === 'contactor' ? 'contactor' : (worst.type === 'mercury' ? 'mercury' : worst.type);
  icon.title = 'Relay ' + num + ' (' + typeLabel + '): ' +
    (worst.percent != null ? worst.percent.toFixed(0) : '?') +
    ' % of rated life. Autotune relay identification switches faster than a firing and eats budget faster.';
}

function poll() {
  Promise.all([
    fetch('/api/status').then(function (r) { return r.json(); }).catch(function () { return null; }),
    fetch('/api/profile_exec').then(function (r) { return r.json(); }).catch(function () { return null; }),
  ]).then(function (results) {
    var data = results[0], st = results[1];
    if (data) {
      // 2026-08-21: keeps app.js's kcUnit cache current from the same
      // response this page already fetches for its own rendering -- no
      // second request just to learn the device's unit preference (see
      // app.js's own one-time-fetch fallback for pages that never poll
      // /api/status at all).
      window.kcUnit.updateFromStatus(data);
      // watchdog_cfg.h: cached here (not re-fetched on Start click) so the
      // extra firing confirmation below reads the same live snapshot every
      // other status-derived control on this page already uses.
      lastWatchdogPanicDisabled = !!data.watchdog_panic_disabled;
      renderChannels(data);
      renderRelayLife(data);
      renderSpiWedged(data);
      renderBootButtonBypass(data);
      renderZonesConfigLoadFault(data);
      renderZonesConfigMigrationPersistFault(data);
      renderKilnCfgSwapBootFault(data);
      renderSafetyTcReconfigGaveUp(data);
      renderSafetyGuardDisabledByZero(data);
      renderSafetyTrip(data);
      // Client-side multi-zone autotune trace sampling (see
      // sampleAutotuneZoneTemps's own header comment) -- a no-op whenever no
      // autotune is actively running.
      sampleAutotuneZoneTemps(data);
      // Same, generalised to a running/paused PROFILE FIRING (see
      // sampleFiringZoneTemps's own header comment) -- a no-op whenever no
      // firing is actively running. Needs `st` (zone_mask, total_elapsed_s,
      // per-zone duty) alongside `data` (channel temps), both already in
      // hand from this same Promise.all tick.
      sampleFiringZoneTemps(data, st);
    }
    if (st) {
      renderExec(st);
      renderLastRun(st);
      renderProgress(st);
      renderLagBanner(st, data);
      var idleNow = !st || st.state === 'idle';
      // New-run detection for the client-side firing series, same shape as
      // pollAutotune()'s own newRun check -- either a fresh idle/done/
      // faulted -> running transition, or a zone_mask that no longer
      // matches what firingZoneSeries/firingDutySeries were collected for
      // (a different run started with a different zone selection).
      var firingNowActive = isFiringActive(st.state);
      var firingNewRun = (firingNowActive && !wasFiringActive) ||
        (st.zone_mask !== firingSeriesZoneMask);
      if (firingNewRun) {
        firingZoneSeries = {};
        firingDutySeries = [];
        firingSeriesZoneMask = st.zone_mask;
      }
      wasFiringActive = firingNowActive;
      var planId = idleNow ? undefined : st.profile_id;
      // Same transition handling as pollExec() -- see noteExecPlanChange().
      if (planId !== lastExecPlanId) noteExecPlanChange(planId, idleNow);
    }
    // Idle dots are a LIVE temperature display (same data as the channel
    // cards above), so they need to refresh on this 2s status poll, not
    // history.csv's slower 15s one -- a firing that's still idle should show
    // the dots tracking the kiln cooling/heating ambient in real time. That
    // refresh, and every other chart-mode decision, now happens exactly
    // once here regardless of which of data/st came back.
    updateChartMode(st);
    // PID popup's own live actual/error display (see its own header
    // comment) -- a no-op whenever no popup is open.
    refreshPidPopupLive();
  });
  setTimeout(poll, 2000);
}

// Idle-preview: previewing the plan for whatever's picked (but not started)
// is a natural fit here since the picker sits right below the chart -- but
// it must never look like a run in progress. drawIdleDots() below labels it
// explicitly ("previewing plan — not started") and it only ever draws while
// wasIdle is true; the moment a run actually starts, pollExec's own
// lastExecPlanId switch takes over and the preview label goes away with it.
document.getElementById('profileSelect').addEventListener('change', function (e) {
  if (wasIdle) {
    setActivePlanFor(e.target.value);
    // An explicit pick is a "last relevant profile" event too -- record it
    // so it outranks whatever ran or was picked before it (see the
    // "Owner report, 2026-09-27" comment above pollExec()).
    setPersistedLastProfileId(e.target.value);
  }
  updateProfileFeasIcon();
  updateProfileLimitIcon();
});

function reloadAfterLoginPickers() {
  var sel = document.getElementById('profileSelect');
  var hadNoProfiles = sel && sel.options.length === 0;
  loadZones();
  loadProfileList().then(function () {
    if (!sel) return;
    // Only re-derive the active-plan preview/icons when the picker actually
    // went from empty to populated (or vice versa) -- an operator who has
    // already picked a profile and logged in for an unrelated reason (e.g.
    // the Run button's own 401) must not have that selection reset under
    // them.
    if (hadNoProfiles && wasIdle) {
      var id = pickInitialProfileId(sel, lastExecStatus, loadedProfileList);
      setActivePlanFor(id);
      selectProfileInPicker(id);
    }
    updateProfileFeasIcon();
    updateProfileLimitIcon();
  });
  loadKilnConfigIndicator();
}
// Owner ask, 2026-09-27: a fetch-once loader that swallowed a background 401
// (see #profilePickerStatus above) gets a chance to reload once a login
// succeeds ANYWHERE on the page -- app.js dispatches this event from the one
// choke point every successful login (401 retry or 403 role-elevate) passes
// through, so this listener need not special-case which action triggered it.
window.addEventListener('kc-login', reloadAfterLoginPickers);

loadZones().then(function () {
  loadProfileList().then(function () {
    var sel = document.getElementById('profileSelect');
    if (wasIdle && sel) {
      var id = pickInitialProfileId(sel, lastExecStatus, loadedProfileList);
      setActivePlanFor(id);
      selectProfileInPicker(id);
    }
    updateProfileFeasIcon();
    updateProfileLimitIcon();
  });
  loadKilnConfigIndicator();
  poll();
});
setInterval(pollHistory, 15000); // history only gains a new sample every 30s -- no need to poll faster
pollAutotune();
setInterval(pollAutotune, 10000); // matches AUTOTUNE_ENGINE_SAMPLE_PERIOD_S -- the trace can't move faster than that
window.addEventListener('resize', function () { if (wasIdle) { drawIdleDots(lastChannelsData); } else { pollHistory(); } });

// UI_PLAN.md item 7: re-render immediately on a °C/°F toggle instead of
// waiting out poll()'s own 2s interval -- re-uses the last payload each
// render function already cached rather than re-fetching from the board.
window.addEventListener('kcunitchange', function () {
  if (lastChannelsData) renderChannels(lastChannelsData);
  if (lastExecStData) { renderExec(lastExecStData); renderLastRun(lastExecStData); }
  pollHistory();
});

(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = isDark(t) ? '☀' : '🌙';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
