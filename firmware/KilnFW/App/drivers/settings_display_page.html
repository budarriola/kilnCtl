<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kilnCtl - Display Settings</title>
<link rel="stylesheet" href="/theme.css">
<script>(function(){var t=localStorage.getItem('kilnctl-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<!-- UI_PLAN.md "web page structure" section, item 2 twin: this page used to
     be the "Display" <h2> section of settings_page.html. Split out 2026-08-22
     (owner report: "both display theme and reset menu items take me to the
     same page" -- nav.js's menu has always had two separate entries, one for
     Display and one for Reset, but both pointed at /settings#display and
     /settings#danger, two anchors on the ONE settings page, so picking either
     menu item visibly landed on the same document; the two need to be
     genuinely different destinations, not two anchors on one). This page is
     now that destination for Display; settings_page.html keeps only the
     Danger zone and no longer needs an anchor of its own to disambiguate them.
     Same shared chrome as every other page (nav.js/app.js, sticky Stop +
     connection-lost banner + kcConfirm). -->
<script defer src="/nav.js"></script>
<script defer src="/app.js"></script>
<style>
  /* Page-local palette tokens only -- see settings_page.html's own comment on
     this same block for why it exists (every real rule lives in /theme.css;
     these are just the --bg/--fg/etc names theme.css's shared rules read). */
  :root {
    --bg: #fff; --fg: #111; --muted: #444; --border: #888; --button-bg: #f2f2f2;
    --card-bg: #f7f7f7;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
      --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
    --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* WEB_UI_RESPONSIVE.md sec 6: min() shrink-to-fit stays, fixed 640px
     cap becomes the shared --kc-shell-max -- see backup_page.html's
     identical comment for the rationale. */
  body { font-family: sans-serif; width: min(100% - 2rem, var(--kc-shell-max)); margin: 2em auto;
         background: var(--bg); color: var(--fg); }
  h1 { font-size: 1.2em; }
  p { color: var(--muted); }
</style>
</head>
<body>
<!-- Real markup, not script-created -- nav.js's topbar-building code looks
     up #themeBtn by id and moves it (not creates it) into #kcDisplayPrefs
     below; see nav.js's comment on that move. Moved verbatim off
     settings_page.html along with the container div and its inline script. -->
<button id="themeBtn" class="theme-btn" title="Toggle dark/light theme"></button>

<h1>Display</h1>
<div id="kcDisplayPrefs"></div>
<p>Temperature units are stored on the board, so this also changes what the
LCD and every other browser shows. The dark/light theme is remembered by this
browser only.</p>

<script>
(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    // Same labelled-row wording as this script's pre-move copy in
    // settings_page.html -- this is a settings row, not a corner button, so
    // it says which theme is on and what clicking does.
    btn.textContent = isDark(t) ? '☀ Theme: Dark (switch to light)'
                                : '🌙 Theme: Light (switch to dark)';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
