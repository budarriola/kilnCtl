<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kilnCtl - Manual relays</title>
<link rel="stylesheet" href="/theme.css">
<script>(function(){var t=localStorage.getItem('kilnctl-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<!-- UI_PLAN.md "web page structure" section, item 3: the manual per-relay
     toggles, moved off main_page.html per the 2026-08-20 decision recorded
     there -- "a phone in a pocket can brush a screen in a way a panel
     mounted on a kiln cannot." Shared nav/app chrome, same load-order
     caveat as every other page (see nav.js's header comment). -->
<script defer src="/nav.js"></script>
<script defer src="/app.js"></script>
<style>
  /* Page-local palette tokens only -- see settings_page.html's identical
     comment. --on-color/--off-color are this page's own copy of
     main_page.html's names for button.relay-on/relay-off (theme.css's
     .relay-toggle rules reference them without defining them, same
     convention as --bg/--fg elsewhere). */
  :root {
    --bg: #fff; --fg: #111; --muted: #444; --border: #888; --button-bg: #f2f2f2;
    --card-bg: #f7f7f7; --on-color: #1a7a1a; --off-color: #888; --fault-color: #b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
      --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
      --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
    }
  }
  :root[data-theme="dark"] {
    --bg: var(--ui-bg); --fg: var(--ui-text-primary); --muted: var(--ui-text-secondary);
    --border: var(--ui-text-secondary); --button-bg: var(--ui-card); --card-bg: var(--ui-card);
    --on-color: var(--ui-accent-4); --off-color: var(--ui-text-secondary); --fault-color: var(--ui-accent-5);
  }
  body { font-family: sans-serif; max-width: 480px; margin: 2em auto; padding: 0 1em;
         background: var(--bg); color: var(--fg); }
  h1 { font-size: 1.2em; }
  p { color: var(--muted); }
</style>
</head>
<body>
<button id="themeBtn" class="theme-btn" title="Toggle dark/light theme"></button>
<!-- <h1>Manual relay control</h1> removed 2026-08-21 (rework item 5):
     nav.js's topbar now shows this page's name ("Manual relays", from
     <title> above) in the brand's old spot, so the heading duplicated it. -->
<p>Grouped by zone (Settings &rarr; Thermocouples &amp; Zones) -- relays in
the same group are assigned to the same zone and switch together when a
profile drives that zone. Forcing a relay while a profile is running fights
that profile's own control -- prefer Stop first.</p>
<!-- 2026-08-21 owner report: "manual relays does not let me activate them...
     i think it is because safety link is down but it should show an error
     message". The refusal itself was already correct (dashboard_http.c's
     relay_post_handler refuses a manual relay-ON with 403 and a reason
     string whenever relay_authority_on_blocked() finds any SAFETY_FAULT_SRC_*
     bit set) -- the bug was entirely here: setRelay() below fed the fetch's
     result into poll() on BOTH success and failure, so a 403 body containing
     the exact reason was fetched off the wire and then thrown away, and the
     button just silently stayed OFF. This div surfaces that reason text
     verbatim (via window.kcEscapeHtml, same as every other server-supplied
     string on this page) instead of the page guessing from a bare status
     code, per the same rule ui_page_temperature.c's LCD-side message
     already follows. -->
<div id="relayError" class="empty" style="display:none;color:var(--fault-color);"></div>
<div id="relays"><p class="empty">Loading…</p></div>

<script>
// -- Moved verbatim from main_page.html's "Relays" section (UI_PLAN.md
// item 3) -- same setRelay/relayRow/renderRelays functions, same zone
// grouping by zones.relay_mask (bit N-1 = Relay N, kiln_io.h numbering),
// same "Unassigned" catch-all so a relay claimed by no zone is never
// silently hidden. This page keeps its own zonesCache/loadZones rather than
// sharing main_page.html's in-memory copy -- each *_page.html is an
// independent static document with no shared JS runtime across pages, same
// as every other page pair in this codebase (e.g. rules_page.html and
// zones_page.html each fetch /api/zones themselves too).
// 2026-08-21 (owner report -- see the <div id="relayError"> comment above):
// this used to be `.then(poll).catch(poll)`, which read the fetch's result
// only far enough to know "something happened" and then discarded it either
// way -- a refused relay-ON (403, with a specific reason in the body: safety
// link down, owned by a running profile, firmware update in progress, ...)
// looked identical to a network error looked identical to success, all three
// just silently re-polling. Now: 2xx clears any previous error and repaints
// via poll() same as before; anything else reads the body text (the server's
// actual reason -- see dashboard_http.c's relay_post_handler /
// relay_safety_reason()) and shows it verbatim, escaped, until the next
// attempt succeeds or the page is reloaded.
function showRelayError(text) {
  const el = document.getElementById('relayError');
  if (!text) {
    el.style.display = 'none';
    el.textContent = '';
    return;
  }
  el.style.display = '';
  el.innerHTML = window.kcEscapeHtml(text);
}

function setRelay(relay, on) {
  fetch('/api/relay', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'relay=' + relay + '&on=' + (on ? '1' : '0'),
  }).then(function (resp) {
    return resp.text().then(function (text) {
      if (resp.ok) {
        showRelayError(null);
      } else {
        showRelayError('Relay ' + relay + ' ' + (on ? 'ON' : 'OFF') + ' refused: ' + (text || ('HTTP ' + resp.status)));
      }
    });
  }).catch(function () {
    showRelayError('Relay ' + relay + ' ' + (on ? 'ON' : 'OFF') + ' failed: could not reach the board.');
  }).then(poll);
}

// The button's ON/OFF text and its relay-on/relay-off styling are both a
// live relay-state reading (this poll's /api/status), not a static label --
// kc-live-value alongside the existing state classes.
function relayRow(r) {
  const div = document.createElement('div');
  div.className = 'card';
  const btn = document.createElement('button');
  btn.className = 'relay-toggle kc-live-value ' + (r.on ? 'relay-on' : 'relay-off');
  btn.textContent = r.on ? 'ON' : 'OFF';
  btn.addEventListener('click', function () {
    var turningOn = !r.on;
    // UI_PLAN.md Web section 4 item 5, unchanged from the pre-move
    // behaviour this pass's hard requirements call out explicitly: forcing
    // a relay ON gets an explicit confirm (turning one off does not --
    // undoing an accidental OFF is just pressing the same button again,
    // undoing an accidental energised element is not). kcConfirm comes from
    // app.js, loaded via a deferred <script> in <head>; safe to call here
    // because this only runs inside a click handler, which can't fire
    // before app.js has executed.
    // Display-only R0-3 in the confirm text (owner request 2026-08-27,
    // matches the thermocouple channels' 0-based numbering); r.relay itself
    // (passed to setRelay() below) stays the real 1-based API number.
    if (turningOn && !kcConfirm('Force relay ' + (r.relay - 1) + ' ON now, outside any running profile?')) {
      return;
    }
    setRelay(r.relay, turningOn);
  });
  div.innerHTML = '<span>Relay ' + (r.relay - 1) + '</span>';
  div.appendChild(btn);
  return div;
}

var zonesCache = { zones: [] };
function renderRelays(statusData) {
  const el = document.getElementById('relays');
  if (!statusData.io_ready) {
    el.innerHTML = '<p class="empty">No relay board attached.</p>';
    return;
  }
  el.innerHTML = '';
  const relaysByN = {};
  statusData.relays.forEach(function (r) { relaysByN[r.relay] = r; });
  const claimed = {};

  zonesCache.zones.slice(0, zonesCache.thermo_count || 0).forEach(function (z, i) {
    const relaysHere = [];
    for (let bit = 0; bit < 4; bit++) {
      if (z.relay_mask & (1 << bit)) {
        const n = bit + 1;
        if (relaysByN[n]) { relaysHere.push(relaysByN[n]); claimed[n] = true; }
      }
    }
    if (relaysHere.length === 0) return;
    const group = document.createElement('div');
    group.className = 'zone-group';
    group.innerHTML = '<h3>' + window.kcEscapeHtml(z.name || ('Zone ' + i)) + '</h3>';
    relaysHere.forEach(function (r) { group.appendChild(relayRow(r)); });
    el.appendChild(group);
  });

  const unassigned = statusData.relays.filter(function (r) { return !claimed[r.relay]; });
  if (unassigned.length > 0) {
    const group = document.createElement('div');
    group.className = 'zone-group';
    group.innerHTML = '<h3>Unassigned</h3>';
    unassigned.forEach(function (r) { group.appendChild(relayRow(r)); });
    el.appendChild(group);
  }
}

function loadZones() {
  return fetch('/api/zones').then(function (r) { return r.json(); }).then(function (data) {
    zonesCache = data;
  }).catch(function () {});
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(function (data) {
    renderRelays(data);
  }).catch(function () {});
  setTimeout(poll, 2000);
}

loadZones().then(poll);

(function () {
  var btn = document.getElementById('themeBtn');
  function isDark(t) { return t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches); }
  function apply(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    btn.textContent = isDark(t) ? '☀' : '🌙';
  }
  apply(localStorage.getItem('kilnctl-theme'));
  btn.addEventListener('click', function () {
    var next = isDark(document.documentElement.getAttribute('data-theme')) ? 'light' : 'dark';
    localStorage.setItem('kilnctl-theme', next);
    apply(next);
  });
})();
</script>
</body>
</html>
