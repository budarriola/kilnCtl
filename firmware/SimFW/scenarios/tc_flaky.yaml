name: tc_flaky
version: 1
exercises: [S5]
# Anti-nuisance doctrine: intermittent OC at a ~0.5 Hz-class alternation must
# NOT produce an instant trip. S5's streak-reset behavior is what should
# absorb it (GUARD_TEST_MATRIX.md §2: "9 bad reads, then a good one -> No
# trip, streak resets"; DESIGN_NOTES.md §8 item 5).
preset: fast_test
# timescale 0.2, not the library's usual 10 -- deliberately, and unlike most
# of this library's other timescale overrides this one is not about a guard
# TIMING bar, it is about SAMPLE COUNT. virtual_dut's harness ticks the guard
# once per OBSERVED telemetry sample (virtual_dut/README.md's "Sampling
# rule"), so a count-based guard bar (S5's 10 consecutive bad reads) can only
# be cleared by real, distinct observations -- never manufactured by batching
# (Finding 11). At timescale 10, telemetry lands one frame per `0.5 /
# timescale` = 0.05 sim-seconds of WALL time, i.e. one frame per 5
# sim-seconds -- far coarser than this scenario's own 900ms bad/900ms good
# alternation (~1 fault-phase transition every 0.9 sim-s), so the default run
# took only ~18 samples across ~96 sim-seconds and never actually presented
# the alternation the scenario exists to test; it could only show that a
# coarse sampler no longer FABRICATES a streak, not that the real ~100ms
# MAX31856 cadence stays quiet. timescale 0.2 (one frame per 0.1 sim-seconds
# -- the real MAX31856 auto-convert cadence, DESIGN_NOTES.md §3.2) is the setting
# this scenario's own claim needs, and its own comment on the `flaky` fault
# below derives the 900ms/900ms split against exactly that cadence. Measured
# at this setting: 453 guard ticks over 45.2 sim-seconds, zero S5 warns, zero
# trips -- see virtual_dut/README.md Finding 11's closing paragraph, which
# this timescale change makes this file's own default run reproduce rather
# than merely footnote. See virtual_dut/README.md's "Sampling rule" section
# for the general "lower timescale, never --poll-interval" guidance this
# follows.
timescale: 0.2
seed: 46
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: flaky
    # DESIGN_NOTES.md §7.1: "Broken (intermittent) TC | Alternates connected/OC on a
    # configurable duty/period". fault_sched.c's own header comment (2026-08-20
    # gap-closure pass) is explicit that this fault has no separate
    # FAULT_SCHED_TYPE_* of its own -- "'Broken (intermittent) TC' still needs
    # no separate fault type -- it is TC_DISCONNECTED scheduled with an
    # EVERY/FOR repeat+duration spec, which fault_engine.h already expresses."
    # `broken_intermittent_tc` is not a real fault type (not in
    # fault_sched.h's fault_sched_fault_type_t enum) and would fail to
    # schedule; corrected to `disconnected_tc` (== FAULT_SCHED_TYPE_TC_
    # DISCONNECTED, the same type tc_disconnect_ramp.yaml/tc_disconnect_
    # soak.yaml use) with an explicit repeat/duration pair, which
    # tools/PcTools/src/kilnsim/scenario.py's loader also already parses
    # (`duration: {for_s: N}`, `repeat: {every: {period: N}}` --
    # confirmed by reading `_parse_duration`/`_parse_repeat` there), so the
    # "schema has no repeat/params fields yet" claim in the prior version of
    # this comment was wrong on the PC-tooling side even though DESIGN_NOTES.md §8.1's
    # own frozen-schema note is about the firmware wire format, not the YAML.
    #
    # Duty/period resolved (not a placeholder): safety_guards.c's S5
    # constants are BAD_READ_COUNT_DEFAULT = 10u and BAD_READ_TIME_S_DEFAULT
    # = 5.0f (safety_guards.c lines 13-14), and the MAX31856's nominal
    # auto-convert cadence is ~100 ms (DESIGN_NOTES.md §3.2). A ~0.5 Hz (≈1s bad /
    # ≈1s good) alternation, as originally suggested by DESIGN_NOTES.md §8 item 5's
    # own wording, gives a bad-phase run of ~10 conversions -- exactly AT the
    # count bar, not reliably under it. Using a 900 ms bad-phase / 900 ms
    # good-phase split instead gives ~9 consecutive bad reads per run
    # (900ms / 100ms), one full conversion short of both the 10-read AND the
    # 5s bar, so the streak resets (safety_guards.c:262, `state->s5_bad_streak
    # = 0`) before either bar is ever reached -- solidly inside the nuisance
    # region rather than skimming its edge -- while the resulting 1.8s
    # bad+good cycle (~0.56 Hz) still matches the "~0.5 Hz-class" figure
    # DESIGN_NOTES.md §8 item 5 names. `repeat: every.period` is measured from the
    # fault's CLEAR time to its next fire (fault_engine.c's
    # rearm_for_repeat(): `repeat_ready_at_s = clear_time_s + period_s`), so
    # it IS the 900ms good-phase length directly, not the full cycle --
    # confirmed by reading that function this pass rather than guessed.
    type: disconnected_tc
    target: tc:safety
    trigger: { at_sim_time: { t: 20 } }
    duration: { for_s: 0.9 }
    repeat: { every: { period: 0.9 } }
expect:
  - name: no_trip_from_flapping
    # Deliberately NOT `forbid: {dut: K4_open, before: {sim_end: true}}`
    # (the original form): K4 is reported open from this harness's very
    # first observation regardless of anything under test (README.md
    # Finding 2), so that boundary was always vacuous, and fixing it by
    # adding `dut.operator_actions:` here (as done for most of this
    # library's other K4-boot-open clauses) is a poor trade for this
    # specific file: K4 cannot close before the real 60s
    # SAFTYFW_STARTUP_GRACE_MS, and at this scenario's deliberately slow
    # `timescale: 0.2` (needed for S5's real-cadence sample resolution, see
    # above) that alone costs 300+ wall-seconds before the flapping test
    # under actual investigation even starts. Rewritten to key off the
    # GUARD_TRIP event itself instead -- the same fix already applied
    # elsewhere in this pass -- which needs no operator action at all: S5's
    # trip decision does not depend on K4's physical contact state or on
    # any current flowing.
    forbid: { event: { type: guard_trip, guard: S5 }, before: { sim_end: true } }
  - name: no_warn_storm
    forbid: { event: { type: guard_warn, guard: S5 }, before: { sim_end: true } }
    # Resolved: see the `flaky` fault's own comment above for the derivation
    # of the 900ms/900ms duty split that keeps every bad-read run one
    # conversion short of S5's 10-read AND 5s bars (SAFETY_MODEL.md §4 S5).
manual_checks:
  - "Confirm LCD/web UI show no fault banner despite the intermittent flips, per the anti-nuisance doctrine (SAFETY_MODEL.md §2)"
report_keep: [telemetry, events]
