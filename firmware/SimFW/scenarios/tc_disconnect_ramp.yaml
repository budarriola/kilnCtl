name: tc_disconnect_ramp
version: 1
exercises: [S5]
# S5 — Safety thermocouple invalid, graduated WARN-then-TRIP
# (SAFETY_MODEL.md §4 S5). This half of the pair (item 4 in PLAN.md §8)
# disconnects the safety-side TC early in the ramp; tc_disconnect_soak.yaml
# is the same fault fired later, during the hold/soak portion.
preset: fast_test
# timescale: 10 (one telemetry frame per ~5 sim-sec) could not resolve
# warns_first's within_s:6 window at all -- S5's "10 consecutive bad reads"
# bar needs more samples than one frame per 5s can present in 6s. Lowered
# per README Finding 8 / this task's guidance ("to increase resolution
# lower timescale, do NOT lower --poll-interval").
timescale: 1
seed: 44
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: oc_ramp
    type: disconnected_tc
    target: tc:safety
    # Early in the ramp. No exact "ramp phase" boundary is defined anywhere
    # in PLAN.md/SAFETY_MODEL.md; this is a judgment call chosen to land
    # comfortably before the fast_test preset's soak portion.
    trigger: { at_sim_time: { t: 30 } }
    duration: permanent
expect:
  - name: warns_first
    event: { type: fault_fired, slot: oc_ramp }
    then:
      event: { type: guard_warn, guard: S5 }
      within_s: 6         # "bad reads >= 10 consecutive AND >= 5s -> WARN"
                          # (SAFETY_MODEL.md §4 S5) + ~1s margin
      not_before_s: 4.5
  - name: trips_after_blind_grace
    event: { type: fault_fired, slot: oc_ramp }
    then:
      # dut: K4_open (as originally written) is vacuously satisfied by the
      # K4-boot-open artifact documented throughout this suite (README.md
      # Finding 2 and its corollary): this file schedules no
      # dut.operator_actions:, so K4 is reported open from sim-time ~1s --
      # long before the fault -- and a level-based `dut: K4_open` clause can
      # never see an edge caused BY the trip. Rewritten to key off the
      # GUARD_TRIP event itself (same fix already applied to
      # safety_tc_frozen/cj_fault/tc_disconnect_soak). Measured:
      # GUARD_TRIP{S5} 61.0s after fault_fired.
      event: { type: guard_trip, guard: S5 }
      within_s: 65        # blind_grace_s = 60s (SAFETY_MODEL.md §4 S5) + margin
      not_before_s: 55    # must not trip before the 60s grace clears
                          # (two-bar doctrine, SAFETY_MODEL.md §2)
  - name: reports_nan_not_stale_value
    at_end: { dut: safety_temp_valid, equals: false }
    # While blind, the status frame reports NaN with SAFETY_FLAG_TEMP_VALID
    # clear — never 0, never the last good reading (SAFETY_MODEL.md §4 S5)
report_keep: [telemetry, events]
