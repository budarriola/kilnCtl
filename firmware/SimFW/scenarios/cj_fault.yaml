name: cj_fault
version: 1
exercises: [S5, S12]
# S5 is cited negatively: SAFETY_MODEL.md §4 S5 explicitly excludes
# CJHIGH/CJLOW/CJRANGE from S5's trip set ("a cold-junction complaint means
# the *board* is too hot or too cold, which is worth a WARN and is not a
# chamber emergency") — this scenario asserts that exclusion holds.
# S12 is the guard actually built for this: the graduated numeric CJ
# over-temperature guard (SAFETY_MODEL.md §4 S12).
preset: fast_test
timescale: 10
seed: 54
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: cj
    # PLAN.md §7.1: "CJ fault | CJ high/low fault bits; wrong CJ
    # temperature". Drives the simulated CJ temperature past cj_max_c.
    type: cj_fault
    target: tc:safety
    trigger: { at_sim_time: { t: 20 } }
    duration: permanent
    # params[0] = CJ offset, degC (fault_sched.h's FAULT_SCHED_TYPE_TC_CJ_FAULT
    # doc comment; max31856_regs.c adds this straight onto the internally-
    # sensed CJ reading). Without a params: list here this fault fires with
    # magnitude 0 -- a scenario-file gap fixed this pass, not a guard/fixture
    # bug. 70.0 chosen so reported_cj_c = true_cj_c (~T_ambient = 25 degC,
    # thermal_model.c's preset default, all presets incl. fast_test) + 70 =
    # ~95 degC, clearing both safety_guards.c's CJ_WARN_C_DEFAULT (60.0,
    # line 17) and CJ_MAX_C_DEFAULT (85.0, line 18) with margin (~35 degC
    # over warn, ~10 degC over trip) instead of landing exactly on a
    # threshold where float rounding could go either way.
    params: [70.0]
expect:
  - name: s5_never_trips_on_cj_alone
    forbid: { event: { type: guard_trip, guard: S5 }, before: { sim_end: true } }
  - name: s12_warns_at_60c
    event: { type: fault_fired, slot: cj }
    then:
      event: { type: guard_warn, guard: S12 }
      within_s: 1        # Resolved (not a placeholder): safety_guards.c's S12
                         # block (lines 337-359) shows cj_warn_c is "a plain
                         # level crossing (WARN only, no timer -- it is
                         # reported every tick it is exceeded, not latched)" --
                         # there is no accumulator/streak to wait out, unlike
                         # S5. Worst-case detection latency is therefore one
                         # MAX31856 conversion (~100-151ms, max31856.c's
                         # MAX31856_CONV_MS_AUTO_60HZ_4AVG) plus at most one
                         # safety_core tick (100ms, SAFTYFW_PRIO_SAFETY_CORE
                         # comment "// 100 ms", task_priorities.h) before the
                         # new cj_c value is read and evaluated -- roughly
                         # 0.2-0.3s worst case. within_s: 1 keeps ~4x margin
                         # over that instead of the earlier 3s guess.
  - name: s12_trips_at_85c_sustained
    event: { type: fault_fired, slot: cj }
    then:
      dut: K4_open
      within_s: 65       # cj_time_s = 60s (SAFETY_MODEL.md §4 S12) + margin
      not_before_s: 58
report_keep: [telemetry, events]
