name: cj_fault
version: 1
exercises: [S5, S12]
# S5 is cited negatively: SAFETY_MODEL.md §4 S5 explicitly excludes
# CJHIGH/CJLOW/CJRANGE from S5's trip set ("a cold-junction complaint means
# the *board* is too hot or too cold, which is worth a WARN and is not a
# chamber emergency") — this scenario asserts that exclusion holds.
# S12 is the guard actually built for this: the graduated numeric CJ
# over-temperature guard (SAFETY_MODEL.md §4 S12).
preset: fast_test
timescale: 10
seed: 54
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: cj
    # PLAN.md §7.1: "CJ fault | CJ high/low fault bits; wrong CJ
    # temperature". Drives the simulated CJ temperature past cj_max_c.
    type: cj_fault
    target: tc:safety
    trigger: { at_sim_time: { t: 20 } }
    duration: permanent
expect:
  - name: s5_never_trips_on_cj_alone
    forbid: { event: { type: guard_trip, guard: S5 }, before: { sim_end: true } }
  - name: s12_warns_at_60c
    event: { type: fault_fired, slot: cj }
    then:
      event: { type: guard_warn, guard: S12 }
      within_s: 3        # TODO: no explicit detection-latency deadline is
                         # stated beyond "already read on every conversion"
                         # (SAFETY_MODEL.md §4 S12) — placeholder using the
                         # MAX31856's ~100ms nominal conversion cadence
                         # (PLAN.md §3.2) with generous margin; confirm
                         # against bench behavior
  - name: s12_trips_at_85c_sustained
    event: { type: fault_fired, slot: cj }
    then:
      dut: K4_open
      within_s: 65       # cj_time_s = 60s (SAFETY_MODEL.md §4 S12) + margin
      not_before_s: 58
report_keep: [telemetry, events]
