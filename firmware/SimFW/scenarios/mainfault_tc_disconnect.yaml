name: mainfault_tc_disconnect
version: 1
exercises: [S6a]
# S6a ("The ESP explicitly asserts fault", SAFETY_MODEL.md §4 S6) trips on
# `mainFault` (GPIO10) reading LOW, debounced 200ms -- an unambiguous signal
# the fixture cannot drive directly (DESIGN_NOTES.md §3.4: the `Fault` line is
# ESP-driven, GPIO6 -> U1 opto -> the Pico's GPIO10, and the fixture only
# *senses* it). The only way to provoke S6a through this fixture is to make
# the real DUT (KilnFW) decide, on its own, to assert its fault output.
# firmware/KilnFW/docs/SAFETY_MODEL.md §"boot faults"/live-fault table and
# App/drivers/safety_link.h document that a main-board thermocouple fault
# does exactly that: guard 6 (sensor validity) trips after 3 consecutive bad
# reads *while a profile is actively running that zone* and asserts a live
# `SAFETY_FAULT_SRC_THERMO`, which lights U1's LED and pulls the Pico's
# mainFault input low (KilnFW/docs/SAFETY_MODEL.md: "guard 6 ... trips after
# 3 consecutive bad reads and asserts a live SAFETY_FAULT_SRC_THERMO ...
# live-verified end to end on the real board"). This scenario disconnects a
# main-side channel (tc:0, ESP/bus-A side -- NOT tc:safety, which is the
# Pico's own independent sensor and cannot affect mainFault at all) to
# provoke that path indirectly, which is the only path this fixture has.
preset: fast_test
timescale: 10
seed: 63
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: oc_main
    type: disconnected_tc
    target: tc:0
    # Fired 5s in so cone6_fast's profile is already actively running zone 0
    # -- the live SAFETY_FAULT_SRC_THERMO escalation this scenario relies on
    # only fires "while a profile is actively running a zone"
    # (KilnFW/docs/SAFETY_MODEL.md); outside of a running profile the same
    # live fault does not block relay-on or assert mainFault at all.
    trigger: { at_sim_time: { t: 5 } }
    duration: permanent
expect:
  - name: no_early_trip
    # Deliberately NOT `forbid: {dut: K4_open, before: {fault: oc_main}}`
    # (the original form): K4 is reported open from this harness's very
    # first observation regardless of anything under test (README.md
    # Finding 2), so a level-based clause always sees an "open" edge before
    # the fault, whatever any guard decides. This file has no reason to add
    # `dut.operator_actions:` to work around it -- S6a does not depend on
    # K4's physical state or any current flowing. Rewritten to key off the
    # GUARD_TRIP event itself, the same fix already applied elsewhere in
    # this pass.
    forbid: { event: { type: guard_trip }, before: { fault: oc_main } }
  - name: mainfault_trips_s6a
    event: { type: fault_fired, slot: oc_main }
    then:
      event: { type: guard_trip, guard: S6a }
      within_s: 3         # no single frozen number exists for KilnFW's own
                           # "3 consecutive bad reads" cadence (MAX31856
                           # conversion cadence is "~100ms nominal",
                           # DESIGN_NOTES.md §3.2) plus SaftyFW's 200ms mainFault
                           # debounce (SAFETY_MODEL.md §4 S6a) -- generous
                           # margin used deliberately rather than a guessed
                           # precise figure
      not_before_s: 0.1   # must not trip on the very first bad read alone
                           # -- KilnFW's guard 6 requires 3 *consecutive*
                           # bad reads before it escalates at all
    blocked_on:
      reason: "STALE REASON, SUPERSEDED 2026-08-20 -- kept below for history,
               real current reason follows. safety_core_build_input() now
               names `.main_fault_asserted = discrete_task_main_fault()`
               (immediately after `.estop_pressed`), so SaftyFW's own half of
               this signal is fully wired; that is no longer what blocks
               this clause. The real blocker is one level deeper, in the
               FIXTURE, not the firmware: `virtual_simfw.c`'s
               `fault_line_asserted` field (the Fault-opto sensing this
               harness's own header comment already says the fixture only
               'senses', never drives) is set ONLY by real hardware's
               `i2c_owner.c`, reading a real I2C GPIO-expander pin
               (`EXP1_PIN_FAULT_LINE`) wired to the ESP's GPIO6 -> U1 opto.
               `virtual_simfw.c` has no I2C-expander emulation of that path
               at all (grepped this pass: `fault_line_asserted` is read in
               three places in virtual_simfw.c/cmd_task.c/telemetry.c and
               WRITTEN in none) -- it is zero-initialized and stays false for
               the entire life of the process, regardless of what TC fault is
               injected on tc:0. Disconnecting tc:0 has no code path to it at
               all: this fixture never executes KilnFW's own guard-6 logic
               (there is no KilnFW anywhere in virtual_simfw or virtual_dut,
               only the real SaftyFW guard code under test), so the 'ESP
               decides to assert its own fault output' step this scenario's
               header comment describes is not something any fault injection
               here can cause. Separately and independently,
               run_dut_scenarios.py's poll loop never reads
               `fault_line_asserted` from telemetry and passes it as
               dut_core.exe's optional TICK `<main_fault>` field at all (it
               always calls `dut.tick(...)` with the parameter's default,
               `main_fault=False`) -- so even a fixture that DID assert the
               Fault line would still need that wiring added before this
               scenario could see it. Both gaps are fixture-side; neither is
               a SaftyFW guard defect or a scenario-authoring gap. See
               GUARD_TEST_MATRIX.md §6 for the full three-way accounting
               (SaftyFW input: wired; fixture Fault-line emulation: absent;
               orchestrator TICK wiring: absent)."
      phase: "No SaftyFW phase applies -- the SaftyFW side is done. The gap
              is virtual_simfw's own I2C-expander/opto emulation, which is
              out of this scenario library's ownership (scenarios/*.yaml
              cannot touch firmware/SimFW/tools/virtual_simfw/src), and even
              closing it would only be half the fix without also wiring
              run_dut_scenarios.py's poll loop to read and forward
              `fault_line_asserted`. S6a is therefore not provokable through
              this harness at all today, by design of what the harness
              chooses to emulate -- not a wiring omission this pass can
              close."
  - name: fault_line_asserted
    event: { type: fault_fired, slot: oc_main }
    then:
      dut: fault_line_asserted
      within_s: 3
    blocked_on:
      reason: "Same fixture-side gap as `mainfault_trips_s6a` immediately
               above: `virtual_simfw.c` has no producer that ever sets
               `fault_line_asserted` true (only real hardware's
               `i2c_owner.c` does), so this clause cannot pass against this
               fixture regardless of what fault is injected or when. This
               clause previously reported as a bare FAIL (no blocked_on
               annotation) -- SCENARIO_RESULTS.md's own honesty rule
               (report.py's BLOCKED-vs-FAIL distinction) says a clause
               blocked on known, tracked fixture incompleteness should read
               as BLOCKED, not FAIL; a bare FAIL here was accurate about the
               outcome but did not carry the reason, and made the suite look
               more broken than it is."
      phase: "Same as `mainfault_trips_s6a` above -- virtual_simfw's Fault-
              line/opto emulation, out of this scenario library's ownership."
  - name: trip_latched
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm KilnFW's cone6_fast profile is actively running zone 0 (not paused/idle) by the time this fault fires at t=5s -- the live SAFETY_FAULT_SRC_THERMO escalation this scenario depends on is documented as profile-gated, not unconditional (firmware/KilnFW/docs/SAFETY_MODEL.md: 'a live thermocouple fault during operation still does not block relay-on outside of a running profile')."
  - "Confirm KilnFW's LCD/web UI surfaces the mainFault/thermocouple trip reason distinctly -- fixture cannot read display/web content."
report_keep: [telemetry, events]
