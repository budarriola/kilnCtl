name: mainfault_tc_disconnect
version: 1
exercises: [S6a]
# S6a ("The ESP explicitly asserts fault", SAFETY_MODEL.md §4 S6) trips on
# `mainFault` (GPIO10) reading LOW, debounced 200ms -- an unambiguous signal
# the fixture cannot drive directly (DESIGN_NOTES.md §3.4: the `Fault` line is
# ESP-driven, GPIO6 -> U1 opto -> the Pico's GPIO10, and the fixture only
# *senses* it). The only way to provoke S6a through this fixture is to make
# the real DUT (KilnFW) decide, on its own, to assert its fault output.
# firmware/KilnFW/docs/SAFETY_MODEL.md §"boot faults"/live-fault table and
# App/drivers/safety_link.h document that a main-board thermocouple fault
# does exactly that: guard 6 (sensor validity) trips after 3 consecutive bad
# reads *while a profile is actively running that zone* and asserts a live
# `SAFETY_FAULT_SRC_THERMO`, which lights U1's LED and pulls the Pico's
# mainFault input low (KilnFW/docs/SAFETY_MODEL.md: "guard 6 ... trips after
# 3 consecutive bad reads and asserts a live SAFETY_FAULT_SRC_THERMO ...
# live-verified end to end on the real board"). This scenario disconnects a
# main-side channel (tc:0, ESP/bus-A side -- NOT tc:safety, which is the
# Pico's own independent sensor and cannot affect mainFault at all) to
# provoke that path indirectly, which is the only path this fixture has.
#
# UPDATE (2026-08-21): this file's own causal chain (TC disconnect -> KilnFW
# guard 6 -> Fault-line opto -> SaftyFW S6a) is now genuinely closed, not
# just S6a-in-general (that separate path,
# `firmware/SimFW/scenarios/mainfault_esp_asserted.yaml`/
# `mainfault_no_nuisance_trip.yaml`'s `set_main_fault` operator action,
# stands in for the ESP's DECISION directly and still exists unchanged for
# its own purpose). This file's `dut.kiln_guard6:` opts into composing
# `firmware/SimFW/tools/virtual_kiln/kiln_core.exe` -- which already compiled
# KilnFW's REAL, unmodified `thermal_guard.c` for the host (that directory's
# own README.md Phase-1 finding: no FreeRTOS/ESP-IDF dependency, already
# host-tested by `test_thermal_guard.c`) -- into this scenario's run. The
# real guard 6 now reads the SAME `tc:0` channel this scenario disconnects,
# via the fixture's real `TC_GET_REGS`; when it genuinely trips for
# `THERMAL_GUARD_TRIP_SENSOR_INVALID`, `run_dut_scenarios.py` asserts
# `virtual_simfw`'s real `fault_line_asserted` field (via a new
# `SIMFW_VIRTUAL_CMD_FAULT_LINE_SET` virtual-only command, see that file's
# own header comment above `dispatch_io()`) and raises `dut_core.exe`'s
# `main_fault` input the same tick -- SaftyFW's own unmodified S6a block then
# decides for itself whether to trip, same as it always has. See
# `run_dut_scenarios.py`'s block comment above `KilnCore`/
# `_send_fault_line_set` for the full wiring, and its `_parse_kiln_guard6`
# for the scenario-facing syntax. Verified non-vacuous: a control run that
# disconnects a DIFFERENT channel than `kiln_guard6.tc_channel` watches
# genuinely FAILS both `mainfault_trips_s6a` and `fault_line_asserted`
# (not BLOCKED, not a false PASS) -- the trip depends on the disconnected
# channel actually being the one the real guard-6 code observes.
preset: fast_test
# timescale: 1, not fast_test's usual 10 -- this scenario's whole point is
# guard 6's real 3-consecutive-bad-tick debounce (see kiln_guard6 below),
# ~3 real sim-seconds at KilnFW's real 1Hz profile_executor cadence. At
# timescale 10 that window is ~0.3 real wall seconds, UNDER virtual_simfw's
# fixed real-time ~2Hz telemetry broadcast period (~0.5s) -- exactly the
# "window shorter than ~500ms of wall time cannot be observed" trap. At
# timescale 1 the same 3-second window is 3 real wall seconds, several
# telemetry samples wide.
timescale: 1
seed: 63
overrides: {}
dut:
  profile: cone6_fast
  # Composes the real causal chain this file's header describes: TC fault ->
  # KilnFW's own real, unmodified thermal_guard.c (guard 6) -> Fault line ->
  # SaftyFW's real S6a -- see run_dut_scenarios.py's `_parse_kiln_guard6`/
  # `KilnCore` block comment for the full wiring. tc_channel 0 is the SAME
  # main-side channel `oc_main` disconnects below. setpoint_c is comfortably
  # above fast_test's ambient start so the zone is genuinely regulating
  # (duty > 0) when the fault fires, matching "a profile actively running
  # that zone" -- guard 6 itself does not care about duty (thermal_guard.c:
  # the sensor-validity check runs before any duty-gated guard), but this
  # keeps the harness's zone state honestly analogous to a running firing.
  kiln_guard6: { tc_channel: 0, setpoint_c: 1200.0 }
faults:
  - id: oc_main
    type: disconnected_tc
    target: tc:0
    # Fired 5s in so cone6_fast's profile is already actively running zone 0
    # -- the live SAFETY_FAULT_SRC_THERMO escalation this scenario relies on
    # only fires "while a profile is actively running a zone"
    # (KilnFW/docs/SAFETY_MODEL.md); outside of a running profile the same
    # live fault does not block relay-on or assert mainFault at all.
    trigger: { at_sim_time: { t: 5 } }
    duration: permanent
expect:
  - name: no_early_trip
    # Deliberately NOT `forbid: {dut: K4_open, before: {fault: oc_main}}`
    # (the original form): K4 is reported open from this harness's very
    # first observation regardless of anything under test (README.md
    # Finding 2), so a level-based clause always sees an "open" edge before
    # the fault, whatever any guard decides. This file has no reason to add
    # `dut.operator_actions:` to work around it -- S6a does not depend on
    # K4's physical state or any current flowing. Rewritten to key off the
    # GUARD_TRIP event itself, the same fix already applied elsewhere in
    # this pass.
    forbid: { event: { type: guard_trip }, before: { fault: oc_main } }
  - name: mainfault_trips_s6a
    event: { type: fault_fired, slot: oc_main }
    then:
      event: { type: guard_trip, guard: S6a }
      within_s: 3         # generous margin over both real ends of this
                           # chain: KilnFW's real guard 6 (thermal_guard.c)
                           # needs 3 consecutive bad ticks at
                           # kiln_guard6's real PROFILE_EXECUTOR_TICK_MS
                           # (1Hz) cadence, then SaftyFW's own real 200ms
                           # mainFault debounce (SAFETY_MODEL.md §4 S6a).
                           # Measured against this composition (2026-08-21,
                           # timescale 1): S6a trips ~0.7-0.9s after
                           # fault_fired, comfortably inside this margin --
                           # kept wide rather than tightened to the measured
                           # value, since the batch-tick approximation
                           # run_dut_scenarios.py's kiln_guard6 composition
                           # uses (see its own header comment) can shift the
                           # observed instant run to run.
      not_before_s: 0.1   # must not trip on the very first bad read alone
                           # -- KilnFW's guard 6 requires 3 *consecutive*
                           # bad reads before it escalates at all
  - name: fault_line_asserted
    event: { type: fault_fired, slot: oc_main }
    then:
      dut: fault_line_asserted
      within_s: 3
  - name: trip_latched
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm KilnFW's cone6_fast profile is actively running zone 0 (not paused/idle) by the time this fault fires at t=5s -- the live SAFETY_FAULT_SRC_THERMO escalation this scenario depends on is documented as profile-gated, not unconditional (firmware/KilnFW/docs/SAFETY_MODEL.md: 'a live thermocouple fault during operation still does not block relay-on outside of a running profile')."
  - "Confirm KilnFW's LCD/web UI surfaces the mainFault/thermocouple trip reason distinctly -- fixture cannot read display/web content."
report_keep: [telemetry, events]
