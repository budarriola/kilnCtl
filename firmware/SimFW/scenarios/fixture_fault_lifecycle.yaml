name: fixture_fault_lifecycle
version: 1
exercises: []
# TIER 0 -- runs on the SimFW fixture ALONE, no SaftyFW and no ESP.
#
# Why this file exists: as of 2026-08-24 not one of the other 26 scenarios
# could run on the fixture by itself (24 need tier 1, 3 need tier 2), so
# `kilnsim testmgr` against an unaccompanied fixture ran the selftest and
# then zero scenarios -- and still exited 0. The fixture's own fault engine,
# event ring and sim clock had no scenario-level coverage on real silicon at
# all, despite being the machinery every other scenario depends on.
#
# This asserts nothing about a DUT. It exercises the fixture's own timed
# fault lifecycle end to end on hardware: a fault scheduled for a fixed
# sim-duration must FIRE, and must then CLEAR on its own, at the right time,
# with both edges observable in the EVT stream.
preset: fast_test
# timescale 1: the assertions below are timing assertions with ~2s windows,
# and a higher timescale coarsens telemetry/event resolution (see
# tc_disconnect_ramp.yaml's own note on the same trade-off).
timescale: 1
seed: 101
overrides: {}
dut:
  # No DUT is attached, and none is needed. Deliberately no operator_actions:
  # anything here would raise the scenario's tier above 0 and defeat the
  # point of the file.
  profile: none
faults:
  - id: timed_tc_open
    type: disconnected_tc
    target: tc:0
    trigger: { at_sim_time: { t: 10 } }
    duration: { for: 10 }
expect:
  - name: fires_at_the_scheduled_time
    # The fault engine's AT_SIM_TIME trigger must actually fire the slot.
    # Anchored on the run's own start rather than another event, so this
    # clause cannot be satisfied by anything except a real FAULT_FIRED.
    event: { type: fault_fired, slot: timed_tc_open }
    then:
      event: { type: fault_cleared, slot: timed_tc_open }
      # duration: for 10 sim-seconds. The window is deliberately tight on
      # both sides: not_before_s catches a slot that clears early (a
      # duration ignored, or measured in the wrong unit), within_s catches
      # one that never clears at all -- which is the failure mode that
      # matters, since a stuck-active fault silently poisons every
      # subsequent scenario in a suite run.
      not_before_s: 8
      within_s: 13
  - name: no_protocol_errors_during_the_run
    # PROTOCOL_ERROR is a real wire event type (sim_snapshot.h's
    # sim_event_type_t), so this is fixture-native and tier 0. A framing or
    # decode fault on the benchproto link would surface here rather than as
    # a confusing failure in whatever scenario happened to be running.
    forbid: { event: { type: protocol_error }, before: { sim_end: true } }
report_keep: [telemetry, events]
