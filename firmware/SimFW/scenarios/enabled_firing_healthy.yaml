name: enabled_firing_healthy
version: 1
exercises: [S3, S4]
# The anti-nuisance control run for S3 and S4 (GUARD_TEST_MATRIX.md §1: "the
# only way to know a guard does not [nuisance-]trip is to run a healthy kiln
# at it"). Every other scenario in this library that cites S3/S4 has, until
# now, been unable to make that argument at all: no scenario closed K4, so no
# current ever flowed (virtual_dut measured any_current_present true on 0 of
# 1229 polls across the whole suite), and both guards were being evaluated
# against a permanently de-energized kiln.
#
# This is the first scenario that performs the operator enable
# (SAFETY_CMD_REQUEST_ENABLE) and commands a zone relay, so it is the first
# one in which S3's `any_current_present` half and S4's
# `relay_commanded_continuously` half are BOTH true of a *healthy* firing --
# which is exactly the condition under which neither guard may fire:
#   S3 = current present AND nothing commanded  -> here something IS
#        commanded (K1), so S3 must stay quiet.
#   S4 = commanded continuously AND no current  -> here current IS present
#        from sim-time ~60s onward, so S4 must stay quiet.
preset: fast_test
# timescale 2, not the library's usual 10, and deliberately so. virtual_simfw
# advances its sim clock by exactly `timescale` sim-seconds per wall second
# (it used to advance by timescale**2 -- its main loop scaled the tick
# ACCUMULATOR by timescale and then each 100ms tick advanced sim by
# 100ms * timescale, applying the factor twice; that is fixed, and
# tools/PcTools/tests/test_kilnsim_virtual_simfw.py::
# test_timescale_advances_sim_linearly_not_quadratically now guards it).
# Its 2Hz telemetry broadcast therefore lands one frame every
# `0.5 / timescale` sim-seconds: 5 sim-seconds at timescale 10 -- only ~4
# samples across the shortest guard window this library tests (S3's 20s
# stuck_on_time_s), which would make a guard verdict as much a measurement of
# the sampling as of the guard. At timescale 2 the same broadcast is one frame
# per sim-second, comfortably finer than every window under test. See
# virtual_dut/README.md's batch-ticking note and its Finding 8.
timescale: 2
seed: 60
overrides: {}
dut:
  profile: cone6_fast
  # `operator_actions:` is read by firmware/SimFW/tools/virtual_dut/
  # run_dut_scenarios.py (see its module docstring for the full rationale and
  # for why it is a scenario-authored step rather than harness behavior:
  # KilnFW does NOT auto-enable on profile start, so a fixture that issued
  # the enable by itself would be modelling a system that does not exist).
  # kilnsim's own loader keeps unknown `dut:` keys on DutSpec.extra/
  # Scenario.raw, so this is a forward-compatible extension, not a schema
  # break -- check_scenarios.py is clean on it.
  operator_actions:
    # Zone 0's contactor closes (on real hardware KilnFW's PID does this; the
    # fixture has no KilnFW, so the scenario says so explicitly) and the
    # operator requests enable, in the same breath a person starting a firing
    # would. K4 still cannot close before sim-time 60s: relay_owner holds the
    # request through the real SAFTYFW_STARTUP_GRACE_MS (60000ms) and only
    # applies it on GRACE -> ARMED. That delay is the DUT's, not the harness's.
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
    # End of the firing: the zone is commanded off. Current must stop (K1 is
    # the only closed zone relay), and neither guard may react to that either
    # -- S3 because there is no current any more, S4 because nothing is
    # commanded continuously any more.
    - { at_sim_time: 200, action: command_relay, relay: K1, state: open }
faults: []
expect:
  - name: k4_closes_after_startup_grace
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      dut: K4_closed
      within_s: 90       # grace ends at sim-time 60s; the K1 edge lands at
                         # ~5-10s, so ~50-55s of separation, plus the fixture's
                         # ~2Hz telemetry quantization (~2 sim-seconds at
                         # timescale 2) at each end
      not_before_s: 40   # must NOT close promptly on request -- the 60s
                         # startup grace is a safety property, not a delay to
                         # be optimized away (SAFETY_MODEL.md §6)
  - name: current_flows_once_k4_permits
    event: { type: relay_edge, relay: K4, edge: close }
    then:
      dut: current_present
      within_s: 10       # one telemetry frame's quantization; duty follows the
                         # sensed contacts on the very next device_tick()
  - name: s3_never_trips_during_a_commanded_firing
    # S3's whole point is "current with nothing commanded". Something IS
    # commanded here for the entire period current flows.
    forbid: { event: { type: guard_trip, guard: S3 }, before: { sim_end: true } }
  - name: s4_never_warns_during_a_commanded_firing
    # K1 is commanded on continuously from ~5s to 200s -- 195s, well past the
    # 150s correlation_window_s bar S4 waits for (SAFETY_MODEL.md §4 S4) --
    # so S4's timing half is genuinely satisfied and only its
    # `!any_current_present` half keeps it quiet. This clause would have been
    # vacuous before this scenario existed; it is not vacuous now.
    forbid: { event: { type: guard_warn, guard: S4 }, before: { sim_end: true } }
  - name: current_stops_when_the_zone_is_commanded_off
    event: { type: relay_edge, relay: K1, edge: open }
    then:
      dut: current_absent
      within_s: 10
  - name: k4_still_closed_at_end
    # No guard tripped, so the safety pilot relay is still energized at the
    # end of a healthy run -- the positive form of "nothing nuisance-tripped".
    at_end: { dut: K4_closed }
manual_checks:
  - "Confirm KilnFW's LCD/web UI shows the safety interlock as ENABLED once K4 closes and reports no guard warning for the whole run — fixture cannot read display/web content"
report_keep: [telemetry, events]
