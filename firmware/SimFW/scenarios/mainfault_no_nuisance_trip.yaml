name: mainfault_no_nuisance_trip
version: 1
exercises: [S6a]
# Anti-nuisance twin of mainfault_esp_asserted.yaml: proves the NEW
# `set_main_fault` operator-action plumbing (run_dut_scenarios.py, this
# pass) defaults to -- and stays at -- false unless a scenario explicitly
# asserts it, and that unrelated real fault/guard activity elsewhere in the
# same run cannot spuriously trip S6a through some bug in that new wiring.
# S6a's own guard condition is a single boolean with no further conditions
# (safety_guards.c's own comment: "unconditional electrical signals rather
# than thermal evidence"), so there is no internal debounce/threshold logic
# left for THIS scenario to stress the way e.g. tc_flaky.yaml's
# no_warn_storm clause stresses S5's read-count bar -- the meaningful claim
# here is specifically about the harness's own plumbing and about
# cross-guard isolation, not about a guard-internal noise-rejection
# property S6a does not have.
preset: fast_test
timescale: 1  # same observability reasoning as mainfault_esp_asserted.yaml
seed: 72
overrides: {}
dut:
  profile: cone6_fast
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    # Explicit false, twice, bracketing the unrelated fault below --
    # exercises the new action kind's parser/threading path even though it
    # is a no-op against the default (main_fault_state starts false), the
    # same "declare the fact, don't just rely on it never being set"
    # discipline command_relay/request_enable already follow elsewhere in
    # this suite.
    - { at_sim_time: 10, action: set_main_fault, asserted: false }
    - { at_sim_time: 120, action: set_main_fault, asserted: false }
faults:
  - id: estop
    # A genuine, unrelated real trip (S7) firing mid-run: proves S6a stays
    # quiet even while ANOTHER guard is actively tripping and K4 is being
    # forced open through a completely different path, not just during
    # otherwise-uneventful operation every other passing scenario already
    # (vacuously) demonstrates for S6a.
    type: estop_trip
    target: io:estop
    trigger: { at_sim_time: { t: 60 } }
    duration: { for_s: 5 }
expect:
  - name: never_trips
    forbid: { event: { type: guard_trip, guard: S6a }, before: { sim_end: true } }
  - name: unrelated_trip_still_works
    # Confirms the estop fault above is genuinely exercising something (not
    # a dead stimulus that never reaches the guard either) -- same
    # non-vacuousness discipline as estop_midfire.yaml's own fast_trip
    # clause.
    event: { type: fault_fired, slot: estop }
    then:
      event: { type: guard_trip, guard: S7 }
      within_s: 10
report_keep: [telemetry, events]
