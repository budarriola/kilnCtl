name: partial_element
version: 1
# No SaftyFW guard is specifically provoked by reduced element power: current
# stays present within normal bounds the whole time, so S3/S4's correlation
# checks see nothing but healthy behavior throughout (current present while
# relay commanded on — neither S3's "no relay commanded" nor S4's "no
# current" conditions are met). This is a KilnFW PID/ramp-rate regression
# scenario, kept in the standard library per PLAN.md §8 item 10 even though
# it has no GUARD_TEST_MATRIX.md mapping.
exercises: []
# Preset: a realistic 3-zone model with coupling/lag is used rather than
# fast_test, because "slow ramp / ramp-rate handling" is the point of the
# scenario and a compressed lumped-mass model would understate the effect
# a 60%-power coil has on ramp shape (per the task's note that scenarios
# like this benefit from `three_zone`, PLAN.md §4.3).
preset: three_zone
timescale: 20
seed: 51
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: partial
    # PLAN.md §7.1: "Partially failed coil | Wrong element resistance ->
    # wrong current + slow heating". Magnitude: ~60% power per PLAN.md §8
    # item 10 (stated there explicitly — recorded as a comment since the
    # scenario schema has no numeric param field yet, e.g. as an
    # element_health≈0.6-equivalent resistance change).
    type: partial_element_health
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
expect:
  - name: no_guard_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
  - name: current_still_present_just_reduced
    event: { type: fault_fired, slot: partial }
    then:
      dut: current_present
      within_s: 5
manual_checks:
  - "Confirm KilnFW's profile executor handles the slower ramp sensibly (extended time-to-target, no spurious ramp-rate abort) — a KilnFW-side behavior, not directly assertable from fixture-sensed signals"
report_keep: [telemetry, events]
