name: partial_element
version: 1
# No SaftyFW guard is specifically provoked by reduced element power: current
# stays present within normal bounds the whole time, so S3/S4's correlation
# checks see nothing but healthy behavior throughout (current present while
# relay commanded on — neither S3's "no relay commanded" nor S4's "no
# current" conditions are met). This is a KilnFW PID/ramp-rate regression
# scenario, kept in the standard library per PLAN.md §8 item 10 even though
# it has no GUARD_TEST_MATRIX.md mapping.
exercises: []
# Preset: a realistic 3-zone model with coupling/lag is used rather than
# fast_test, because "slow ramp / ramp-rate handling" is the point of the
# scenario and a compressed lumped-mass model would understate the effect
# a 60%-power coil has on ramp shape (per the task's note that scenarios
# like this benefit from `three_zone`, PLAN.md §4.3).
preset: three_zone
timescale: 20
seed: 51
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: partial
    # PLAN.md §7.1: "Partially failed coil | Wrong element resistance ->
    # wrong current + slow heating". Magnitude: ~60% power per PLAN.md §8
    # item 10 (stated there explicitly). params[0] = forced element_health,
    # 0..1 directly (fault_sched.h's FAULT_SCHED_TYPE_PARTIAL_ELEMENT doc
    # comment; sim_engine's P_heater = duty * V^2/R * element_health, so
    # health=0.6 IS the "~60% power" this scenario names). Without a
    # params: list this fault type reads slot->params[0] == 0.0, which is
    # indistinguishable from BROKEN_ELEMENT (fully dead, 0% power) rather
    # than "partially failed" -- fixed this pass.
    type: partial_element_health
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
    params: [0.6]
expect:
  - name: no_guard_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    blocked_on:
      reason: "This forbid clause is still satisfied for the wrong reason: K4
               is open at sim-time 0 and never closes, so it is already true
               before anything under test has had a chance to say otherwise.
               NOTE (updated after SaftyFW commit f304392): the previous
               wording here -- 'relay_owner_command_energize() is called by
               nothing in the current source tree' -- is no longer true. It
               now has a caller, safety_core_request_enable(), reached from
               link_task.c's SAFETY_CMD_REQUEST_ENABLE (0x02) decoder. That
               path is driven only by an explicit operator/PC command
               (KilnFW's uart_bridge.c -> safety_link_request_enable(), i.e.
               PcTools' safety_request_enable MCP tool); KilnFW does NOT
               request enable automatically when a profile runs, and no
               scenario in this library models that operator step."
      phase: "No longer a missing-decoder gap on the SaftyFW side --
              link_task.c decodes LINK_FRAME_REQUEST_ENABLE_CMD (0x02) today
              and relay_owner_command_energize() has its first caller. The
              remaining gap is on this side of the fence: no scenario issues
              the operator enable.
              firmware/SimFW/tools/virtual_dut/dut_core/main.c already accepts
              an ENABLE command mirroring relay_owner's TRIPPED-refuses /
              GRACE-defers / ARMED-honours behavior; run_dut_scenarios.py
              never sends one, because deciding WHEN a scenario would issue it
              is a scenario-library design question, not something a harness
              should invent. Owned by SimFW's scenario library, not by
              SaftyFW."
  - name: current_still_present_just_reduced
    event: { type: fault_fired, slot: partial }
    then:
      dut: current_present
      within_s: 5
manual_checks:
  - "Confirm KilnFW's profile executor handles the slower ramp sensibly (extended time-to-target, no spurious ramp-rate abort) — a KilnFW-side behavior, not directly assertable from fixture-sensed signals"
report_keep: [telemetry, events]
