name: partial_element
version: 1
# No SaftyFW guard is specifically provoked by reduced element power: current
# stays present within normal bounds the whole time, so S3/S4's correlation
# checks see nothing but healthy behavior throughout (current present while
# relay commanded on — neither S3's "no relay commanded" nor S4's "no
# current" conditions are met). This is a KilnFW PID/ramp-rate regression
# scenario, kept in the standard library per PLAN.md §8 item 10 even though
# it has no GUARD_TEST_MATRIX.md mapping.
exercises: []
# Preset: a realistic 3-zone model with coupling/lag is used rather than
# fast_test, because "slow ramp / ramp-rate handling" is the point of the
# scenario and a compressed lumped-mass model would understate the effect
# a 60%-power coil has on ramp shape (per the task's note that scenarios
# like this benefit from `three_zone`, PLAN.md §4.3).
preset: three_zone
timescale: 20
seed: 51
overrides: {}
dut:
  profile: cone6_fast
  # Neither expectation below was actually testable without this: K4 never
  # closes in current SaftyFW without an explicit operator enable (no
  # scenario auto-issues one -- see enabled_firing_healthy.yaml's own
  # comment for the full rationale), so `no_guard_trips`' forbid on
  # dut:K4_open was vacuously satisfied by the K4-boot-open artifact
  # (README.md Finding 2) rather than by any guard genuinely staying quiet,
  # and `current_still_present_just_reduced` could never observe current at
  # all (K4 gates duty/current to zero while open). Zone 0's relay closes
  # and the operator enables before the partial-element fault fires at
  # t=10, and is never commanded off, so the whole observation window is a
  # real, current-carrying firing.
  operator_actions:
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: partial
    # PLAN.md §7.1: "Partially failed coil | Wrong element resistance ->
    # wrong current + slow heating". Magnitude: ~60% power per PLAN.md §8
    # item 10 (stated there explicitly). params[0] = forced element_health,
    # 0..1 directly (fault_sched.h's FAULT_SCHED_TYPE_PARTIAL_ELEMENT doc
    # comment; sim_engine's P_heater = duty * V^2/R * element_health, so
    # health=0.6 IS the "~60% power" this scenario names). Without a
    # params: list this fault type reads slot->params[0] == 0.0, which is
    # indistinguishable from BROKEN_ELEMENT (fully dead, 0% power) rather
    # than "partially failed" -- fixed this pass.
    type: partial_element_health
    target: element:0
    # t=90, not the original t=10: K4 cannot close before the real 60s
    # SAFTYFW_STARTUP_GRACE_MS elapses after the t=5 operator enable added
    # above (relay_grace.c), so a fault firing at t=10 would land on a
    # de-energized zone and "current_still_present_just_reduced" could never
    # observe anything -- current only exists once K4 has permitted it.
    # t=90 gives K4's ~65s close a healthy margin before the fault fires
    # into an already-flowing current.
    trigger: { at_sim_time: { t: 90 } }
    duration: permanent
    params: [0.6]
expect:
  - name: no_guard_trips
    # Deliberately NOT `forbid: {dut: K4_open, before: {sim_end: true}}`
    # (the original form): K4 is reported open at sim-time ~1s, before the
    # operator enable has had 60s to clear the real SAFTYFW_STARTUP_GRACE_MS
    # -- that boot-open observation would make ANY scenario using this form
    # spuriously violate the forbid regardless of what happens later
    # (README.md Finding 2's corollary; the same reason
    # enabled_firing_healthy.yaml uses an event:guard_trip forbid instead of
    # a dut:K4_open one for its own S3/S4 anti-nuisance clauses). No
    # `guard:` filter -- this scenario is not about any one guard
    # (`exercises: []`), it is the claim that a partially-failed element by
    # itself must not provoke ANY of them.
    forbid: { event: { type: guard_trip }, before: { sim_end: true } }
  - name: current_still_present_just_reduced
    # Deliberately NOT `then: {dut: current_present, within_s: 5}` (the
    # original form): current is already flowing well before the fault
    # fires (K4 closes ~t=60, current present from ~t=70, fault at t=90 --
    # on purpose, so the fault lands on an already-energized zone), so
    # `current_present` produces no NEW edge for a `then:` clause to match
    # after the fault -- it was already true. report.py's grammar docstring
    # names exactly this case: a persisting level's negation stopping IS an
    # edge, so "current must not stop" is a `forbid: {dut: current_absent,
    # after: {...}}` (the same form already used by welded_contactor_s9's
    # contactor_weld_engages_on_k4_open). This is the positive claim the
    # scenario's own name makes -- reduced power, but current never drops
    # to zero -- and it WOULD fail against BROKEN_ELEMENT (element_health
    # forced to 0.0), the fault this one is deliberately not testing.
    forbid: { dut: current_absent, after: { event: { type: fault_fired, slot: partial } } }
manual_checks:
  - "Confirm KilnFW's profile executor handles the slower ramp sensibly (extended time-to-target, no spurious ramp-rate abort) — a KilnFW-side behavior, not directly assertable from fixture-sensed signals"
report_keep: [telemetry, events]
