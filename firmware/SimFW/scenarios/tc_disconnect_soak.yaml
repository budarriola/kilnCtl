name: tc_disconnect_soak
version: 1
exercises: [S5]
# S5 — Safety thermocouple invalid, graduated WARN-then-TRIP
# (SAFETY_MODEL.md §4 S5). Second half of the pair (DESIGN_NOTES.md §8 item 4):
# same disconnected-TC fault as tc_disconnect_ramp.yaml, fired later, once
# the zone is holding near its target instead of still climbing — the point
# being that S5's grace/deadline behavior must be identical regardless of
# where in the firing it happens (SAFETY_MODEL.md §2's duration bars don't
# depend on profile phase).
preset: fast_test
# timescale: 10 (one telemetry frame per ~5 sim-sec) could not resolve
# warns_first's within_s:6 window at all -- S5's "10 consecutive bad reads"
# bar needs more samples than one frame per 5s can present in 6s. Lowered
# per README Finding 8 / this task's guidance ("to increase resolution
# lower timescale, do NOT lower --poll-interval").
timescale: 1
seed: 45
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: oc_soak
    type: disconnected_tc
    target: tc:safety
    # Into the soak/hold portion of the fast_test profile. As with the ramp
    # variant, no exact "soak start" sim-time is defined in PLAN.md; this is
    # a judgment call picked to land well past the ramp in a ~2 min fast_test
    # firing (DESIGN_NOTES.md §4.3).
    trigger: { at_sim_time: { t: 90 } }
    duration: permanent
expect:
  - name: warns_first
    event: { type: fault_fired, slot: oc_soak }
    then:
      event: { type: guard_warn, guard: S5 }
      within_s: 6
      not_before_s: 4.5
  - name: trips_after_blind_grace
    event: { type: fault_fired, slot: oc_soak }
    then:
      # dut: K4_open (as originally written) is vacuously satisfied by the
      # K4-boot-open artifact documented throughout this suite (README.md
      # Finding 2 and its corollary): this file schedules no
      # dut.operator_actions:, so K4 is reported open from sim-time ~1s --
      # long before the fault -- and a level-based `dut: K4_open` clause can
      # never see an edge caused BY the trip. Rewritten to key off the
      # GUARD_TRIP event itself (same fix already applied to
      # safety_tc_frozen/cj_fault). Measured: GUARD_TRIP{S5} 60.0s after
      # fault_fired -- matches blind_grace_s = 60s almost exactly.
      event: { type: guard_trip, guard: S5 }
      within_s: 65
      not_before_s: 55
  - name: reports_nan_not_stale_value
    at_end: { dut: safety_temp_valid, equals: false }
report_keep: [telemetry, events]
