name: tc_disconnect_soak
version: 1
exercises: [S5]
# S5 — Safety thermocouple invalid, graduated WARN-then-TRIP
# (SAFETY_MODEL.md §4 S5). Second half of the pair (PLAN.md §8 item 4):
# same disconnected-TC fault as tc_disconnect_ramp.yaml, fired later, once
# the zone is holding near its target instead of still climbing — the point
# being that S5's grace/deadline behavior must be identical regardless of
# where in the firing it happens (SAFETY_MODEL.md §2's duration bars don't
# depend on profile phase).
preset: fast_test
timescale: 10
seed: 45
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: oc_soak
    type: disconnected_tc
    target: tc:safety
    # Into the soak/hold portion of the fast_test profile. As with the ramp
    # variant, no exact "soak start" sim-time is defined in PLAN.md; this is
    # a judgment call picked to land well past the ramp in a ~2 min fast_test
    # firing (PLAN.md §4.3).
    trigger: { at_sim_time: { t: 90 } }
    duration: permanent
expect:
  - name: warns_first
    event: { type: fault_fired, slot: oc_soak }
    then:
      event: { type: guard_warn, guard: S5 }
      within_s: 6
      not_before_s: 4.5
  - name: trips_after_blind_grace
    event: { type: fault_fired, slot: oc_soak }
    then:
      dut: K4_open
      within_s: 65
      not_before_s: 55
  - name: reports_nan_not_stale_value
    at_end: { dut: safety_temp_valid, equals: false }
report_keep: [telemetry, events]
