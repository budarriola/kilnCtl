name: spi_flaky_tc_ic
version: 1
exercises: [S5]
# Targets the safety-side channel (tc:safety) specifically because S5's
# trip set explicitly includes "SPI transfer failure" as one of its three
# trigger conditions (SAFETY_MODEL.md §4 S5: "Trips on: SPI transfer
# failure, NaN, or THERMO_FAULT_OPEN / OVUV / TCRANGE"), giving this
# scenario a direct guard mapping. DESIGN_NOTES.md §8 item 14's "no garbage temps
# accepted" half of the expectation is a driver-correctness property best
# checked via the fixture's shadow-truth vs. reported-value comparison and
# SPI error counters (DESIGN_NOTES.md §3.2.1) rather than a DUT-facing sensed
# signal, and is called out under manual_checks.
preset: fast_test
timescale: 10
seed: 55
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: flaky_spi
    # DESIGN_NOTES.md §7.1: "TC IC flaky SPI | Bit errors on MISO at configurable
    # rate".
    # TODO: still genuinely unresolved -- no bit-error-rate number is stated
    # anywhere in PLAN.md/SAFETY_MODEL.md, and it cannot be derived from the
    # real driver either. Read firmware/SaftyFW/src/max31856.c in full for
    # this pass: it has NO checksum/CRC/data-content sanity check at all --
    # `spi_failed` (the field S5 keys on, safety_guards.c line 227) is set
    # only from the SPI HAL transfer's own return code (transport-level
    # failure: clock stall, framing, timeout), never from inspecting the
    # bytes it got back. So the prior version of this comment's "fail the
    # driver's checksum/sanity check" framing was inaccurate -- there is no
    # such check to fail. A bit-flip on MISO that doesn't happen to trip the
    # HAL-level transfer-failure path, and doesn't happen to land in a bit
    # that flips an SR fault flag or produces a CJHF/LTHFTH-style threshold
    # crossing, is simply accepted as a garbled-but-plausible temperature --
    # there is nothing in the driver to catch it. That is a real, load-
    # bearing fact about current firmware behavior (worth flagging upstream:
    # DESIGN_NOTES.md §8 item 14's "no garbage temps accepted" expectation currently
    # has no mechanism to make it true for a corrupted-but-structurally-valid
    # transfer). No bench-derived rate exists, and none can be derived from
    # PLAN.md/SAFETY_MODEL.md -- but leaving params: unset makes
    # bit_error_rate == 0.0 (max31856_regs.c's apply_bit_errors() short-
    # circuits entirely at rate <= 0.0), which is not "an unresolved
    # magnitude", it is "no fault at all": every byte reads back clean and
    # this scenario's whole fault never does anything. That is the same
    # class of dead-test bug as this pass's other params: gaps, so it gets
    # a value too, chosen to be defensible without pretending a bench number
    # exists: params[0] = bit_error_rate, 0..1, independent per-bit flip
    # probability (fault_sched.h's FAULT_SCHED_TYPE_TC_FLAKY_SPI doc
    # comment; max31856_regs.c's apply_bit_errors(), applied per-bit to
    # every byte of every read including the SR byte at 0x0F).
    #
    # 0.5 (this pass's prior value) turned out to rest on a miscomputed
    # probability: "P(a given byte entirely unflipped) = 0.5^8 ~= 0.4%" is
    # the wrong quantity. safety_guards.c's S5 bad-read test only cares
    # about 3 of the SR byte's 8 bits (OPEN | OVUV | TCRANGE); the other 5
    # can flip freely without producing a bad read. The quantity that
    # matters is P(none of those 3 specific bits flip) = (1-rate)^3, which
    # at rate=0.5 is 0.5^3 = 12.5% per read -- not rare. safety_guards.c
    # resets s5_bad_streak/s5_bad_elapsed_s to 0 on ANY good read (S5's own
    # two-bar accumulator, safety_guards.c lines ~262-264), so a ~1-in-8
    # chance of a clean read repeatedly aborted the accumulation before it
    # could reach blind_grace_s (60s): measured, this produced
    # three separate bad-then-good cycles (safety_temp_valid toggling
    # true/false/true/false/true/false) before a long enough unbroken bad
    # run happened by chance, and GUARD_TRIP{S5} landed 92s after
    # fault_fired instead of the ~65s a persistently-blind fault
    # (tc_disconnect_*.yaml) gives. That is not wrong behavior -- it is
    # SAFETY_MODEL.md §4 S5's stated design ("a wiggled connector ... should
    # cost a warning and nothing else") working as intended against a
    # fault that is, at 0.5, still genuinely likely to self-clear for a
    # few seconds at a time. Raised to 0.95 -- P(none of the 3 bits flip) =
    # 0.05^3 = 0.0125% per read, low enough that an unbroken bad run
    # spanning the 60s window is the overwhelmingly likely outcome rather
    # than a matter of which cycle happens to run long -- while still being
    # a per-bit probabilistic flip, not the deterministic full-inversion a
    # rate of 1.0 would give (indistinguishable from dead_tc_ic/TC_DEAD_IC,
    # a different fault type this scenario is not testing).
    type: flaky_spi_tc_ic
    target: tc:safety
    trigger: { at_sim_time: { t: 20 } }
    duration: permanent
    params: [0.95]
expect:
  - name: not_an_instant_trip
    # Deliberately NOT `forbid: {dut: K4_open, before: {sim_time_s: 5}}`
    # (the original form): K4 is reported open from this harness's very
    # first observation (README.md Finding 2 -- nothing energizes it before
    # a request_enable this file never issues), and that first observation
    # can itself land anywhere in the first few sim-seconds depending on
    # real-wall-clock poll timing, making a `dut: K4_open` boundary this
    # close to sim-time 0 a coin flip unrelated to anything the guard
    # decided (measured: PASSed in an earlier run of this exact file, FAILed
    # in a later one, with no scenario change between them). Rewritten to
    # key off the GUARD_TRIP event itself, the same fix already applied
    # elsewhere in this pass -- S5 genuinely cannot trip this fast (its own
    # two bars: >= 10 consecutive bad reads AND >= 5s, SAFETY_MODEL.md §4 S5).
    forbid: { event: { type: guard_trip, guard: S5 }, before: { sim_time_s: 5 } }
  - name: warns_then_trips_like_disconnect
    event: { type: fault_fired, slot: flaky_spi }
    then:
      # dut: K4_open (as originally written) is vacuously satisfied by the
      # K4-boot-open artifact documented throughout this suite (README.md
      # Finding 2 and its corollary): this file schedules no
      # dut.operator_actions:, so K4 is reported open from sim-time ~1s --
      # long before the fault -- and a level-based `dut: K4_open` clause can
      # never see an edge caused BY the trip. Rewritten to key off the
      # GUARD_TRIP event itself (same fix already applied elsewhere in this
      # pass to cj_fault/tc_disconnect_ramp/tc_disconnect_soak).
      event: { type: guard_trip, guard: S5 }
      within_s: 65       # blind_grace_s = 60s (SAFETY_MODEL.md §4 S5) + margin,
                         # same numeric pattern as tc_disconnect_*.yaml
      not_before_s: 55
manual_checks:
  - "Confirm via SWD/telemetry SPI CRC-class error counters (DESIGN_NOTES.md §3.2.1) that the driver's own sanity checks rejected the corrupted transfers rather than accepting a garbled temperature reading — not directly observable from the fixture's DUT-facing sensed signals alone"
report_keep: [telemetry, events]
