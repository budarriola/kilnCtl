name: s2_setpoint_overshoot
version: 1
exercises: [S2]
# S2 ("sustained excess over setpoint", SAFETY_MODEL.md §4) was reachable in
# safety_core_build_input() as of commit f304392 but not provokable by this
# fixture at all: nothing in kilnsim/virtual_simfw carries a zone setpoint,
# so `max_zone_setpoint_c` was always NaN and `in->tc_c > in->max_zone_
# setpoint_c + margin` was always false regardless of temperature
# (run_dut_scenarios.py's own module docstring documented this as a known
# gap). This scenario closes it: run_dut_scenarios.py gained a
# `dut.zone_setpoints:` mapping (2026-08-20, this pass) that lets a scenario
# declare a static, per-zone setpoint_c -- the same kind of honest stand-in
# for "what a real ESP's PID would be holding" that `operator_actions:`
# already is for "what a real ESP's PID would be commanding". Zone 0's
# setpoint is declared at 150°C below; no PID exists here to chase it (there
# is no controller in this fixture at all, only the direct relay commands
# below), so zone 0's temperature simply runs away past it under full duty,
# which is exactly the "sustained excess" S2 exists to catch.
#
# Physics (fast_test preset, zone 0, thermal_model.c THERMAL_PRESET_
# FAST_TEST's unmodified params: C=2000 J/degC, k_loss=8 W/degC,
# R_element=15 ohm, V_mains=240V, T_ambient=25degC):
#   T_inf = T_ambient + V_mains^2 / (R_element * k_loss) = 25 + 480 = 505 degC
#   tau = C / k_loss = 2000 / 8 = 250s
# Crossing setpoint(150) + overshoot_margin_c(75 default) = 225degC:
#   225 = 505 - 480 * exp(-t/250)  =>  t = 250 * ln(480/280) ~= 134.7s after
#   heat starts. S2 needs overshoot_time_s (120s default) sustained past
#   that -- and the rise is monotonic toward 505 the whole run (nothing ever
#   commands K1 off), so once past 225degC it never comes back down, and the
#   guard trips at ~134.7 + 120 = ~254.7s after heat starts.
preset: fast_test
timescale: 10
seed: 66
overrides: {}
dut:
  profile: cone6_fast
  # Static setpoint declaration (see the header comment above and
  # run_dut_scenarios.py's "Zone setpoints" docstring section). Zone 0 is
  # the only zone with a commanded relay below, so it is the only zone whose
  # setpoint matters to context_reduce_zones()'s max -- zones 1/2 keep
  # setpoint_c = NaN (unset), which never wins that max (NaN comparisons are
  # always false), so they cannot distort it even though they are still
  # "eligible" (active + measured-valid) every tick.
  zone_setpoints:
    0: 150.0
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
faults: []
expect:
  - name: s2_trips_after_sustained_overshoot
    event: { type: relay_edge, relay: K4, edge: close }
    then:
      event: { type: guard_trip, guard: S2 }
      within_s: 310        # ~254.7s true worst case (see header comment)
                            # + margin for the K4-close-to-current-flowing
                            # gap this file does not itself measure, plus
                            # telemetry quantization
      not_before_s: 220    # safely below the ~254.7s true minimum, and
                            # safely above the ~134.7s crossing time alone --
                            # a bare crossing must not be enough, the
                            # overshoot_time_s=120s bar has to clear too
                            # (two-bar doctrine, SAFETY_MODEL.md §2)
  - name: no_trip_before_k4_closes
    # Trivial but real: nothing can overshoot a setpoint before the zone is
    # even permitted to draw any power at all.
    forbid: { event: { type: guard_trip, guard: S2 }, before: { event: { type: relay_edge, relay: K4, edge: close } } }
manual_checks:
  - "This scenario's setpoint (150°C) and margin (S2's overshoot_margin_c default, 75°C) are chosen so the crossing point (225°C) sits well inside fast_test zone-0's ~505°C asymptote, with margin for both the guard's own bars (SAFETY_MODEL.md §2's two-bar doctrine) and this fixture's telemetry quantization at timescale 10 -- re-derive the header comment's arithmetic before reusing this pattern against a different preset or setpoint."
report_keep: [telemetry, events]
