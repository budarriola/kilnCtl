name: mainfault_esp_asserted
version: 1
exercises: [S6a]
# S6a ("The ESP explicitly asserts fault", SAFETY_MODEL.md §4 S6) trips on
# `mainFault` (GPIO10) reading LOW, debounced 200ms by discrete_task --
# unconditional, "no further conditions" (safety_guards.c's own S6a block
# comment). `mainfault_tc_disconnect.yaml` tries to provoke it INDIRECTLY,
# through a causal chain this fixture cannot complete end to end (TC fault
# -> KilnFW's own guard-6 logic -> Fault-line opto -> virtual_simfw's
# `fault_line_asserted`, and there is no KilnFW process anywhere in this
# fixture to run that logic) -- see that file's own `blocked_on` for the
# full accounting. That gap is real and stays open; this scenario does not
# try to close it.
#
# What changed (2026-08-21): dut_core.exe's TICK line has always had an
# OPTIONAL trailing `<main_fault>` field (commit 5375bca), documented as
# "already-debounced ... standing in for discrete_task_main_fault()" --
# i.e. it is the OUTCOME of the ESP's decision, not the causal chain that
# produces it. run_dut_scenarios.py simply never populated it (always sent
# the parameter's default, main_fault=False). This scenario uses a new
# `dut.operator_actions:` kind, `set_main_fault`, to declare that outcome
# directly at a scheduled sim-time -- exactly the same category of honesty
# `request_enable` already uses to stand in for an operator's decision
# instead of this fixture running a whole UI/button-press model to arrive
# at one. Nothing about the real guard is bypassed: `safety_guards.c`'s S6a
# block still runs unmodified, still sees a plain boolean on its own input
# struct, and still decides for itself whether to trip.
preset: fast_test
# timescale 1 (not this suite's usual 10): virtual_simfw's own TELEMETRY
# broadcast is real-time-paced (TELEMETRY_RATE_HZ, virtual_simfw.c), so one
# broadcast period is 500ms of WALL time regardless of timescale -- at
# timescale 10 that is 5 sim-seconds of unavoidable observation latency
# (measured directly while fixing power_blip.yaml's own `within_s` windows
# for the identical reason), at timescale 1 it is 0.5 sim-seconds. Lower
# timescale buys tighter, more meaningful `within_s` windows below without
# inflating them to cover wall-clock broadcast latency -- same guidance
# tc_disconnect_ramp.yaml's own header already gives for an unrelated S5
# window ("to increase resolution lower timescale, do NOT lower
# --poll-interval").
timescale: 1
seed: 71
overrides: {}
dut:
  profile: cone6_fast
  # K1 closed + enable requested so this is a genuine mid-fire trip (current
  # flowing, K4 already closed) rather than a boot-time one -- matching
  # estop_midfire.yaml's own convention for the same reason, even though
  # S6a's own trip condition does not require current (it is unconditional,
  # same as S7 -- safety_guards.c's own comment groups them together).
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    # K4 cannot close before SAFTYFW_STARTUP_GRACE_MS (60s) elapses; 90s
    # gives it comfortable margin (same margin power_blip.yaml uses for the
    # identical reason) before the assertion below.
    - { at_sim_time: 90, action: set_main_fault, asserted: true }
faults: []
expect:
  - name: no_early_trip
    # Anchored on the assertion's own synthetic mark (see
    # run_dut_scenarios.py's `set_main_fault` handling) rather than
    # `before: {sim_end: true}`: this also doubles as the "healthy mid-fire
    # activity alone does not trip S6a" claim -- K1 closed, K4 closed,
    # current flowing for 85s before the assertion, and S6a stays quiet
    # throughout all of it.
    forbid:
      event: { type: guard_trip, guard: S6a }
      before: { event: { type: sim_clock_mark, entity: main_fault, state: true } }
  - name: trips_promptly
    event: { type: sim_clock_mark, entity: main_fault, state: true }
    then:
      event: { type: guard_trip, guard: S6a }
      # S6a's own trip condition is met on the very tick dut_core.exe sees
      # main_fault=true (unconditional, no debounce at the guard layer --
      # that already happened upstream). This window is not a guard-timing
      # bar; it is purely how long the harness's own ~poll-cadence-bound
      # tick() calls can take to observe the flag at all (see the
      # `timescale: 1` comment above) -- generous margin over that.
      within_s: 10
  - name: k4_opens_promptly
    event: { type: sim_clock_mark, entity: main_fault, state: true }
    then:
      dut: K4_open
      within_s: 10
  - name: trip_latched
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm KilnFW's own UI/web surfaces a distinct 'main controller fault' reason when it is the one asserting mainFault (not observable by the fixture, which only sees the debounced GPIO10 level SaftyFW receives)"
report_keep: [telemetry, events]
