name: stuck_load_no_command_s3
version: 1
exercises: [S3]
# The first scenario built to make S3 actually TRIP, rather than to be
# evaluated and stay quiet for want of current.
#
# S3 (SAFETY_MODEL.md §4) is "load active with no heat commanded": current
# present while nothing has been commanded on within correlation_window_s
# (150s), sustained for stuck_on_time_s (20s). welded_ssr_midfire.yaml aims
# at the same guard but welds K1 *mid-firing*, when K1 has been commanded on
# -- so its `relay_commanded_recently` half is true and S3 is correctly
# inhibited for 150s after the last command. This scenario removes that
# confound: no zone relay is EVER commanded here, so relay_recent_mask is 0
# for the whole run and the weld is the only thing that can put current on
# the CT.
#
# Sequence: enable at 5s -> K4 closes at 60s (real SAFTYFW_STARTUP_GRACE_MS)
# with the kiln idle and drawing nothing -> at 70s zone 0's SSR welds shut,
# so duty is forced to 1 with K1 still sensed open -> 240V / 15R = 16A on
# CT0, an order of magnitude over i_present_a's 2.0A default -> S3 accumulates
# and trips ~20s later, opening K4 and killing the current.
preset: fast_test
# timescale 2, not the library's usual 10, and deliberately so. virtual_simfw
# advances its sim clock by exactly `timescale` sim-seconds per wall second
# (it used to advance by timescale**2 -- its main loop scaled the tick
# ACCUMULATOR by timescale and then each 100ms tick advanced sim by
# 100ms * timescale, applying the factor twice; that is fixed, and
# tools/PcTools/tests/test_kilnsim_virtual_simfw.py::
# test_timescale_advances_sim_linearly_not_quadratically now guards it).
# Its 2Hz telemetry broadcast therefore lands one frame every
# `0.5 / timescale` sim-seconds: 5 sim-seconds at timescale 10 -- only ~4
# samples across the shortest guard window this library tests (S3's 20s
# stuck_on_time_s), which would make a guard verdict as much a measurement of
# the sampling as of the guard. At timescale 2 the same broadcast is one frame
# per sim-second, comfortably finer than every window under test. See
# virtual_dut/README.md's batch-ticking note and its Finding 8.
timescale: 2
seed: 61
overrides: {}
dut:
  profile: cone6_fast
  # See run_dut_scenarios.py's module docstring. The enable is the operator
  # step KilnFW never performs automatically; without it K4 stays open, the
  # sim gates all duty to zero, and this scenario would degenerate into the
  # very dead test it exists to replace.
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: weld
    # FAULT_SCHED_TYPE_WELDED_RELAY: duty forced to 1 for the target zone
    # regardless of the relay sense (fault_sched.h) -- a shorted/welded SSR.
    # Takes no params[], so there is no magnitude to get wrong here (contrast
    # welded_k4_current_persist, which silently forces 0.0A without one);
    # the resulting current comes from the preset's own physics:
    # V_mains 240 / zones[0].R_element 15 * element_health 1.0 = 16.0A.
    type: welded_ssr
    target: relay:K1
    # Deliberately AFTER the 60s startup grace, so the weld happens into an
    # already-armed, already-closed K4 -- i.e. the current genuinely reaches
    # the CT. A weld before 60s would be gated to zero amps by K4 and would
    # only re-create the old dead test.
    trigger: { at_sim_time: { t: 70 } }
    duration: permanent
expect:
  - name: uncommanded_current_appears_with_the_weld
    # Also the proof that K4 is closed at this point: sim_engine.c gates every
    # zone's duty on K4, so current on CT0 is only possible with K4 permitting.
    event: { type: fault_fired, slot: weld }
    then:
      dut: current_present
      within_s: 10       # one ~2Hz telemetry frame (~2 sim-seconds at
                         # timescale 2) plus margin
  - name: s3_trips_on_uncommanded_load
    event: { type: fault_fired, slot: weld }
    then:
      event: { type: guard_trip, guard: S3 }
      within_s: 40       # stuck_on_time_s = 20s (SAFETY_MODEL.md §4 S3), plus
                         # up to two telemetry frames of quantization before
                         # the current is even observed, plus margin
      not_before_s: 15   # the lower bar of the two-bar doctrine
                         # (SAFETY_MODEL.md §2): a magnitude alone is never
                         # enough, 20s of it is required. Set one tick-batch
                         # BELOW the real 20s bar, not at it, and that gap is
                         # measurement error rather than slack: virtual_dut
                         # replays one telemetry sample across the whole batch
                         # of 100ms guard ticks that covers the elapsed sim
                         # time (see run_dut_scenarios.py's batch-tick
                         # comment), so the first batch that sees current
                         # credits the guard's accumulator for the ~2 sim-
                         # seconds preceding the sample too. Measured: trip at
                         # 18.8s after the weld fired, 18.2s after current was
                         # first observed. Asserting >= 20 here would be
                         # asserting the fixture's sampling, not the guard's
                         # threshold.
  - name: s3_does_not_trip_before_there_is_any_current
    # The idle, enabled, drawing-nothing period from 60s to 70s is itself an
    # anti-nuisance check: K4 closed, context valid, zero amps, nothing
    # commanded -- S3 must be silent.
    forbid: { event: { type: guard_trip, guard: S3 }, before: { fault: weld } }
  - name: k4_opens_and_stays_open
    at_end: { dut: K4_open }
  - name: current_stops_when_k4_opens
    # K4 is in series with every zone's power path, and this weld is a duty
    # override, not a welded contactor downstream of K4 (that is
    # welded_contactor_s9.yaml's job) -- so the trip must actually kill the
    # current. If it did not, S9 would be the guard under test instead.
    event: { type: guard_trip, guard: S3 }
    then:
      dut: current_absent
      within_s: 10
manual_checks:
  - "Confirm KilnFW's LCD/web UI names the S3 trip reason distinctly ('load active with no heat commanded'), not a generic fault — fixture cannot read display/web content"
report_keep: [telemetry, events]
