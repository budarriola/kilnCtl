name: safety_tc_frozen
version: 1
exercises: [S11]
# S11 ("Frozen safety reading", SAFETY_MODEL.md §4) applies to *whichever*
# safety-side source is active -- the Pico's own MAX31856 (tc_source=OWN_J7),
# a borrowed zone channel (BORROWED_ZONE), or both (BOTH). This scenario
# freezes the safety-side channel (tc:safety) directly with `stuck_tc`,
# which is the right target regardless of tc_source: in OWN_J7/BOTH it
# freezes the Pico's own conversion (the case this scenario is built for);
# in BORROWED_ZONE it would freeze the exact main-side register the ESP
# forwards over the context link, which is *also* S13's trigger condition on
# the same fault mechanism -- see tc_stuck.yaml's own manual_checks note
# (that file fires the identical `stuck_tc` fault on tc:0, the main-side
# channel, specifically to land on S13 instead of S11). The two guards read
# disjoint facts (safety_guards.c: S11 reads only tc_c/tc_valid/
# heat_commanded; S13 reads only context_valid/sample_counter_advancing) so
# firing on tc:safety here cannot accidentally exercise S13 instead.
preset: fast_test
timescale: 10
seed: 61
overrides: {}
dut:
  profile: cone6_fast
  # 2026-08-20 pass: safety_core_build_input() now wires heat_commanded from
  # any_current_present (the guard's own gate: `if (in->tc_valid &&
  # in->heat_commanded)`), so this scenario needs a real, closed K4 and a
  # real commanded relay for the 600s window to ever start accumulating --
  # exactly the same operator-action need welded_ssr_midfire.yaml/
  # stuck_load_no_command_s3.yaml already established for S3/S4. K1 is never
  # commanded off, so current (and therefore heat_commanded) stays true for
  # the rest of the run once K4 permits it.
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
faults:
  - id: freeze
    # DESIGN_NOTES.md §7.1 TC/sensor fault catalog: "Stuck TC | LTCB frozen at last
    # value while zone keeps moving". Fired 5s in (near the start of the
    # ramp) so the ~600s frozen_window_s accumulates from as close to t=0 as
    # this library's convention allows (matching tc_disconnect_ramp.yaml's
    # early-in-the-ramp placement for the same reason: leave the whole rest
    # of the run to observe the guard).
    type: stuck_tc
    target: tc:safety
    trigger: { at_sim_time: { t: 5 } }
    duration: permanent
expect:
  - name: no_early_trip
    # Genuinely meaningful now (contrast the pre-2026-08-20 `forbid:
    # {dut: K4_open, before: {fault: freeze}}` form, which was structurally
    # broken by K4's own boot-open state -- see virtual_dut/README.md
    # Finding 2). The freeze fault fires at sim-time 5s, before K4 even
    # closes (~61s), so this is a real, if modest, assertion: nothing in the
    # guard/relay stack can produce an S11 trip before the fault that must
    # cause it has even fired.
    forbid: { event: { type: guard_trip, guard: S11 }, before: { fault: freeze } }
  - name: frozen_window_trips_s11
    # Not measured from K4 closing -- from the freeze fault itself (t=5s),
    # matching the other clauses' convention -- but the real deadline has to
    # account for the fact that S11's window cannot even START until
    # heat_commanded goes true, which needs the full 60s SAFTYFW_STARTUP_
    # GRACE_MS plus the operator's enable landing (~61s absolute, per
    # enabled_firing_healthy.yaml's own measured K4-close timing) before the
    # 600s frozen_window_s bar even begins counting. Worst case: freeze at
    # 5s (reading already pinned at its near-ambient value from t=5 on,
    # since stuck_tc freezes tc:safety at whatever it read when the fault
    # fired), heat_commanded first true ~63s (K4 close + one telemetry
    # frame of current-present quantization), window completes 600s later
    # -> trip at ~663s absolute -> ~658s after the freeze fault. within_s
    # below is deliberately generous over that (not a tight bound) because
    # the exact K4-close/current-start timing is itself only measured
    # elsewhere (enabled_firing_healthy.yaml), not re-derived here.
    event: { type: fault_fired, slot: freeze }
    then:
      event: { type: guard_trip, guard: S11 }
      within_s: 700        # ~658s true worst case + ~40s margin for the
                            # K4-close/current-start timing this file does
                            # not itself measure precisely
      not_before_s: 630    # comfortably below the ~658s true minimum, and
                            # well above the ~63s point heat_commanded first
                            # goes true -- proves the full 600s bar, not just
                            # "eventually", is required
  - name: trip_latched
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm SaftyFW is commissioned with tc_source=OWN_J7, BORROWED_ZONE, or BOTH before running -- S11 evaluates against whichever source is active (SAFETY_MODEL.md §4 S11), and commissioning state is not something the fixture itself can verify or set."
  - "This scenario now drives current directly via `dut.operator_actions:` (request_enable + K1 closed, held closed for the whole run) rather than relying on a KilnFW profile's PID -- there is no PID in this fixture at all, and nothing here ever commands K1 off, so heat_commanded cannot gap mid-window the way a duty-cycled soak could (safety_guards.c: `else { state->s11_window_active = false; }` on any gap). The prior version of this note worried about exactly that gap under a hypothetical PID-driven soak; it no longer applies because there is no PID path in play here at all -- flagged here rather than silently deleted, since the underlying safety_guards.c behavior (any gap resets the window) is still real and still worth knowing about for a bench run that DOES duty-cycle."
report_keep: [telemetry, events]
