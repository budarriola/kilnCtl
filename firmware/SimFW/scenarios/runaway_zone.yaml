name: runaway_zone
version: 1
exercises: [S3, S8]
# DESIGN_NOTES.md §8 item 12: "heat with relay open (model-forced); the S8-relevant
# scenario (S8 itself ships disabled; scenario documents expected *current*
# behavior and is ready for when S8 gets a measured threshold)."
#
# Forcing P_heater regardless of relay state produces the same physical
# signature S3 exists to catch (current flowing, no relay commanded), so in
# TODAY's system S3 trips this well before any dangerous rate-of-rise
# develops — S8 never gets the chance to matter. This scenario documents
# that current behavior explicitly, and separately documents that S8
# produces no trip of its own (it ships disabled, max_rate_c_per_min = 0,
# SAFETY_MODEL.md §4 S8) so the assertion below must be revisited once S8
# is enabled with a measured threshold (TODO.md phase 6).
preset: fast_test
timescale: 10
seed: 53
overrides: {}
dut:
  profile: cone6_fast
  # ONLY the operator enable, deliberately never a command_relay: this
  # scenario's whole point is heat with the zone relay NEVER commanded
  # (S3's `!relay_commanded_recently` half), so K1 must stay uncommanded for
  # the entire run. K4 still needs the interlock permit (request_enable) for
  # any current to be observable at all -- sim_engine.c gates CT current on
  # K4 regardless of what forces P_heater on -- so this is the minimum
  # action that makes the scenario's own fault provokable without
  # contradicting what it is testing.
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: runaway
    # DESIGN_NOTES.md §7.1 system-fault catalog: "Runaway zone | Force P_heater on
    # regardless of relay state (model-level)".
    type: runaway_zone
    target: zone:0
    # Was `at_zone_temp: {zone: 0, temp_c: 300}` -- unreachable as written:
    # K1 is deliberately never commanded in this file (see operator_actions
    # above), so zone 0 never heats above ambient until the runaway fault
    # itself forces P_heater on, which is a chicken-and-egg a temperature
    # trigger can never resolve. Switched to at_sim_time, same fix already
    # applied to welded_ssr_midfire.yaml/welded_contactor_s9.yaml/
    # power_blip.yaml for the same reason. t=90 gives K4's ~65s close a
    # comfortable margin.
    trigger: { at_sim_time: { t: 90 } }
    duration: permanent
expect:
  - name: s3_catches_it_first
    event: { type: fault_fired, slot: runaway }
    then:
      # Deliberately NOT `dut: K4_open` (the original form): K4 is reported
      # open from this harness's very first observation (README.md Finding
      # 2), long before the fault, so a level-based clause can never see an
      # edge caused BY the trip. Rewritten to key off the GUARD_TRIP event
      # itself, the same fix already applied elsewhere in this pass.
      event: { type: guard_trip, guard: S3 }
      within_s: 25       # stuck_on_time_s = 20s (SAFETY_MODEL.md §4 S3) + margin
      not_before_s: 18
  - name: s8_produces_no_trip_of_its_own_today
    forbid: { event: { type: guard_trip, guard: S8 }, before: { sim_end: true } }
    # S8 ships disabled (max_rate_c_per_min = 0, SAFETY_MODEL.md §4 S8) —
    # this documents CURRENT behavior and must be revisited once S8 is
    # enabled with a measured maximum legitimate ramp rate (TODO.md phase 6)
manual_checks:
  - "Once S8 is enabled (TODO.md phase 6), re-run this scenario and add an assertion that S8 itself would have tripped before S1's absolute ceiling, per SAFETY_MODEL.md §4 S8's stated intent"
report_keep: [telemetry, events]
