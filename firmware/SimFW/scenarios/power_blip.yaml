name: power_blip
version: 1
exercises: [S6b]
# S6a (mainFault) and S6b (link timeout) are treated separately, per
# SAFETY_MODEL.md §4 S6's own instruction that "they are not redundant
# copies of each other and must never be collapsed into one": with the main
# board unpowered, R8 pulls GPIO10 (mainFault) high, which reads *healthy* —
# "mainFault cannot detect a dead ESP" — so S6a structurally CANNOT react to
# an unannounced DUT power cut (confirmed by re-reading safety_guards.c: its
# S6a block reads only in->main_fault_asserted, which this fault has no way
# to set true) and only S6b's link-timeout path can possibly react here.
# Previously declared as generic `S6`; corrected to the specific `S6b` this
# scenario actually exercises (audit finding, see
# firmware/SaftyFW/docs/GUARD_TEST_MATRIX.md §5). S6a coverage for an
# ESP-detected fault (as opposed to an ESP-unpowered fault, which S6a cannot
# see by design) is a separate scenario:
# firmware/SimFW/scenarios/mainfault_tc_disconnect.yaml.
#
# This fault is NOT one of PLAN.md §7.1's three catalog tables — it uses the
# fixture's dedicated DUT 12V power relay (PLAN.md §3.4/§6.2), a distinct
# fixture capability from the TC/power-path/system fault catalog.
preset: fast_test
timescale: 10
seed: 57
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: blip
    type: dut_power_cut
    target: io:dut_power
    # Trigger lowered from 500degC to 400degC this pass -- fast_test's zone 0
    # (unmodified defaults, thermal_model.c THERMAL_PRESET_FAST_TEST) has a
    # physics asymptote of only ~505degC (V_mains^2/R_element/k_loss +
    # T_ambient = 240^2/15/8 + 25 = 505degC), so a 500degC trigger sat 1%
    # below the ceiling and needed ~115s wall time at 10x timescale to reach
    # (~4.6 thermal time constants) -- consuming nearly all of fast_test's
    # ~2min wall-time budget just to arrive, before this scenario's own
    # post-trigger deadlines (safe_resume within_s: 30, etc.) even start.
    # 400degC reaches in ~38s wall (~1.5 time constants), matching the
    # trigger already used for the same "mid-fire" intent in
    # welded_ssr_midfire.yaml/welded_contactor_s9.yaml. See
    # estop_midfire.yaml's identical fix for the full derivation.
    trigger: { at_zone_temp: { zone: 0, temp_c: 400, edge: rising } }
    # 200ms off-time, matching PLAN.md §6.2's own CLI example
    # (`kilnsim power cycle --off-ms 200`) rather than a guessed duration.
    duration: { for_s: 0.2 }
expect:
  - name: mainfault_reads_healthy_during_blip
    forbid: { event: { type: guard_trip, guard: S6a }, before: { sim_end: true } }
    # "R8 pulls GPIO10 high, and it reads healthy" while the ESP is
    # unpowered (SAFETY_MODEL.md §4 S6) — S6a must never trip from this
  - name: relays_deenergize_no_current_during_blip
    event: { type: dut_power, state: off }
    then:
      dut: current_absent
      within_s: 1
    # relay outputs are expected to fail safe (de-energized) with the ESP
    # unpowered, so no CT current should flow during the blip
  - name: s6b_stays_at_warn_not_trip
    forbid: { dut: K4_open, before: { sim_end: true } }
    blocked_on:
      reason: "One of the two original reasons here is now resolved, the other
               is not. RESOLVED: link_up is no longer permanently false --
               commit f304392 wired it to link_task_link_up() (a CRC-valid
               frame within LINK_UP_RECENCY_MS), and S6b's unconditional ~120s
               hard-backstop trip, which previously fired in 16 of 19
               virtual_dut scenarios, now fires in none of them. This clause's
               'stays at warn, not trip' claim is finally testable in
               principle. NOT RESOLVED: K4 is still open from sim-time 0 (no
               scenario issues the operator SAFETY_CMD_REQUEST_ENABLE -- see
               the K4 blocked_on entries elsewhere in this library), so the
               forbid clause is still satisfied before the blip has had a
               chance to prove anything."
      phase: "link_up: done (f304392, link_task_link_up() +
              safety_core_build_input() reading it). K4 energize: no longer a
              missing decoder either -- link_task.c decodes
              LINK_FRAME_REQUEST_ENABLE_CMD (0x02) and
              relay_owner_command_energize() has its first caller. The
              residual gap is scenario-side: nothing here performs the
              operator enable step. Also note that a 0.2s blip is far shorter
              than LINK_UP_RECENCY_MS (1000ms), so even a faithful fixture
              would not necessarily drop link_up at all -- revisit this
              clause's off-time against that constant before treating a PASS
              here as evidence about S6b."
    # quiet link + no current = "not an emergency... warn and keep
    # watching" (SAFETY_MODEL.md §4 S6) — this is the expected, SAFE
    # outcome of a brief blip with no current flowing, distinct from the
    # 10s soft-trip path that applies only when current IS present
  - name: safe_resume
    event: { type: dut_power, state: on }
    then:
      event: { type: link_up }
      within_s: 30
    # TODO: still genuinely unresolvable from docs/code alone -- confirmed
    # for this pass by re-reading SAFETY_MODEL.md §4 S6's own text: "The
    # window is 20s (REBOOT_GRACE_WINDOW_MS, safety_core.c) ... a software
    # timeout with generous margin over a plausible ESP32-S3 boot-to-first-
    # PUSH_CONTEXT time" -- but that number covers an *announced* OTA
    # restart specifically (in->reboot_grace_active gates only the S6b
    # trip() calls for that narrow case, safety_guards.c's S6 block) and the
    # doc is explicit the mechanism "does not apply" to an unannounced power
    # cut, where the ESP gets no chance to send ANNOUNCE_REBOOT before power
    # actually disappears. No other boot-to-first-context timing figure
    # exists anywhere in SAFETY_MODEL.md or the safety-side code (which
    # cannot see the ESP's boot process at all -- it only sees the link go
    # quiet and come back). The only other numeric anchor is
    # link_dead_hard_s's 120s unconditional backstop (SAFETY_MODEL.md §4
    # S6b) -- an upper bound on how long S6b tolerates silence before
    # tripping regardless of current, not a statement about how fast a cold
    # boot actually completes. 30s remains a placeholder order-of-magnitude
    # margin (comfortably under the 120s hard backstop so this scenario's
    # "safe resume" case and S6b's "conditionally trips" case stay clearly
    # distinguishable) pending an actual bench measurement of ESP32-S3
    # cold-boot-to-first-PUSH_CONTEXT time.
manual_checks:
  - "Confirm KilnFW resumes the firing (or safely aborts/pauses per its own policy) rather than silently continuing as if nothing happened — LCD/web UI behavior not observable by the fixture"
report_keep: [telemetry, events]
