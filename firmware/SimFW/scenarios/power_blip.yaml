name: power_blip
version: 1
exercises: [S6b]
# S6a (mainFault) and S6b (link timeout) are treated separately, per
# SAFETY_MODEL.md §4 S6's own instruction that "they are not redundant
# copies of each other and must never be collapsed into one": with the main
# board unpowered, R8 pulls GPIO10 (mainFault) high, which reads *healthy* —
# "mainFault cannot detect a dead ESP" — so S6a structurally CANNOT react to
# an unannounced DUT power cut (confirmed by re-reading safety_guards.c: its
# S6a block reads only in->main_fault_asserted, which this fault has no way
# to set true) and only S6b's link-timeout path can possibly react here.
# Previously declared as generic `S6`; corrected to the specific `S6b` this
# scenario actually exercises (audit finding, see
# firmware/SaftyFW/docs/GUARD_TEST_MATRIX.md §5). S6a coverage for an
# ESP-detected fault (as opposed to an ESP-unpowered fault, which S6a cannot
# see by design) is a separate scenario:
# firmware/SimFW/scenarios/mainfault_tc_disconnect.yaml.
#
# This fault is NOT one of DESIGN_NOTES.md §7.1's three catalog tables — it uses the
# fixture's dedicated DUT 12V power relay (DESIGN_NOTES.md §3.4/§6), a distinct
# fixture capability from the TC/power-path/system fault catalog.
preset: fast_test
timescale: 10
seed: 57
overrides: {}
dut:
  profile: cone6_fast
  # Needed for two independent reasons: (1) the blip fault's own trigger is
  # `at_zone_temp: {zone: 0, temp_c: 400}`, which fast_test's zone 0 only
  # reaches under real commanded duty (K1 closed, K4 permitting current --
  # nothing in this fixture heats a zone on its own); (2) `s6b_stays_at_warn_
  # not_trip`'s forbid on K4_open needs K4 actually closed beforehand, or it
  # is vacuously satisfied by the K4-boot-open artifact (README.md Finding 2)
  # rather than by S6b genuinely staying at WARN through the blip.
  operator_actions:
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: blip
    type: dut_power_cut
    target: io:dut_power
    # Was `at_zone_temp: {zone: 0, temp_c: 400}` (a past pass's fix for an
    # even-less-reachable 500degC trigger). That reasoning predates this
    # file's own `dut.operator_actions:` (added this pass, see above): K4
    # cannot close before the real 60s SAFTYFW_STARTUP_GRACE_MS elapses, so
    # duty does not start until ~t=65s, and fast_test's zone 0 needs on the
    # order of 300+s of full duty to climb from ambient to 400degC (measured
    # elsewhere in this suite: welded_ssr_midfire.yaml's own header derives
    # ~304s for the same preset/target) -- ~370s total, which timed out this
    # scenario's run before the fault ever fired (measured: 253s wall-clock-
    # equivalent sim time, zone still climbing, fault never triggered).
    # Nothing about "mid-fire" requires a specific temperature -- only that
    # current is genuinely flowing when the blip happens -- so this switches
    # to `at_sim_time`, the same fix already applied to
    # welded_ssr_midfire.yaml/welded_contactor_s9.yaml for the identical
    # reason. t=90 gives K4's ~65s close a comfortable margin.
    trigger: { at_sim_time: { t: 90 } }
    # 200ms off-time, matching DESIGN_NOTES.md §6's own CLI example
    # (`kilnsim power cycle --off-ms 200`) rather than a guessed duration.
    duration: { for_s: 0.2 }
expect:
  - name: mainfault_reads_healthy_during_blip
    forbid: { event: { type: guard_trip, guard: S6a }, before: { sim_end: true } }
    # "R8 pulls GPIO10 high, and it reads healthy" while the ESP is
    # unpowered (SAFETY_MODEL.md §4 S6) — S6a must never trip from this
  - name: relays_deenergize_no_current_during_blip
    event: { type: dut_power, state: off }
    then:
      dut: current_absent
      within_s: 1
    # relay outputs are expected to fail safe (de-energized) with the ESP
    # unpowered, so no CT current should flow during the blip
    blocked_on:
      reason: "The FT_DUT_POWER_CUT fault's `dut_power_on` flag is now
               genuinely observable (this pass wired a SIM_EVENT_DUT_POWER
               edge -- see virtual_simfw.c's apply_edge_effects(), no
               real-firmware analog exists to port since real hardware
               never fakes cutting its own power), but it is still purely
               OBSERVATIONAL in this fixture: nothing in virtual_simfw.c
               ties `dut_power_on` to K1/K2/K3's driven state, to CT
               current, or to telemetry/link delivery. Real hardware losing
               its main-board 12V would presumably float its GPIO relay
               drivers open (fail-safe) and stop transmitting; this
               simulator keeps commanding relays and publishing telemetry
               exactly as if nothing happened, so current never actually
               stops during a blip here."
      phase: "Fixture-emulation gap (category 1, GUARD_TEST_MATRIX.md-style
               accounting): modeling 'board loses power -> its GPIO outputs
               fail-safe -> current stops' is a real addition to
               virtual_simfw.c's power model (gating relay/CT state on
               dut_power_on inside device_tick()), not a one-line wiring
               fix, and is left for a future pass rather than rushed into
               this one alongside everything else it touches."
  - name: s6b_stays_at_warn_not_trip
    # Deliberately NOT `forbid: {dut: K4_open, before: {sim_end: true}}`
    # (the original form): K4 is reported open from sim-time ~1s regardless
    # of anything under test (README.md Finding 2's corollary), so a
    # `before: sim_end` boundary spanning the whole run would flag that
    # boot-open observation as a violation even now that the
    # operator_actions above make K4 genuinely close later. Anchored on K4's
    # own first close edge instead: "once K4 has closed, it must not open
    # again" is exactly S6b's "stays at warn, not trip" claim, and does not
    # care what K4 was doing before anyone commanded anything.
    forbid: { dut: K4_open, after: { event: { type: relay_edge, relay: K4, edge: close } } }
    # quiet link + no current = "not an emergency... warn and keep
    # watching" (SAFETY_MODEL.md §4 S6) — this is the expected, SAFE
    # outcome of a brief blip with no current flowing, distinct from the
    # 10s soft-trip path that applies only when current IS present.
    # NOTE: a 0.2s blip is far shorter than LINK_UP_RECENCY_MS (1000ms), so
    # a faithful fixture would not necessarily drop link_up at all --a PASS
    # here mainly demonstrates S6b tolerates a blip this short without
    # incident, not that it correctly handles a longer, genuinely link-down
    # blip. That is this scenario's own off-time choice (DESIGN_NOTES.md §6's CLI
    # example), not a fixture gap.
  - name: safe_resume
    event: { type: dut_power, state: on }
    then:
      event: { type: link_up }
      within_s: 30
    blocked_on:
      reason: "EventType.LINK_UP (protocol.py: 'kilnlink came back up (e.g.
               after power_blip)' -- reserved with exactly this clause in
               mind) had no producer at all before this pass; it now fires
               on a genuine link_up rising edge (run_dut_scenarios.py's
               _GuardEdgeTracker, reusing dut_core.exe's own
               already-correct link_up decision). But this scenario's link
               never actually drops to begin with, for the same root cause
               as relays_deenergize_no_current_during_blip immediately
               above: dut_power_on does not gate virtual_simfw's telemetry
               publication, so the harness keeps seeing fresh frames
               throughout the blip and link_up (measured: true on all 54
               polls of this run) never has a falling edge to rise back
               from."
      phase: "Same fixture-emulation gap as relays_deenergize_no_current_
               during_blip -- both need dut_power_on to actually suppress
               something (relay drive / telemetry) inside virtual_simfw.c's
               device_tick(), which this pass did not build. Once that
               exists, this clause's own `within_s: 30` bracket remains the
               open, genuinely-undocumented question flagged below."
    # TODO: still genuinely unresolvable from docs/code alone -- confirmed
    # for this pass by re-reading SAFETY_MODEL.md §4 S6's own text: "The
    # window is 20s (REBOOT_GRACE_WINDOW_MS, safety_core.c) ... a software
    # timeout with generous margin over a plausible ESP32-S3 boot-to-first-
    # PUSH_CONTEXT time" -- but that number covers an *announced* OTA
    # restart specifically (in->reboot_grace_active gates only the S6b
    # trip() calls for that narrow case, safety_guards.c's S6 block) and the
    # doc is explicit the mechanism "does not apply" to an unannounced power
    # cut, where the ESP gets no chance to send ANNOUNCE_REBOOT before power
    # actually disappears. No other boot-to-first-context timing figure
    # exists anywhere in SAFETY_MODEL.md or the safety-side code (which
    # cannot see the ESP's boot process at all -- it only sees the link go
    # quiet and come back). The only other numeric anchor is
    # link_dead_hard_s's 120s unconditional backstop (SAFETY_MODEL.md §4
    # S6b) -- an upper bound on how long S6b tolerates silence before
    # tripping regardless of current, not a statement about how fast a cold
    # boot actually completes. 30s remains a placeholder order-of-magnitude
    # margin (comfortably under the 120s hard backstop so this scenario's
    # "safe resume" case and S6b's "conditionally trips" case stay clearly
    # distinguishable) pending an actual bench measurement of ESP32-S3
    # cold-boot-to-first-PUSH_CONTEXT time.
manual_checks:
  - "Confirm KilnFW resumes the firing (or safely aborts/pauses per its own policy) rather than silently continuing as if nothing happened — LCD/web UI behavior not observable by the fixture"
report_keep: [telemetry, events]
