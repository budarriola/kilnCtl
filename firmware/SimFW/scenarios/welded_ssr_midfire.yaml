# ---------------------------------------------------------------------------
# Signal / event vocabulary used throughout firmware/SimFW/scenarios/
# (documented once, here, since this file is PLAN.md §8.1's own template)
# ---------------------------------------------------------------------------
# `expect` clauses follow PLAN.md §8.1's three forms: `event`+`then`, `forbid`,
# `at_end`. Within them:
#
#   dut:  <signal>        a boolean the fixture senses from the real board or
#                          derives from its own telemetry truth. Used values:
#                          K1_closed/K2_closed/K3_closed/K5_closed/K4_closed,
#                          K4_open (== !K4_closed, spelled out for readability
#                          at trip sites), estop_open, fault_line_asserted,
#                          current_present (per-channel CT presence, from the
#                          fixture's own I_amps telemetry, PLAN.md §5.3).
#   event: { type: ..., slot/relay/guard: ... }
#                          fixture EVT-stream events (PLAN.md §5.3): fault_fired,
#                          fault_cleared, relay_edge, guard_warn, guard_trip,
#                          trip_ineffective_latched, link_up, dut_power.
#   then: { dut: X, within_s: N }
#                          upper-bound deadline (as in PLAN.md §8.1's example).
#   then: { ..., not_before_s: M }
#                          added lower bound, same field, for asserting BOTH
#                          bars of the nuisance-trip doctrine (SAFETY_MODEL.md
#                          §2: "a magnitude... and a duration... one alone is
#                          never enough") in a single clause: must not fire
#                          before M, must fire by N.
#
# Fault entries stick to exactly {id, type, target, trigger, duration} per
# PLAN.md §8.1's frozen shape. Fault-type parameters ARE part of the frozen
# shape (PLAN.md §5.2: "the four generic params carry fault-specific
# values"; §8.1 documents `params:` as a plain float list on the fault
# entry, matched positionally to fault_sched.h's params[0..3] doc comment
# for that fault type) -- give every fault that needs one a real, justified
# `params:` list (see cj_fault.yaml/main_safety_skew.yaml/etc for examples
# with the derivation in a comment); leaving it off silently defaults to
# params[0..3] == 0.0, which for most fault types means the fault fires
# with zero effect -- a dead test that looks like a real one, not a
# schema limitation.
#
# --- `blocked_on:` -- expectations that cannot pass against TODAY's
# SaftyFW, distinct from `manual_checks:` -----------------------------------
# `manual_checks:` (PLAN.md §8.1) is for things the FIXTURE cannot observe
# (LCD/web content, commissioning state) -- a human checks those, and the
# scenario's automated expectations are otherwise trustworthy. `blocked_on:`
# is the opposite kind of gap: the automated expectation is well-formed and
# the fixture COULD observe the result, but present-day SaftyFW structurally
# cannot produce the passing condition yet (a guard input is never
# populated, a relay is never commanded, etc.) -- this is DUT incompleteness,
# not a fixture limitation, and it is tracked in the SaftyFW roadmap
# (firmware/SaftyFW/docs/*), not something a scenario author can work around.
# Conflating the two under `manual_checks:` would tell a human to go check
# something a person cannot check either (there's nothing to look at) and
# would tell an automated report generator nothing about why the run FAILed.
#
# Shape: an optional `blocked_on:` mapping is a sibling of `name:`/`event:`/
# `forbid:`/`at_end:` on any `expect:` list entry:
#
#   - name: some_guard_trips
#     event: { type: fault_fired, slot: some_fault }
#     then: { event: { type: guard_trip, guard: S3 }, within_s: 25 }
#     blocked_on:
#       reason: "context_valid is never set true by safety_core_build_input()
#                (firmware/SaftyFW/src/tasks/safety_core.c) -- S3's whole
#                block is gated on it (safety_guards.c), so this can never
#                fire regardless of what the fixture does"
#       phase: "Phase 7 (link_task) -- link_task does not exist yet to
#               publish the context frame that would set context_valid true"
#
# `reason` names the specific missing SaftyFW input/behavior (cite the file/
# field, not just the guard letter); `phase` names the roadmap phase that
# supplies it, or says plainly that no roadmap doc currently tracks the gap
# if that's the honest answer (e.g. mainfault_tc_disconnect.yaml's S6a case).
# Both are plain strings -- kilnsim's scenario.py loader (`_parse_expect`)
# only reads the keys it models (name/event/then/forbid/at_end) off each
# `expect:` entry and does not reject unknown sibling keys, and the full
# parsed YAML survives on `Scenario.raw` for exactly this kind of forward-
# compatible extension (see that dataclass field's own comment) -- confirmed
# by reading the loader, not assumed; `check_scenarios.py` was re-run clean
# against every `blocked_on:`-bearing file introduced in the same pass as
# this comment. Nothing on the PC/report side reads `blocked_on:` yet: a
# future `report.py` pass should render it as a fourth verdict class (e.g.
# BLOCKED, distinct from PASS/FAIL/SKIPPED) instead of reporting a genuine
# FAIL for something that cannot pass today by design of the roadmap, not by
# a defect in the guard, the fixture, or the scenario.
# ---------------------------------------------------------------------------

name: welded_ssr_midfire
version: 1
exercises: [S3, S4]
# S3 is the guard this scenario is built to provoke (welded/shorted SSR:
# current flows with the relay sensed open — SAFETY_MODEL.md §4 S3).
# S4 is cited because the healthy portion of the run *before* the weld fires
# is itself S4's nuisance check: relay commanded on, current present, for the
# whole pre-fault period — must never produce a WARN (SAFETY_MODEL.md §4 S4,
# GUARD_TEST_MATRIX.md §1).
preset: fast_test
timescale: 10
seed: 42
overrides:
  zones[0].R_element: 12.0
dut:
  profile: cone6_fast
faults:
  - id: weld
    type: welded_ssr
    target: relay:K1
    # trigger point approximates "40% of soak" (PLAN.md §8 item 2); no exact
    # sim-clock boundary for "40% of soak" is defined anywhere, so a zone-temp
    # trigger mid-ramp is used as a reasonable, repeatable proxy instead of a
    # guessed sim-time offset.
    trigger: { at_zone_temp: { zone: 0, temp_c: 400, edge: rising } }
    duration: permanent
expect:
  - name: safety_trips
    event: { type: fault_fired, slot: weld }
    then:
      dut: K4_open
      within_s: 25       # stuck_on_time_s = 20s (SAFETY_MODEL.md §4 S3) + ~5s
                         # margin for the guard's own 10Hz evaluation tick and
                         # relay coil release time (no separate numeric bound
                         # is given for the latter beyond "de-energizes K4
                         # first, before anything else, before logging",
                         # SAFETY_MODEL.md §6)
      not_before_s: 18  # must not trip meaningfully before the 20s
                         # stuck_on_time_s bar is cleared (lower bar of the
                         # two-bar doctrine, SAFETY_MODEL.md §2)
    blocked_on:
      reason: "context_valid is never set true by safety_core_build_input()
               (firmware/SaftyFW/src/tasks/safety_core.c) -- S3's whole
               block (in->any_current_present && !in->relay_commanded_recently)
               lives inside safety_guards.c's `if (!in->context_valid) { ...
               } else { ... }` split and is unconditionally reset/skipped
               while context_valid is false, so this cannot fire against
               present-day SaftyFW regardless of what the fixture does."
      phase: "Phase 7 (link_task) -- link_task does not exist yet to publish
              the context frame that would set context_valid true (same root
              cause as S6b's own unconditional-trip finding: no link
              producer exists yet)."
  - name: no_early_trip
    forbid: { dut: K4_open, before: { fault: weld } }
  - name: trip_latched
    at_end: { dut: K4_open }
  - name: current_decays_after_k4_opens
    event: { type: relay_edge, relay: K4, edge: open }
    then:
      dut: current_absent
      within_s: 4        # <5% within ~4s, τ≈1s peak-hold decay
                         # (GUARD_TEST_MATRIX.md §3.3 "Decay")
    blocked_on:
      reason: "Downstream of `safety_trips` above: this clause's own trigger
               is the relay_edge{K4, open} event, which only occurs if S3
               actually trips K4 -- since S3 cannot fire (see `safety_trips`
               blocked_on), the triggering edge never occurs either."
      phase: "Phase 7 (link_task) -- same as `safety_trips` above."
manual_checks:
  - "Confirm KilnFW's LCD/web UI surfaces the S3 trip reason distinctly (not a generic fault) — fixture cannot read display/web content"
report_keep: [telemetry, events]
