# ---------------------------------------------------------------------------
# Signal / event vocabulary used throughout firmware/SimFW/scenarios/
# (documented once, here, since this file is PLAN.md §8.1's own template)
# ---------------------------------------------------------------------------
# `expect` clauses follow PLAN.md §8.1's three forms: `event`+`then`, `forbid`,
# `at_end`. Within them:
#
#   dut:  <signal>        a boolean the fixture senses from the real board or
#                          derives from its own telemetry truth. Used values:
#                          K1_closed/K2_closed/K3_closed/K5_closed/K4_closed,
#                          K4_open (== !K4_closed, spelled out for readability
#                          at trip sites), estop_open, fault_line_asserted,
#                          current_present (per-channel CT presence, from the
#                          fixture's own I_amps telemetry, PLAN.md §5.3).
#   event: { type: ..., slot/relay/guard: ... }
#                          fixture EVT-stream events (PLAN.md §5.3): fault_fired,
#                          fault_cleared, relay_edge, guard_warn, guard_trip,
#                          trip_ineffective_latched, link_up, dut_power.
#   then: { dut: X, within_s: N }
#                          upper-bound deadline (as in PLAN.md §8.1's example).
#   then: { ..., not_before_s: M }
#                          added lower bound, same field, for asserting BOTH
#                          bars of the nuisance-trip doctrine (SAFETY_MODEL.md
#                          §2: "a magnitude... and a duration... one alone is
#                          never enough") in a single clause: must not fire
#                          before M, must fire by N.
#
# Fault entries stick to exactly {id, type, target, trigger, duration} per
# PLAN.md §8.1's frozen shape. Fault-type parameters ARE part of the frozen
# shape (PLAN.md §5.2: "the four generic params carry fault-specific
# values"; §8.1 documents `params:` as a plain float list on the fault
# entry, matched positionally to fault_sched.h's params[0..3] doc comment
# for that fault type) -- give every fault that needs one a real, justified
# `params:` list (see cj_fault.yaml/main_safety_skew.yaml/etc for examples
# with the derivation in a comment); leaving it off silently defaults to
# params[0..3] == 0.0, which for most fault types means the fault fires
# with zero effect -- a dead test that looks like a real one, not a
# schema limitation.
#
# --- `blocked_on:` -- expectations that cannot pass against TODAY's
# SaftyFW, distinct from `manual_checks:` -----------------------------------
# `manual_checks:` (PLAN.md §8.1) is for things the FIXTURE cannot observe
# (LCD/web content, commissioning state) -- a human checks those, and the
# scenario's automated expectations are otherwise trustworthy. `blocked_on:`
# is the opposite kind of gap: the automated expectation is well-formed and
# the fixture COULD observe the result, but present-day SaftyFW structurally
# cannot produce the passing condition yet (a guard input is never
# populated, a relay is never commanded, etc.) -- this is DUT incompleteness,
# not a fixture limitation, and it is tracked in the SaftyFW roadmap
# (firmware/SaftyFW/docs/*), not something a scenario author can work around.
# Conflating the two under `manual_checks:` would tell a human to go check
# something a person cannot check either (there's nothing to look at) and
# would tell an automated report generator nothing about why the run FAILed.
#
# Shape: an optional `blocked_on:` mapping is a sibling of `name:`/`event:`/
# `forbid:`/`at_end:` on any `expect:` list entry:
#
#   - name: s11_trips_on_frozen_reading
#     event: { type: fault_fired, slot: some_fault }
#     then: { event: { type: guard_trip, guard: S11 }, within_s: 605 }
#     blocked_on:
#       reason: "safety_core_build_input() hardcodes heat_commanded = false
#                (firmware/SaftyFW/src/tasks/safety_core.c, its own comment:
#                'no current sense yet, Phase 6') -- S11's trip path is gated
#                on `in->tc_valid && in->heat_commanded` (safety_guards.c),
#                so this can never fire regardless of what the fixture does"
#       phase: "Phase 6 (current-sense wiring) -- the exact gap
#               safety_core.c's own comment already flags at that call site"
#
# (The example above deliberately uses S11, which is still blocked. The one
# this comment originally used -- S3's `context_valid` gap -- was CLOSED by
# SaftyFW commit f304392 and is no longer a valid illustration; see the
# updated blocked_on entries below and firmware/SaftyFW/docs/
# GUARD_TEST_MATRIX.md §6 for what did and did not clear.)
#
# `reason` names the specific missing SaftyFW input/behavior (cite the file/
# field, not just the guard letter); `phase` names the roadmap phase that
# supplies it, or says plainly that no roadmap doc currently tracks the gap
# if that's the honest answer (e.g. mainfault_tc_disconnect.yaml's S6a case).
# Both are plain strings -- kilnsim's scenario.py loader (`_parse_expect`)
# only reads the keys it models (name/event/then/forbid/at_end) off each
# `expect:` entry and does not reject unknown sibling keys, and the full
# parsed YAML survives on `Scenario.raw` for exactly this kind of forward-
# compatible extension (see that dataclass field's own comment) -- confirmed
# by reading the loader, not assumed; `check_scenarios.py` was re-run clean
# against every `blocked_on:`-bearing file introduced in the same pass as
# this comment. `tools/PcTools/src/kilnsim/report.py` now DOES read
# `blocked_on:` (commit 582ba73): a non-passing annotated clause is reported
# BLOCKED rather than FAIL/SKIPPED, and an annotated clause that
# unexpectedly PASSes is flagged "blocked_on annotation is STALE" so the
# annotation gets removed rather than quietly outliving the gap it names.
# Keep these annotations current: a `reason` that has been fixed upstream is
# worse than no annotation at all, because it explains away a result with a
# cause that no longer exists.
# ---------------------------------------------------------------------------

name: welded_ssr_midfire
version: 1
exercises: [S3, S4]
# S3 is the guard this scenario is built to provoke, in its MID-FIRE form:
# zone 0's SSR welds shut while the zone is legitimately commanded on, the
# controller later commands the zone off, and current keeps flowing with the
# relay sensed open (SAFETY_MODEL.md §4 S3).
#
# That mid-fire framing is what distinguishes this file from
# stuck_load_no_command_s3.yaml, which welds into a kiln that was NEVER
# commanded. S3 has two halves -- current present AND nothing commanded within
# correlation_window_s (150 s) -- and only this scenario exercises the second
# half as a *timing* property: from the weld until 150 s after the last K1
# command, S3 must stay silent even though current is flowing, and only then
# may it accumulate its 20 s stuck_on_time_s and trip. A guard that tripped as
# soon as it saw uncommanded current would pass stuck_load_no_command_s3.yaml
# and fail here.
#
# S4 is cited because the commanded, current-carrying stretch before the weld
# is itself S4's nuisance check: relay commanded on, current present, for the
# whole pre-fault period — must never produce a WARN (SAFETY_MODEL.md §4 S4,
# GUARD_TEST_MATRIX.md §1).
#
# --- What this file used to be, and why it changed -------------------------
# Until this pass this scenario was a DEAD TEST, blocked twice over, and both
# blockers were recorded in its own (now-removed) `blocked_on:` annotations:
#   1. it scheduled no `dut.operator_actions:`, so K4 never closed, so
#      sim_engine.c gated every zone's duty to zero and no current ever
#      existed for S3 to see (measured: any_current_present true on 0 of 82
#      polls);
#   2. independently, its `at_zone_temp: 400` trigger was unreachable in the
#      run's own time budget even with K4 closed.
# Both are fixed below. The trigger temperature is now 150 °C, which this
# preset genuinely reaches: with K4 closed and K1 commanded, zone 0 leaves
# ambient at sim-time ~65 s and T_zone crosses 150 °C ~60 s later (measured
# against virtual_simfw with this file's own R_element override: 100 °C at
# ~35 s of heating, 150 °C at ~60 s, 200 °C at ~92 s). 400 °C would have
# needed ~300 s of full duty on top of the 65 s of startup, which is what made
# the old trigger unreachable — not the run length alone.
preset: fast_test
# timescale 2, not the library's usual 10. virtual_simfw now advances the sim
# clock by exactly `timescale` sim-seconds per wall second (the timescale²
# defect its main loop used to have is fixed), so its 2 Hz telemetry broadcast
# lands one frame per `0.5 / timescale` sim-seconds: 0.5 s at timescale 1, 1 s
# at timescale 2, 5 s at timescale 10. S3's stuck_on_time_s is 20 s, so
# timescale 10 would resolve that window with only ~4 telemetry samples and
# any verdict would be as much a measurement of the sampling as of the guard;
# timescale 2 gives ~20. See virtual_dut/README.md's batch-ticking note and
# its Finding 8.
timescale: 2
seed: 42
overrides:
  zones[0].R_element: 12.0
dut:
  profile: cone6_fast
  # See run_dut_scenarios.py's module docstring for why these are scenario-
  # authored steps rather than harness behavior (KilnFW does not auto-enable
  # on profile start, and there is no PID here to decide when a zone is on).
  # The sequence IS this file's test:
  #   t=5    operator requests enable; relay_owner holds it through the real
  #          60 s SAFTYFW_STARTUP_GRACE_MS and closes K4 at t≈60.
  #   t=65   zone 0 is commanded on — a normal firing. Current flows (K4
  #          permits, K1 is sensed closed) and the zone starts heating.
  #   t≈125  T_zone crosses 150 °C and the SSR welds (fault `weld` below).
  #          Nothing observable changes yet: duty was already 1 because K1 is
  #          legitimately closed. That is what makes it a *hidden* weld.
  #   t=135  the controller commands zone 0 OFF. THIS is the moment the weld
  #          becomes visible: K1 is sensed open, nothing is commanded, and
  #          20 A keeps flowing. S3's correlation window starts here.
  #   t≈285  the 150 s correlation_window_s expires — only now may S3 count.
  #   t≈305  S3 trips after its 20 s stuck_on_time_s; K4 opens; current dies.
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 65, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 135, action: command_relay, relay: K1, state: open }
faults:
  - id: weld
    # FAULT_SCHED_TYPE_WELDED_RELAY: duty forced to 1 for the target zone
    # regardless of the relay sense (fault_sched.h) — a shorted/welded SSR.
    # Takes no params[], so there is no magnitude to get wrong here (contrast
    # welded_k4_current_persist in welded_contactor_s9.yaml, which silently
    # forces 0.0 A without one); the current comes from the preset's own
    # physics: V_mains 240 / this file's zones[0].R_element override 12.0 ×
    # element_health 1.0 = 20.0 A.
    type: welded_ssr
    target: relay:K1
    # A zone-temperature trigger, kept rather than converted to at_sim_time
    # because "the SSR welds part-way up the ramp" is the physical story this
    # scenario tells — PLAN.md §8 item 2's "40% of soak" has no exact sim-clock
    # definition, and a temperature is the repeatable proxy for it. The number
    # is now one this run actually reaches; see the header note above for the
    # measured heating curve.
    trigger: { at_zone_temp: { zone: 0, temp_c: 150, edge: rising } }
    duration: permanent
expect:
  - name: current_flows_during_the_commanded_firing
    # The precondition for everything below, and S4's nuisance premise: K4
    # closed and K1 commanded means real current on CT0. If this fails, every
    # other clause here is vacuous — which is exactly how this file went dead
    # before.
    # Anchored on the K1 command edge, not the K4 close edge: K4 closes at
    # t~60 but zone 0 is not commanded until t=65, so current legitimately does
    # not exist for ~5 s after K4 permits. (Both halves are still asserted --
    # this clause needs K4 closed too, because sim_engine.c gates every zone's
    # duty on it, so current on CT0 is itself the proof that K4 is closed.)
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      dut: current_present
      within_s: 10       # one telemetry frame's quantization (~1 sim-second at
                         # timescale 2) plus margin; duty follows the sensed
                         # contacts on the very next device_tick()
  - name: s4_never_warns_while_commanded_and_conducting
    # S4 = commanded continuously AND no current. K1 is commanded on from 65 s
    # to 135 s with 20 A flowing the whole time, so S4's magnitude half is
    # genuinely false here rather than untested.
    forbid: { event: { type: guard_warn, guard: S4 }, before: { fault: weld } }
  - name: s3_waits_out_the_correlation_window
    # The lower bar of the two-bar doctrine (SAFETY_MODEL.md §2), and the one
    # property only this scenario tests: uncommanded current alone is not
    # enough while K1 was commanded within correlation_window_s. K1 is
    # commanded off at t=135, so S3 may not trip before t≈285 (135 + 150) at
    # the very earliest. Anchored on the weld (t≈125) because report.py's
    # `before:` boundary takes an event, not a sim time.
    forbid: { event: { type: guard_trip, guard: S3 }, before: { fault: weld } }
  - name: s3_trips_after_the_window_expires
    event: { type: fault_fired, slot: weld }
    then:
      event: { type: guard_trip, guard: S3 }
      within_s: 200      # the weld fires at t≈125; the trip is due at t≈305,
                         # i.e. ~180 s later (150 s correlation_window_s
                         # measured from the t=135 command-off, + 20 s
                         # stuck_on_time_s, + the fixture's telemetry
                         # quantization at each end). 200 s leaves ~20 s of
                         # headroom on that.
      not_before_s: 150  # must not trip before the correlation window can
                         # possibly have expired: 135 − 125 = 10 s from the
                         # weld to the last command, + 150 s of window = 160 s.
                         # Set below that rather than at it, for the same
                         # reason stuck_load_no_command_s3's own not_before_s
                         # sits below its nominal bar: the harness replays one
                         # telemetry sample across a whole batch of 100 ms
                         # guard ticks, so the guard's clock runs a few percent
                         # fast (virtual_dut/README.md Finding 8). Asserting
                         # the nominal number would be asserting the fixture's
                         # sampling, not the guard's threshold.
  - name: no_early_trip
    forbid: { dut: K4_open, before: { fault: weld } }
    blocked_on:
      reason: "Not about S3 at all: K4 is reported open from this harness's
               very first observation, because nothing in current SaftyFW
               energizes it until the operator enable survives the 60 s startup
               grace -- and the first telemetry frame lands well before that.
               So a `forbid: {dut: K4_open}` clause sees an 'open' edge at
               sim-time ~1 s, long before the weld, no matter what any guard
               decides. See firmware/SimFW/tools/virtual_dut/README.md Finding
               2 and its corollary. `s3_waits_out_the_correlation_window` above
               is the clause that genuinely tests early-trip behavior here, and
               it keys off the guard_trip event rather than the K4 level for
               exactly this reason."
      phase: "No phase: nothing upstream is missing. This clause FORM
              (`forbid: {dut: K4_open}`) cannot be meaningful while K4's boot
              state is open and report.py matches edges rather than levels; a
              scenario author should prefer the guard_trip form."
  - name: trip_latched
    at_end: { dut: K4_open }
  - name: current_decays_after_k4_opens
    event: { type: relay_edge, relay: K4, edge: open }
    then:
      dut: current_absent
      within_s: 10       # K4 is in series with every zone's power path
                         # (sim_engine.c's own k4_closed block), so the trip
                         # must actually kill the current even though the SSR
                         # is still welded. Widened from the old 4 s, which was
                         # the <5% peak-hold decay time constant
                         # (GUARD_TEST_MATRIX.md §3.3) — finer than this
                         # fixture's ~1 sim-second sampling can resolve, so
                         # asserting it would be asserting the sampling.
manual_checks:
  - "Confirm KilnFW's LCD/web UI surfaces the S3 trip reason distinctly (not a generic fault) — fixture cannot read display/web content"
report_keep: [telemetry, events]
