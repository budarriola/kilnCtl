name: welded_contactor_s9
version: 1
exercises: [S3, S9]
# S9 is the guard this scenario exists to provoke: current keeps flowing after
# K4 is sensed open, i.e. the trip did not work (SAFETY_MODEL.md §4 S9 — "the
# single most valuable guard after S1"). S3 is only the *initiating* trip, the
# thing that produces a K4-open edge for the welded contactor to survive.
#
# Because S3 is a means rather than the subject here, this file deliberately
# uses the SHORTEST recipe that makes S3 trip for real — the uncommanded weld
# of stuck_load_no_command_s3.yaml (enable, let K4 close, then weld a zone that
# was never commanded, so S3's correlation-window half is satisfied from the
# start and the trip lands ~20 s later). welded_ssr_midfire.yaml is the file
# that tests S3's mid-fire timing behavior properly; duplicating its 150 s
# correlation window here would add ~200 s of sim time to a run whose subject
# is what happens *after* the trip.
#
# --- What this file used to be, and why it changed -------------------------
# Until this pass this scenario was a DEAD TEST, blocked twice over, and both
# blockers were recorded in its own (now-removed) `blocked_on:` annotations:
#   1. it scheduled no `dut.operator_actions:`, so K4 never closed, so
#      sim_engine.c gated every zone's duty to zero and no current ever
#      existed for S3 to see;
#   2. independently, its `at_zone_temp: 400` trigger was unreachable in the
#      run's own time budget even with K4 closed (the fast_test preset needs
#      ~300 s of full duty to get there, on top of the 60 s startup grace).
# The trigger is now `at_sim_time`, not a lower temperature: nothing about S9
# depends on how hot the kiln is, and a weld scheduled at a known sim time
# keeps the run short and its arithmetic checkable. welded_ssr_midfire.yaml is
# where the temperature trigger still earns its place.
preset: fast_test
# timescale 2, not the library's usual 10. virtual_simfw now advances the sim
# clock by exactly `timescale` sim-seconds per wall second (the timescale²
# defect its main loop used to have is fixed), so its 2 Hz telemetry broadcast
# lands one frame per `0.5 / timescale` sim-seconds: 1 s at timescale 2, 5 s at
# timescale 10. The two windows under test here are S3's 20 s stuck_on_time_s
# and S9's 10 s trip_verify_s, both of which timescale 10 would resolve with
# only a handful of samples. See virtual_dut/README.md's Finding 8.
timescale: 2
seed: 43
overrides:
  zones[0].R_element: 12.0
dut:
  profile: cone6_fast
  # See run_dut_scenarios.py's module docstring. Only the enable is needed: no
  # zone relay is ever commanded, which is precisely what lets S3 fire as soon
  # as the weld puts current on the CT (relay_recent_mask stays 0 for the whole
  # run, so the 150 s correlation window is satisfied from t=0).
  operator_actions:
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: weld_ssr
    # FAULT_SCHED_TYPE_WELDED_RELAY: duty forced to 1 for the target zone
    # regardless of the relay sense (fault_sched.h). Takes no params[], so
    # there is no magnitude to get wrong; the current is the preset's own
    # physics, V_mains 240 / zones[0].R_element 12.0 = 20.0 A.
    type: welded_ssr
    target: relay:K1
    # Deliberately AFTER the 60 s startup grace, so the weld happens into an
    # already-armed, already-closed K4 and the current genuinely reaches the
    # CT. A weld before 60 s would be gated to zero amps by K4 and would
    # re-create the dead test this file used to be.
    trigger: { at_sim_time: { t: 70 } }
    duration: permanent
  - id: welded_contactor
    # PLAN.md §7.1 power-path catalog: "Welded K4 test support: Keep CT
    # current flowing after K4 sensed open (S9 escalation)". This is the
    # fixture's stand-in for a real, mains-rated line contactor that is
    # physically welded downstream of K4 — the fixture cannot simulate mains
    # hardware (out of scope, PLAN.md §1), so it keeps synthesizing current
    # on the CT channel even after K4's own contacts are sensed open.
    type: welded_k4_current_persist
    target: ct:0
    trigger: { on_relay_edge: { relay: K4, edge: open, delay_s: 0 } }
    duration: permanent
    # params[0] = forced amps (fault_sched.h's
    # FAULT_SCHED_TYPE_WELDED_K4_CURRENT_PERSIST doc comment). Without a
    # params: list this forces the CT channel to CT_WAVE_MODE_MANUAL at
    # 0.0 A -- the opposite of "current keeps flowing", silently defeating
    # this scenario's entire point (S9's "current persists after K4 opens"
    # signature). 20.0 = V_mains (240, thermal_model.c's preset default) /
    # this scenario's own zones[0].R_element override (12.0) -- exactly the
    # current a genuinely-conducting zone-0 element would draw, so the
    # persisted current is physically plausible rather than an arbitrary large
    # number.
    params: [20.0]
expect:
  - name: uncommanded_current_appears_with_the_weld
    # Also the proof that K4 is closed at this point: sim_engine.c gates every
    # zone's duty on K4, so current on CT0 is only possible with K4 permitting.
    event: { type: fault_fired, slot: weld_ssr }
    then:
      dut: current_present
      within_s: 10       # one ~2 Hz telemetry frame (~1 sim-second at
                         # timescale 2) plus margin
  - name: initial_trip
    event: { type: fault_fired, slot: weld_ssr }
    then:
      event: { type: guard_trip, guard: S3 }
      within_s: 40       # stuck_on_time_s = 20 s (SAFETY_MODEL.md §4 S3), plus
                         # up to two telemetry frames of quantization before
                         # the current is even observed, plus margin
      not_before_s: 15   # the lower bar of the two-bar doctrine
                         # (SAFETY_MODEL.md §2), set one tick-batch below the
                         # real 20 s bar rather than at it — the harness
                         # replays one telemetry sample across a whole batch of
                         # 100 ms guard ticks, so the guard clock runs a few
                         # percent fast (virtual_dut/README.md Finding 8).
  - name: contactor_weld_engages_on_k4_open
    # This is the real S9 physical claim -- "current does NOT stop when K4
    # opens" -- expressed with the clause form that can actually say it.
    # The old `event: relay_edge/then: {dut: current_present, within_s}` form
    # could never pass here: current is already present *before* K4 opens
    # (the welded SSR put 20 A on CT0 at t≈70.2 s) and simply never stops, so
    # there is no NEW current_present edge inside any window after the K4-open
    # cause for `then:` to match against -- report.py's `_eval_event_then`
    # only matches edges, never a persisting level (virtual_dut/README.md's
    # Finding 2 corollary). A `forbid: {..., after: {...}}` clause (report.py
    # `_eval_forbid`/`_generic_boundary`) asks the opposite, answerable
    # question instead: "does a current_absent EDGE ever occur from the
    # K4-open edge onward?" -- which is exactly an edge-shaped question, so it
    # can genuinely PASS/FAIL rather than being structurally unobservable.
    # No `before:` needed -- the forbidden window runs to sim_end.
    forbid:
      dut: current_absent
      after: { event: { type: relay_edge, relay: K4, edge: open } }
  - name: s9_escalates
    event: { type: relay_edge, relay: K4, edge: open }
    then:
      event: { type: trip_ineffective_latched }
      within_s: 15      # trip_verify_s = 10s (SAFETY_MODEL.md §4 S9) + ~5s
                        # margin for the peak-hold decay and evaluation tick
      not_before_s: 8   # must not report ineffective before the decay window
                        # (τ≈1s) could plausibly have cleared a real trip
    # The `blocked_on:` that used to sit here is REMOVED, not softened: this
    # clause PASSes now. Its last blocker -- "the persisted current has no
    # observable in this fixture" -- was closed by run_dut_scenarios.py reading
    # the CT channels' synthesized amps through the fixture's own real
    # CT_GET_STATE command, so current_any_present() stays true after K4 opens
    # and S9's verification window completes for real. Measured: S3 trips at
    # t=90.2 s, K4 opens, TRIP_INEFFECTIVE_LATCHED at t=100.4 s -- 9.2 s later,
    # against trip_verify_s = 10 s plus one sim-second of telemetry
    # quantization. relay_deenergized had already been genuinely produced since
    # SaftyFW 5f90325. This is S9's decision logic exercised end to end for the
    # first time.
  - name: stays_open_and_latched
    at_end: { dut: K4_open }
  - name: escalation_latched_at_end
    at_end: { event: trip_ineffective_latched }
    # `blocked_on:` removed for the same reason as `s9_escalates` above: the
    # escalation path it depends on now runs, and this clause PASSes.
manual_checks:
  - "Confirm the GUI/LCD escalates TRIP_INEFFECTIVE distinctly from a normal trip — e.g. a 'POWER IS STILL FLOWING — REMOVE IT AT THE BREAKER' style message, not the ordinary fault banner (SAFETY_MODEL.md §4 S9) — fixture cannot read display/web content"
report_keep: [telemetry, events]
