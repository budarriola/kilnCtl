name: welded_contactor_s9
version: 1
exercises: [S3, S9]
# S3 provides the initiating trip (same welded-SSR mechanism as
# welded_ssr_midfire.yaml). S9 is the guard this scenario is actually built
# to provoke: current keeps flowing after K4 is sensed open, i.e. the trip
# did not work (SAFETY_MODEL.md §4 S9 — "the single most valuable guard
# after S1").
preset: fast_test
timescale: 10
seed: 43
overrides:
  zones[0].R_element: 12.0
dut:
  profile: cone6_fast
faults:
  - id: weld_ssr
    type: welded_ssr
    target: relay:K1
    trigger: { at_zone_temp: { zone: 0, temp_c: 400, edge: rising } }
    duration: permanent
  - id: welded_contactor
    # PLAN.md §7.1 power-path catalog: "Welded K4 test support: Keep CT
    # current flowing after K4 sensed open (S9 escalation)". This is the
    # fixture's stand-in for a real, mains-rated line contactor that is
    # physically welded downstream of K4 — the fixture cannot simulate mains
    # hardware (out of scope, PLAN.md §1), so it keeps synthesizing current
    # on the CT channel even after K4's own contacts are sensed open.
    type: welded_k4_current_persist
    target: ct:0
    trigger: { on_relay_edge: { relay: K4, edge: open, delay_s: 0 } }
    duration: permanent
    # params[0] = forced amps (fault_sched.h's
    # FAULT_SCHED_TYPE_WELDED_K4_CURRENT_PERSIST doc comment). Without a
    # params: list this forces the CT channel to CT_WAVE_MODE_MANUAL at
    # 0.0 A -- the opposite of "current keeps flowing", silently defeating
    # this scenario's entire point (S9's "current persists after K4 opens"
    # signature). 20.0 = V_mains (240, thermal_model.c's preset default) /
    # this scenario's own zones[0].R_element override (12.0, line 13) --
    # exactly the current a genuinely-conducting zone-0 element would draw,
    # so the persisted current is physically plausible rather than an
    # arbitrary large number.
    params: [20.0]
expect:
  - name: initial_trip
    event: { type: fault_fired, slot: weld_ssr }
    then:
      dut: K4_open
      within_s: 25       # stuck_on_time_s = 20s (SAFETY_MODEL.md §4 S3) + margin
      not_before_s: 18
    blocked_on:
      reason: "RESOLVED on the SaftyFW side, still blocked on the fixture. The
               previous reason here -- 'context_valid is never set true by
               safety_core_build_input()' -- was fixed by commit f304392:
               context_valid, any_current_present and relay_commanded_recently
               are all populated for real now (virtual_dut measures
               context_valid true on every poll of this scenario), so S3 is
               EVALUATED every tick instead of being force-reset. What it
               never sees is current: firmware/SimFW/src/tasks/sim_engine.c
               gates heater duty and CT current on K4, K4 never closes (no
               scenario issues the operator SAFETY_CMD_REQUEST_ENABLE -- see
               the K4 blocked_on entries elsewhere in this library), so
               any_current_present is false for the whole run (measured 0 of
               ~83 polls), and S3's `any_current_present &&
               !relay_commanded_recently` condition can never be true."
      phase: "Not a SaftyFW phase gap any more -- safety_core_build_input()
              reads link_task's published context via
              link_task_get_context_snapshot() and reduces it with the pure
              context_reduce_zones()/current_any_present() helpers in
              src/snapshots.h. The remaining gap is SimFW-side and circular:
              no current flows because K4 is open, and K4 is open because no
              scenario performs the operator enable. Breaking it needs a
              scenario that issues ENABLE (dut_core.exe supports it) or a
              fault that forces CT current independently of duty, e.g.
              welded_k4_current_persist, which bypasses the duty path
              entirely."
  - name: contactor_weld_engages_on_k4_open
    event: { type: relay_edge, relay: K4, edge: open }
    then:
      dut: current_present
      within_s: 1
    blocked_on:
      reason: "Downstream of `initial_trip` above: this clause's trigger is
               the relay_edge{K4, open} event, which only occurs if S3
               actually trips K4 -- since S3 cannot fire (see `initial_trip`
               blocked_on), the triggering edge never occurs either."
      phase: "Same as the clause it depends on -- the SaftyFW-side
              context_valid gap is closed (commit f304392); what remains is
              the fixture-side inability to present current / close K4. Not a
              Phase 7 gap."
  - name: s9_escalates
    event: { type: relay_edge, relay: K4, edge: open }
    then:
      event: { type: trip_ineffective_latched }
      within_s: 15      # trip_verify_s = 10s (SAFETY_MODEL.md §4 S9) + ~5s
                        # margin for the peak-hold decay and evaluation tick
      not_before_s: 8   # must not report ineffective before the decay window
                        # (τ≈1s) could plausibly have cleared a real trip
    blocked_on:
      reason: "Doubly blocked: (1) same relay_edge{K4, open} trigger
               dependency on S3 as `contactor_weld_engages_on_k4_open`
               above, and (2) even with a trip, S9's own escalation
               (safety_guards.c: `if (in->relay_deenergized) { ... }`) reads
               relay_deenergized, which safety_core_build_input() also never
               populates -- so S9 could not escalate even if something else
               produced a K4 open edge."
      phase: "Same as the clause it depends on -- the SaftyFW-side
              context_valid gap is closed (commit f304392); what remains is
              the fixture-side inability to present current / close K4. Not a
              Phase 7 gap."
  - name: stays_open_and_latched
    at_end: { dut: K4_open }
  - name: escalation_latched_at_end
    at_end: { event: trip_ineffective_latched }
    blocked_on:
      reason: "trip_ineffective can only latch via S9's escalation path
               (see `s9_escalates` blocked_on above), which cannot run."
      phase: "Same as the clause it depends on -- the SaftyFW-side
              context_valid gap is closed (commit f304392); what remains is
              the fixture-side inability to present current / close K4. Not a
              Phase 7 gap."
manual_checks:
  - "Confirm the GUI/LCD escalates TRIP_INEFFECTIVE distinctly from a normal trip — e.g. a 'POWER IS STILL FLOWING — REMOVE IT AT THE BREAKER' style message, not the ordinary fault banner (SAFETY_MODEL.md §4 S9) — fixture cannot read display/web content"
report_keep: [telemetry, events]
