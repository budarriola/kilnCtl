name: baseline_firing
version: 1
# Clean regression run: no fault is scheduled. This is deliberately the
# "healthy kiln" control run GUARD_TEST_MATRIX.md §1 argues every guard needs
# ("the only way to know a guard does not [nuisance-]trip is to run a healthy
# kiln at it") — but it exercises no *specific* guard on its own, so the list
# below is empty rather than padded with speculative citations.
exercises: []
preset: fast_test
timescale: 10
seed: 1
overrides: {}
dut:
  profile: cone6_fast
faults: []
expect:
  - name: never_faults
    forbid: { dut: fault_line_asserted, before: { sim_end: true } }
  - name: never_estops
    forbid: { dut: estop_open, before: { sim_end: true } }
  - name: never_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    blocked_on:
      reason: "This forbid clause is currently satisfied for the wrong
               reason: K4 starts de-energized (open) at boot and stays that
               way for the whole run, because relay_owner_command_energize()
               (firmware/SaftyFW/src/tasks/relay_owner.c) is fully built
               (INIT/GRACE/ARMED/TRIPPED state machine) but is called by
               nothing anywhere in the current source tree -- so K4_open is
               already true at sim-time 0, before a healthy no-fault run has
               had any chance to prove anything, not because this baseline
               genuinely stayed healthy under a real energized relay."
      phase: "Phase 7 (link_task) -- link_task exists and already decodes
              several ESP->Pico commands (PUSH_CONTEXT, CLEAR_TRIP,
              SET_CONFIG, ROLLBACK, ANNOUNCE_REBOOT...), but not this one.
              KilnFW already sends SAFETY_CMD_REQUEST_ENABLE (0x02) over
              the link (safety_link_request_enable(), App/drivers/
              uart_bridge.c), yet SaftyFW's link_task.c has no
              LINK_FRAME_REQUEST_ENABLE_CMD case at all (confirmed against
              link_frame.h's command list), so relay_owner_command_energize()
              is never called from anywhere. A genuinely missing decoder,
              not a wiring omission on an existing pair -- see ROADMAP.md
              M4's matching finding."
  - name: heat_actually_cycles
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      dut: K1_closed
      within_s: 1
manual_checks:
  - "KilnFW LCD shows normal profile progress and a clean 'complete'/idle state at the end of the run — the fixture has no profile-completion signal of its own"
  - "Web UI firing history shows a completed run with no fault/alarm banner"
report_keep: [telemetry, events]
