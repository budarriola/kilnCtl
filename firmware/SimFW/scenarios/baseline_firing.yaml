name: baseline_firing
version: 1
# Clean regression run: no fault is scheduled. This is deliberately the
# "healthy kiln" control run GUARD_TEST_MATRIX.md §1 argues every guard needs
# ("the only way to know a guard does not [nuisance-]trip is to run a healthy
# kiln at it") — but it exercises no *specific* guard on its own, so the list
# below is empty rather than padded with speculative citations.
exercises: []
preset: fast_test
timescale: 10
seed: 1
overrides: {}
dut:
  profile: cone6_fast
faults: []
expect:
  - name: never_faults
    forbid: { dut: fault_line_asserted, before: { sim_end: true } }
  - name: never_estops
    forbid: { dut: estop_open, before: { sim_end: true } }
  - name: never_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    blocked_on:
      reason: "This forbid clause is still satisfied for the wrong reason:
               K4 is open at sim-time 0 and never closes, so it is already
               true before a healthy no-fault run has had any chance to
               prove anything. NOTE (updated after SaftyFW commit f304392):
               the old wording here -- 'relay_owner_command_energize() is
               called by nothing anywhere in the current source tree' -- is
               no longer true. It now has a caller,
               safety_core_request_enable(), reached from link_task.c's
               SAFETY_CMD_REQUEST_ENABLE (0x02) decoder. That path is driven
               only by an explicit operator/PC command (KilnFW's
               uart_bridge.c -> safety_link_request_enable(), i.e. PcTools'
               safety_request_enable MCP tool); KilnFW does NOT request
               enable automatically when a profile runs, and no scenario in
               this library models that operator step."
      phase: "No longer a missing-decoder gap on the SaftyFW side --
              link_task.c decodes LINK_FRAME_REQUEST_ENABLE_CMD (0x02)
              today. What is missing is on this side of the fence: a
              scenario-level way to issue the operator enable.
              firmware/SimFW/tools/virtual_dut/dut_core/main.c already
              accepts an ENABLE command that mirrors relay_owner's
              TRIPPED-refuses/GRACE-defers/ARMED-honours behavior;
              run_dut_scenarios.py never sends one, because deciding WHEN a
              scenario would issue it is a scenario-library design question,
              not something a harness should invent. Owned by SimFW's
              scenario library, not by SaftyFW."
  - name: heat_actually_cycles
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      dut: K1_closed
      within_s: 1
manual_checks:
  - "KilnFW LCD shows normal profile progress and a clean 'complete'/idle state at the end of the run — the fixture has no profile-completion signal of its own"
  - "Web UI firing history shows a completed run with no fault/alarm banner"
report_keep: [telemetry, events]
