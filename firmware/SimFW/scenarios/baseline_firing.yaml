name: baseline_firing
version: 1
# Clean regression run: no fault is scheduled. This is deliberately the
# "healthy kiln" control run GUARD_TEST_MATRIX.md §1 argues every guard needs
# ("the only way to know a guard does not [nuisance-]trip is to run a healthy
# kiln at it") — but it exercises no *specific* guard on its own, so the list
# below is empty rather than padded with speculative citations.
exercises: []
preset: fast_test
timescale: 10
seed: 1
overrides: {}
dut:
  profile: cone6_fast
  # Closes the gap the previous blocked_on: annotation on `never_trips`
  # described: without an operator enable and a commanded zone relay,
  # nothing in current SaftyFW ever closes K4 (README.md Finding 2), so
  # `never_trips`'s forbid was vacuously satisfied by the K4-boot-open
  # artifact rather than by a genuinely healthy firing staying quiet, and
  # `heat_actually_cycles`' own relay_edge trigger could never occur at all.
  # Mirrors enabled_firing_healthy.yaml's pattern.
  operator_actions:
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
    - { at_sim_time: 150, action: command_relay, relay: K1, state: open }
faults: []
expect:
  - name: never_faults
    forbid: { dut: fault_line_asserted, before: { sim_end: true } }
  - name: never_estops
    forbid: { dut: estop_open, before: { sim_end: true } }
  - name: never_trips
    # Deliberately NOT `forbid: {dut: K4_open, before: {sim_end: true}}`
    # (the original form): see the module-level note above for why K4's
    # own boot-open level artifact makes that form vacuous, and
    # partial_element.yaml's own comment for the identical fix. No `guard:`
    # filter -- this is a no-fault baseline run, so the claim is that
    # NOTHING trips, not any one guard in particular.
    forbid: { event: { type: guard_trip }, before: { sim_end: true } }
  - name: heat_actually_cycles
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      dut: K1_closed
      within_s: 1
manual_checks:
  - "KilnFW LCD shows normal profile progress and a clean 'complete'/idle state at the end of the run — the fixture has no profile-completion signal of its own"
  - "Web UI firing history shows a completed run with no fault/alarm banner"
report_keep: [telemetry, events]
