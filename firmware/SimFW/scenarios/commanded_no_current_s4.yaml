name: commanded_no_current_s4
version: 1
exercises: [S4]
# The first scenario built to make S4 actually WARN.
#
# S4 (SAFETY_MODEL.md §4) is "heat commanded but load inactive":
# `relay_commanded_continuously && !any_current_present`, where
# "continuously" means correlation_window_s (150s) of uninterrupted command.
# broken_element.yaml aims at the same guard, but nothing in the fixture ever
# commanded a zone relay, so its own `relay_edge K1 close` trigger never
# occurred and the clause reported "triggering event never occurred" rather
# than any verdict about S4.
#
# This scenario supplies the missing half: zone 0's contactor is commanded
# closed at 5s and held closed, and the operator enables the interlock so K4
# closes at 60s and the power path is genuinely live. The element is dead
# (element_health forced to 0), so 240V across a closed contactor draws
# nothing at all. At ~155s the 150s window elapses with still no current and
# S4 warns -- and, being WARN-only by design, must not touch K4.
preset: fast_test
# timescale 2, not the library's usual 10, and deliberately so. virtual_simfw
# advances its sim clock by exactly `timescale` sim-seconds per wall second
# (it used to advance by timescale**2 -- its main loop scaled the tick
# ACCUMULATOR by timescale and then each 100ms tick advanced sim by
# 100ms * timescale, applying the factor twice; that is fixed, and
# tools/PcTools/tests/test_kilnsim_virtual_simfw.py::
# test_timescale_advances_sim_linearly_not_quadratically now guards it).
# Its 2Hz telemetry broadcast therefore lands one frame every
# `0.5 / timescale` sim-seconds: 5 sim-seconds at timescale 10 -- only ~4
# samples across the shortest guard window this library tests (S3's 20s
# stuck_on_time_s), which would make a guard verdict as much a measurement of
# the sampling as of the guard. At timescale 2 the same broadcast is one frame
# per sim-second, comfortably finer than every window under test. See
# virtual_dut/README.md's batch-ticking note and its Finding 8.
timescale: 2
seed: 62
overrides: {}
dut:
  profile: cone6_fast
  # See run_dut_scenarios.py's module docstring for both action kinds.
  operator_actions:
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: dead_element
    # PLAN.md §7.1: "Broken heater coil | Relay closes, zero current on that
    # CT, zone doesn't heat". FAULT_SCHED_TYPE_BROKEN_ELEMENT forces
    # element_health to 0 (fault_sched.h) and takes no params[], so there is
    # no magnitude to get wrong: current_a = V/R * duty * 0 = exactly 0A,
    # unambiguously below i_present_a's 2.0A default.
    type: broken_heater_coil
    target: element:0
    # Fires before anything is commanded, so there is never a moment where
    # current flows and then stops -- S4's `!any_current_present` half is true
    # for the entire run, and the only thing the clock is waiting on is the
    # 150s command window.
    trigger: { at_sim_time: { t: 2 } }
    duration: permanent
expect:
  - name: s4_warns_after_the_correlation_window
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      event: { type: guard_warn, guard: S4 }
      within_s: 175      # correlation_window_s = 150s (SAFETY_MODEL.md §4 S4)
                         # plus up to two ~2Hz telemetry frames of
                         # quantization (~2 sim-seconds each at timescale 2)
                         # plus margin
      not_before_s: 145  # lower bar of the two-bar doctrine
                         # (SAFETY_MODEL.md §2): a dead element must be dead
                         # for the whole window before anyone is told
  - name: no_current_ever_flows
    # The premise of the whole scenario. If this failed, the S4 clause above
    # would be measuring something else entirely.
    forbid: { dut: current_present, before: { sim_end: true } }
  - name: s4_never_opens_k4
    # "This never trips, and that is a design decision" (SAFETY_MODEL.md §4
    # S4): a dead element ruins a firing, it does not start one. Stated here
    # as the positive fact that K4 is STILL CLOSED at the end of a run in
    # which S4 warned -- which is only a meaningful assertion because K4 was
    # closed in the first place.
    at_end: { dut: K4_closed }
manual_checks:
  - "Confirm KilnFW's own thermal_guard 'heating failed' (main-board guard, not SaftyFW) aborts or flags the profile on the LCD/web UI — outside GUARD_TEST_MATRIX.md's scope and not observable by the fixture"
  - "Confirm the S4 WARN is surfaced as a warning, not an alarm/trip, in the LCD/web UI — fixture cannot read display/web content"
report_keep: [telemetry, events]
