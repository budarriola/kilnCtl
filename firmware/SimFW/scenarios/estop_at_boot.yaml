name: estop_at_boot
version: 1
exercises: [S7]
preset: fast_test
timescale: 10
seed: 56
overrides: {}
dut:
  # The DUT is power-cycled during this scenario with no firing profile
  # started; the point is the boot-time STOP presentation, not a firing.
  profile: none
faults:
  - id: estop_pre_boot
    # PLAN.md §7.1 system-fault catalog "E-stop during firing" fault type,
    # reused here at boot rather than mid-firing: the fixture opens the
    # E-stop loop BEFORE the DUT is power-cycled and holds it open through
    # boot — replicating the as-built no-jumper state (HARDWARE.md §5,
    # PLAN.md §3.4: "the fixture *becomes* the jumper").
    type: estop_trip
    target: io:estop
    trigger: { manual: {} }   # armed by the runner before the DUT power
                              # cycle it then issues (PLAN.md §7.2 MANUAL
                              # trigger; §6.2 `kilnsim power cycle`)
    duration: permanent
expect:
  - name: relay_never_energizes
    forbid: { dut: K4_closed, before: { sim_end: true } }
    # "Power-on state is de-energized... heating is permitted only after
    # every task has reported healthy, the startup grace has elapsed, and
    # no guard is tripped" (SAFETY_MODEL.md §6); with E-stop already open at
    # power-on, K4 must never close for the whole run
  - name: still_open_at_end
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm KilnFW's LCD/web UI presents a clear 'E-STOP' / permanent-stop message at boot, not a generic error or blank screen (SAFETY_MODEL.md §7, HARDWARE.md as-built no-jumper state) — fixture cannot read display/web content"
report_keep: [telemetry, events]
