name: broken_element
version: 1
exercises: [S4]
# S4 — "Heat commanded but load inactive" — matches this scenario exactly:
# relay closes, zero current on that CT, zone never heats (SAFETY_MODEL.md
# §4 S4). S4 is WARN-only by design and never touches the relay; the
# "profile abort" half of PLAN.md §8 item 9's description is a KilnFW-side
# (thermal_guard "heating failed") decision, not a SaftyFW guard, so it is
# not cited in `exercises` and is called out under manual_checks instead.
preset: fast_test
timescale: 10
seed: 50
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: broken
    # PLAN.md §7.1: "Broken heater coil | Relay closes, zero current on that
    # CT, zone doesn't heat".
    type: broken_heater_coil
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
expect:
  - name: s4_warns
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      event: { type: guard_warn, guard: S4 }
      within_s: 155      # correlation_window_s = 150s (SAFETY_MODEL.md §4 S4) + margin
      not_before_s: 148
    blocked_on:
      reason: "RESOLVED on the SaftyFW side, still blocked on the fixture.
               The old reason here -- 'context_valid is never set true by
               safety_core_build_input()' -- was fixed by commit f304392:
               context_valid, any_current_present and
               relay_commanded_continuously are all populated for real now,
               and virtual_dut confirms context_valid is true on every poll
               of this scenario. S4 is therefore EVALUATED every tick; it
               simply never warns, because
               `relay_commanded_continuously && !any_current_present`
               needs a relay commanded on continuously for
               correlation_window_s (150s) and no relay ever closes in a
               virtual_dut run: there is no KilnFW/PID in the loop to close
               K1, and this scenario's own `relay_edge K1 close` trigger
               never occurs for the same reason (the clause reports
               'triggering event never occurred', not a guard verdict)."
      phase: "Not a SaftyFW phase gap any more. The remaining gap is
              SimFW-side: nothing in the fixture ever commands a zone relay
              on, so S4's positive half cannot be presented. Closing it
              needs either a virtual KilnFW/PID that drives K1..K3, or a
              scenario that forces a relay closed independently of heat
              (welded_relay-class faults already exist but are triggered on
              zone temperatures this fixture never reaches while K4 gates
              duty). See firmware/SimFW/tools/virtual_dut/README.md."
  - name: s4_never_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    # "This never trips, and that is a design decision" (SAFETY_MODEL.md §4 S4)
    blocked_on:
      reason: "This forbid clause is still satisfied for the wrong reason: K4
               is open at sim-time 0 and never closes, so it is already true
               before anything under test has had a chance to say otherwise.
               NOTE (updated after SaftyFW commit f304392): the previous
               wording here -- 'relay_owner_command_energize() is called by
               nothing in the current source tree' -- is no longer true. It
               now has a caller, safety_core_request_enable(), reached from
               link_task.c's SAFETY_CMD_REQUEST_ENABLE (0x02) decoder. That
               path is driven only by an explicit operator/PC command
               (KilnFW's uart_bridge.c -> safety_link_request_enable(), i.e.
               PcTools' safety_request_enable MCP tool); KilnFW does NOT
               request enable automatically when a profile runs, and no
               scenario in this library models that operator step."
      phase: "No longer a missing-decoder gap on the SaftyFW side --
              link_task.c decodes LINK_FRAME_REQUEST_ENABLE_CMD (0x02) today
              and relay_owner_command_energize() has its first caller. The
              remaining gap is on this side of the fence: no scenario issues
              the operator enable.
              firmware/SimFW/tools/virtual_dut/dut_core/main.c already accepts
              an ENABLE command mirroring relay_owner's TRIPPED-refuses /
              GRACE-defers / ARMED-honours behavior; run_dut_scenarios.py
              never sends one, because deciding WHEN a scenario would issue it
              is a scenario-library design question, not something a harness
              should invent. Owned by SimFW's scenario library, not by
              SaftyFW."
manual_checks:
  - "Confirm KilnFW's own thermal_guard 'heating failed' (main-board guard, not SaftyFW) aborts or flags the profile on the LCD/web UI — outside GUARD_TEST_MATRIX.md's scope and not observable by the fixture"
report_keep: [telemetry, events]
