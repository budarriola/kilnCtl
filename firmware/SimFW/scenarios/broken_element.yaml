name: broken_element
version: 1
exercises: [S4]
# S4 — "Heat commanded but load inactive" — matches this scenario exactly:
# relay closes, zero current on that CT, zone never heats (SAFETY_MODEL.md
# §4 S4). S4 is WARN-only by design and never touches the relay; the
# "profile abort" half of PLAN.md §8 item 9's description is a KilnFW-side
# (thermal_guard "heating failed") decision, not a SaftyFW guard, so it is
# not cited in `exercises` and is called out under manual_checks instead.
preset: fast_test
timescale: 10
seed: 50
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: broken
    # PLAN.md §7.1: "Broken heater coil | Relay closes, zero current on that
    # CT, zone doesn't heat".
    type: broken_heater_coil
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
expect:
  - name: s4_warns
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      event: { type: guard_warn, guard: S4 }
      within_s: 155      # correlation_window_s = 150s (SAFETY_MODEL.md §4 S4) + margin
      not_before_s: 148
    blocked_on:
      reason: "RESOLVED on both sides now -- what remains is local to THIS
               file. The original reason ('context_valid is never set true
               by safety_core_build_input()') was fixed by commit f304392.
               The follow-up reason ('nothing in the fixture ever commands a
               zone relay on') was fixed by the operator-actions pass:
               run_dut_scenarios.py replays a scenario's own
               `dut.operator_actions:` list, and commanded_no_current_s4.yaml
               -- the same broken-element stimulus, plus a commanded K1 and
               an operator enable -- drives S4 to a genuine WARN 152.8
               sim-seconds after K1 closes. This scenario does not schedule
               those actions, so its own `relay_edge K1 close` trigger still
               never occurs and the clause still reports 'triggering event
               never occurred' rather than any verdict about S4."
      phase: "No phase: nothing upstream is missing. Either add
              `dut.operator_actions:` to this file (see
              commanded_no_current_s4.yaml) and delete this annotation, or
              treat that scenario as the library's live S4 test and retire
              this clause."
  - name: s4_never_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    # "This never trips, and that is a design decision" (SAFETY_MODEL.md §4 S4)
    blocked_on:
      reason: "This forbid clause is still satisfied for the wrong reason: K4
               is open at sim-time 0 and never closes IN THIS FILE, so it is
               already true before anything under test has had a chance to
               say otherwise. NOTE (updated again, after the operator-actions
               pass): 'no scenario models the operator enable' is no longer
               true -- commanded_no_current_s4.yaml issues it, watches K4
               close at ~58s, watches S4 warn, and then asserts the real
               design property this clause is reaching for (K4 STILL CLOSED
               at end of run, because S4 is WARN-only). That is the
               assertion this clause cannot make while K4 never closes."
      phase: "No phase: nothing upstream is missing. Superseded in practice
              by commanded_no_current_s4.yaml's `s4_never_opens_k4` clause;
              retire this one, or give this file the operator actions that
              would make it meaningful."
manual_checks:
  - "Confirm KilnFW's own thermal_guard 'heating failed' (main-board guard, not SaftyFW) aborts or flags the profile on the LCD/web UI — outside GUARD_TEST_MATRIX.md's scope and not observable by the fixture"
report_keep: [telemetry, events]
