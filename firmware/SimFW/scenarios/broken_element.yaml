name: broken_element
version: 1
exercises: [S4]
# S4 — "Heat commanded but load inactive" — matches this scenario exactly:
# relay closes, zero current on that CT, zone never heats (SAFETY_MODEL.md
# §4 S4). S4 is WARN-only by design and never touches the relay; the
# "profile abort" half of DESIGN_NOTES.md §8 item 9's description is a KilnFW-side
# (thermal_guard "heating failed") decision, not a SaftyFW guard, so it is
# not cited in `exercises` and is called out under manual_checks instead.
preset: fast_test
# timescale 2, not 10 -- see commanded_no_current_s4.yaml's own comment for
# why (1 telemetry frame/sim-sec at timescale 2 vs 1 per 5 sim-sec at 10;
# S4's 150s correlation_window_s is long enough that 10 would probably still
# resolve it, but this file's operator_actions/K4-close timing is shared
# with scenarios that need the finer grid, so it is used here too).
timescale: 2
seed: 50
overrides: {}
dut:
  profile: cone6_fast
  # Closes the gap the blocked_on: annotations below described: without an
  # operator enable and a commanded zone relay, this scenario's own
  # `relay_edge K1 close` trigger never occurs at all (nothing in this
  # fixture commands a relay on its own), and K4 never closes, so
  # `s4_never_trips`' forbid was vacuously satisfied by the K4-boot-open
  # artifact. Mirrors commanded_no_current_s4.yaml's pattern -- this file
  # differs from that one only in when the broken_heater_coil fault fires
  # relative to the enable (t=10 here vs t=2 there), which does not matter
  # for S4: K4 does not close until ~60s regardless, so the element is dead
  # long before any current could have flowed either way.
  operator_actions:
    - { at_sim_time: 5, action: command_relay, relay: K1, state: closed }
    - { at_sim_time: 5, action: request_enable }
faults:
  - id: broken
    # DESIGN_NOTES.md §7.1: "Broken heater coil | Relay closes, zero current on that
    # CT, zone doesn't heat".
    type: broken_heater_coil
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
expect:
  - name: s4_warns
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      event: { type: guard_warn, guard: S4 }
      within_s: 175      # correlation_window_s = 150s (SAFETY_MODEL.md §4 S4)
                         # plus up to two ~2Hz telemetry frames of
                         # quantization (~2 sim-seconds each at timescale 2)
                         # plus margin -- same bracket as
                         # commanded_no_current_s4.yaml's sibling clause
      not_before_s: 145
  - name: s4_never_trips
    # "This never trips, and that is a design decision" (SAFETY_MODEL.md §4
    # S4): stated positively, as commanded_no_current_s4.yaml's
    # `s4_never_opens_k4` does -- K4 is STILL CLOSED at the end of a run in
    # which S4 warned, which is only a meaningful assertion because K4 was
    # closed in the first place (see the operator_actions: added above).
    at_end: { dut: K4_closed }
manual_checks:
  - "Confirm KilnFW's own thermal_guard 'heating failed' (main-board guard, not SaftyFW) aborts or flags the profile on the LCD/web UI — outside GUARD_TEST_MATRIX.md's scope and not observable by the fixture"
report_keep: [telemetry, events]
