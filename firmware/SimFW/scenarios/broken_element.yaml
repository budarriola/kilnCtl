name: broken_element
version: 1
exercises: [S4]
# S4 — "Heat commanded but load inactive" — matches this scenario exactly:
# relay closes, zero current on that CT, zone never heats (SAFETY_MODEL.md
# §4 S4). S4 is WARN-only by design and never touches the relay; the
# "profile abort" half of PLAN.md §8 item 9's description is a KilnFW-side
# (thermal_guard "heating failed") decision, not a SaftyFW guard, so it is
# not cited in `exercises` and is called out under manual_checks instead.
preset: fast_test
timescale: 10
seed: 50
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: broken
    # PLAN.md §7.1: "Broken heater coil | Relay closes, zero current on that
    # CT, zone doesn't heat".
    type: broken_heater_coil
    target: element:0
    trigger: { at_sim_time: { t: 10 } }
    duration: permanent
expect:
  - name: s4_warns
    event: { type: relay_edge, relay: K1, edge: close }
    then:
      event: { type: guard_warn, guard: S4 }
      within_s: 155      # correlation_window_s = 150s (SAFETY_MODEL.md §4 S4) + margin
      not_before_s: 148
    blocked_on:
      reason: "context_valid is never set true by safety_core_build_input()
               (firmware/SaftyFW/src/tasks/safety_core.c) -- S4's
               `state->s4_warn = in->relay_commanded_continuously &&
               !in->any_current_present` assignment lives inside
               safety_guards.c's context_valid-gated else-branch and is
               force-reset to false while context_valid is false, so this
               cannot warn against present-day SaftyFW regardless of what
               the fixture does."
      phase: "Phase 7 (link_task) is built and already publishes this
              context -- link_task_publish_context()/
              link_task_get_context_snapshot() (firmware/SaftyFW/src/tasks/
              link_task.c) parse and cache every SAFETY_CMD_PUSH_CONTEXT
              (0x07) frame today. The real gap is one layer up:
              safety_core.c's safety_core_build_input() never calls
              link_task_get_context_snapshot() at all (see its own TODO at
              safety_core.c:208-210), so context_valid stays at its
              zero-init false regardless of what the ESP sends. A wiring
              gap in an already-built producer/consumer pair, not a
              missing Phase 7 deliverable."
  - name: s4_never_trips
    forbid: { dut: K4_open, before: { sim_end: true } }
    # "This never trips, and that is a design decision" (SAFETY_MODEL.md §4 S4)
    blocked_on:
      reason: "This forbid clause is currently satisfied for the wrong
               reason: K4 starts de-energized (open) at boot and stays that
               way, because relay_owner_command_energize()
               (firmware/SaftyFW/src/tasks/relay_owner.c) is fully built but
               called by nothing in the current source tree -- so K4_open is
               already true at sim-time 0, before any guard (or lack of one)
               has had a chance to say anything, not because S4's own
               correct 'never trips' design held up under test."
      phase: "Phase 7 (link_task) -- link_task exists and already decodes
              several ESP->Pico commands (PUSH_CONTEXT, CLEAR_TRIP,
              SET_CONFIG, ROLLBACK, ANNOUNCE_REBOOT...), but not this one.
              KilnFW already sends SAFETY_CMD_REQUEST_ENABLE (0x02) over
              the link (safety_link_request_enable(), App/drivers/
              uart_bridge.c), yet SaftyFW's link_task.c has no
              LINK_FRAME_REQUEST_ENABLE_CMD case at all (confirmed against
              link_frame.h's command list), so relay_owner_command_energize()
              is never called from anywhere. A genuinely missing decoder,
              not a wiring omission on an existing pair like
              context_valid's gap above -- see ROADMAP.md M4's matching
              finding."
manual_checks:
  - "Confirm KilnFW's own thermal_guard 'heating failed' (main-board guard, not SaftyFW) aborts or flags the profile on the LCD/web UI — outside GUARD_TEST_MATRIX.md's scope and not observable by the fixture"
report_keep: [telemetry, events]
