name: estop_midfire
version: 1
exercises: [S7]
preset: fast_test
timescale: 10
seed: 52
overrides: {}
dut:
  profile: cone6_fast
faults:
  - id: estop
    # PLAN.md §7.1 system-fault catalog: "E-stop during firing | Open the
    # E-stop loop at trigger". Held open for 5s then the fixture physically
    # re-closes the loop (simulating press-then-release) so the scenario can
    # also assert the trip does NOT auto-clear when the contact re-closes.
    type: estop_trip
    target: io:estop
    # Trigger temp checked this pass against fast_test's actual physics
    # (thermal_model.c THERMAL_PRESET_FAST_TEST, zone 0 default/unmodified:
    # C=2000 J/degC, k_loss=8 W/degC, R_element=15ohm, V_mains=240V):
    # P_max = V^2/R = 3840W, steady-state DeltaT = P_max/k_loss = 480degC,
    # so the zone's own asymptote is T_ss = T_ambient + 480 = 505degC. The
    # original trigger (500degC) sat only 1% below that asymptote, so
    # reaching it needed ~4.6 time constants (tau =
    # C/k_loss = 250 sim-s) = ~1150 sim-s = ~115s wall at this file's 10x
    # timescale -- nearly the whole ~2min wall-time fast_test is designed
    # for (PLAN.md §4.3), just to reach the trigger, leaving almost no
    # margin for this scenario's own post-trigger deadlines. Lowered to
    # 400degC (reached in ~1.5 tau =~380 sim-s =~38s wall), matching the
    # trigger already used by welded_ssr_midfire.yaml/welded_contactor_s9.yaml
    # for the same "mid-fire" intent and leaving comfortable headroom.
    trigger: { at_zone_temp: { zone: 0, temp_c: 400, edge: rising } }
    duration: { for_s: 5 }
expect:
  - name: fast_trip
    event: { type: fault_fired, slot: estop }
    then:
      dut: K4_open
      within_s: 1        # GPIO9 debounced 50ms (SAFETY_MODEL.md §4 S7) +
                         # generous margin for the fixture's own event
                         # detection latency; still comfortably sub-second
  - name: stays_latched_after_physical_release
    event: { type: fault_cleared, slot: estop }
    then:
      dut: K4_open
      within_s: 1
    # loop is physically closed again (fault_cleared = the fixture's
    # for_s:5 override expired and it re-closed the contact), but the trip
    # must remain latched — "clearing requires a deliberate operator act",
    # not a condition clearing on its own (SAFETY_MODEL.md §6)
  - name: latched_at_end
    at_end: { dut: K4_open }
manual_checks:
  - "Confirm the trip cannot be cleared except via SAFETY_CMD_CLEAR_TRIP or a full E-stop assert-then-release cycle at the physical button (not exercised by this scenario's scripted fixture release) — SAFETY_MODEL.md §6"
report_keep: [telemetry, events]
