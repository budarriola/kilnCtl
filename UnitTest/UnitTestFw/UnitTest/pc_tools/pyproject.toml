[project]
name = "uart-control"
version = "0.1.0"
description = "PC-side counterpart to the ESP32-S3 hardened UART protocol (uart_protocol.c/.h)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "mcp>=1.2.0",
]

[project.scripts]
uart-mcp-server = "uart_control.mcp_server:main"
uart-control-gui = "uart_control.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uart_control"]
