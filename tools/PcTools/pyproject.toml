[project]
name = "kilnctrl"
version = "0.2.0"
description = "PC-side counterpart to the kilnCtl main board's hardened UART protocol (uart_protocol.c/.h)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "mcp>=1.2.0",
    # The MCP servers serve streamable HTTP by default (docs/MCP_SERVERS.md),
    # so the ASGI stack is a hard requirement here, not an extra: mcp pulls
    # both in today, but a transport this project depends on should not be
    # left to another package's optional dependency.
    "uvicorn>=0.30",
    "starlette>=0.37",
    "logic2-automation>=1.0.11",
    # Only used by the display page's "send an image" control (scaling and
    # RGB565 conversion -- see display.py). Imported lazily so the rest of the
    # package still works if the wheel is missing, and the About window's
    # pinout PNG deliberately uses tk.PhotoImage instead.
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Used by tests/test_no_undefined_names.py to catch a moved-function-left-
    # its-import-behind defect (the devices_info.py/pin_function_label class of
    # bug) before it ships silently in a function body no test happens to call.
    "pyflakes>=3.0",
]

[project.scripts]
kilnctrl-gui = "kilnctrl.gui:main"
kilnctrl-mcp-server = "kilnctrl.mcp_server:main"
saleae-capture = "kilnctrl.logic_capture:main"
kilnctrl-console-capture = "kilnctrl.console_capture:main"
kilnctrl-log-analysis = "kilnctrl.log_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilnctrl", "src/mcpkit"]
